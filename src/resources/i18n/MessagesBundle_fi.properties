dialog.template.miscellaneous = Sekalaiset
dialog.template.priority = Prioriteetti
dialog.template.priority.tooltip = DOSBoxin prioriteetti. Toimettoman arvokenttään voidaan laittaa arvo, joka määräytyy siitä, milloin DOSBoxia ei ole keskitetty, tai se on piilotettu/pienennetty
dialog.template.active = Aktiivinen
dialog.template.inactive = Toimeton
