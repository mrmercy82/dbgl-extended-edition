dialog.template.set = Aseta
dialog.template.set.tooltip = Liitä valittuun DOSBox-versioon: vain omat muutoksesi säilyvät, kaikki muut asetukset tulevat tämän DOSBox-version asetustiedostosta (tapahtuu myös automaattisesti OK-painikkeella)
dialog.template.switch = Säilytä kaikki
dialog.template.switch.tooltip = Liitä valittuun DOSBox-versioon ja säilytä kaikki nykyiset arvot, myös edellisen DOSBox-version oletuksista tulleet
dialog.template.reloadsettings = Lataa asetukset uudelleen
