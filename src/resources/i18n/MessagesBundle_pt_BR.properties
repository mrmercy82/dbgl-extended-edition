dialog.template.output = Saída
dialog.template.output.tooltip = O sistema de vídeo a ser usado para saída
dialog.template.fullscreen = Tela cheia
dialog.template.fullscreen.tooltip = Iniciar o DOSBox diretamente em tela cheia. (Pressione ALT-Enter para retornar)
dialog.template.windowresolution = Resolução da Janela
dialog.template.windowresolution.tooltip = Dimensionar a janela para este tamanho SE o dispositivo de saída suportar dimensionamento por hardware. (output = superfície não!)
dialog.template.fullscreenresolution = Resolução de Tela cheia
dialog.template.fullscreenresolution.tooltip = Que resolução usar para tela cheia\: original ou tamanho fixo (por exemplo, 1024x768).\nUsar a resolução máxima do seu monitor com aspecto\=true pode dar os melhores resultados.\nSe você terminar com uma janela pequena em uma tela grande, tente uma saída diferente a partir da superfície.
dialog.template.scaler = Escalonador
dialog.template.scaler.tooltip = Escalonador usado para ampliar/melhorar os modos de baixa resolução. Se 'forced' é acrescentado, o escalonador vai ser usado mesmo que o resultado possa não ser o desejado.
