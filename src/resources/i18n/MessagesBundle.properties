dialog.template.tab.ne2000 = NE2000
dialog.template.ne2000enable = Enable
dialog.template.ne2000enable.tooltip = Enable emulation of a Novell NE2000 network card
dialog.template.ne2000backend = Backend
dialog.template.ne2000backend.tooltip = The backend (either pcap or slirp is supported) used for the NE2000 Ethernet emulation.\nIf set to "auto", then "slirp" is selected when available, otherwise "pcap" is selected when available.\nNE2000 Ethernet emulation will be disabled if no backend is available (or the specified backend if unavailable).
dialog.template.ne2000base = Address
dialog.template.ne2000base.tooltip = Base address of the NE2000 card (300 by default)
dialog.template.ne2000irq = IRQ
dialog.template.ne2000irq.tooltip = The interrupt used by the NE2000 card (3 by default)
dialog.template.ne2000macaddress = MAC address
dialog.template.ne2000macaddress.tooltip = The MAC address of the NE2000 card ('AC:DE:48:88:99:AA' by default)
dialog.template.ne2000udpforward = Forward UDP ports
dialog.template.ne2000udpforward.tooltip = Forward one or more UDP ports from the host into the DOS guest
dialog.template.ne2000tcpforward = Forward TCP ports
dialog.template.ne2000tcpforward.tooltip = Forward one or more TCP ports from the host into the DOS guest
