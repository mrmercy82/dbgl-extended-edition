dialog.template.gusmastervolume = GUS-Lautstärke
dialog.template.gusmastervolume.tooltip = Gesamtlautstärke der Gravis Ultrasound GF1 in Dezibel.\nEine niedrigere Gesamtlautstärke hilft bei Spielen oder Demoszene-Produktionen,\nderen Musik zu laut ist und übersteuert.
dialog.template.gusglobalregisterreadalias = GUS-Register-Alias
dialog.template.gusglobalregisterreadalias.tooltip = Bei true haben alle globalen GUS-Register einen Lese-Alias bei N und N+0x80.\nBei false haben, wie offiziell dokumentiert, nur die Stimmregister 0x0-0xF einen Lese-Alias bei 0x80-0x8F.\nBei auto wird anhand anderer Einstellungen wie dem GUS-Typ entschieden.\nDas kann für Demoszene-Beiträge nötig sein, die mit diesem Alias rechnen, z. B. Out of Control von Contract.
