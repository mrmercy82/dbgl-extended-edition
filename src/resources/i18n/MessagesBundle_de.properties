dialog.template.sboplport = Port des OPL2 Audio Board
dialog.template.sboplport.tooltip = Serieller Port des OPL2 Audio Board bei oplemu=opl2board; opl2mode wird dann automatisch zu 'opl2'.
dialog.template.sbhardwarebase = Adresse der echten Sound Blaster
dialog.template.sbhardwarebase.tooltip = Basisadresse der echten Sound-Blaster-Hardware
