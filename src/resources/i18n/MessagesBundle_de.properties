dialog.template.gustype.tooltip = Art der emulierten Gravis Ultrasound.\nclassic: Ursprünglicher Gravis-Ultrasound-Chipsatz\nclassic37: Ursprüngliche Gravis Ultrasound mit ICS-Mixer (Rev. 3.7)\nmax: Emulation der Gravis Ultrasound MAX (mit CS4231-Codec)\ninterwave: Gravis Ultrasound Plug & Play (Interwave)
dialog.template.gusmemsize = GUS-Speichergröße
