dialog.template.ultradir.tooltip = Pfad zum Gravis Ultrasound Ordner. In diesem Ordner sollte sich ein MIDI-Ordner befinden, in welchem sich die Patch-Dateien für die GUS-Wiedergabe befinden.\nPatch-Sets für Timidity sollten funktionieren
