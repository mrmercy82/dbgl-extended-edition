dialog.template.ime = IME
dialog.template.ime.tooltip = Unterstützt die Eingabemethoden des Systems (IME) zur Zeicheneingabe in den Windows- und Linux-Versionen.\nBei auto nur an, wenn DOSBox-X mit einer chinesischen, japanischen oder koreanischen Codepage startet.
dialog.template.tab.mouse = Maus
dialog.template.autolock = Automatisches Einfangen
dialog.template.autolock.tooltip = Die Maus wird "gefangen", wenn im DOSBox-Fenster geklickt wird
dialog.template.sensitivity = Empfindlichkeit
dialog.template.sensitivity.tooltip = Mausempfindlichkeit
dialog.template.mouseemu = Mausemulation
dialog.template.mouseemu.tooltip = Wann wird die Maus emuliert?\nintegration: wenn nicht gesperrt\nlocked: wenn gesperrt\nalways: immer\nnever: nie\nWenn aus, ist die Mausposition in DOSBox-X genau dort, wo das Host-Betriebssystem sie meldet.\nBei einer Maus mit hoher DPI kann die Emulation der Mausbewegung die Empfindlichkeit\nspürbar verringern, d. h. die Maus ist langsamer, aber genauer.
dialog.template.mousecapture = Maus einfangen
dialog.template.mousecapture.tooltip = Verhalten beim Einfangen der Maus:\nonclick: Maus beim Klick mit einer beliebigen Maustaste ins Fenster einfangen (Standard)\nonstart: Maus sofort beim Start einfangen. Funktioniert auf manchen Host-Systemen eventuell nicht richtig\nseamless: Maus nahtlos zwischen DOSBox-Fenster und übrigem Desktop bewegen; eingefangen wird nur per Mittelklick oder Tastenkürzel.\nNahtlose Maus funktioniert nicht mit allen Spielen richtig. Windows 3.1x lässt sich mit einem eigenen Maustreiber verträglich machen.\nnomouse: Maus ausblenden und keine Mauseingaben an das Spiel senden. Für Touchscreens 'seamless' verwenden.
dialog.template.middleunlock = Freigabe per mittlerer Taste
dialog.template.middleunlock.tooltip = Ob sich die gesperrte Maus mit der mittleren Maustaste freigeben lässt.\nBei "manual" nur mit "autolock=false", bei "auto" nur mit "autolock=true".
dialog.template.mousemiddlerelease = Freigabe per Mittelklick
dialog.template.mousemiddlerelease.tooltip = Die eingefangene Maus per Mittelklick freigeben und im nahtlosen Modus auch einfangen (standardmäßig an)
dialog.template.autolockfeedback = Rückmeldung bei automatischer Sperre
dialog.template.autolockfeedback.tooltip = Art der Rückmeldung zur automatischen Sperre: sichtbar, hörbar oder keine
dialog.template.usesystemcursor = Systemcursor verwenden
dialog.template.usesystemcursor.tooltip = Den Mauszeiger des Host-Systems verwenden, statt einen DOS-Mauszeiger zu zeichnen.\nAktiv, wenn die Maus nicht gesperrt ist.
dialog.template.int33 = INT33
dialog.template.int33.tooltip = INT 33H für Mausunterstützung aktivieren
dialog.template.aux8042 = 8042-AUX-Port
dialog.template.aux8042.tooltip = Emulation des AUX-Ports des 8042. Für die PS/2-Mausemulation nötig.\nAktivieren für Windows ME oder andere Betriebssysteme,\ndie Mausereignisse nicht über das BIOS empfangen.
dialog.template.mousevmware = VMware-Mausschnittstelle
dialog.template.mousevmware.tooltip = VMware-Mausschnittstelle (standardmäßig an). Voll verträglich nur mit einem experimentellen Treiber eines Drittanbieters für Windows 3.1x.\nHinweis: Erfordert eine aktivierte PS/2-Maus.
dialog.template.mousevirtualbox = VirtualBox-Mausschnittstelle
dialog.template.mousevirtualbox.tooltip = VirtualBox-Mausschnittstelle (standardmäßig an). Voll verträglich nur mit einem Treiber eines Drittanbieters für Windows 3.1x.\nHinweis: Erfordert eine aktivierte PS/2-Maus.
dialog.template.mousecommodel = COM-Mausmodell
dialog.template.mousecommodel.tooltip = Standard-Mausmodell am COM-Port (seriell):\n2button: 2 Tasten, Microsoft-Maus.\n3button: 3 Tasten, Logitech-Maus; weitgehend verträglich mit der Microsoft-Maus.\nwheel: 3 Tasten + Rad; weitgehend verträglich mit der Microsoft-Maus.\nmsm: 3 Tasten, Mouse-Systems-Maus; NICHT verträglich mit der Microsoft-Maus.\n2button+msm: automatische Wahl zwischen '2button' und 'msm'.\n3button+msm: automatische Wahl zwischen '3button' und 'msm'.\nwheel+msm: automatische Wahl zwischen 'wheel' und 'msm' (Standard).\nHinweis: Mäuse am COM-Port im Abschnitt [serial] aktivieren.
dialog.template.mouseps2model = PS/2-Mausmodell
dialog.template.mouseps2model.tooltip = Mausmodell am PS/2-AUX-Port:\nstandard: 3 Tasten, normale PS/2-Maus.\nintellimouse: 3 Tasten + Rad, Microsoft IntelliMouse.\nexplorer: 5 Tasten + Rad, Microsoft IntelliMouse Explorer (Standard).\nnone: keine PS/2-Maus emulieren.
dialog.template.mousedosdriver = DOS-Maustreiber
dialog.template.mousedosdriver.tooltip = Eingebauten DOS-Maustreiber aktivieren (standardmäßig an). Hinweise:\n- Abschalten, wenn im emulierten DOS der Original-Treiber MOUSE.COM verwendet werden soll.\n- Beim Booten eines Gastsystems wird der eingebaute Treiber automatisch abgeschaltet.
dialog.template.auxdevice = PS/2-Typ
dialog.template.auxdevice.tooltip = Art der PS/2-Maus am AUX-Port
dialog.template.mouserawinput = Rohe Mauseingabe
dialog.template.mouserawinput.tooltip = Mausbeschleunigung und Empfindlichkeit des Betriebssystems umgehen (standardmäßig an).\nWirkt im Vollbild oder wenn die Maus im Fenstermodus eingefangen ist.
dialog.template.mouseimmediate = Maus sofort aktualisieren
dialog.template.mouseimmediate.tooltip = Zähler der Mausbewegung sofort aktualisieren, ohne auf einen Interrupt zu warten (standardmäßig aus). Kann das Spielgefühl verbessern, aber Verträglichkeitsprobleme verursachen.
dialog.template.mousemultidisplayaware = Mausverhalten bei mehreren Bildschirmen
dialog.template.mousemultidisplayaware.tooltip = Nahtlose Maus und Freigabe des Mauszeigers auch im Vollbild auf Systemen mit mehreren Bildschirmen (standardmäßig an).\nHinweis: Abschalten, wenn fälschlich mehrere Bildschirme erkannt werden, obwohl nur einer genutzt werden soll. Das kann bei\ngespiegelten Bildschirmen oder dem HDMI-Eingang eines AV-Receivers nur für Ton passieren.
dialog.template.mousereportrate = Melderate
dialog.template.mousereportrate.tooltip = Melderate der Maus, oder 0 für automatisch. Bestimmt, wie oft Mausereignisse über den Maus-Interrupt an das Gastsystem gemeldet werden.\nManche Spiele, darunter CyClone, brauchen eine niedrigere Melderate. Im Automatikmodus kann das Gastsystem die Rate über die PS/2-Mausemulation ändern.\nOhne Wirkung auf DOS-Spiele, die die Mausbewegung per Abfrage über INT 33h ermitteln.
dialog.template.mousewheelkey = Mausrad als Tasten
dialog.template.mousewheelkey.tooltip = Bewegungen des Mausrads in Tastendrücke umwandeln, z. B. Pfeiltasten.\n0: aus; 1: Pfeil hoch/runter; 2: Pfeil links/rechts; 3: Bild auf/Bild ab.\n4: Strg+Pfeil hoch/runter; 5: Strg+Pfeil links/rechts; 6: Strg+Bild auf/Bild ab.\n7: Strg+W/Z, wie es Editoren wie WordStar und MS-DOS EDIT unterstützen.\nEin vorangestelltes Minuszeichen schaltet die Umwandlung für Gastsysteme ab.
dialog.template.tab.joystick = Joystick
dialog.template.joysticktype = Typ
dialog.template.joysticktype.tooltip = Joystick-Typ, welche emuliert wird\: "auto" (default), "none", "2axis" (unterstützt werden bis zu zwei Joysticks),\"n4axis" (unterstützt einen Joystick, erster wird benutzt), "4axis_2" (unterstützt einen Joystick, zweiter wird benutzt,\"nfcs" (Thrustmaster), "ch" (CH-Flightstick).\n"none" Joystick-Emulation wird deaktiviert.\n"auto" wählt die Emulation basierend auf evtl. vorhandenen Joystick(s).
dialog.template.timedemulation = Zeitgesteuerte Emulation
dialog.template.timedemulation.tooltip = Schalte getimte Intervalle für die Achsen ein ("false" ist die alte Einstellung)
dialog.template.autofire = Autofeuer
dialog.template.autofire.tooltip = Aktiviert Dauerfeuer, wenn Feuerknopf gedrückt wird
dialog.template.swap34 = Achsen 3 && 4 tauschen
dialog.template.swap34.tooltip = Tauscht die dritte und vierte Achse (wird für manche Joysticks benötigt)
dialog.template.buttonwrapping = Tasten umbrechen
dialog.template.buttonwrapping.tooltip = Aktiviert "button wrapping" für die Anzahl emulierter Joystick-Knöpfe
dialog.template.calibratex = Kalibrierung X-Achse
dialog.template.calibratex.tooltip = Kalibrierwerte der X-Achse aus den Tastenkürzeln übernehmen
dialog.template.calibratey = Kalibrierung Y-Achse
dialog.template.calibratey.tooltip = Kalibrierwerte der Y-Achse aus den Tastenkürzeln übernehmen
dialog.template.calibratehotkeys = Kalibrierung in Echtzeit
dialog.template.calibratehotkeys.tooltip = Tastenkürzel zur Kalibrierung der X- und Y-Achse des Joysticks in Echtzeit aktivieren
dialog.template.deadzone = Totzone
dialog.template.deadzone.tooltip = Prozentualer Anteil der zu ignorierenden Bewegungseingaben. Bei einem Wert "100"  verhält sich der analoge Controller-Stick wie ein digitaler Stick
dialog.template.circularinput = Kreisförmige Eingabe
dialog.template.circularinput.tooltip = Kreisförmige Eingabe in quadratische Ausgabe umrechnen. Ausprobieren, wenn sich der linke Analogstick nur im Kreis bewegen lässt
