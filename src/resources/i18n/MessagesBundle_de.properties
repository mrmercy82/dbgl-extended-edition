dialog.template.controllertype = Controller-Typ
dialog.template.controllertype.tooltip = Art des angeschlossenen Tastatur-Controllers (und der Tastatur).\nauto: automatisch je nach Maschinentyp\nat: AT-Tastatur (PS/2)\nxt: IBM-PC/XT-Tastatur\npcjr: IBM-PCjr-Tastatur (nur bei machine=pcjr)\npc98: PC-98-Tastaturemulation (nur bei machine=pc98)
