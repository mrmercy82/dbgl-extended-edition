dialog.template.automount = Automatisch einbinden
dialog.template.automount.tooltip = Automatisches Einbinden von Laufwerken unter Windows aktivieren
dialog.template.automountall = Windows-Laufwerke automatisch einbinden
dialog.template.automountall.tooltip = Beim Start automatisch alle verfügbaren Windows-Laufwerke einbinden
dialog.template.convertdrivefat = Automatisch in FAT umwandeln
dialog.template.convertdrivefat.tooltip = Wenn gesetzt, wandelt DOSBox-X eingebundene Nicht-FAT-Laufwerke (z. B. lokale Laufwerke) automatisch in das FAT-Format um, damit Gastsysteme sie nutzen können
dialog.template.automountwarning = Warnung beim automatischen Einbinden
dialog.template.automountwarning.tooltip = Wenn gesetzt, wird beim automatischen Einbinden der Windows-Laufwerke des Hosts eine Warnung angezeigt
dialog.template.freesizecap = Freier Speicher begrenzen
dialog.template.freesizecap.tooltip = Bei "cap" (="true") gilt der Wert von MOUNT -freesize nur, wenn der tatsächlich freie Platz größer als der angegebene Wert ist.\nBei "relative" ändert sich der Wert von MOUNT -freesize relativ zum angegebenen Wert.\nBei "fixed" (="false") wird immer der feste Wert von MOUNT -freesize gemeldet.
dialog.template.nocachedir = Verzeichnis-Cache abschalten
dialog.template.nocachedir.tooltip = Wenn gesetzt, binden MOUNT-Befehle standardmäßig mit -nocachedir ein (Verzeichnis-Cache aus)
dialog.template.tab.dosbox = DOSBox
dialog.template.association = DOSBox
dialog.template.dosboxversion = DOSBox-Version
dialog.template.set = Zuordnen
dialog.template.set.tooltip = Ausgewählte DOSBox-Version zuordnen: Nur Ihre eigenen Änderungen bleiben erhalten, alle übrigen Einstellungen kommen aus der Konfiguration dieser DOSBox-Version (geschieht beim Klick auf OK auch automatisch)
dialog.template.switch = Alles behalten
dialog.template.switch.tooltip = Ausgewählte DOSBox-Version zuordnen und alle aktuellen Werte behalten, auch die, die aus den Standardeinstellungen der bisherigen DOSBox-Version stammen
dialog.template.reloadsettings = Zurücksetzen
dialog.template.reloadsettings.tooltip = Zurücksetzen der Einstellungen des aktuellen Profils auf die Standardeinstellungen der ausgewählten DOSBox-Version \n(aktuelle Einstellungen werden vollständig verworfen)
dialog.template.miscellaneous = Diverses
dialog.template.priority = Priorität
dialog.template.priority.tooltip = Priorität, mit welcher DOSBox ausgeführt werden soll. Der zweite Wert ("inaktiv") ist für den minimierten Modus bzw. wenn das DOSBox-Fenster nicht im Fokus ist.
dialog.template.active = aktiv
dialog.template.inactive = inaktiv
dialog.template.waitonerror = DOSBox bei Fehlern geöffnet halten
dialog.template.waitonerror.tooltip = Bei Fehlern wird gewartet und die DOSbox-Konsole bleibt geöffnet
dialog.template.exitafterwards = DOSBox nach Beenden schließen
dialog.template.exitafterwards.tooltip = DOSBox schließen, wenn das DOS-Hauptprogramm beendet wurde
dialog.template.languagefile = DOSBox-Sprachdatei
dialog.template.languagefile.tooltip = Pfad zur DOSBox-Sprachdatei
dialog.template.customconf = Eigener Abschnitt
dialog.template.customconf.tooltip = Eigene Abschnitte an die Konfigurationsdatei anhängen
dialog.template.captures = Screenshot-Ordner
dialog.template.captures.tooltip = Pfad zum Ordner, in dem Objekte wie Screenshots, Wave- oder MIDI-Dateien gespeichert werden
dialog.template.configfile = Konfigurationsdatei
dialog.template.configfile.tooltip = Die Datei mit allen (abweichenden) DOSBox-Einstellungen
dialog.template.tab.experimentaloptions = Experimentelle Einstellungen
dialog.template.startbanner = Begrüßungstext
dialog.template.startbanner.tooltip = Wenn gesetzt (Standard), zeigt DOSBox-X beim Start den Begrüßungstext an
dialog.template.bannercolortheme = Farben des Begrüßungstexts
dialog.template.bannercolortheme.tooltip = Hier lässt sich ein anderes Farbschema für den Hintergrund des Begrüßungstexts wählen
dialog.template.showbasic = Grundinfos anzeigen
dialog.template.showbasic.tooltip = Wenn gesetzt, zeigt DOSBox-X in der Titelleiste Grundinfos wie die Versionsnummer und die aktuelle Geschwindigkeit.
dialog.template.startupverbosity = Ausführlichkeit beim Start
dialog.template.startupverbosity.tooltip = Steuert die Ausführlichkeit, bevor das Programm angezeigt wird (Standard 'auto')
dialog.template.showdetails = Detailinfos anzeigen
dialog.template.showdetails.tooltip = Wenn gesetzt, zeigt DOSBox-X in der Titelleiste die Zyklen (FPS) und die Emulationsgeschwindigkeit im Verhältnis zur Echtzeit.
dialog.template.titlebar = Titelleiste
dialog.template.titlebar.tooltip = Der Text in der Titelleiste von DOSBox-X
dialog.template.fastbioslogo = Schnelles BIOS-Logo
dialog.template.fastbioslogo.tooltip = Wenn gesetzt, überspringt DOSBox-X den BIOS-Bildschirm (ohne die Pause von einer Sekunde)
dialog.template.addtitlebar = Zusätzlicher Text für die Titelleiste
dialog.template.addtitlebar.tooltip = Zusätzlicher Text für die Titelleiste des Fensters
dialog.template.logotext = Logo-Text
dialog.template.logotext.tooltip = Text am unteren Bildschirmrand während des Start-Logos. Der Text wird automatisch umbrochen.\nFür einen erzwungenen Zeilenumbruch \\n in den Text schreiben.
dialog.template.logo = Ordner der Logo-Bilder
dialog.template.logo.tooltip = Ort der PNG-Bilder, die beim Start statt des DOSBox-X-Logos gezeigt werden.\nDas ist der Pfad des Basis-Dateinamens. Zum Beispiel verwendet logo=subdir\\sets\\007\\logo\nmit machine=vgaonly die Datei subdir\\sets\\007\\logo224x224.png als Logo.
dialog.template.showmenu = Menüleiste anzeigen
dialog.template.showmenu.tooltip = Ob die Menüleiste angezeigt wird (falls unterstützt). Standard: true.
dialog.template.quitwarning = Warnung beim Beenden
dialog.template.quitwarning.tooltip = Legt fest, ob DOSBox-X warnt, wenn der Benutzer das Fenster schließen will.\nBei auto (Standard) warnt DOSBox-X, wenn gerade ein DOS-Programm, ein Spiel oder ein Gastsystem läuft.\nBei autofile warnt DOSBox-X, wenn Dateien geöffnet sind oder ein Gastsystem läuft.
dialog.template.configurationtooltheme = Design des Konfigurationswerkzeugs
dialog.template.configurationtooltheme.tooltip = Design für das Konfigurationswerkzeug. Wenn nicht gesetzt, wird der Dunkelmodus des Hosts übernommen.
dialog.template.showadvancedoptions = Erweiterte Optionen
dialog.template.showadvancedoptions.tooltip = Wenn gesetzt, zeigt das Konfigurationswerkzeug standardmäßig alle Optionen an (auch die erweiterten)
dialog.template.resolveconfigpath = Optionen in Pfaden auflösen
dialog.template.resolveconfigpath.tooltip = Bei true löst DOSBox-X Optionen mit Pfaden in der Konfigurationsdatei auf (außer im Abschnitt [autoexec]).\nDazu gehören Umgebungsvariablen (%VAR% [DOS/Windows] oder ${VAR} [Linux/macOS]) und die Tilde (~) unter Linux/macOS.\nBei dosvar löst DOSBox-X auf allen Plattformen DOS-Umgebungsvariablen (%VAR%) auf (und die Tilde).\nBei tilde löst DOSBox-X unter Linux/macOS nur die Tilde (~) auf, aber keine Umgebungsvariablen.
dialog.template.configshortcuts = Konfigurations-Kurzbefehle
dialog.template.configshortcuts.tooltip = Kurzbefehle für eine einfachere Konfiguration erlauben (standardmäßig an).\nZ. B. genügt statt 'config -set sbtype sb16' einfach 'sbtype sb16',\nund statt 'config -get sbtype' einfach der Befehl 'sbtype'.
dialog.template.hostkey = Host-Taste
dialog.template.hostkey.tooltip = Standardmäßig verwendet DOSBox-X die im Mapper festgelegte Host-Taste: F11 unter Windows, F12 auf anderen Systemen.\nMit dieser Einstellung lässt sich stattdessen eine andere Host-Taste festlegen.\nDas geht auch über das Menü ("Main" => "Select host key").
dialog.template.startcmd = START-Befehl
dialog.template.startcmd.tooltip = Den Befehl START erlauben, um Programme auf dem Host-System zu starten.\nUnter Windows lassen sich Host-Programme oder -Befehle auch direkt aufrufen.
dialog.template.workingdiroption = Arbeitsordner
dialog.template.workingdiroption.tooltip = Wahl des Arbeitsordners von DOSBox-X beim Start.\nautoprompt: DOSBox-X entscheidet selbst, ob nach einem Arbeitsordner gefragt wird.\nconfig: Der Ordner der primären Konfigurationsdatei wird zum Arbeitsordner.\ncustom: Arbeitsordner über die Option "working directory default" festlegen.\ndefault: Wie autoprompt, aber DOSBox-X fragt, ob der gewählte Ordner gespeichert werden soll.\nforce: Wie "custom", überschreibt aber die Befehlszeilenoption -defaultdir.\nnoprompt: DOSBox-X verwendet den aktuellen Ordner und fragt nie.\nprogram: Der Programmordner von DOSBox-X wird zum Arbeitsordner.\nprompt: DOSBox-X fragt beim Start immer nach einem Arbeitsordner.\nuserconfig: Der Benutzer-Konfigurationsordner von DOSBox-X wird zum Arbeitsordner.
dialog.template.startquiet = Leise starten
dialog.template.startquiet.tooltip = Wenn gesetzt, zeigt DOSBox-X beim Start von Programmen auf dem Host\nkeine Meldungen wie "Now run it as a Windows application".
dialog.template.workingdirdefault = Standard-Arbeitsordner
dialog.template.workingdirdefault.tooltip = Der Standardordner, der als Arbeitsordner von DOSBox-X dient. Siehe auch die Einstellung "working directory option".\nBei working directory option=prompt ist dieser Ordner die Vorgabe für die Ordnerauswahl.
dialog.template.startwait = Nach dem Start warten
dialog.template.startwait.tooltip = Legt fest, ob DOSBox-X nach dem Start auf die Programme des Host-Systems wartet
dialog.template.startnopause = Keine Pause nach Abschluss
dialog.template.startnopause.tooltip = Wenn gesetzt, pausiert DOSBox-X nach der Ausführung eines Host-Befehls nicht.
dialog.template.autoexecsections = Autoexec-Abschnitte
dialog.template.autoexecsections.tooltip = Umgang mit Autoexec-Abschnitten aus mehreren Konfigurationsdateien:\njoin: zu einem großen Abschnitt zusammenfügen (bisheriges Verhalten; Standard).\noverwrite: den zuletzt gefundenen verwenden, wie bei anderen Einstellungen.
dialog.template.starttranspath = Pfade übersetzen
dialog.template.starttranspath.tooltip = Legt fest, ob DOSBox-X beim Start von Host-Programmen alle Pfade in der Befehlszeile\nautomatisch in Pfade des Host-Systems übersetzt.
dialog.template.imgcaptureformat = Aufnahmeformat
dialog.template.imgcaptureformat.tooltip = Format der Standard-Bildschirmfotos (Standard 'upscaled')
dialog.template.writeprotect = Dateien schreibschützen
dialog.template.writeprotect.tooltip = Viele Spiele öffnen alle ihre Dateien mit Schreibrechten, auch solche, die sie nie ändern.\nDiese Einstellung schützt diese Dateien vor dem Schreiben, das Spiel kann sie aber weiter lesen (standardmäßig an).\nAußerdem: Bei einem Copy-on-Write- oder Netzwerk-Dateisystem\nvermeidet diese Einstellung Schreibvorgänge für diese schreibgeschützten Dateien.
dialog.template.logfile = Protokolldatei
dialog.template.logfile.tooltip = Datei, in der die Protokollmeldungen gespeichert werden
dialog.template.pausewheninactive = Pause, wenn inaktiv
dialog.template.pausewheninactive.tooltip = Emulation anhalten, wenn das Fenster nicht aktiv ist (standardmäßig aus)
dialog.template.debuggerrun = Startmodus des Debuggers
dialog.template.debuggerrun.tooltip = Der Modus, in dem der DOSBox-X-Debugger startet
dialog.template.saveslot = Speicherplatz
dialog.template.saveslot.tooltip = Standard-Speicherplatz (1-100) zum Speichern und Laden von Spielständen
dialog.template.savefile = Speicherdatei
dialog.template.savefile.tooltip = Standard-Datei zum Speichern und Laden von Spielständen. Wenn angegeben, wird sie statt des Speicherplatzes verwendet.
dialog.template.saveremark = Notiz beim Speichern
dialog.template.saveremark.tooltip = Wenn gesetzt, fragt die Speicherfunktion beim Speichern eines Spielstands nach einer Notiz
dialog.template.autosave = Automatisch speichern
dialog.template.autosave.tooltip = Automatisches Speichern von Spielständen. Zeitabstand in Sekunden angeben, optional einen Speicherplatz oder ersten und letzten Speicherplatz.\nZum Beispiel speichert "autosave=10 11-20" alle 10 Sekunden in die Speicherplätze 11 bis 20.\nZusätzlich lassen sich bis zu 9 Programme angeben, z. B. "autosave=10 11-20 EDIT:21-30 EDITOR:35" für "EDIT" und "EDITOR".\nEin Minuszeichen (-) vor dem Zeitabstand bewirkt, dass das automatische Speichern beim Start nicht aktiv ist.
dialog.template.forceloadstate = Spielstand trotzdem laden
dialog.template.forceloadstate.tooltip = Wenn gesetzt, lädt DOSBox-X einen Spielstand auch dann, wenn die DOSBox-X-Version,\nder Maschinentyp, der Programmname oder die Speichergröße nicht übereinstimmen.
dialog.template.synctime = Zeit abgleichen
dialog.template.synctime.tooltip = Wenn gesetzt, gleicht DOSBox-X die Uhrzeit automatisch mit dem Host ab, sofern Datum und Uhrzeit nicht von Hand geändert werden
dialog.template.clipboardspeed = Einfügegeschwindigkeit der Zwischenablage
dialog.template.clipboardspeed.tooltip = Tastaturgeschwindigkeit beim Einfügen von Text aus der gemeinsamen Zwischenablage.\nGehen mit dem Standardwert 30 Tastenanschläge verloren, die Zahl erhöhen.\nBei Programmen, die Tastenanschläge schnell annehmen, kann man auch eine kleinere Zahl ausprobieren.
dialog.template.clipboardbutton = Kopieren/Einfügen per Zwischenablage
dialog.template.clipboardbutton.tooltip = Maustaste oder Pfeiltasten für das Kopieren und Einfügen über die gemeinsame Zwischenablage.\nStandard ist "right": Mit der rechten Maustaste wird Text markiert, in die Zwischenablage des Hosts kopiert und daraus eingefügt.\n"middle" verwendet die mittlere Maustaste, "arrows" die Pfeiltasten statt einer Maustaste, "none" schaltet die Funktion ab.\nBei "arrows" startet die Pos1-Taste (oder Fn+Shift+Links auf Mac-Laptops) die Markierung, die Ende-Taste (oder Fn+Shift+Rechts) beendet sie.
dialog.template.clipboardmod = Zusatztaste für die Zwischenablage
dialog.template.clipboardmod.tooltip = Zusatztaste für das Kopieren und Einfügen über die gemeinsame Zwischenablage per Maustaste oder Pfeiltasten.\nStandard ist "shift" (linke und rechte Umschalttaste). "none", wenn keine Zusatztaste gewünscht ist.
dialog.template.clipboardbios = Zwischenablage per BIOS
dialog.template.clipboardbios.tooltip = Legt fest, ob zum Einfügen aus der Zwischenablage die Tastaturfunktionen des BIOS statt simulierter Tastenanschläge verwendet werden.\nZum Einfügen in Programme unter Windows 3.x/9x (z. B. Editor) die Methode mit Tastenanschlägen verwenden.
dialog.template.tab.startup = Start
dialog.template.nativecommands = Externe Programme, die vor/nach dem Start von DOSBox gestartet werden sollen
dialog.template.tab.dosboxautoexec = DOSBox [autoexec] Abschnitt
dialog.template.customcommand1 = Am Anfang
dialog.template.customcommand2 = Vor dem Start
dialog.template.customcommand3 = Nach dem Start
dialog.template.customcommand4 = Am Ende
dialog.template.tab.rendering = Darstellung
dialog.template.output = Ausgabe
dialog.template.output.tooltip = Art der Videoausgabe
dialog.template.fullscreen = Vollbildmodus
dialog.template.fullscreen.tooltip = DOSBox wird im Vollbildmodus gestartet
dialog.template.windowresolution = Fenster-Auflösung
dialog.template.windowresolution.tooltip = Das Fenster wird auf diese Größe geändert, wenn das Ausgabegerät Hardware-Scaling beherrscht
dialog.template.fullscreenresolution = Vollbild-Auflösung
dialog.template.fullscreenresolution.tooltip = Vollbild-Auflösung\: Originalgröße oder feste Größe (z.Bsp. 1024x768)
dialog.template.scaler = Skalierer
dialog.template.scaler.tooltip = Ein Scaler wird genutzt, um niedrige Auflösungen zu vergrößern bzw. Bildverbesserungen zu erzielen
dialog.template.scalerforced = Forcieren
dialog.template.scalerforced.tooltip = Wenn gewählt, wird der Scaler auch beim Auftreten unerwünschter Resultate verwendet
dialog.template.doublebuffering = Doppelte Pufferung
dialog.template.doublebuffering.tooltip = Doppelte Pufferung im Vollbildmodus
dialog.template.aspectcorrection = Bildformat-Korrektur
dialog.template.aspectcorrection.tooltip = Bildformat-Korrektur (Aspect Ratio). Wenn die gewählte Ausgabemethode dies nicht unterstützt, kann es zu Geschwindigkeitsverlusten kommen
dialog.template.frameskip = Bilder überspringen
dialog.template.frameskip.tooltip = Anzahl der Frameskips
dialog.template.glshader = GLSL-Shader
dialog.template.glshader.tooltip = Einen adaptiven Shader zur CRT-Monitor-Emulation oder einen normalen GLSL-Shader für die OpenGL-Ausgabe festlegen.
dialog.template.pixelshader = Pixelshader
dialog.template.pixelshader.tooltip = Direct3D-Pixel-Shader-Programm festlegen (die Effektdatei muss im Unterordner Shaders liegen).\nMit angehängtem 'forced' wird der Pixel-Shader auch dann verwendet, wenn das Ergebnis eventuell nicht gewünscht ist.
dialog.template.texturerenderer = Textur-Renderer
dialog.template.texturerenderer.tooltip = Render-Treiber für die Ausgabe 'texture' (Standard 'auto').
dialog.template.maximize = Fenster maximieren
dialog.template.maximize.tooltip = Wenn gesetzt, wird das DOSBox-X-Fenster beim Start maximiert (nur SDL2- und Windows-SDL1-Versionen; für TTF-Ausgabe Vollbild verwenden)
dialog.template.videodriver = Videotreiber
dialog.template.videodriver.tooltip = Erzwingt einen Videotreiber für die SDL-Bibliothek (z. B. windib/windows, directx, x11, fbcon, dummy)
dialog.template.dpiaware = DPI-bewusst
dialog.template.dpiaware.tooltip = Teilt dem Betriebssystem mit, dass DOSBox-X DPI-bewusst ist (Standard auto).\nOhne diese Einstellung vergrößern Windows Vista/7/8/10 und neuer das DOSBox-X-Fenster\nauf hochauflösenden Monitoren eventuell, was meist nicht gewünscht ist.
dialog.template.windowposition = Fensterposition
dialog.template.windowposition.tooltip = Anfangsposition des Fensters im Fenstermodus:\n auto: Der Fenstermanager entscheidet (Standard).\nX,Y: Position im Format X,Y (z. B. 250,100). 0,0 ist die linke obere Bildschirmecke.
dialog.template.windowpositionx = Fensterposition
dialog.template.windowpositionx.tooltip = Fensterposition beim Start im Format X,Y (z. B. 1300,200).\nMit "," (oder leer) wird das Fenster zentriert, mit "-" bleibt es an der ursprünglichen Position.
dialog.template.aspectratio = Seitenverhältnis
dialog.template.aspectratio.tooltip = Seitenverhältnis (z. B. 16:9) für die Seitenverhältnis-Korrektur.\n0:0 bedeutet das Standardverhältnis 4:3, -1:-1 das ursprüngliche Bildverhältnis.
dialog.template.overscan = Overscan-Rand
dialog.template.overscan.tooltip = Breite des Overscan-Rands für die Ausgabe "surface"
dialog.template.integerscaling = Ganzzahlige Skalierung
dialog.template.integerscaling.tooltip = Begrenzt den waagerechten oder senkrechten Skalierungsfaktor auf die größte ganze Zahl, mit der das Bild noch in den Anzeigebereich passt.\nDas eingestellte Seitenverhältnis bleibt gemäß den Einstellungen 'aspect' und 'viewport' immer erhalten,\nwodurch der Faktor in der anderen Richtung nicht ganzzahlig sein kann. Ist das Bild größer als der Anzeigebereich,\nwird die ganzzahlige Skalierung automatisch abgeschaltet (wie 'off').
dialog.template.autofit = Automatisch einpassen
dialog.template.autofit.tooltip = Passt das Bild bestmöglich ins Fenster ein. Gedacht für output=direct3d, fullresolution=original, aspect=true
dialog.template.viewport = Anzeigebereich
dialog.template.viewport.tooltip = Größe des Anzeigebereichs. Das ist die größte Zeichenfläche; das Bild liegt immer\ninnerhalb dieses Bereichs, unter Berücksichtigung des eingestellten Seitenverhältnisses.
dialog.template.windowdecorations = Fensterrahmen
dialog.template.windowdecorations.tooltip = Fensterrahmen im Fenstermodus anzeigen (standardmäßig an)
dialog.template.vsyncmode = V-Sync-Modus
dialog.template.vsyncmode.tooltip = Modus der vertikalen Synchronisation (VSync) des Host-Grafiktreibers:\nauto: VSync nur, wo es hilft, z. B. bei einem interpolierenden VRR-Bildschirm im Vollbild (Standard).\non: VSync an. Kann Bildrisse in manchen Spielen verhindern, kostet aber Leistung oder verwirft Bilder, wenn die DOS-Bildrate höher ist als die des Hosts (z. B. 70 Hz DOS gegenüber 60 Hz Host).\nadaptive: VSync an, solange die Bildrate über der des Hosts liegt, und aus, wenn sie darunter fällt.\nUnter macOS eine sinnvolle Alternative zu 'on'. Hinweis: nur in OpenGL-Ausgabemodi gültig, sonst wie 'on'.\noff: VSync möglichst abschalten, für schnellere Bildausgabe mit dem Risiko von Bildrissen in manchen Spielen.\nyield: Die Synchronisation dem Grafiktreiber des Hosts überlassen.
dialog.template.vsyncrate = V-Sync-Rate
dialog.template.vsyncrate.tooltip = VSync-Rate, wenn VSync an ist. Wird ignoriert, wenn vsyncmode auf host steht (win32).
dialog.template.vsyncskip = VSync überspringen
dialog.template.vsyncskip.tooltip = Mikrosekunden, die das Rendern blockieren darf, bevor das nächste Bild übersprungen wird.\nEin Wert von 7000 ist z. B. etwa die halbe Bilddauer bei 70 Hz.\n0 schaltet das ab, es wird immer gerendert (Standard).
dialog.template.hostrefreshrate = Bildwiederholrate
dialog.template.hostrefreshrate.tooltip = Bildwiederholrate des Hosts:\n auto: SDI-Raten verwenden, im Vollbild auf einem Bildschirm mit hoher Bildrate VRR-Raten (Standard).\nsdi: SDI-Raten (Serial Device Interface) ohne weitere Anpassung verwenden.\nvrr: 3 Hz von der gemeldeten Rate abziehen (empfohlen für VRR-Bildschirme).\nN: Eigene Bildwiederholrate in Hz (Dezimalwerte erlaubt; Minimum 23.000).
dialog.template.framepresentationmode = Bildausgabemodus
dialog.template.framepresentationmode.tooltip = Modus der Bildausgabe:\nauto: Bilder anhand der Bildraten von Host und DOS geschickt takten und verwerfen, damit die Emulation nicht stockt (Standard).\ncfr: DOS-Bilder immer mit konstanter Bildrate ausgeben.\nvfr: Geänderte DOS-Bilder immer mit variabler Bildrate ausgeben.
dialog.template.transparency = Transparenz
dialog.template.transparency.tooltip = Set the transparency of the DOSBox Staging screen (0 by default).\nFrom 0 (no transparency) to 90 (high transparency).
dialog.template.displayno = Bildschirmnummer
dialog.template.displayno.tooltip = Nummer des Bildschirms bei mehreren Bildschirmen (0 = Standard)
dialog.template.doublescan = Doppelte Zeilen
dialog.template.doublescan.tooltip = Wenn gesetzt, gibt die Ausgabe mit doppelten Zeilen für jede Quellzeile zwei Bildzeilen aus, wie die echte VGA-Ausgabe (320x200 wird z. B. als 640x400 gerendert).\nWenn nicht gesetzt, wird in der nativen Quellauflösung gerendert (320x200 als 320x200).\nDas betrifft das Raster VOR den Software- oder Hardware-Skalierern. Mit dieser Option arbeiten manche Skalierer eventuell nicht wie erwartet.\nIn dem Fall die Option abschalten. Für pixelgenaue Skalierung (output=openglpp) wird empfohlen, sie abzuschalten.
dialog.template.screensaver = Bildschirmschoner
dialog.template.screensaver.tooltip = Mit 'allow' oder 'block' die Umgebungsvariable SDL_VIDEO_ALLOW_SCREENSAVER überschreiben,\ndie den Bildschirmschoner während der Emulation meist blockiert (Standard 'auto').
dialog.template.euro = Euro-Zeichen
dialog.template.euro.tooltip = Statt des angegebenen ASCII-Zeichens (33-255) das Euro-Zeichen anzeigen.\nMit 128 erscheint z. B. das Euro-Zeichen statt des C mit Cedille.
dialog.template.char9 = 9 Pixel breite Schriften
dialog.template.char9.tooltip = 9 Pixel breite Schriften im Textmodus statt 8 Pixel breiter erlauben
dialog.template.tab.ttf = TrueType font (TTF)
dialog.template.ttf.bold = Fett
dialog.template.ttf.bold.tooltip = Wenn gesetzt, zeigt DOSBox-X bei der TTF-Ausgabe fetten Text auch fett an (erfordert eine eingestellte Textverarbeitung).\nDafür wird die mit fontbold angegebene fette Schrift verwendet oder die Schrift automatisch fett dargestellt.
dialog.template.ttf.font = Schrift
dialog.template.ttf.font.tooltip = TrueType-Schrift für die TTF-Ausgabe. Ohne Angabe wird die eingebaute TrueType-Schrift verwendet.\nAngeben lässt sich ein Schriftname oder ein vollständiger Pfad. Bei Dateien mit der Endung .TTF kann die Endung entfallen.\nBei einem Schriftnamen oder relativen Pfad werden z. B. der Arbeitsordner und der Schriftordner des Systems durchsucht.\nZum Beispiel verwendet "consola" oder "consola.ttf" die Schrift Consola (bei Windows dabei); ebenso für andere TTF-Schriften.\nAußerdem werden OTF-Schriften (z. B. OratorStd.otf), .FON-Schriften (z. B. vgasys.fon) und .TTC-Schriften (z. B. msgothic.ttc) unterstützt.\nFür chinesischen, japanischen oder koreanischen Text in diesen Codepages ist eine Schrift mit CJK-Zeichen nötig (z. B. GNU Unifont oder Sarasa Gothic).
dialog.template.ttf.italic = Kursiv
dialog.template.ttf.italic.tooltip = Wenn gesetzt, zeigt DOSBox-X bei der TTF-Ausgabe kursiven Text auch kursiv an (erfordert eine eingestellte Textverarbeitung).\nDafür wird die mit fontital angegebene kursive Schrift verwendet oder die Zeichen werden automatisch schräg gestellt.
dialog.template.ttf.fontbold = Fette Schrift
dialog.template.ttf.fontbold.tooltip = Optional eine fette TrueType-Schrift für die TTF-Ausgabe, mit der fetter Text dargestellt wird.\nErfordert eine mit der Option wp eingestellte Textverarbeitung; diese fette Schrift wird dann für den Stil fett verwendet.\nZum Beispiel verwendet "consolab" oder "consolab.ttf" die Schrift Consolab; ebenso für andere TTF-Schriften.
dialog.template.ttf.underline = Unterstrichen
dialog.template.ttf.underline.tooltip = Wenn gesetzt, zeigt DOSBox-X bei der TTF-Ausgabe unterstrichenen Text auch unterstrichen an (erfordert eine eingestellte Textverarbeitung)
dialog.template.ttf.fontital = Kursive Schrift
dialog.template.ttf.fontital.tooltip = Optional eine kursive TrueType-Schrift für die TTF-Ausgabe, mit der kursiver Text dargestellt wird.\nErfordert eine mit der Option wp eingestellte Textverarbeitung; diese kursive Schrift wird dann für den Stil kursiv verwendet.\nZum Beispiel verwendet "consolai" oder "consolai.ttf" die Schrift Consolai; ebenso für andere TTF-Schriften.
dialog.template.ttf.strikeout = Durchgestrichen
dialog.template.ttf.strikeout.tooltip = Wenn gesetzt, zeigt DOSBox-X bei der TTF-Ausgabe durchgestrichenen Text auch durchgestrichen an (erfordert eine eingestellte Textverarbeitung)
dialog.template.ttf.fontboit = Fett-kursive Schrift
dialog.template.ttf.fontboit.tooltip = Optional eine fett-kursive TrueType-Schrift für die TTF-Ausgabe, mit der fett-kursiver Text dargestellt wird.\nErfordert eine mit der Option wp eingestellte Textverarbeitung; diese Schrift wird dann für den Stil fett-kursiv verwendet.\nZum Beispiel verwendet "consolaz" oder "consolaz.ttf" die Schrift Consolaz; ebenso für andere TTF-Schriften.
dialog.template.ttf.righttoleft = Von rechts nach links
dialog.template.ttf.righttoleft.tooltip = Wenn gesetzt, zeigt DOSBox-X bei der TTF-Ausgabe Text von rechts nach links statt von links nach rechts an.\nDas ist besonders für Sprachen mit Schrift von rechts nach links nützlich (z. B. Arabisch und Hebräisch).
dialog.template.ttf.blinkc = Blinkender Cursor
dialog.template.ttf.blinkc.tooltip = Bei true blinkt der Cursor bei der TTF-Ausgabe, bei false nicht.\nDie Blinkgeschwindigkeit lässt sich mit einer ganzen Zahl zwischen 1 (am schnellsten) und 7 (am langsamsten) einstellen, 0 bedeutet kein Cursor.
dialog.template.ttf.printfont = Schrift zum Drucken verwenden
dialog.template.ttf.printfont.tooltip = Wenn gesetzt, verwendet DOSBox-X die aktuelle TrueType-Schrift (Option font) außer zum Anzeigen auch zum Drucken
dialog.template.ttf.colors = Farbschema
dialog.template.ttf.colors.tooltip = Farbschema für die TTF-Ausgabe, angegeben durch alle 16 Farbwerte als RGB: (r,g,b) oder hexadezimal wie in HTML: #RRGGBB\nDie ursprünglichen DOS-Farben (0-15): #000000 #0000aa #00aa00 #00aaaa #aa0000 #aa00aa #aa5500 #aaaaaa #555555 #5555ff #55ff55 #55ffff #ff5555 #ff55ff #ffff55 #ffffff\nGraustufen-Farbschema: (0,0,0)  #0e0e0e  (75,75,75) (89,89,89) (38,38,38) (52,52,52) #717171 #c0c0c0 #808080 (28,28,28) (150,150,150) (178,178,178) (76,76,76) (104,104,104) (226,226,226) (255,255,255)\nMit einem vorangestellten "+" wird das Farbschema auch beim Wechsel von einer anderen Ausgabe verwendet.
dialog.template.ttf.autodbcs = DBCS automatisch
dialog.template.ttf.autodbcs.tooltip = Wenn gesetzt, aktiviert DOSBox-X chinesische, japanische und koreanische DBCS-Zeichen (Doppelbyte), wenn diese Codepages aktiv sind.\nNur bei einer DBCS-Codepage (932: Japanisch, 936: vereinfachtes Chinesisch, 949: Koreanisch, 950: traditionelles Chinesisch)\nDas gilt für die Anzeige und den Druck dieser Zeichen (Einzelheiten zum Druck im Abschnitt [printer]).
dialog.template.ttf.winperc = Fenstergröße in Prozent
dialog.template.ttf.winperc.tooltip = Fenstergröße der TTF-Ausgabe in Prozent (100 = Vollbild). Wird ignoriert, wenn ptsize angegeben ist.
dialog.template.ttf.gbk = GBK-Erweiterung
dialog.template.ttf.gbk.tooltip = Aktiviert die GBK-Erweiterung (zusätzlich zum Standard-Zeichensatz GB2312) für die TTF-Ausgabe in vereinfachtem Chinesisch oder die DOS/V-Emulation
dialog.template.ttf.ptsize = Schriftgröße in Punkt
dialog.template.ttf.ptsize.tooltip = Schriftgröße der TTF-Ausgabe in Punkt. Wenn angegeben (mindestens 9), hat sie Vorrang vor winperc.
dialog.template.ttf.chinasea = ChinaSea- und Big5-2003-Erweiterung
dialog.template.ttf.chinasea.tooltip = Aktiviert die ChinaSea- und Big5-2003-Erweiterung (zusätzlich zum Standard-Zeichensatz Big5-1984) für die TTF-Ausgabe in traditionellem Chinesisch.\nFür die korrekte Darstellung der ChinaSea-Zeichen ist eine TTF/OTF-Schrift mit diesen Zeichen nötig (z. B. die mitgelieferte Schrift SarasaGothicFixed).
dialog.template.ttf.lins = Zeilen
dialog.template.ttf.lins.tooltip = Anzahl der Zeilen auf dem Bildschirm bei der TTF-Ausgabe (0 = Standard)
dialog.template.ttf.dosvfunc = FEP-Steuerung
dialog.template.ttf.dosvfunc.tooltip = Wenn gesetzt, funktioniert die FEP-Steuerung für japanische DOS/V-Programme, und blinkende Zeichenattribute werden als hohe Helligkeit dargestellt.
dialog.template.ttf.cols = Spalten
dialog.template.ttf.cols.tooltip = Anzahl der Spalten auf dem Bildschirm bei der TTF-Ausgabe (0 = Standard)
dialog.template.ttf.wp = Textverarbeitung
dialog.template.ttf.wp.tooltip = Textverarbeitung für die TTF-Ausgabe, optional mit Versionsnummer.\nUnterstützt werden WP=WordPerfect, WS=WordStar, XY=XyWrite, FE=FastEdit, jeweils mit optionaler Versionsnummer.\nZum Beispiel stellt WP6 WordPerfect 6 ein und XY4 XyWrite 4.\nDanach richten sich programmspezifische Funktionen wie Textstile auf dem Bildschirm und die Schrift mit 512 Zeichen.
dialog.template.ttf.outputswitch = Ausgabe beim Wechsel
dialog.template.ttf.outputswitch.tooltip = Die Ausgabe, auf die DOSBox-X von der TTF-Ausgabe wechselt, wenn ein Grafikmodus verlangt wird, oder auto für automatische Wahl
dialog.template.dos.version = DOS-Version
dialog.template.dos.version.tooltip = Set DOS version (5.0 by default)
dialog.template.dosclipboardapi = DOS-Zwischenablage
dialog.template.dosclipboardapi.tooltip = Wenn gesetzt, werden DOS-Schnittstellen zum Austausch mit der Windows-Zwischenablage aktiviert (gemeinsame Zwischenablage).\nVorsicht: Manche Programme glauben dann, sie liefen unter Windows.
dialog.template.dos.setverfile = Versionsdatei
dialog.template.dos.setverfile.tooltip = Datei mit der Liste der Programme und der ihnen zugewiesenen DOS-Versionen (durch Tabulatoren getrennt), die SETVER.EXE dauerhaft speichert
dialog.template.dosclipboarddevice = Zwischenablage-Gerät
dialog.template.dosclipboarddevice.tooltip = Wenn aktiviert, wird ein DOS-Gerät für den Austausch in beide Richtungen mit der gemeinsamen Zwischenablage hinzugefügt.\n"read" erlaubt nur Lesen, "write" nur Schreiben.\n"full" oder "true" erlaubt beides; "false" oder "disabled" schaltet den Zugriff bzw. das Gerät ab.\nDer Gerätename ist standardmäßig CLIP$ und lässt sich mit der Einstellung "dos clipboard device name" ändern.
dialog.template.fat32setversion = Version automatisch setzen
dialog.template.fat32setversion.tooltip = Legt fest, ob DOSBox-X die gemeldete DOS-Version automatisch auf 7.0/7.10 setzt, wenn sie niedriger ist und LBA/FAT32-Images eingebunden werden sollen.\nBei "ask" fragt ein Hinweisfenster, ob DOSBox-X die gemeldete DOS-Version ändern soll, um das Image einzubinden.
dialog.template.dosclipboarddevicename = Name des Zwischenablage-Geräts
dialog.template.dosclipboarddevicename.tooltip = DOS-Gerätename (bis zu 8 Zeichen) für den Austausch in beide Richtungen mit der gemeinsamen Zwischenablage.\nOhne Angabe oder bei ungültigem Namen wird CLIP$ verwendet (z. B. zeigt "TYPE CLIP$" den Inhalt der Zwischenablage).\nOhne Wirkung, wenn "dos clipboard device enable" aus ist; im sicheren Modus abgeschaltet.
dialog.template.dos.localeperiod = Zeitraum der Ländereinstellungen
dialog.template.dos.localeperiod.tooltip = Zeitraum der Ländereinstellungen (Standard 'modern'). Historische Einstellungen (falls für das Land vorhanden) ahmen das Verhalten alter DOS-Versionen bei Datum, Uhrzeit oder Zahlen nach; moderne folgen heutigen Gepflogenheiten, passend zu üblichen Host-Systemen.
dialog.template.dos.country = DOS-Ländercode
dialog.template.dos.country.tooltip = DOS-Ländercode (Standard 'auto'). Er bestimmt landesspezifische Angaben wie Datums-, Uhrzeit- und Dezimalformat. Bei 'auto' wird der Ländercode der gewählten Tastaturbelegung verwendet.
dialog.template.dos.expandshellvar = Umgebungsvariablen auflösen
dialog.template.dos.expandshellvar.tooltip = Umgebungsvariablen wie %PATH% in der DOS-Befehlszeile auflösen (Standard auto: an ab DOS-Version 7.0). COMMAND.COM von FreeDOS und MS-DOS 7/8 unterstützt das.
dialog.template.dos.shellhistoryfile = Befehlsverlauf
dialog.template.dos.shellhistoryfile.tooltip = Datei mit dem dauerhaften Befehlsverlauf (Standard 'shell_history.txt'). Leer schaltet den dauerhaften Verlauf ab.
dialog.template.longfilenames = Lange Dateinamen
dialog.template.longfilenames.tooltip = Unterstützung langer Dateinamen. Bei auto (Standard) ist sie an, wenn die gemeldete DOS-Version mindestens 7.0 ist.\nBei autostart schaltet der eingebaute Befehl VER die Unterstützung nicht je nach gemeldeter DOS-Version ein oder aus.
dialog.template.fileaccesstries = Versuche beim Dateizugriff
dialog.template.fileaccesstries.tooltip = Bei einer positiven ganzen Zahl versucht DOSBox-X unter Windows so oft, Dateien auf eingebundenen lokalen Laufwerken\nohne Zwischenspeicher direkt zu lesen, zu schreiben oder zu sperren, bevor es aufgibt.\nFür Netzwerk-Datenbankprogramme (z. B. dBase, FoxPro) wird dringend ein Wert wie 3 empfohlen.
dialog.template.quickreboot = Schneller Neustart
dialog.template.quickreboot.tooltip = Wenn gesetzt, startet der DOS-Neustart-Aufruf das emulierte DOS (eingebautes DOS oder Gast-DOS) neu statt der ganzen virtuellen Maschine.
dialog.template.share = Share.exe
dialog.template.share.tooltip = Meldet SHARE.EXE als geladen und bietet Funktionen wie das Sperren von Dateien und Datensätzen,\nauch wenn nicht alle SHARE-Funktionen emuliert werden.
dialog.template.doslogconsole = CON-Ausgabe protokollieren
dialog.template.doslogconsole.tooltip = Wenn gesetzt, wird die CON-Ausgabe von DOS in die Protokolldatei geschrieben.\nBei "quiet" wird nur die CON-Ausgabe protokolliert (keine Debug-Ausgaben).
dialog.template.autofixwarning = Warnung bei beschädigter gepackter Datei
dialog.template.autofixwarning.tooltip = Bei true oder both zeigt DOSBox-X Meldungen, während es den Fehler "Packed file is corrupt" automatisch zu beheben versucht.\nBei false oder none zeigt DOSBox-X solche Meldungen beim Auftreten des Fehlers nicht an.\nBei "a20fix" oder "loadfix" zeigt DOSBox-X die Meldung nur für a20fix bzw. loadfix.
dialog.template.tab.configsys = Config.sys
dialog.template.configsys.shell = Shell
dialog.template.configsys.shell.tooltip = Der Befehlsinterpreter (COMMAND.COM oder 4DOS.COM)
dialog.template.configsys.dos = DOS
dialog.template.configsys.dos.tooltip = Meldet, ob DOS den HMA belegt und UMB-Speicher reserviert (falls vorhanden)
dialog.template.configsys.fcbs = FCBS
dialog.template.configsys.fcbs.tooltip = Anzahl der FCB-Handles für DOS-Programme (1-255). 0 verwendet automatisch einen sinnvollen Standardwert.
dialog.template.configsys.files = Files
dialog.template.configsys.files.tooltip = Anzahl der Datei-Handles für DOS-Programme (8-255). 0 verwendet automatisch einen sinnvollen Standardwert.
dialog.template.configsys.country = Land
dialog.template.configsys.country.tooltip = Ländercode für Datums-, Uhrzeit- und Dezimalformat und optional die Codepage für TTF-Ausgabe und Sprachdateien
dialog.template.configsys.lastdrive = Lastdrive
dialog.template.configsys.lastdrive.tooltip = Der höchste Laufwerksbuchstabe, auf den Programme zugreifen können
dialog.template.configsys.numlock = NumLock
dialog.template.configsys.numlock.tooltip = Anfangszustand der NumLock-Taste
dialog.template.configsys.break = Break
dialog.template.configsys.break.tooltip = Schaltet die erweiterte Prüfung auf STRG+C ein oder aus
dialog.template.configsys.setpath = PATH setzen
dialog.template.configsys.setprompt = PROMPT setzen
dialog.template.configsys.settemp = TEMP setzen
dialog.template.configsys.install = Install
dialog.template.configsys.installhigh = Installhigh
dialog.template.configsys.device = Device
dialog.template.configsys.devicehigh = Devicehigh
dialog.template.tab.dosv = DOS/V
dialog.template.dosvemu = DOS/V-Emulation
dialog.template.dosvemu.tooltip = DOS/V-Emulation aktivieren und die zu emulierende Version wählen. Gedacht für Spiele und Programme\naus Ostasien (China, Japan, Korea), die Doppelbyte-Zeichensätze (DBCS) und die DOS/V-Erweiterung verwenden,\num japanischen (jp), chinesischen (chs/cht/cn/tw) oder koreanischen (ko) Text anzuzeigen. Mit DOS/V wird der Textmodus 80x25 durch\neinen EGA/VGA-Grafikmodus ersetzt, der den Textmodus nachbildet; das kann mit nicht-asiatischer Software unverträglich sein, die\ndirekt über Segment 0xB800 auf den Textmodus zugreift. Für eine allgemeine DOS-Umgebung mit CJK-Unterstützung lieber DOS/V\nabschalten und die TTF-Ausgabe mit einer CJK-Codepage (932, 936, 949, 950) und einer TTF-Schrift mit CJK-Zeichen verwenden.
dialog.template.dosdbcs = DBCS-Tabelle
dialog.template.dosdbcs.tooltip = DBCS-Tabelle und Unterstützung für Chinesisch, Japanisch und Koreanisch bei der TTF-Ausgabe aktivieren.\nVORSICHT: Manche Programme stürzen ohne DBCS-Tabelle ab, darunter der Installer von Open Watcom.
dialog.template.dosvgetsysfont = Systemschriften verwenden
dialog.template.dosvgetsysfont.tooltip = Wenn aktiviert, versucht DOSBox-X unter Windows und Linux, die Systemschriften für die DOS/V-Emulation zu verwenden.\nGelingt das nicht, nimmt DOSBox-X die eingebaute japanische DOS/V-Schrift, oder man gibt eine andere Schrift an.
dialog.template.showdbcsnodosv = DBCS-Zeichen ohne DOS/V
dialog.template.showdbcsnodosv.tooltip = Stellt chinesische, japanische und koreanische Zeichen für DBCS-Codepages auf normalen VGA- und EGA-Maschinentypen ohne DOS/V und ohne TTF dar.\nDafür werden DOS/V-Schriften verwendet, die sich mit den Optionen oben einstellen lassen (z. B. fontxdbcs, fontxdbcs14 und fontxdbcs24).\nBei "auto" werden diese Zeichen dargestellt, wenn eine Sprachdatei geladen ist (oder die Option "autodbcs" gesetzt ist).
dialog.template.dosvyen = Yen-Zeichen
dialog.template.dosvyen.tooltip = Zeigt das japanische Yen-Zeichen an Position 5ch, wenn es in einer eigenen SBCS-Schrift für die japanische DOS/V- oder JEGA-Emulation an 7fh steht
dialog.template.fepcontrol = FEP
dialog.template.fepcontrol.tooltip = FEP-Steuerschnittstelle für die DOS/V-Emulation
dialog.template.vtext1 = V-Text-Modus 1
dialog.template.vtext1.tooltip = V-Text-Bildschirmmodus 1 für die DOS/V-Emulation. Mit dem Befehl "VTEXT 1" in diesen Modus wechseln.\nXGA/SXGA wird nur von den Maschinentypen svga_s3trio und svga_et4000 unterstützt.
dialog.template.vtext2 = V-Text-Modus 2
dialog.template.vtext2.tooltip = V-Text-Bildschirmmodus 2 für die DOS/V-Emulation. Mit dem Befehl "VTEXT 2" in diesen Modus wechseln.\nXGA/SXGA wird nur von den Maschinentypen svga_s3trio und svga_et4000 unterstützt.
dialog.template.dosvuse20pixelfont = 20-Pixel-Schrift verwenden
dialog.template.dosvuse20pixelfont.tooltip = Verwendet für die japanische DOS/V-Emulation (mit V-Text) die 20-Pixel-Schrift statt der 24-Pixel-Systemschrift
dialog.template.j3100 = J-3100
dialog.template.j3100.tooltip = Mit dosv=jp und einem anderen Wert als off wird der Toshiba J-3100 mit DCGA-Unterstützung emuliert.\n"on" oder "auto" startet J-3100 automatisch, mit "manual" wechselt man mit dem Befehl DCGA in den J-3100-Modus.
dialog.template.j3100type = J-3100-Modell
dialog.template.j3100type.tooltip = Das Toshiba-J-3100-Modell im J-3100-Modus. Je nach Modell ändert sich die Farbpalette.
dialog.template.dosvj3100colorscroll = J-3100-Bildlauf
dialog.template.dosvj3100colorscroll.tooltip = Legt fest, dass die Farbanzeige für den Bildlauf verwendet werden kann; das ist derzeit z. B. mit der J-3100-Version von SimCity unverträglich.\nDie VGA-Version von Toshiba Windows 3.1 läuft mit "false", die CGA/EGA-Version braucht "true".
dialog.template.dosvfontxsbcs = SBCS-Schrift 8x19
dialog.template.dosvfontxsbcs.tooltip = FONTX2-Datei zur Darstellung von SBCS-Zeichen (8x19) im DOS/V- oder JEGA-Modus. Ohne Angabe wird die Standardschrift verwendet.\nIm DOS/V-Modus lassen sich auch die Schriftdateien ASC16 und ASCFONT.15 (aus den chinesischen DOS-Systemen UCDOS und ETen) laden.
dialog.template.dosvfontxsbcs16 = SBCS-Schrift 8x16
dialog.template.dosvfontxsbcs16.tooltip = FONTX2-Datei zur Darstellung von SBCS-Zeichen (8x16) im DOS/V- oder JEGA-Modus. Ohne Angabe wird die Standardschrift verwendet.\nIm DOS/V-Modus lassen sich auch die Schriftdateien ASC16 und ASCFONT.15 (aus den chinesischen DOS-Systemen UCDOS und ETen) laden.
dialog.template.dosvfontxsbcs24 = SBCS-Schrift 12x24
dialog.template.dosvfontxsbcs24.tooltip = FONTX2-Datei zur Darstellung von SBCS-Zeichen (12x24) im DOS/V-Modus (mit V-Text). Ohne Angabe wird die Standardschrift verwendet.\nIm DOS/V-Modus lassen sich auch die Schriftdateien ASC24 und ASCFONT.24? (letztere aus dem chinesischen DOS-System ETen) laden.
dialog.template.dosvfontxdbcs = DBCS-Schrift 16x16
dialog.template.dosvfontxdbcs.tooltip = FONTX2-Datei zur Darstellung von DBCS-Zeichen (16x16) im DOS/V- oder VGA/JEGA-Modus. Ohne Angabe wird die Standardschrift verwendet.\nAlternativ lässt sich eine BDF- oder PCF-Schrift (16x16 oder 15x15) laden, z. B. die freien Bitmap-Schriften von WenQuanYi (https://wenq.org/).\nFür DOS/V in vereinfachtem Chinesisch lässt sich auch die Schriftdatei HZK16 laden (https://github.com/aguegu/BitmapFont/tree/master/font).\nFür DOS/V in traditionellem Chinesisch lässt sich auch die Schriftdatei STDFONT.15 aus dem chinesischen DOS-System ETen laden.
dialog.template.dosvfontxdbcs14 = DBCS-Schrift 14x14
dialog.template.dosvfontxdbcs14.tooltip = FONTX2-Datei zur Darstellung von DBCS-Zeichen (14x14) für das Konfigurationswerkzeug oder den EGA-Modus. Ohne Angabe wird die Standardschrift verwendet.\nAlternativ lässt sich eine BDF- oder PCF-Schrift (14x14 oder 15x15) laden, z. B. die freien Bitmap-Schriften von WenQuanYi (https://wenq.org/).\nFür DOS/V in vereinfachtem Chinesisch lässt sich auch die Schriftdatei HZK14 laden (https://github.com/aguegu/BitmapFont/tree/master/font).\nFür DOS/V in traditionellem Chinesisch lässt sich auch die Schriftdatei STDFONT.15 aus dem chinesischen DOS-System ETen laden.
dialog.template.dosvfontxdbcs24 = DBCS-Schrift 24x24
dialog.template.dosvfontxdbcs24.tooltip = FONTX2-Datei zur Darstellung von DBCS-Zeichen (24x24) im DOS/V-Modus (mit V-Text und 24-Pixel-Schriften).\nFür DOS/V in vereinfachtem Chinesisch lässt sich auch die Schriftdatei HZK24? laden (https://github.com/aguegu/BitmapFont/tree/master/font).\nFür DOS/V in traditionellem Chinesisch lässt sich auch die Schriftdatei STDFONT.24 aus dem chinesischen DOS-System ETen laden.
dialog.template.tab.system = System
dialog.template.machine = Rechner
dialog.template.machine.tooltip = Rechnertyp, welcher emuliert werden soll
dialog.template.integrationdevice = DOSBox-X-Integrationsgerät
dialog.template.integrationdevice.tooltip = Aktiviert das Integrations-E/A-Gerät von DOSBox-X, über das zusätzliche Software mit DOSBox-X kommunizieren kann. Derzeit experimentell.\nDarüber kann z. B. der aktuelle Status von DOSBox-X abgefragt oder vom Gastsystem die Position des Mauszeigers abgeglichen werden.
dialog.template.vmware = VMware-Integration
dialog.template.vmware.tooltip = Emulation der VMware-Schnittstelle einschließlich Mausintegration im Gastsystem\n(zusammen mit z. B. dem VMware-Maustreiber für Windows 3.x).
dialog.template.pc98256color = PC-98 256 Farben
dialog.template.pc98256color.tooltip = Wenn gesetzt, ist der Grafikmodus mit 256 Farben erlaubt, sonst nicht
dialog.template.pc98anex86font = PC-98 Anex86-Schrift
dialog.template.pc98anex86font.tooltip = Eine Anex86-kompatible Schrift für die PC-98-Emulation, wie sie der Emulator Anex86 unterstützt.\nStandardmäßig versucht DOSBox-X nach FONT.ROM die Dateien ANEX86.BMP und dann FREECG98.BMP zu laden.\nEine hier angegebene Schrift wird zuerst versucht, eventuell noch vor FONT.ROM (siehe vorige Option).
dialog.template.pc9816color = PC-98 16 Farben
dialog.template.pc9816color.tooltip = Wenn gesetzt, ist der Grafikmodus mit 16 Farben erlaubt, sonst nicht
dialog.template.pc98fmboard = PC-98 FM-Karte
dialog.template.pc98fmboard.tooltip = Im PC-98-Modus die zu emulierende FM-Musikkarte
dialog.template.pc98grcg = PC-98 GRCG-Grafik
dialog.template.pc98grcg.tooltip = Wenn gesetzt, sind die GRCG-Grafikfunktionen erlaubt, sonst nicht
dialog.template.pc98busmouse = PC-98 Busmaus
dialog.template.pc98busmouse.tooltip = Emulation der PC-98-Busmaus. Abschalten schaltet die Emulation von INT 33h nicht ab.
dialog.template.pc98egc = PC-98 EGC-Grafik
dialog.template.pc98egc.tooltip = Wenn gesetzt, sind die EGC-Grafikfunktionen erlaubt, sonst nicht
dialog.template.pc98forceibmkeyboard = PC-98 IBM-Tastatur
dialog.template.pc98forceibmkeyboard.tooltip = Erzwingt für die PC-98-Emulation eine Standard-Tastaturbelegung wie IBM US-Englisch.\nFunktioniert nur mit Programmen und Spielen, die die Tastatur über das BIOS ansprechen.
dialog.template.pc98fontrom = PC-98 Schrift-ROM
dialog.template.pc98fontrom.tooltip = Wenn aktiviert, versucht DOSBox-X für die PC-98-Emulation zuerst die von T98Tools erzeugte Datei FONT.ROM zu laden
dialog.template.pc98forcejiskeyboard = PC-98 JIS-Tastatur
dialog.template.pc98forcejiskeyboard.tooltip = Erzwingt für die PC-98-Emulation eine Standard-Tastaturbelegung wie JIS (JP106).\nFunktioniert nur mit Programmen und Spielen, die die Tastatur über das BIOS ansprechen.
dialog.template.pc98biosstring = PC-98 BIOS-Copyright
dialog.template.pc98biosstring.tooltip = Wenn gesetzt, steht der Copyright-Text des PC-98-BIOS an E800:0000.\nFür Software aktivieren, die zwischen PC-98 und Epson unterscheidet.
dialog.template.tab.cpu = CPU
dialog.template.core = Kern
dialog.template.core.tooltip = Art, wie der CPU-Kern emuliert wird. "auto" wird zu "dynamic" wechseln, wenn es möglich und angemessen ist
dialog.template.cputype = CPU-Typ
dialog.template.cputype.tooltip = CPU, welche emuliert werden soll. Die maximale Geschwindigkeit wird durch "auto" erreicht
dialog.template.cycles = Zyklen
dialog.template.cycles.tooltip = Anzahl der Berechnungen (Cycles) pro Millisekunde. Wird dieser Wert zu hoch eingestellt, kann es zu Soundaussetzern und Stottern kommen. Berechnungen können auf drei Arten eingestellt werden\:\n(1) "auto" versucht, den besten Wert für das Spiel zu finden. Normalerweise funktioniert das, aber bei einigen Spielen auch nicht.\n(2) Ein fester Wert (z. B. "4000") sollte eingestellen werden, wenn "auto" nicht korrekt funktioniert\n(3) Bei "max" wird die maximal mögliche Anzahl von Berechnungen angefordert.
dialog.template.up = Erhöhen um
dialog.template.up.tooltip = Anzahl der Berechnungen (Cycles), die man mittels Tastenkombination Strg+F12 dynamisch erhöht
dialog.template.down = Verringern um
dialog.template.down.tooltip = Anzahl der Berechnungen (Cycles), die man mittels Tastenkombination Strg+F11 dynamisch verringert
dialog.template.cpucycles = Zyklen
dialog.template.cpucycles.tooltip = Geschwindigkeit der emulierten CPU (Standard '3000'). Steht 'cpu_cycles_protected' auf 'auto', gilt der Wert für Programme im Real Mode und im Protected Mode.\n<Zahl>: Eine feste Anzahl Zyklen pro Millisekunde emulieren (etwa MIPS). Gültig von 50 bis 2000000.\nmax: So viele Zyklen emulieren, wie ein Kern der Host-CPU schafft. Die Zyklen pro Millisekunde können schwanken; das kann bei manchen DOS-Programmen Probleme machen.\nHinweise:\n- Mit 'max' oder hohen festen Werten kann der Ton aussetzen und alles träge werden.\n- Am besten den niedrigsten festen Wert wählen, mit dem das Spiel ausreichend schnell läuft.
dialog.template.cpucyclesprotected = Protected Mode
dialog.template.cpucyclesprotected.tooltip = Geschwindigkeit der emulierten CPU nur für Programme im Protected Mode (Standard '60000').\nauto: Die Einstellung `cpu_cycles' verwenden.\n<Zahl>: Eine feste Anzahl Zyklen pro Millisekunde emulieren (etwa MIPS). Gültig von 50 bis 2000000.\nmax: So viele Zyklen emulieren, wie ein Kern der Host-CPU schafft. Die Zyklen pro Millisekunde können schwanken; das kann bei manchen DOS-Programmen Probleme machen.
dialog.template.cputhrottle = Dynamisch drosseln
dialog.template.cputhrottle.tooltip = Die Zahl der emulierten CPU-Zyklen dynamisch senken, wenn die Host-CPU nicht mithält. Gilt nur für feste Zyklenwerte.\nDann können die Zyklen pro Millisekunde schwanken; das kann bei manchen DOS-Programmen Probleme machen.
dialog.template.fpuemulation = FPU
dialog.template.fpuemulation.tooltip = FPU-Emulation aktivieren
dialog.template.rdtscrate = RDTSC-Rate
dialog.template.rdtscrate.tooltip = Wenn nicht 0, zählt der Pentium-RDTSC-Zähler mit dieser Rate pro Millisekunde statt nach den Zyklen
dialog.template.dosidleapi = DOS-Leerlauf
dialog.template.dosidleapi.tooltip = Wenn gesetzt, kann DOSBox-X die CPU-Last des Hosts senken, wenn ein unterstütztes Programm im Gastsystem untätig ist
dialog.template.segmentlimits = Segmentgrenzen erzwingen
dialog.template.segmentlimits.tooltip = Prüfung der Segmentgrenzen bei CPU-Typen ab 80286 erzwingen
dialog.template.speedmods = Geschwindigkeitsoptimierungen
dialog.template.speedmods.tooltip = Änderungen erlauben, die bekanntermaßen die Leistung verbessern (standardmäßig an)
dialog.template.turbo = Turbo
dialog.template.turbo.tooltip = Aktiviert den Turbo-Modus (schneller Vorlauf), um Abläufe zu beschleunigen
dialog.template.outputportreset = CPU-Reset über Ausgabeport erlauben
dialog.template.outputportreset.tooltip = Wenn gesetzt (Standard), darf das Programm die CPU über den Tastatur-Controller zurücksetzen.\nDas ist nötig, damit Windows ME richtig neu startet; Windows 9x und älter\nstarten auch ohne diese Option über INT 19h neu.
dialog.template.apmbios = APM-BIOS
dialog.template.apmbios.tooltip = BIOS-Aufrufe für Advanced Power Management (APM) emulieren
dialog.template.isapnpbios = ISA-PnP-BIOS
dialog.template.isapnpbios.tooltip = ISA-Plug-and-Play-BIOS emulieren. Aktivieren für PnP-fähige DOS-Programme oder zum Booten von Windows 9x.\nNicht abschalten, wenn Windows 9x mit PnP-Geräten eingerichtet ist; das bringt es wahrscheinlich durcheinander.
dialog.template.tab.memory = Speicher
dialog.template.memorysize = Größe
dialog.template.memorysize.tooltip = RAM in Megabyte. Der Wert sollte auf dem voreingestellten Wert ("16") belassen werden, um Probleme mit einigen Spielen zu umgehen.\nAllerdings benötigen manche Spiele mehr RAM. Wird dieser Wert erhöht, steigt die Spielgeschwindigkeit nicht.
dialog.template.xms = XMS
dialog.template.xms.tooltip = Aktivieren für XMS-Unterstützung
dialog.template.ems = EMS
dialog.template.ems.tooltip = Auf "true" setzen für EMS-Unterstützung
dialog.template.umb = UMB
dialog.template.umb.tooltip = Auf "true" setzen für UMB-Unterstützung
dialog.template.hma = HMA
dialog.template.hma.tooltip = Über XMS melden, dass der HMA vorhanden ist (nicht unbedingt verfügbar)
dialog.template.shellhigh = Befehlsinterpreter im UMB
dialog.template.shellhigh.tooltip = Den Befehlsinterpreter von DOSBox-X in den oberen Speicher laden, wenn UMB verfügbar ist.\nBei auto (Standard) an, wenn die gemeldete DOS-Version mindestens 7.0 ist.
dialog.template.xmshandles = XMS-Handles
dialog.template.xmshandles.tooltip = Anzahl der XMS-Handles für die DOS-Umgebung, oder 0 für einen sinnvollen Standardwert
dialog.template.minimummcbfree = Mindestens frei bis Segment
dialog.template.minimummcbfree.tooltip = Segmentwert, bis zu dem Speicher frei bleiben soll. Beim Start reserviert der DOS-Kernel Speicher\nbis zu diesem Punkt. Das hilft bei EXEPACK-Problemen oder DOS-Programmen, die nicht\nzu weit unten im Speicher geladen werden dürfen. Soll mehr freier konventioneller Speicher gemeldet werden,\nkann man den Wert z. B. auf 1 setzen.
dialog.template.a20 = A20-Gate
dialog.template.a20.tooltip = Emulationsmodus des A20-Gates.\nDie Optionen on/off/on_fake/off_fake sind zum Testen und Debuggen bei der DOS-Entwicklung gedacht,\nzur Emulation ungewöhnlicher Hardware oder als Umgehung möglicher Probleme von DOS-Programmen mit dem erweiterten Speicher.\non_fake/off_fake prüfen, ob ein Programm mit einem Speichertest sicherstellt, dass das A20-Gate\nwie gewünscht gesetzt ist (wie HIMEM.SYS). Verlässt es sich nur auf das Gate-Bit, WIRD es abstürzen.\nDieser Wert lässt sich auch mit dem eingebauten Befehl A20GATE ändern.\nfast: A20 durch Umlegen der ersten 64 KB an der 1-MB-Grenze emulieren (schnell, Verhalten des normalen DOSBox)\nmask: A20 durch Maskieren der Speicheradressen emulieren (genau)\noff: A20-Gate fest aus (Software/Betriebssystem kann A20 nicht einschalten)\non: A20-Gate fest an (Software/Betriebssystem kann A20 nicht abschalten)\noff_fake: A20-Gate fest aus, aber das Bit darf umschalten (hoffentlich testet das DOS-Spiel den HMA!)\non_fake: A20-Gate fest an, aber das Bit darf umschalten
dialog.template.mcbfaults = MCB-Fehler
dialog.template.mcbfaults.tooltip = Umgang mit Speicherkettenblöcken, die von Software beschädigt wurden:\nrepair: Fehler mithilfe benachbarter Blöcke reparieren (und melden) (Standard).\nreport: Fehler melden, sonst unverändert weitermachen.\nallow: Fehler nicht melden (Verhalten echter Hardware).\ndeny: Beim Erkennen von Fehlern beenden (und melden).
dialog.template.pcjrmemorylayout = PCjr-Speicheraufteilung
dialog.template.pcjrmemorylayout.tooltip = Speicheraufteilung des PCjr (Standard 'expanded').\nexpanded: 640 KB Speicher, Programme oberhalb von 128 KB. Mit den meisten Spielen verträglich.\nstandard: 128 KB Speicher, Programme unterhalb von 96 KB. Nötig für manche ältere Spiele (z. B. Jumpman, Troll).
dialog.template.memoryfile = Speicherdatei
dialog.template.memoryfile.tooltip = Wenn gesetzt, wird der Speicher des Gastsystems aus einer Datei auf der Festplatte eingeblendet, statt im Arbeitsspeicher reserviert
dialog.template.tab.disks = Datenträger
dialog.template.fdc1enable = Disketten-Controller
dialog.template.fdc1enable.tooltip = Disketten-Controller aktivieren
dialog.template.fdc1pnp = Disketten-Controller PnP
dialog.template.fdc1pnp.tooltip = Disketten-Controller in der Geräteliste des ISA-PnP-BIOS aufführen
dialog.template.floppydatarate = Diskettengeschwindigkeit
dialog.template.floppydatarate.tooltip = Datendurchsatz der Diskette verlangsamen (begrenzen). Die Grenze in Byte pro Sekunde.\n0 schaltet die Grenze ab, -1 (Standard) verwendet eine sinnvolle Grenze.\nDie Geschwindigkeit wie in DOSBox SVN erreicht man mit 0.
dialog.template.fdc1mode = Disketten-Controller-Modus
dialog.template.fdc1mode.tooltip = Modus des Disketten-Controllers, also wie er sich verhält.\nps2: PS/2-Modus (am häufigsten)\nps2_model30: PS/2 Modell 30\nat: AT-Modus\nxt: PC/XT-Modus
dialog.template.ide1enable = Primärer IDE-Kanal
dialog.template.ide1enable.tooltip = IDE-Schnittstelle aktivieren
dialog.template.ide1pnp = Primärer IDE-Kanal PnP
dialog.template.ide1pnp.tooltip = IDE-Gerät in der Geräteliste des ISA-PnP-BIOS aufführen
dialog.template.ide2enable = Sekundärer IDE-Kanal
dialog.template.ide2pnp = Sekundärer IDE-Kanal PnP
dialog.template.ide3enable = Dritter IDE-Kanal
dialog.template.ide3pnp = Dritter IDE-Kanal PnP
dialog.template.ide4enable = Vierter IDE-Kanal
dialog.template.ide4pnp = Vierter IDE-Kanal PnP
dialog.template.ide5enable = Fünfter IDE-Kanal
dialog.template.ide5pnp = Fünfter IDE-Kanal PnP
dialog.template.ide6enable = Sechster IDE-Kanal
dialog.template.ide6pnp = Sechster IDE-Kanal PnP
dialog.template.ide7enable = Siebter IDE-Kanal
dialog.template.ide7pnp = Siebter IDE-Kanal PnP
dialog.template.ide8enable = Achter IDE-Kanal
dialog.template.ide8pnp = Achter IDE-Kanal PnP
dialog.template.hddatarate = Festplattengeschwindigkeit
dialog.template.hddatarate.tooltip = Datendurchsatz der Festplatte verlangsamen (begrenzen). Die Grenze in Byte pro Sekunde.\n0 schaltet die Grenze ab, -1 (Standard) verwendet eine sinnvolle Grenze.\nDie Geschwindigkeit wie in DOSBox SVN erreicht man mit 0.
dialog.template.tab.video = Video
dialog.template.vmemsizemb = Grafikspeicher in MB
dialog.template.vmemsizemb.tooltip = Grafikspeicher in Megabyte. Davon hängen die höchste Auflösung und Farbtiefe ab, die svga_s3 darstellen kann.\n-1: auto (vmemsizekb wird ignoriert)\n0: 512k (800x600 bei 256 Farben), wenn vmemsizekb=0\n1: 1024x768 bei 256 Farben oder 800x600 bei 64k Farben\n2: 1600x1200 bei 256 Farben oder 1024x768 bei 64k Farben oder 640x480 bei 16M Farben\n4: 1600x1200 bei 64k Farben oder 1024x768 bei 16M Farben\n8: bis 1600x1200 bei 16M Farben\nFür Spiele mit der Build-Engine mehr Speicher als oben angegeben verwenden, damit dreifache Pufferung möglich ist und nichts flimmert.
dialog.template.scanlineondemand = Zeilenweises Rendern bei Bedarf
dialog.template.scanlineondemand.tooltip = Die Videoausgabe beim VSync oder bei Änderungen mitten im Bild rendern, statt jede Bildzeile einzeln.\nKann bei den meisten DOS-Spielen die Leistung verbessern, aber zeitkritische Spiel- oder Demoszene-Effekte stören.\nStandard auto: aus für VGA-Modi, an für SVGA-Modi.
dialog.template.vmemsizekb = Grafikspeicher in KB
dialog.template.vmemsizekb.tooltip = Grafikspeicher in Kilobyte, zusätzlich zum Grafikspeicher in MB
dialog.template.vgarenderperscanline = VGA-Rendern pro Bildzeile
dialog.template.vgarenderperscanline.tooltip = Genaues VGA-Rendern pro Bildzeile emulieren (standardmäßig an).\nDerzeit muss das für einige Spiele abgeschaltet werden, sonst stürzen sie beim Start ab\n(z. B. Deus, Ishar 3, Robinson's Requiem, Time Warriors).
dialog.template.vmemsize = Grafikspeicher
dialog.template.vmemsize.tooltip = Grafikspeicher in MB (1-8) oder KB (256 bis 8192). 'auto' verwendet den Standard der gewählten Grafikkarte (Standard 'auto').
dialog.template.ioopt1 = Speicher-E/A-Optimierung 1
dialog.template.ioopt1.tooltip = Eine Gruppe von Optimierungen für EGA/VGA-Speicherzugriffe. Standard AN (true).\nBei Grafikfehlern zuerst das abschalten. Kann die Leistung verbessern.
dialog.template.vmemdelay = Verzögerung beim Grafikspeicherzugriff
dialog.template.vmemdelay.tooltip = Emulation der Verzögerung beim Zugriff auf den Grafikspeicher (Standard 'off').\noff: keine Verzögerung emulieren (Standard). Für die meisten Spiele besser, um Verlangsamungen zu vermeiden.\non: Verzögerung emulieren (3000 ns). Kann Flimmern in Hercules-, CGA-, EGA- und frühen VGA-Spielen verringern oder beseitigen.\n<Wert>: Verzögerung in Nanosekunden. Gültig von 0 bis 20000 ns; am sinnvollsten sind 500 bis 5000 ns.\nHinweis: Nur bei Bedarf pro Spiel setzen, weil es den ganzen Emulator verlangsamt.
dialog.template.dosrate = Bildrate
dialog.template.dosrate.tooltip = Bildrate des emulierten Videomodus anpassen.\ndefault: Der DOS-Videomodus bestimmt die Rate (empfohlen; Standard).\nhost: Die DOS-Rate an die Rate des Hosts anpassen.\n<Wert>: Eine genaue Rate zwischen 24.000 und 1000.000 (Hz).\nHinweis: Empfohlen ist 'default', sonst pro Spiel testen und einstellen.
dialog.template.monochromepalette = Monochrom-Palette
dialog.template.monochromepalette.tooltip = Palette für die Emulation einer Monochrom-Anzeige (Standard 'amber').\nFunktioniert nur mit den Maschinentypen 'hercules' und 'cga_mono'.\nHinweis: Die Paletten lassen sich auch per Tastenkürzel durchschalten.
dialog.template.ansi = ANSI
dialog.template.ansi.tooltip = Wenn gesetzt (Standard), wird ANSI.SYS emuliert. Wenn nicht, wird ANSI.SYS nicht emuliert und erscheint nicht als installiert.\nHINWEIS: Ohne Wirkung im PC-98-Modus, wo MS-DOS ANSI.SYS in den DOS-Kernel integriert.
dialog.template.cgacolors = CGA-Farben
dialog.template.cgacolors.tooltip = Darstellung der CGA-RGBI-Farben. Gilt für alle Maschinentypen,\ndie CGA-Grafik oder besser darstellen können.
dialog.template.blinking = Blinkender Text
dialog.template.blinking.tooltip = Auf false setzen, um helle Hintergrundfarben statt blinkendem Vordergrundtext zu sehen.\nOhne Wirkung im PC-98-Modus und in einigen anderen Videomodi.
dialog.template.vesamodes = VESA
dialog.template.vesamodes.tooltip = Legt fest, welche VESA-Videomodi verfügbar sind:\ncompatible: Nur die verträglichsten VESA-Modi für den eingestellten Grafikspeicher (Standard).\nEmpfohlen mit 4 oder 8 MB Grafikspeicher ('vmemsize') für die beste Verträglichkeit mit Spielen.\nDie 320x200-Modi mit vielen Farben fehlen, weil sie bis Ende der '90er nicht richtig unterstützt wurden.\nAuch die 256-Farben-Modi 320x240, 400x300 und 512x384 mit linearem Framebuffer fehlen, weil sie in Spielen mit der Build-Engine Timing-Probleme verursachen.\nhalfline: Wie 'compatible', aber der VESA-Modus 120h wird durch einen speziellen Halbzeilen-Modus für Extreme Assault ersetzt. Nur bei Bedarf.\nall: Alle Modi, auch zusätzliche DOSBox-eigene VESA-Modi.\nAm besten mit 8 MB Grafikspeicher. Manche Spiele verhalten sich bei bestimmten VESA-Modi falsch;\ndann 'compatible' ausprobieren. Die 320x200-Modi mit vielen Farben in diesem Modus brauchen oft Demoszene-Produktionen der späten '90er.
dialog.template.8pxvgafont = 8-Pixel-VGA-Schrift
dialog.template.8pxvgafont.tooltip = 8 Pixel breite Schriften auf VGA-Karten verwenden (standardmäßig aus)
dialog.template.reelmagic = ReelMagic MPEG
dialog.template.reelmagic.tooltip = Unterstützung für die MPEG-Wiedergabe mit ReelMagic (auch REALmagic):\noff: keine Unterstützung (Standard).\ncardonly: Karte initialisieren, ohne den Treiber FMPDRV.EXE zu laden.\non: Karte initialisieren und FMPDRV.EXE beim Start laden.
dialog.template.reelmagicfcode = ReelMagic-Bildrate
dialog.template.reelmagicfcode.tooltip = Bildraten-Code für die Videowiedergabe vorgeben:\n0: keine Vorgabe, Bildrate automatisch ermitteln (Standard).\n1 bis 7: Bildrate fest vorgeben (1 bis 7 verwenden):\n1=23,976, 2=24, 3=25, 4=29,97, 5=30, 6=50 oder 7=59,94 FPS.
dialog.template.reelmagickey = ReelMagic-Schlüssel
dialog.template.reelmagickey.tooltip = Der 32-Bit-Schlüssel zum Entschlüsseln der Videos des Spiels:\n auto: Schlüssel mit den eingebauten Routinen ermitteln (Standard).\ncommon: Den häufigsten Schlüssel verwenden, 0x40044041.\nthehorde: Den Schlüssel von The Horde verwenden, 0xC39D7088.\n<eigener>: Eigenen Schlüssel hexadezimal angeben (z. B. 0x12345678).
dialog.template.tab.cgacomposite = CGA composite
dialog.template.composite = Composite-Modus beim Start
dialog.template.composite.tooltip = Composite-Modus beim Start aktivieren (nur für die Maschinentypen 'cga', 'pcjr' und 'tandy'; Standard 'auto'). Bei 'auto' entscheidet das Programm.
dialog.template.compositeera = Composite-Generation
dialog.template.compositeera.tooltip = Generation der Composite-Technik (Standard 'auto'). Bei 'auto' verwendet der PCjr 'new', CGA und Tandy 'old'.
dialog.template.compositehue = Hue
dialog.template.compositehue.tooltip = Farbton der RGB-Palette (Standard 0). Zum Beispiel so lange anpassen, bis der Himmel blau ist.
dialog.template.compositesaturation = Sättigung
dialog.template.compositesaturation.tooltip = Farbintensität, von blass bis kräftig (Standard 100)
dialog.template.compositecontrast = Kontrast
dialog.template.compositecontrast.tooltip = Verhältnis zwischen dunklen und hellen Bereichen (Standard 100)
dialog.template.compositebrightness = Helligkeit
dialog.template.compositebrightness.tooltip = Helligkeit des Bildes, von dunkel bis hell (Standard 0)
dialog.template.compositeconvergence = Konvergenz
dialog.template.compositeconvergence.tooltip = Konvergenz der Subpixel, von unscharf bis scharf (Standard 0)
dialog.template.tab.voodoo = Voodoo
dialog.template.voodooemu = Voodoo-Emulation
dialog.template.voodooemu.tooltip = Unterstützung für die 3dfx-Voodoo-Karte aktivieren
dialog.template.voodoo3dfx = Voodoo-Emulation
dialog.template.voodoo3dfx.tooltip = 3dfx-Voodoo-Emulation aktivieren (standardmäßig an)
dialog.template.voodoomem = Voodoo-RAM
dialog.template.voodoomem.tooltip = Speichergröße der VOODOO-Karte.\n'standard' Karte mit 4 MB (2 MB Bildpuffer + 1x 2 MB Textureinheit)\n'max' Karte mit 12 MB (4 MB Bildpuffer + 2x 4 MB Textureinheiten)
dialog.template.voodoomemsize.tooltip = Grafikspeicher der 3dfx-Voodoo-Grafik, 4 oder 12 MB.\nDer Speicher verteilt sich so auf das Frame Buffer Interface (FBI) und die Texture Mapping Units (TMU):\n4: 2 MB für das FBI und eine TMU mit 2 MB (Standard).\n12: 4 MB für das FBI und zwei TMUs mit je 4 MB.
dialog.template.voodoomaxmem = Voodoo maximaler Speicher
dialog.template.voodoomaxmem.tooltip = Ob die Voodoo-Karte die maximale Speichergröße erhält.\nWenn gesetzt (standardmäßig an), hat sie 12 MB (4 MB Bildpuffer + 2x 4 MB Textureinheiten).\nSonst die Standardgröße 4 MB (2 MB Bildpuffer + 1x 2 MB Textureinheit).
dialog.template.glide = Glide
dialog.template.glide.tooltip = Enable glide emulation
dialog.template.lfbglide = LFB-Access
dialog.template.lfbglide.tooltip = LFB-Zugriff. OpenGlide unterstützt das Sperren des Hilfspuffers nicht, bitte die _noaux-Modi verwenden
dialog.template.splash3dfx = 3Dfx-Splashscreen
dialog.template.splash3dfx.tooltip = Show 3dfx splash screen (requires 3dfxSpl2.dll)
dialog.template.voodoomultithreading = Voodoo-Threads
dialog.template.voodoomultithreading.tooltip = Threads verwenden, um die 3dfx-Voodoo-Leistung zu verbessern:\nauto: bis zu 8 Threads je nach verfügbaren CPU-Kernen (Standard).\n<Wert>: Eine bestimmte Anzahl Threads zwischen 1 und 16.\nHinweis: Tests zeigen, dass die Bildrate bis 8 Threads steigt und danach meist gleich bleibt oder sinkt.
dialog.template.voodoobilinearfiltering = Voodoo bilineare Filterung
dialog.template.voodoobilinearfiltering.tooltip = Bilineare Filterung verwenden, um die Texturglättung der 3dfx Voodoo nachzubilden (standardmäßig aus).\nNur mit einer schnellen Desktop-CPU empfohlen, auf langsameren Systemen kann die Bildrate leiden.
dialog.template.tab.audio = Audio
dialog.template.silentmode = Stille-Modus
dialog.template.silentmode.tooltip = Der Soundmixer wird auf "aus" (mute) gesetzt. Der Sound wird jedoch trotzdem emuliert
dialog.template.samplerate = Samplerate
dialog.template.samplerate.tooltip = Die Samplerate des Soundmixers in Hertz. Wird bei einem Gerät eine höhere Samplerate als diese eingestellt, kann dies die Soundqualität vermindern
dialog.template.blocksize = Block-Größe
dialog.template.blocksize.tooltip = Die Block-Größe des Soundmixers. Größere Blöcke können bei Soundaussetztern helfen, aber es kann zu leichten Soundverzögerungen kommen
dialog.template.prebuffer = Prebuffer-Größe
dialog.template.prebuffer.tooltip = Größe des Soundpuffers in Millisekunden
dialog.template.mixercommand = Mixer-Befehle
dialog.template.mixercommand.tooltip = Lautstärke der Mixer-Kanäle einstellen
dialog.template.mutewheninactive = Stumm, wenn inaktiv
dialog.template.mutewheninactive.tooltip = Ton stummschalten, wenn das Fenster nicht aktiv ist (standardmäßig aus)
dialog.template.audiocrossfeed = Crossfeed
dialog.template.audiocrossfeed.tooltip = Crossfeed für alle Stereokanäle aktivieren, für das Hören mit Kopfhörern
dialog.template.sampleaccurate = Samplegenau
dialog.template.sampleaccurate.tooltip = Samplegenaues Mischen, auf Kosten etwas Emulationsleistung.\nFür DOS-Spiele und Demos, die diese Genauigkeit für korrekte Tandy/OPL-Ausgabe einschließlich digitalisierter Sprache brauchen.\nKann auch kleine Fehler der Gravis-Ultrasound-Emulation beseitigen, die zufällige Echo- oder Dämpfungseffekte verursachen.
dialog.template.audioreverb = Hall
dialog.template.audioreverb.tooltip = Hall für alle Kanäle aktivieren, um dem Klang Räumlichkeit zu geben
dialog.template.audionegotiate = Mit Treiber aushandeln
dialog.template.audionegotiate.tooltip = Eine eventuell bessere Einstellung für 'blocksize' aushandeln.\nAktivieren, wenn mit der eingestellten 'blocksize' kein Ton kommt oder er stottert.\nAbschalten, um den von Hand gesetzten Wert für 'blocksize' zu erzwingen.
dialog.template.audiochorus = Chorus
dialog.template.audiochorus.tooltip = Chorus für alle Kanäle aktivieren, um dem Klang Stereobewegung zu geben
dialog.template.swapstereo = L/R-Kanäle tauschen
dialog.template.swapstereo.tooltip = Vertauscht den linken und rechten Stereokanal
dialog.template.audioleveling = Automatische Pegelanpassung
dialog.template.audioleveling.tooltip = Den Kompressor zur automatischen Pegelanpassung auf dem Hauptkanal aktivieren, damit die Tonausgabe nicht übersteuert
dialog.template.tab.midi = Midi
dialog.template.mpu401 = MPU-401
dialog.template.mpu401.tooltip = Art des MPU-401, welches emuliert wird
dialog.template.mididevice = MIDI-Gerät
dialog.template.mididevice.tooltip = Gerät, welches die MIDI-Daten vom MPU-401 empfängt
dialog.template.midiconfig = Config-Wert
dialog.template.midiconfig.tooltip = Spezielle Einstellungen für den Gerätetreiber.\n Details finden sich in der DOSBox-Readme
dialog.template.midisamplerate = Abtastrate des Synthesizers
dialog.template.midisamplerate.tooltip = Abtastrate des MIDI-Synthesizers, falls zutreffend
dialog.template.mpubase = MPU-401-Basisadresse
dialog.template.mpubase.tooltip = Die E/A-Adresse der MPU-401.\n0 verwendet eine Standard-E/A-Adresse.\n300h bis 330h sind für den IBM-PC-Modus.\nC0D0h bis F8D0h sind für den NEC-PC-98-Modus (MPU98).\n80D2h bis 80DEh sind für die MPU-401-Emulation der NEC-PC-98-Sound-Blaster-16.\nOhne Angabe (0) ist 330h der Standard für IBM PC und E0D0h für PC-98.
dialog.template.mpuirq = MPU-401-IRQ
dialog.template.mpuirq.tooltip = MPU-401-IRQ. -1 wählt automatisch.
dialog.template.rawmidioutput = Unveränderte MIDI-Ausgabe
dialog.template.rawmidioutput.tooltip = Unveränderte, rohe MIDI-Ausgabe aktivieren (standardmäßig aus)
dialog.template.tab.fluidsynth = FluidSynth
dialog.template.fluidsynth.driver = Treiber
dialog.template.fluidsynth.driver.tooltip = Treiber für FluidSynth, unter Windows nicht nötig. Welche Treiber verfügbar sind, hängt davon ab, wie FluidSynth kompiliert wurde.
dialog.template.fluidsynth.soundfont = Soundfont
dialog.template.fluidsynth.soundfont.tooltip = Soundfont für FluidSynth. Es muss einer angegeben werden.
dialog.template.fluidsynth.samplerate = Samplerate
dialog.template.fluidsynth.samplerate.tooltip = Abtastrate für FluidSynth
dialog.template.fluidsynth.gain = Gain-Wert
dialog.template.fluidsynth.gain.tooltip = Verstärkung von FluidSynth
dialog.template.fluidsynth.chorus = Chorus
dialog.template.fluidsynth.chorus.tooltip = Chorus-Effekt: 'auto' (Standard), 'on', 'off' oder eigene Werte
dialog.template.fluidsynth.reverb = Hall
dialog.template.fluidsynth.reverb.tooltip = Hall-Effekt: 'auto' (Standard), 'on', 'off' oder eigene Werte
