dialog.template.sblistentorecordingsource = Aufnahmequelle mithören
dialog.template.sblistentorecordingsource.tooltip = Wenn das Gastsystem über die Sound-Blaster-Karte aufnimmt, die Eingangsquelle auch an die Lautsprecher geben, damit sie hörbar ist.
dialog.template.sbretrowavebus = Retrowave-Bus
dialog.template.sbretrowavebus.tooltip = Bus der Retrowave-Karte. SPI wird nur unter Linux unterstützt.
dialog.template.sbrecordingsource = Tonaufnahmequelle
dialog.template.sbrecordingsource.tooltip = Tonquelle, wenn das Gastsystem Ton aufnimmt. Derzeit gibt es nur erzeugte Tonquellen.
dialog.template.retrowaveport = Retrowave-Port
