dialog.template.fluidsynth.filter.tooltip = Filter für die Tonausgabe von FluidSynth
dialog.template.tab.mt32 = Roland MT-32
dialog.template.mt32.model = Modell
dialog.template.mt32.model.tooltip = Das Roland-MT-32/CM-32ML-Modell. Die ROM-Dateien des gewählten Modells müssen vorhanden sein (siehe 'romdir').
dialog.template.mt32.dac = DAC-Type
dialog.template.mt32.dac.tooltip = Emulationsmodus des MT-32-DAC-Eingangs\nNice = 0 - Standard, erzeugt Samples mit doppelter Lautstärke ohne Tricks. Höhere Qualität als die echten Geräte\nPure = 1, erzeugt Samples, die genau den Bits des emulierten LA32 entsprechen. Angenehmeres Übersteuerungsverhalten als die DAC-Tricks (Samples werden einfach begrenzt). Übersteuert viel seltener als jeder andere Modus. Halbe Lautstärke der anderen Modi. Ideal für Entwickler beim Debuggen :)\nGENERATION1 = 2, ordnet die LA32-Ausgabebits wie bei frühen MT-32-Generationen (laut Wikipedia).\nGENERATION2 = 3, ordnet die LA32-Ausgabebits wie bei späteren Generationen (persönlich an meinem CM-32L geprüft - KG).
dialog.template.mt32.romdir = ROM-Ordner
dialog.template.mt32.romdir.tooltip = Ordner mit den ROM-Dateien (Control und PCM) des MT-32. Ohne diese Dateien funktioniert die Emulation nicht.
dialog.template.mt32.rate = Abtastrate
dialog.template.mt32.rate.tooltip = Abtastrate der MT-32-Emulation
dialog.template.mt32.gain = Ausgangsverstärkung
dialog.template.mt32.gain.tooltip = Ausgangsverstärkung der MT-32-Emulation in Prozent, Standard 100.
dialog.template.mt32.analog = Analogausgabe-Modus
dialog.template.mt32.analog.tooltip = Emulationsmodus des analogen MT-32-Ausgangs.\nDigital = 0, nur der digitale Weg wird emuliert. Die Samples entsprechen dem digitalen Signal am DAC-Eingang. Schnellster Modus.\nCoarse = 1, grobe Emulation der Tiefpass-Schaltung. Hohe Frequenzen werden angehoben, die Abtastrate bleibt gleich. Klingt etwas besser, ist aber etwas langsamer.\nAccurate = 2 - Standard, feinere Emulation der Tiefpass-Schaltung. Das Signal wird auf 48 kHz hochgerechnet, um hörbare Spiegelfrequenzen über 16 kHz nachzubilden, die die Tiefpass-Schaltung kaum dämpft. Klingt näher am analogen Ausgang echter Hardware, ist aber langsamer als die Modi 0 und 1.\nOversampled = 3, wie der Standardmodus 2, aber mit zweifacher Überabtastung, also 96 kHz Ausgaberate. Noch langsamer als alle anderen Modi, erhält aber die höchsten Frequenzen besser, wenn der DOSBox-Mixer weiter umrechnet.
dialog.template.mt32.chunk = Chunk-Größe
dialog.template.mt32.chunk.tooltip = Mindestdauer der auf einmal gerenderten Daten in Millisekunden. Höhere Werte verringern den Aufwand und können die Leistung verbessern, erhöhen aber die Tonverzögerung. Gilt nur beim Rendern in einem eigenen Thread.
dialog.template.mt32.srcquality = Qualität der Abtastratenwandlung
dialog.template.mt32.srcquality.tooltip = Qualität der Abtastratenwandlung des MT-32. '0' ist die schnellste Wandlung, '3' die beste Qualität. Standard 2.
dialog.template.mt32.prebuffer = Prebuffer-Größe
dialog.template.mt32.prebuffer.tooltip = Wie viele Millisekunden im Voraus gerendert werden. Höhere Werte können Aussetzer vermeiden, erhöhen aber die Tonverzögerung. Muss größer als mt32.chunk sein. Gilt nur beim Rendern in einem eigenen Thread.
dialog.template.mt32.niceampramp = Sanfte Lautstärkerampe
dialog.template.mt32.niceampramp.tooltip = Toggles "Nice Amp Ramp" mode that improves amplitude ramp for sustaining instruments. Quick changes of volume or expression on a MIDI channel may result in amp jumps on real hardware. When "Nice Amp Ramp" mode is enabled, amp changes gradually instead. Otherwise, the emulation accuracy is preserved. Default is true.
dialog.template.mt32.partials = Maximale Partials
dialog.template.mt32.partials.tooltip = Die größte Anzahl gleichzeitig spielender Partials
dialog.template.mt32.reverbmode = Reverb-Modus
dialog.template.mt32.reverbmode.tooltip = Hallmodus des MT-32
dialog.template.mt32.reverboutputgain = Hall-Ausgangsverstärkung
dialog.template.mt32.reverboutputgain.tooltip = Hall-Ausgangsverstärkung der MT-32-Emulation in Prozent, Standard 100.
dialog.template.mt32.reverbtime = Reverb-Decay (Hallzeit)
dialog.template.mt32.reverbtime.tooltip = Abklingzeit des MT-32-Halls
dialog.template.mt32.reverblevel = Reverb-Level
dialog.template.mt32.reverblevel.tooltip = Hallstärke des MT-32
dialog.template.mt32.filter = Filter
dialog.template.mt32.filter.tooltip = Filter für die Tonausgabe des Roland MT-32/CM-32L
dialog.template.mt32.swapstereo.tooltip = Stereokanäle der MT-32-Ausgabe vertauschen
dialog.template.mt32.multithread = Eigener Thread
dialog.template.mt32.multithread.tooltip = MT-32 in einem eigenen Thread rendern
dialog.template.mt32.verboselogging = Debug-Protokollierung
dialog.template.mt32.verboselogging.tooltip = Debug-Protokoll des MT-32
dialog.template.tab.soundblaster = Sound Blaster
dialog.template.sbtype = Typ
dialog.template.sbtype.tooltip = Einstellung des Sound Blaster-Typs
dialog.template.sbaddress = I/O-Adresse
dialog.template.sbaddress.tooltip = I/O-Adresse
dialog.template.sboplrate = OPL-Rate
dialog.template.sboplrate.tooltip = Samplerate der OPL Music Emulation. Es sollte der Wert "49716" für höchste Soundqualität eingetragen werden. (Die Samplerate des Soundmixers unter "Allgemein" sollte denselben Wert haben)
dialog.template.sbirq = IRQ
dialog.template.sbirq.tooltip = Nummer der Interrupt Request Line (IRQ)
dialog.template.sboplmode = OPL-Modus
dialog.template.sboplmode.tooltip = Art der OPL-Emulation. Bei "auto" wird der Modus durch den Sound Blaster-Typ bestimmt. Alle OPL-Modi sind adlib-kompatibel, ausgenommen "cms"
dialog.template.sbdma = DMA
dialog.template.sbdma.tooltip = Nummer des Direct Memory Access-Kanals (DMA)
dialog.template.sboplemu = OPL-Emulation
dialog.template.sboplemu.tooltip = Provider für die OPL-Emulation. Der Wert "compat" kann in bessere Soundqualität resultieren (auch "OPL-Rate" beachten)
dialog.template.sbhdma = High DMA
dialog.template.sbhdma.tooltip = Nummer des High Direct Memory Access-Kanals (High DMA)
dialog.template.mixer = Mixer
dialog.template.mixer.tooltip = Erlaubt es dem Sound Blaster-Soundmixer, den DOSBox-Soundmixer zu ändern
dialog.template.sbenv = BLASTER-Umgebungsvariable
dialog.template.sbenv.tooltip = Ob die Umgebungsvariable BLASTER beim Start automatisch gesetzt wird
dialog.template.sbwarmup = Aufwärmzeit
dialog.template.sbwarmup.tooltip = DMA-Ton nach dem Einschalten der Karte so viele Millisekunden stumm halten (Standard 100).\nDas verringert Knackser beim Start vieler Sound-Blaster-Spiele.\nVerringern, wenn am Anfang der Wiedergabe Ton fehlt.
dialog.template.sbenablespeaker = Lautsprecher einschalten
dialog.template.sbenablespeaker.tooltip = Die virtuelle DOS-Maschine mit eingeschaltetem Sound-Blaster-Lautsprecher starten.\nSound Blaster Pro und ältere Karten haben einen Befehl zum Ein- und Ausschalten des Lautsprechers. Normalerweise startet die Karte mit ausgeschaltetem Lautsprecher.\nVersucht ein DOS-Spiel oder eine Demo abzuspielen, ohne den Lautsprecher einzuschalten, diese Option auf true setzen.\nBei Emulation einer Sound Blaster 16 ohne Bedeutung.
dialog.template.fmstrength = FM-Stärke
dialog.template.fmstrength.tooltip = Lautstärke der FM-Wiedergabe in Prozent, im Verhältnis zur PCM-Wiedergabe. Standard 150.
dialog.template.cms = CMS aktivieren
dialog.template.cms.tooltip = CMS-Emulation aktivieren.\noff: keine CMS-Emulation (außer bei gewähltem Game Blaster).\non: CMS-Emulation auf Sound Blaster 1 und 2.\nauto: CMS-Emulation für Sound Blaster 1 und Game Blaster automatisch aktivieren.
dialog.template.oplremovedcbias = OPL-Gleichspannungsanteil entfernen
dialog.template.oplremovedcbias.tooltip = Gleichspannungsanteil aus der OPL-Ausgabe entfernen. Nur als letzter Ausweg gegen Knacken\nin Spielen, die PCM-Ton über den OPL-Synthesizer einer Sound-Blaster- oder AdLib-Karte abspielen, z. B.:\nGolden Eagle (1991), Wizardry 6 (1990) und Wizardry 7 (1992).
dialog.template.goldplay = Goldplay
dialog.template.goldplay.tooltip = Goldplay-Emulation aktivieren
dialog.template.sboplfadeout = OPL ausblenden
dialog.template.sboplfadeout.tooltip = Die Ausgabe des OPL-Synthesizers nach dem letzten Schreiben auf einen E/A-Port ausblenden
dialog.template.sbfilter = Filter
dialog.template.sbfilter.tooltip = Art des emulierten Filters für die digitale Tonausgabe der Sound Blaster
dialog.template.sboplfilter = OPL-Filter
dialog.template.sboplfilter.tooltip = Art des emulierten Filters für die OPL-Ausgabe der Sound Blaster
dialog.template.sbforcefilter = Filter erzwingen
dialog.template.sbforcefilter.tooltip = Den Filter der Sound Blaster Pro 2 immer eingeschaltet lassen.\nAndere Sound-Blaster-Modelle erlauben kein Umschalten des Filters per Software.
