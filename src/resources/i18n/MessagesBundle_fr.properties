dialog.template.innovamodel = SSI-2001 model
dialog.template.innovamodel.tooltip = Model of chip to emulate in the Innovation SSI-2001 card:\nauto: Use the 6581 chip\n6581: The original chip, known for its bassy and rich character\n8580: A later revision that more closely matched the SID specification. It fixed the 6581's DC bias and is less prone to distortion.\nnone: Disable the card (default)
