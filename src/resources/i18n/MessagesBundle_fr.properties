dialog.template.sbenablespeaker = Enable speaker
dialog.template.sbenablespeaker.tooltip = Start the DOS virtual machine with the Sound Blaster speaker enabled.\nSound Blaster Pro and older cards have a speaker disable/enable command. Normally the card boots up with the speaker disabled.\nIf a DOS game or demo attempts to play without enabling the speaker, set this option to true to compensate.\nThis setting has no meaning if emulating a Sound Blaster 16 card.
