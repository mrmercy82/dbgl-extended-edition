dialog.template.builtindosmousedriver = Pilote souris DOS intégré
dialog.template.builtindosmousedriver.tooltip = Mode du pilote souris DOS intégré (on par défaut).\non simule un pilote TSR, no-tsr active le pilote sans TSR,\noff le désactive pour pouvoir charger un vrai pilote souris DOS.
