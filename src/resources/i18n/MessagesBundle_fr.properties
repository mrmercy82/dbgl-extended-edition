dialog.template.deinterlacing = Désentrelacement
dialog.template.deinterlacing.tooltip = Supprime les lignes noires d'entrelacement des vidéos FMV (off par défaut).\non correspond à la pleine intensité, light/medium/strong/full règlent l'intensité.
dialog.template.dedithering = Suppression du tramage
dialog.template.dedithering.tooltip = Supprime les motifs de tramage en damier, utile pour les jeux CGA et EGA (off par défaut).
dialog.template.imageadjustments = Réglages de l'image
dialog.template.imageadjustments.tooltip = Active les réglages de couleur et de luminosité de la section [render] (activé par défaut).\nDésactiver pour contourner toutes les transformations de couleur et de luminosité.
dialog.template.soundcanvasmodel = Modèle Sound Canvas
dialog.template.soundcanvasmodel.tooltip = Modèle Roland SC-55 à émuler quand mididevice vaut soundcanvas (auto par défaut).\nauto, sc55 et sc55mk2 choisissent le meilleur modèle disponible de ce type.
dialog.template.soundcanvasromdir = Dossier ROM Sound Canvas
dialog.template.soundcanvasromdir.tooltip = Dossier contenant les fichiers ROM du Roland SC-55 (vide par défaut, les emplacements standard sont utilisés).
dialog.template.audiodenoiser = Réduction du bruit
dialog.template.audiodenoiser.tooltip = Supprime le bruit de fond de la sortie OPL et Sound Canvas (activé par défaut).
dialog.template.harddisknoise = Bruit du disque dur
dialog.template.harddisknoise.tooltip = Émule les bruits du disque dur (off par défaut).\nseek-only émule seulement les accès, on émule aussi la rotation.
dialog.template.floppydisknoise = Bruit du lecteur de disquettes
