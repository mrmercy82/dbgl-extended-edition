dialog.template.blacklevel = Niveau de noir
dialog.template.blacklevel.tooltip = Rehausse le niveau de noir, de 0 à 100 (auto par défaut).\nauto le rehausse pour les modes PCjr, Tandy, CGA et EGA avec les shaders CRT adaptatifs.
dialog.template.colortemperature = Température de couleur
dialog.template.colortemperature.tooltip = Température de couleur (point blanc) en Kelvin, de 3000 à 10000 (auto par défaut).\n6500 est neutre, les valeurs plus basses sont plus chaudes, les plus hautes plus froides.
