dialog.template.serial.tooltip = Définis le type de périphérique connecté au port com. Ce périphérique peut être disabled (désactivé), dummy (générique), modem, nullmodem, directserial (port série).\nLes paramètres additionnels doivent être sur la même ligne, sous la forme paramètre : valeur.\nLe paramètre pour tous type est irq (en option).\npour directserial\: realport (requis), rxdelay (en option). (realport\:COM1 realport\:ttyS0).\npour modem\: listenport (en option).\npar câble null modem\: server, rxdelay, txdelay, telnet, usedtr, transparent, port, inhsocket (toutes les options).\nExemple\: modem listenport\:5000
