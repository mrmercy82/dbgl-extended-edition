dialog.template.customconf.tooltip = Append custom sections to the configuration file
dialog.template.captures = Optage-mappe
dialog.template.captures.tooltip = Directory where things like wave, midi, screenshot get captured
dialog.template.configfile = Konfigurationsfil
dialog.template.configfile.tooltip = The file that contains all (incremental) DOSBox settings
dialog.template.tab.experimentaloptions = Experimental options, available using select DOSBox builds only
dialog.template.startbanner = Velkomstbanner
dialog.template.startbanner.tooltip = If set (default), DOSBox-X will display the welcome banner when it starts
dialog.template.bannercolortheme = Farver på velkomstbanner
dialog.template.bannercolortheme.tooltip = You can specify a different background color theme for the welcome banner from the default one
dialog.template.showbasic = Vis grundlæggende info
dialog.template.showbasic.tooltip = If set, DOSBox-X will show basic information including the DOSBox-X version number and current running speed in the title bar.
dialog.template.startupverbosity = Detaljeniveau ved start
dialog.template.startupverbosity.tooltip = Controls verbosity prior to displaying the program ('auto' by default)
dialog.template.showdetails = Vis detaljeret info
dialog.template.showdetails.tooltip = If set, DOSBox-X will show the cycles count (FPS) and emulation speed relative to realtime in the title bar.
dialog.template.titlebar = Titellinje
dialog.template.titlebar.tooltip = The string displayed in the DOSBox-X title bar
dialog.template.fastbioslogo = Hurtigt BIOS-logo
dialog.template.fastbioslogo.tooltip = If set, DOSBox-X will skip the BIOS screen by activating fast BIOS logo mode (without 1-second pause)
dialog.template.addtitlebar = Ekstra tekst til titellinjen
dialog.template.addtitlebar.tooltip = Additional text to place in the title bar of the window
dialog.template.logotext = Logotekst
dialog.template.logotext.tooltip = Text to place at the bottom of the screen during the startup logo. Text will line wrap automatically.\nTo explicitly break to the next line, put \\n in the string.
dialog.template.logo = Mappe med logobillede
dialog.template.logo.tooltip = Location of PNG images to use in place of the DOSBox-X logo at startup.\nThis is the path of the base file name. For example logo=subdir\\sets\\007\\logo\nwith machine=vgaonly will use subdir\\sets\\007\\logo224x224.png as the logo.
dialog.template.showmenu = Vis menulinje
dialog.template.showmenu.tooltip = Whether to show the menu bar (if supported). Default true.
dialog.template.quitwarning = Advarsel ved afslutning
dialog.template.quitwarning.tooltip = Set this option to indicate whether DOSBox-X should show a warning message when the user tries to close its window.\nIf set to auto (default), DOSBox-X will warn if a DOS program, game or a guest system is currently running.\nIf set to autofile, DOSBox-X will warn if there are open file handles or a guest system is currently running.
dialog.template.configurationtooltheme = Tema for konfigurationsværktøj
dialog.template.configurationtooltheme.tooltip = Theme for the configuration tool. If not set, host dark mode setting will be followed.
dialog.template.showadvancedoptions = Avancerede indstillinger
dialog.template.showadvancedoptions.tooltip = If set, the Configuration Tool will display all config options (including advanced ones) by default
dialog.template.resolveconfigpath = Opløs indstillinger i stier
dialog.template.resolveconfigpath.tooltip = If set to true, DOSBox-X will resolve options containing paths in the config file (except [autoexec] section).\nThis includes environment variables (%VAR% [DOS/Windows] or ${VAR} [Linux/macOS] and tilde (~) in Linux/macOS.\nIf set to dosvar, DOSBox-X forces to resolve DOS-style environment variables (%VAR%) in all platforms (and tilde).\nIf set to tilde, DOSBox-X will only resolve tilde (~) in Linux/macOS but will not resolve environment variables.
dialog.template.configshortcuts = Konfigurationsgenveje
dialog.template.configshortcuts.tooltip = Allow shortcuts for simpler configuration management (enabled by default).\nE.g., instead of 'config -set sbtype sb16', it is enough to execute 'sbtype sb16',\nand instead of 'config -get sbtype', you can just execute the 'sbtype' command.
dialog.template.hostkey = Værtstast
dialog.template.hostkey.tooltip = By default, DOSBox-X uses the mapper-defined host key, which defaults to F11 on Windows and F12 on other platforms.\nYou may alternatively specify a host key with this setting and bypass the host key as defined in the mapper.\nThis can also be done from the menu ("Main" => "Select host key").
dialog.template.startcmd = Startkommando
dialog.template.startcmd.tooltip = Enable START command to start programs to run on the host system.\nOn Windows host programs or commands may also be launched directly.
dialog.template.workingdiroption = Arbejdsmappe
dialog.template.workingdiroption.tooltip = Select an option for DOSBox-X's working directory when it runs.\nautoprompt: DOSBox-X will auto-decide whether to prompt for a working directory.\nconfig: DOSBox-X will use the primary config file directory as the working directory.\ncustom: Specify a working directory via the "working directory default" option.\ndefault: Similar to autoprompt, but DOSBox-X will ask whether to save the selected folder.\nforce: Similar to "custom", while overriding -defaultdir command-line option if used.\nnoprompt: DOSBox-X uses the current directory and never prompts for a working directory.\nprogram: DOSBox-X will use the DOSBox-X program directory as the working directory.\nprompt: DOSBox-X will always ask the user to select a working directory when it runs.\nuserconfig: DOSBox-X will use its user configuration directory as the working directory.
dialog.template.startquiet = Start stille
dialog.template.startquiet.tooltip = If set, before launching host system applications to run on the host\nDOSBox-X will not show messages like "Now run it as a Windows application".
dialog.template.workingdirdefault = Standardarbejdsmappe
dialog.template.workingdirdefault.tooltip = The default directory to act as DOSBox-X's working directory. See also the setting "working directory option".\nFor working directory option=prompt, the specified directory becomes the default directory for the folder selection.
dialog.template.startwait = Vent efter start
dialog.template.startwait.tooltip = Specify whether DOSBox-X should wait for the host system applications after they are started
dialog.template.startnopause = Ingen pause efter afslutning
dialog.template.startnopause.tooltip = If set, DOSBox-X will not pause after host command execution is completed.
dialog.template.autoexecsections = Autoexec-sektioner
dialog.template.autoexecsections.tooltip = How autoexec sections are handled from multiple config files:\njoin: Combine them into one big section (legacy behavior; default).\noverwrite: Use the last one encountered, like other config settings.
dialog.template.starttranspath = Oversæt stier
dialog.template.starttranspath.tooltip = Specify whether DOSBox-X should automatically translate all paths in the command-line\nto host system paths when starting programs to run on the host system.
dialog.template.imgcaptureformat = Optageformat
dialog.template.imgcaptureformat.tooltip = Set the capture format of the default screenshot action ('upscaled' by default)
dialog.template.writeprotect = Skrivebeskyt filer
dialog.template.writeprotect.tooltip = Many games open all their files with writable permissions; even files that they never modify.\nThis setting lets you write-protect those files while still allowing the game to read them (enabled by default).\nA second use-case: if you're using a copy-on-write or network-based filesystem,\nthis setting avoids triggering write operations for these write-protected files.
dialog.template.logfile = Logfil
dialog.template.logfile.tooltip = File where the log messages will be saved to
dialog.template.pausewheninactive = Pause ved inaktivitet
dialog.template.pausewheninactive.tooltip = Pause emulation when the window is inactive (disabled by default)
dialog.template.debuggerrun = Debuggerens kørselstilstand
dialog.template.debuggerrun.tooltip = The run mode when the DOSBox-X Debugger starts
dialog.template.saveslot = Gemmeplads
dialog.template.saveslot.tooltip = Select the default save slot (1-100) to save/load states
dialog.template.savefile = Gemmefil
dialog.template.savefile.tooltip = Select the default save file to save/load states. If specified it will be used instead of the save slot.
dialog.template.saveremark = Bemærkning til gemning
dialog.template.saveremark.tooltip = If set, the save state feature will ask users to enter remarks when saving a state
dialog.template.autosave = Gem automatisk
dialog.template.autosave.tooltip = Enable the auto-save state feature. Specify a time interval in seconds, and optionally a save slot or start and end save slots.\nFor example, "autosave=10 11-20" will set a 10-second time interval for auto-saving, and the save slots used will be between 11 and 20.\nYou can additionally specify up to 9 programs for this feature, e.g. "autosave=10 11-20 EDIT:21-30 EDITOR:35" for "EDIT" and "EDITOR".\nPutting a minus sign (-) before the time interval causes the auto-saving function to not be activated at start.
dialog.template.forceloadstate = Gennemtving indlæsning af gemt tilstand
dialog.template.forceloadstate.tooltip = If set, DOSBox-X will load a saved state even if it finds there is a mismatch\nin the DOSBox-X version, machine type, program name and/or the memory size.
dialog.template.synctime = Synkronisér tid
dialog.template.synctime.tooltip = If set, DOSBox-X will try to automatically synchronize time with the host, unless you decide to change the date/time manually
dialog.template.clipboardspeed = Clipboard paste speed
dialog.template.clipboardspeed.tooltip = Set keyboard speed for pasting text from the shared clipboard.\nIf the default setting of 30 causes lost keystrokes, increase the number.\nOr experiment with decreasing the number for applications that accept keystrokes quickly.
dialog.template.clipboardbutton = Kopiér/indsæt via udklipsholder
dialog.template.clipboardbutton.tooltip = Select the mouse button or use arrow keys for the shared clipboard copy/paste function.\nThe default mouse button is "right", which means using the right mouse button to select text, copy to and paste from the host clipboard.\nSet to "middle" to use the middle mouse button, "arrows" to use arrow keys instead of a mouse button, or "none" to disable this feature.\nFor "arrows", press Home key (or Fn+Shift+Left on Mac laptops) to start selection, and End key (or Fn+Shift+Right on Mac laptops) to end selection.
dialog.template.clipboardmod = Ændringstast for udklipsholder
dialog.template.clipboardmod.tooltip = Change the keyboard modifier for the shared clipboard copy/paste function using a mouse button or arrow keys.\nThe default modifier is "shift" (both left and right shift keys). Set to "none" if no modifier is desired.
dialog.template.clipboardbios = Udklipsholder-BIOS
dialog.template.clipboardbios.tooltip = Specify whether to use BIOS keyboard functions for the clipboard pasting instead of the keystroke method.\nFor pasting clipboard text into Windows 3.x/9x applications (e.g. Notepad), make sure to use the keystroke method.
dialog.template.tab.startup = Opstart
dialog.template.nativecommands = Programmer, der skal køres før og/eller efter DOSBox
dialog.template.tab.dosboxautoexec = DOSBox [autoexec] section
dialog.template.customcommand1 = Ved start
dialog.template.customcommand2 = Før opstart
dialog.template.customcommand3 = Efter opstart
dialog.template.customcommand4 = Ved afslutning
dialog.template.tab.rendering = Gengivelse
dialog.template.output = Metode
dialog.template.output.tooltip = What video system to use for output
dialog.template.fullscreen = Fuldskærm
dialog.template.fullscreen.tooltip = Start dosbox directly in fullscreen. (Press ALT-Enter to go back)
dialog.template.windowresolution = Vindue-størrelse
dialog.template.windowresolution.tooltip = Scale the window to this size IF the output device supports hardware scaling. (output=surface does not!)
dialog.template.fullscreenresolution = Fuldskærms-størrelse
dialog.template.fullscreenresolution.tooltip = What resolution to use for fullscreen\: original or fixed size (e.g. 1024x768).\nUsing your monitors maximum resolution with aspect\=true might give the best results.\nIf you end up with small window on a large screen, try an output different from surface.
dialog.template.scaler = Skalering
dialog.template.scaler.tooltip = Scaler used to enlarge/enhance low resolution modes. If 'forced' is appended, the scaler will be used even if the result might not be desired.
dialog.template.scalerforced = Tvunget
dialog.template.scalerforced.tooltip = If checked, the scaler will be used even if the result might not be desired.
dialog.template.doublebuffering = Baggrundsskrivning
dialog.template.doublebuffering.tooltip = Use double buffering in fullscreen. It can reduce screen flickering, but it can also result in a slow DOSBox.
dialog.template.aspectcorrection = Aspekt-korrigering
dialog.template.aspectcorrection.tooltip = Do aspect correction, if your output method doesn't support scaling this can slow things down!
dialog.template.frameskip = Billedspring
dialog.template.frameskip.tooltip = How many frames DOSBox skips before drawing one
dialog.template.glshader = GLSL shader
dialog.template.glshader.tooltip = Set an adaptive CRT monitor emulation shader or a regular GLSL shader in OpenGL output modes.
dialog.template.pixelshader = Pixelshader
dialog.template.pixelshader.tooltip = Set Direct3D pixel shader program (effect file must be in Shaders subdirectory).\nIf 'forced' is appended, then the pixel shader will be used even if the result might not be desired.
dialog.template.texturerenderer = Teksturrenderer
dialog.template.texturerenderer.tooltip = Render driver to use in 'texture' output mode ('auto' by default).
dialog.template.maximize = Maksimér vindue
dialog.template.maximize.tooltip = If set, the DOSBox-X window will be maximized at start (SDL2 and Windows SDL1 builds only; use fullscreen for TTF output)
dialog.template.videodriver = Videodriver
dialog.template.videodriver.tooltip = Forces a video driver (e.g. windib/windows, directx, x11, fbcon, dummy, etc) for the SDL library to use
dialog.template.dpiaware = DPI-bevidst
dialog.template.dpiaware.tooltip = Set this option (auto by default) to indicate to your OS that DOSBox-X is DPI aware.\nIf it is not set, Windows Vista/7/8/10 and higher may upscale the DOSBox-X window\non higher resolution monitors which is probably not what you want.
dialog.template.windowposition = Vinduesplacering
dialog.template.windowposition.tooltip = Set initial window position for windowed mode:\n auto: Let the window manager decide the position (default).\nX,Y: Set window position in X,Y format (e.g., 250,100). 0,0 is the top-left corner of the screen.
dialog.template.windowpositionx = Vinduesplacering
dialog.template.windowpositionx.tooltip = Set the window position at startup in the positionX,positionY format (e.g.: 1300,200).\nThe window will be centered with "," (or empty), and will be in the original position with "-".
dialog.template.aspectratio = Billedformat
dialog.template.aspectratio.tooltip = Set the aspect ratio (e.g. 16:9) in the aspect ratio correction mode.\n0:0 means the default ratio of 4:3, and -1:-1 means the original image ratio.
dialog.template.overscan = Extra-linier
dialog.template.overscan.tooltip = Width of the overscan border for the "surface" output
dialog.template.integerscaling = Heltalsskalering
dialog.template.integerscaling.tooltip = Constrain the horizontal or vertical scaling factor to the largest integer value so the image still fits into the viewport.\nThe configured aspect ratio is always maintained according to the 'aspect' and 'viewport' settings,\nwhich may result in a non-integer scaling factor in the other dimension. If the image is larger than the viewport,\nthe integer scaling constraint is auto-disabled (same as 'off').
dialog.template.autofit = Tilpas automatisk
dialog.template.autofit.tooltip = Best fits image to window. Intended for output=direct3d, fullresolution=original, aspect=true
dialog.template.viewport = Viewport
dialog.template.viewport.tooltip = Set the viewport size. This is the maximum drawable area; the video output is always contained\nwithin the viewport while taking the configured aspect ratio into account.
dialog.template.windowdecorations = Vinduesdekorationer
dialog.template.windowdecorations.tooltip = Enable window decorations in windowed mode (enabled by default)
dialog.template.vsyncmode = Vsync-type
dialog.template.vsyncmode.tooltip = Set the host video driver's vertical synchronization (vsync) mode:\nauto: Limit vsync to beneficial cases, such as when using an interpolating VRR display in fullscreen (default).\non: Enable vsync. This can prevent tearing in some games but will impact performance or drop frames when the DOS rate exceeds the host rate (e.g. 70 Hz DOS rate vs 60 Hz host rate).\nadaptive: Enables vsync when the frame rate is higher than the host rate, but disables it when the frame rate drops below the host rate.\nThis is a reasonable alternative on macOS instead of 'on'. Note: only valid in OpenGL output modes; otherwise treated as 'on'.\noff: Attempt to disable vsync to allow quicker frame presentation at the risk of tearing in some games.\nyield: Let the host's video driver control video synchronization.
dialog.template.vsyncrate = Vsync-frekvens
dialog.template.vsyncrate.tooltip = Vsync rate used if vsync is enabled. Ignored if vsyncmode is set to host (win32).
dialog.template.vsyncskip = Vsync-spring
dialog.template.vsyncskip.tooltip = Number of microseconds to allow rendering to block before skipping the next frame.\nFor example, a value of 7000 is roughly half the frame time at 70 Hz.\n0 disables this and will always render (default).
dialog.template.hostrefreshrate = Opdateringshastighed
dialog.template.hostrefreshrate.tooltip = Set the host's refresh rate:\n auto: Use SDI rates, or VRR rates when in fullscreen on a high-refresh rate display (default).\nsdi: Use serial device interface (SDI) rates, without further adjustment.\nvrr: Deduct 3 Hz from the reported rate (best practice for VRR displays).\nN: Specify custom refresh rate in Hz (decimal values are allowed; 23.000 is the allowed minimum).
dialog.template.framepresentationmode = Præsentationstilstand for billeder
dialog.template.framepresentationmode.tooltip = Select the frame presentation mode:\nauto: Intelligently time and drop frames to prevent emulation stalls, based on host and DOS frame rates (default).\ncfr: Always present DOS frames at a constant frame rate.\nvfr: Always present changed DOS frames at a variable frame rate.
dialog.template.transparency = Gennemsigtighed
dialog.template.transparency.tooltip = Set the transparency of the DOSBox Staging screen (0 by default).\nFrom 0 (no transparency) to 90 (high transparency).
dialog.template.displayno = Skærmnummer
dialog.template.displayno.tooltip = Screen/display number to use for a multi-screen setup (0 = default)
dialog.template.doublescan = Dobbeltscanning
dialog.template.doublescan.tooltip = If set, doublescanned output emits two scanlines for each source line, in the same manner as the actual VGA output (320x200 is rendered as 640x400 for example).\nIf clear, doublescanned output is rendered at the native source resolution (320x200 as 320x200).\nThis affects the raster PRIOR to the software or hardware scalers. Setting this option may prevent some scalers to work as expected.\nTry turning this option off in such case. For pixel-perfect scaling (output=openglpp), it is recommended to turn this option off.
dialog.template.screensaver = Pauseskærm
dialog.template.screensaver.tooltip = Use 'allow' or 'block' to override the SDL_VIDEO_ALLOW_SCREENSAVER environment variable\nwhich usually blocks the OS screensaver while the emulator is running ('auto' by default).
dialog.template.euro = Eurosymbol
dialog.template.euro.tooltip = Display Euro symbol instead of the specified ASCII character (33-255).\nFor example, setting it to 128 allows Euro symbol to be displayed instead of C-cedilla.
dialog.template.char9 = Skrifttyper på 9 pixel
dialog.template.char9.tooltip = Allow 9-pixel wide text mode fonts instead of 8-pixel wide fonts
dialog.template.tab.ttf = TrueType font (TTF)
dialog.template.ttf.bold = Fed
dialog.template.ttf.bold.tooltip = If set, DOSBox-X will display bold text in visually (requires a word processor be set) for the TTF output.\nThis is done either with the actual bold font specified by the fontbold option, or by making it bold automatically.
dialog.template.ttf.font = Skrifttype
dialog.template.ttf.font.tooltip = Specifies a TrueType font to use for the TTF output. If not specified, the built-in TrueType font will be used.\nEither a font name or full font path can be specified. If file ends with the .TTF extension then the extension can be omitted.\nFor a font name or relative path, directories such as the working directory and default system font directory will be searched.\nFor example, setting it to "consola" or "consola.ttf" will use Consola font (included in Windows); similar for other TTF fonts.\nAdditionally, OTF fonts (e.g. OratorStd.otf), .FON fonts (e.g. vgasys.fon), and .TTC fonts (e.g. msgothic.ttc) are also supported.\nTo display Chinese/Japanese/Korean text in these code pages, a font with CJK characters is needed (e.g. GNU Unifont or Sarasa Gothic).
dialog.template.ttf.italic = Kursiv
dialog.template.ttf.italic.tooltip = If set, DOSBox-X will display italicized text visually (requires a word processor be set) for the TTF output.\nThis is done either with the actual italic font specified by the fontital option, or by slanting the characters automatically.
dialog.template.ttf.fontbold = Fed skrifttype
dialog.template.ttf.fontbold.tooltip = You can optionally specify a bold TrueType font for use with the TTF output that will render the bold text style.\nIt requires a word processor be set with the wp option, and this actual bold font will be used for the bold style.\nFor example, setting it to "consolab" or "consolab.ttf" will use the Consolab font; similar for other TTF fonts.
dialog.template.ttf.underline = Understreget
dialog.template.ttf.underline.tooltip = If set, DOSBox-X will display underlined text visually (requires a word processor be set) for the TTF output
dialog.template.ttf.fontital = Kursiv skrifttype
dialog.template.ttf.fontital.tooltip = You can optionally specify an italic TrueType font for use with the TTF output that will render the italic text style.\nIt requires a word processor be set with the wp option, and this actual italic font will be used for the italic style.\nFor example, setting it to "consolai" or "consolai.ttf" will use the Consolai font; similar for other TTF fonts.
dialog.template.ttf.strikeout = Gennemstreget
dialog.template.ttf.strikeout.tooltip = If set, DOSBox-X will display strikeout text visually (requires a word processor be set) for the TTF output
dialog.template.ttf.fontboit = Fed && kursiv skrifttype
dialog.template.ttf.fontboit.tooltip = You can optionally specify a bold italic TrueType font for use with the TTF output that will render the bold italic text style.\nIt requires a word processor be set with the wp option, and this actual bold-italic font will be used for the bold-italic style.\nFor example, setting it to "consolaz" or "consolaz.ttf" will use the Consolaz font; similar for other TTF fonts.
dialog.template.ttf.righttoleft = Højre mod venstre
dialog.template.ttf.righttoleft.tooltip = If set, DOSBox-X will display text from right to left instead of left to right on the screen for the TTF output.\nThis is especially useful for languages which use right-to-left scripts (such as Arabic and Hebrew).
dialog.template.ttf.blinkc = Blinkende markør
dialog.template.ttf.blinkc.tooltip = If set to true, the cursor blinks for the TTF output; setting it to false will turn the blinking off.\nYou can also change the blinking rate by setting an integer between 1 (fastest) and 7 (slowest), or 0 for no cursor.
dialog.template.ttf.printfont = Brug skrifttype til udskrivning
dialog.template.ttf.printfont.tooltip = If set, DOSBox-X will force to use the current TrueType font (set via font option) for printing in addition to displaying
dialog.template.ttf.colors = Farveskema
dialog.template.ttf.colors.tooltip = Specifies a color scheme to use for the TTF output by supply all 16 color values in RGB: (r,g,b) or hexadecimal as in HTML: #RRGGBB\nThe original DOS colors (0-15): #000000 #0000aa #00aa00 #00aaaa #aa0000 #aa00aa #aa5500 #aaaaaa #555555 #5555ff #55ff55 #55ffff #ff5555 #ff55ff #ffff55 #ffffff\ngray scaled color scheme: (0,0,0)  #0e0e0e  (75,75,75) (89,89,89) (38,38,38) (52,52,52) #717171 #c0c0c0 #808080 (28,28,28) (150,150,150) (178,178,178) (76,76,76) (104,104,104) (226,226,226) (255,255,255)\nAn optional leading "+" sign allows the preset color scheme to be used when switching from another output.
dialog.template.ttf.autodbcs = Automatisk DBCS
dialog.template.ttf.autodbcs.tooltip = If set, DOSBox-X enables Chinese/Japanese/Korean DBCS (double-byte) characters when these code pages are active by default.\nOnly applicable when using a DBCS code page (932: Japanese, 936: Simplified Chinese; 949: Korean; 950: Traditional Chinese)\nThis applies to both the display and printing of these characters (see the [printer] section for details of the latter).
dialog.template.ttf.winperc = Vinduesprocent
dialog.template.ttf.winperc.tooltip = Specifies the window percentage for the TTF output (100 = full screen). Ignored if the ptsize setting is specified.
dialog.template.ttf.gbk = GBK-udvidelse
dialog.template.ttf.gbk.tooltip = Enables the GBK extension (in addition to the standard GB2312 charset) for the Simplified Chinese TTF output or DOS/V emulation
dialog.template.ttf.ptsize = Skriftstørrelse i punkter
dialog.template.ttf.ptsize.tooltip = Specifies the font point size for the TTF output. If specified (minimum: 9), it will override the winperc setting.
dialog.template.ttf.chinasea = ChinaSea && Big5-2003-udvidelse
dialog.template.ttf.chinasea.tooltip = Enables the ChinaSea and Big5-2003 extension (in addition to the standard Big5-1984 charset) for the Traditional Chinese TTF output.\nA TTF/OTF font containing such characters (such as the included SarasaGothicFixed TTF font) is needed to correctly render ChinaSea characters.
dialog.template.ttf.lins = Rækker
dialog.template.ttf.lins.tooltip = Specifies the number of rows on the screen for the TTF output (0 = default)
dialog.template.ttf.dosvfunc = FEP-styring
dialog.template.ttf.dosvfunc.tooltip = If set, enables FEP control to function for Japanese DOS/V applications, and changes the blinking of character attributes to high brightness.
dialog.template.ttf.cols = Kolonner
dialog.template.ttf.cols.tooltip = Specifies the number of columns on the screen for the TTF output (0 = default)
dialog.template.ttf.wp = Tekstbehandling
dialog.template.ttf.wp.tooltip = You can specify a word processor for the TTF output and optionally also a version number for the word processor.\nSupported word processors are WP=WordPerfect, WS=WordStar, XY=XyWrite, FE=FastEdit, and an optional version number.\nFor example, WP6 will set the word processor as WordPerfect 6, and XY4 will set the word processor as XyWrite 4.\nWord processor-specific features like on-screen text styles and 512-character font will be enabled based on this.
dialog.template.ttf.outputswitch = Outputomskifter
dialog.template.ttf.outputswitch.tooltip = Specifies the output that DOSBox-X should switch to from the TTF output when a graphical mode is requested, or auto for automatic selection
dialog.template.dos.version = DOS-version
dialog.template.dos.version.tooltip = Set DOS version (5.0 by default)
dialog.template.dosclipboardapi = DOS-udklipsholder
dialog.template.dosclipboardapi.tooltip = If set, DOS APIs for communications with the Windows clipboard will be enabled for shared clipboard communications.\nCaution: Enabling this API may cause some programs to think they are running under Windows.
dialog.template.dos.setverfile = Versionsfil
dialog.template.dos.setverfile.tooltip = File containing the list of applications and assigned DOS versions, in a tab-separated format, used by SETVER.EXE as a persistent storage
dialog.template.dosclipboarddevice = Udklipsholderenhed
dialog.template.dosclipboarddevice.tooltip = If enabled, a DOS device will be added for bidirectional communications with the shared clipboard.\nSetting to "read" will only allow read access, and setting to "write" will only allow write access.\nSetting to "full" or "true" enables both; setting to "false" or "disabled" disables the access or device.\nThe default device name is CLIP$, but can be changed with the "dos clipboard device name" setting below.
dialog.template.fat32setversion = Indstil version automatisk
dialog.template.fat32setversion.tooltip = Whether DOSBox-X should automatically set the reported DOS version to 7.0/7.10 when it is less than 7.0/7.10 and mounting LBA/FAT32 disk images is requested.\nIf set to "ask", a popup message will show up to ask whether DOSBox-X should automatically change the reported DOS version in order to mount the disk image.
dialog.template.dosclipboarddevicename = Navn på udklipsholderenhed
dialog.template.dosclipboarddevicename.tooltip = Set DOS device name (up to 8 characters) for bidirectional communications with the shared clipboard.\nIf unset or invalid, the default name CLIP$ will be used (e.g. "TYPE CLIP$" shows the clipboard contents).\nIt has no effect if "dos clipboard device enable" is disabled, and it is deactivated if the secure mode is enabled.
dialog.template.dos.localeperiod = Lokal epoke
dialog.template.dos.localeperiod.tooltip = Set locale epoch ('modern' by default). Historic settings (if available for the given country) try to mimic old DOS behaviour when displaying information such as dates, time, or numbers, modern ones follow current day practices for user experience more consistent with typical host systems.
dialog.template.dos.country = DOS-landekode
dialog.template.dos.country.tooltip = Set DOS country code ('auto' by default). This affects country-specific information such as date, time, and decimal formats. If set to 'auto', the country code corresponding to the selected keyboard layout will be used.
dialog.template.dos.expandshellvar = Udvid miljøvariabler
dialog.template.dos.expandshellvar.tooltip = Enable expanding environment variables such as %PATH% in the DOS command shell (auto by default, enabled if DOS version >= 7.0). FreeDOS and MS-DOS 7/8 COMMAND.COM supports this behavior.
dialog.template.dos.shellhistoryfile = Shellhistorik
dialog.template.dos.shellhistoryfile.tooltip = File containing persistent command line history ('shell_history.txt' by default). Setting it to empty disables persistent shell history.
dialog.template.longfilenames = Understøttelse af lange filnavne
dialog.template.longfilenames.tooltip = Enable long filename support. If set to auto (default), LFN support is enabled if the reported DOS version is at least 7.0.\nIf set to autostart, the built-in VER command won't activate/deactivate LFN support according to the reported DOS version.
dialog.template.fileaccesstries = Forsøg på filadgang
dialog.template.fileaccesstries.tooltip = If a positive integer is set, DOSBox-X will try to read/write/lock files directly on mounted local drives\nfor the specified number of times without caching before failing on Windows systems.\nFor networked database applications (e.g. dBase, FoxPro, etc), it is strongly recommended to set this to e.g. 3 for correct operations.
dialog.template.quickreboot = Hurtig genstart
dialog.template.quickreboot.tooltip = If set, the DOS restart call will reboot the emulated DOS (integrated DOS or guest DOS) instead of the virtual machine.
dialog.template.share = Share.exe
dialog.template.share.tooltip = Reports SHARE.EXE as resident and provides functions such as file-locking and record-locking,\nalthough not all SHARE functions are emulated.
dialog.template.doslogconsole = Logning af CON-output
dialog.template.doslogconsole.tooltip = If set, log DOS CON output to the log file.\nSetting to "quiet" will log DOS CON output only (no debugging output).
dialog.template.autofixwarning = Advarsel om beskadiget pakket fil
dialog.template.autofixwarning.tooltip = If set to true or both, DOSBox-X shows messages while trying to automatically fix the "Packed file is corrupt" error.\nIf set to false or none, DOSBox-X will not show such messages on the screen when the error occurred.\nIf set to "a20fix" or "loadfix", DOSBox-X will show the message for the a20fix or the loadfix only.
dialog.template.tab.configsys = Config.sys
dialog.template.configsys.shell = Shell
dialog.template.configsys.shell.tooltip = Specifies the command shell (COMMAND.COM or 4DOS.COM)
dialog.template.configsys.dos = DOS
dialog.template.configsys.dos.tooltip = Reports whether DOS occupies HMA and allocates UMB memory (if available)
dialog.template.configsys.fcbs = FCBS
dialog.template.configsys.fcbs.tooltip = Number of FCB handles available to DOS programs (1-255). Set to 0 to automatically use a reasonable default.
dialog.template.configsys.files = Files
dialog.template.configsys.files.tooltip = Number of file handles available to DOS programs (8-255). Set to 0 to automatically use a reasonable default.
dialog.template.configsys.country = Land
dialog.template.configsys.country.tooltip = Country code for date/time/decimal formats and optionally code page for TTF output and language files
dialog.template.configsys.lastdrive = Lastdrive
dialog.template.configsys.lastdrive.tooltip = The maximum drive letter that can be accessed by programs
dialog.template.configsys.numlock = NumLock
dialog.template.configsys.numlock.tooltip = Sets the initial state of the NumLock key
dialog.template.configsys.break = Break
dialog.template.configsys.break.tooltip = Sets or clears extended CTRL+C checking
dialog.template.configsys.setpath = Indstil PATH
dialog.template.configsys.setprompt = Indstil PROMPT
dialog.template.configsys.settemp = Indstil TEMP
dialog.template.configsys.install = Install
dialog.template.configsys.installhigh = Installhigh
dialog.template.configsys.device = Device
dialog.template.configsys.devicehigh = Devicehigh
dialog.template.tab.dosv = DOS/V
dialog.template.dosvemu = DOS/V-emulering
dialog.template.dosvemu.tooltip = Enable DOS/V emulation and specify which version to emulate. This option is intended for use with games or software\noriginating from East Asia (China, Japan, Korea) that use the double byte character set (DBCS) encodings and DOS/V extension\nto display Japanese (jp), Chinese (chs/cht/cn/tw), or Korean (ko) text. Note that enabling DOS/V replaces 80x25 text mode with\na EGA/VGA graphics mode that emulates text mode to display the characters and may be incompatible with non-Asian software that\nassumes direct access to the text mode via segment 0xB800. For a general DOS environment with CJK support please disable DOS/V\nemulation and use TrueType font (TTF) output with a CJK code page (932, 936, 949, 950) and TTF font with CJK characters instead.
dialog.template.dosdbcs = DBCS-tabel
dialog.template.dosdbcs.tooltip = Enable DBCS table and Chinese, Japanese, Korean support for the TrueType font (TTF) output.\nCAUTION: Some software will crash without the DBCS table, including the Open Watcom installer.
dialog.template.dosvgetsysfont = Brug systemskrifttyper
dialog.template.dosvgetsysfont.tooltip = If enabled, DOSBox-X will try to get and use the system fonts on Windows and Linux platforms for the DOS/V emulation.\nIf this cannot be done, then DOSBox-X will try to use the internal Japanese DOS/V font, or you can specify a different font.
dialog.template.showdbcsnodosv = DBCS-tegn uden DOS/V
dialog.template.showdbcsnodosv.tooltip = Enables rendering of Chinese/Japanese/Korean characters for DBCS code pages in standard VGA and EGA machine types in non-DOS/V and non-TTF mode.\nDOS/V fonts will be used in such cases, which can be adjusted by the above config options (such as fontxdbcs, fontxdbcs14, and fontxdbcs24).\nSetting to "auto" enables Chinese/Japanese/Korean character rendering if a language file is loaded (or with "autodbcs" option set) in such cases.
dialog.template.dosvyen = Yensymbol
dialog.template.dosvyen.tooltip = Enables the Japanese yen symbol at 5ch if it is found at 7fh in a custom SBCS font for the Japanese DOS/V or JEGA emulation
dialog.template.fepcontrol = FEP
dialog.template.fepcontrol.tooltip = FEP control API for the DOS/V emulation
dialog.template.vtext1 = V-teksttilstand 1
dialog.template.vtext1.tooltip = V-text screen mode 1 for the DOS/V emulation. Enter command "VTEXT 1" for this mode.\nNote that XGA/SXGA mode is only supported by the svga_s3trio and svga_et4000 machine types.
dialog.template.vtext2 = V-teksttilstand 2
dialog.template.vtext2.tooltip = V-text screen mode 2 for the DOS/V emulation. Enter command "VTEXT 2" for this mode.\nNote that XGA/SXGA mode is only supported by the svga_s3trio and svga_et4000 machine types.
dialog.template.dosvuse20pixelfont = Brug 20 px-skrifttype
dialog.template.dosvuse20pixelfont.tooltip = Enables the 20 pixel font to be used instead of the 24 pixel system font for the Japanese DOS/V emulation (with V-text enabled)
dialog.template.j3100 = J-3100
dialog.template.j3100.tooltip = With the setting dosv=jp and a non-off value of this option, the Toshiba J-3100 machine will be emulated with DCGA support.\nSetting to "on" or "auto" starts J-3100 automatically, and with the setting "manual" you can enter J-3100 mode with DCGA command.
dialog.template.j3100type = J-3100-maskine
dialog.template.j3100type.tooltip = Specifies the Toshiba J-3100 machine type if J-3100 mode is enabled. The color palette will be changed with different machine types.
dialog.template.dosvj3100colorscroll = J-3100-rulning
dialog.template.dosvj3100colorscroll.tooltip = Specifies that the color display can be used for scrolling, which is currently incompatible with for example the J-3100 version of the SimCity game.\nThe VGA version of the Toshiba Windows 3.1 works fine with the "false" value of this setting, whereas its CGA/EGA version requires a "true" value for this.
dialog.template.dosvfontxsbcs = 8x19 SBCS font
dialog.template.dosvfontxsbcs.tooltip = FONTX2 file used to rendering SBCS characters (8x19) in DOS/V or JEGA mode. If not specified, the default one will be used.\nLoading the ASC16 and ASCFONT.15 font files (from the UCDOS and ETen Chinese DOS systems) is also supported for the DOS/V mode.
dialog.template.dosvfontxsbcs16 = 8x16 SBCS font
dialog.template.dosvfontxsbcs16.tooltip = FONTX2 file used to rendering SBCS characters (8x16) in DOS/V or JEGA mode. If not specified, the default one will be used.\nLoading the ASC16 and ASCFONT.15 font files (from the UCDOS and ETen Chinese DOS systems) is also supported for the DOS/V mode.
dialog.template.dosvfontxsbcs24 = 12x24 SBCS font
dialog.template.dosvfontxsbcs24.tooltip = FONTX2 file used to rendering SBCS characters (12x24) in DOS/V mode (with V-text). If not specified, the default one will be used.\nLoading the ASC24 and ASCFONT.24? font files (the latter from the ETen Chinese DOS system) is also supported for the DOS/V mode.
dialog.template.dosvfontxdbcs = DBCS-skrifttype 16x16
dialog.template.dosvfontxdbcs.tooltip = FONTX2 file used to rendering DBCS characters (16x16) in DOS/V or VGA/JEGA mode. If not specified, the default one will be used.\nAlternatively, you can load a BDF or PCF font file (16x16 or 15x15), such as the free bitmap fonts from WenQuanYi (https://wenq.org/).\nFor Simplified Chinese DOS/V, loading the HZK16 font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported.\nFor Traditional Chinese DOS/V, loading the STDFONT.15 font file from the ETen Chinese DOS system is also supported.
dialog.template.dosvfontxdbcs14 = DBCS-skrifttype 14x14
dialog.template.dosvfontxdbcs14.tooltip = ONTX2 file used to rendering DBCS characters (14x14) for Configuration Tool or EGA mode. If not specified, the default one will be used.\nAlternatively, you can load a BDF or PCF font file (14x14 or 15x15), such as the free bitmap fonts from WenQuanYi (https://wenq.org/).\nFor Simplified Chinese DOS/V, loading the HZK14 font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported.\nFor Traditional Chinese DOS/V, loading the STDFONT.15 font file from the ETen Chinese DOS system is also supported.
dialog.template.dosvfontxdbcs24 = DBCS-skrifttype 24x24
dialog.template.dosvfontxdbcs24.tooltip = FONTX2 file used to rendering DBCS characters (24x24) in DOS/V mode (with V-text and 24-pixel fonts enabled).\nFor Simplified Chinese DOS/V, loading the HZK24? font file (https://github.com/aguegu/BitmapFont/tree/master/font) is also supported.\nFor Traditional Chinese DOS/V, loading the STDFONT.24 font file from the ETen Chinese DOS system is also supported.
dialog.template.tab.system = System
dialog.template.machine = Maskintype
dialog.template.machine.tooltip = The type of machine DOSBox tries to emulate
dialog.template.integrationdevice = DOSBox-X-integrationsenhed
dialog.template.integrationdevice.tooltip = Enable DOSBox-X's integration I/O device, a way for additional software to talk to DOSBox-X. It is currently experimental.\nThis can for example be used to return DOSBox-X's current status and by the guest OS to match the mouse pointer position.
dialog.template.vmware = VMware-integration
dialog.template.vmware.tooltip = Enable VMware interface emulation including guest mouse integration\n(when used along with e.g. VMware mouse driver for Windows 3.x).
dialog.template.pc98256color = PC-98 256 farver
dialog.template.pc98256color.tooltip = Allow 256-color graphics mode if set, disable if not set
dialog.template.pc98anex86font = PC-98 Anex86-skrifttype
dialog.template.pc98anex86font.tooltip = Specify an Anex86 compatible font to load as supported by the Anex86 emulator for PC-98 emulation.\nBy default DOSBox-X tries to load ANEX86.BMP followed by FREECG98.BMP after trying to load FONT.ROM.\nIf you specify a font here then it will be tried first, perhaps before FONT.ROM (see previous option).
dialog.template.pc9816color = PC-98 16 farver
dialog.template.pc9816color.tooltip = Allow 16-color graphics mode if set, disable if not set
dialog.template.pc98fmboard = PC-98 FM
dialog.template.pc98fmboard.tooltip = In PC-98 mode, selects the FM music board to emulate
dialog.template.pc98grcg = PC-98 GRCG-grafik
dialog.template.pc98grcg.tooltip = Allow GRCG graphics functions if set, disable if not set
dialog.template.pc98busmouse = PC-98 busmus
dialog.template.pc98busmouse.tooltip = Enable PC-98 bus mouse emulation. Disabling this option does not disable INT 33h emulation.
dialog.template.pc98egc = PC-98 EGC-grafik
dialog.template.pc98egc.tooltip = Allow EGC graphics functions if set, disable if not set
dialog.template.pc98forceibmkeyboard = PC-98 IBM-tastatur
dialog.template.pc98forceibmkeyboard.tooltip = Force to use a default keyboard layout like IBM US-English for PC-98 emulation.\nWill only work with apps and games using BIOS for keyboard.
dialog.template.pc98fontrom = PC-98 skrifttype-ROM
dialog.template.pc98fontrom.tooltip = If enabled, DOSBox-X will first try to load FONT.ROM as generated by T98Tools for PC-98 emulation
dialog.template.pc98forcejiskeyboard = PC-98 JIS-tastatur
dialog.template.pc98forcejiskeyboard.tooltip = Force to use a default keyboard layout like JIS (JP106) for PC-98 emulation.\nWill only work with apps and games using BIOS for keyboard.
dialog.template.pc98biosstring = PC-98 BIOS-copyright
dialog.template.pc98biosstring.tooltip = If set, the PC-98 BIOS copyright string is placed at E800:0000.\nEnable this for software that detects PC-98 vs Epson.
dialog.template.tab.cpu = CPU
dialog.template.core = Kerne
dialog.template.core.tooltip = CPU Core used in emulation. auto will switch to dynamic if available and appropriate.
dialog.template.cputype = CPU-type
dialog.template.cputype.tooltip = CPU Type used in emulation. auto is the fastest choice.
dialog.template.cycles = Hastighed
dialog.template.cycles.tooltip = Number of instructions DOSBox tries to emulate each millisecond. Setting this value too high results in sound dropouts and lags. Cycles can be set in 3 ways\:\n'auto' tries to guess what a game needs. It usually works, but can fail for certain games.\n'fixed \#number' will set a fixed number of cycles. This is what you usually need if 'auto' fails. (Example\: fixed 4000)\n'max' will allocate as much cycles as your computer is able to handle
dialog.template.up = Hurtigere
dialog.template.up.tooltip = Amount of cycles to increase with keycombo. Setting it lower than 100 will be a percentage. (CTRL-F12)
dialog.template.down = Langsommere
dialog.template.down.tooltip = Amount of cycles to decrease with keycombo. Setting it lower than 100 will be a percentage. (CTRL-F11)
dialog.template.cpucycles = Cyklusser
dialog.template.cpucycles.tooltip = Speed of the emulated CPU ('3000' by default). If 'cpu_cycles_protected' is on 'auto', this sets the cycles for both real and protected mode programs.\n<number>: Emulate a fixed number of cycles per millisecond (roughly equivalent to MIPS). Valid range is from 50 to 2000000.\nmax: Emulate as many cycles as your host CPU can handle on a single core. The number of cycles per millisecond can vary; this might cause issues in some DOS programs.\nNotes:\n- Setting the CPU speed to 'max' or to high fixed values may result in sound drop-outs and general lagginess.\n- Set the lowest fixed cycles value that runs the game at an acceptable speed for the best results.
dialog.template.cpucyclesprotected = Beskyttet tilstand
dialog.template.cpucyclesprotected.tooltip = Speed of the emulated CPU for protected mode programs only ('60000' by default).\nauto: Use the `cpu_cycles' setting.\n<number>: Emulate a fixed number of cycles per millisecond (roughly equivalent to MIPS). Valid range is from 50 to 2000000.\nmax: Emulate as many cycles as your host CPU can handle on a single core. The number of cycles per millisecond can vary; this might cause issues in some DOS programs.
dialog.template.cputhrottle = Dynamisk begrænsning
dialog.template.cputhrottle.tooltip = Throttle down the number of emulated CPU cycles dynamically if your host CPU cannot keep up. Only affects fixed cycles settings.\nWhen enabled, the number of cycles per millisecond can vary; this might cause issues in some DOS programs.
dialog.template.fpuemulation = FPU
dialog.template.fpuemulation.tooltip = Enable FPU emulation
dialog.template.rdtscrate = RDTSC-frekvens
dialog.template.rdtscrate.tooltip = If nonzero, the Pentium RDTSC counter will tick at this rate per millisecond instead of by the cycle count
dialog.template.dosidleapi = DOS-tomgang
dialog.template.dosidleapi.tooltip = If set, DOSBox-X can lower the host system's CPU load when a supported guest program is idle
dialog.template.segmentlimits = Håndhæv segmentgrænser
dialog.template.segmentlimits.tooltip = Enforce checks for segment limits on 80286 and higher CPU types
dialog.template.speedmods = Hastighedsjusteringer
dialog.template.speedmods.tooltip = Permit changes known to improve performance (enabled by default)
dialog.template.turbo = Turbo
dialog.template.turbo.tooltip = Enables Turbo (Fast Forward) mode to speed up operations
dialog.template.outputportreset = Tillad nulstilling via outputport
dialog.template.outputportreset.tooltip = If set (default), allow the application to reset the CPU through the keyboard controller.\nThis option is required to allow Windows ME to reboot properly, whereas Windows 9x and earlier\nwill reboot without this option using INT 19h.
dialog.template.apmbios = APM-BIOS
dialog.template.apmbios.tooltip = Emulate Advanced Power Management (APM) BIOS calls
dialog.template.isapnpbios = ISA PnP-BIOS
dialog.template.isapnpbios.tooltip = Emulate ISA Plug & Play BIOS. Enable if using DOSBox-X to run a PnP aware DOS program or if booting Windows 9x.\nDo not disable if Windows 9x is configured around PnP devices, you will likely confuse it.
dialog.template.tab.memory = Hukommelse
dialog.template.memorysize = Størrelse
dialog.template.memorysize.tooltip = Amount of memory DOSBox has in megabytes. This value is best left at its default to avoid problems with some games,\nthough few games might require a higher value. There is generally no speed advantage when raising this value.
dialog.template.xms = XMS
dialog.template.xms.tooltip = Enable XMS support
dialog.template.ems = EMS
dialog.template.ems.tooltip = Enable EMS support. The default (\=true) provides the best compatibility but certain applications may run better with other choices,\nor require EMS support to be disabled (\=false) to work at all.
dialog.template.umb = UMB
dialog.template.umb.tooltip = Enable UMB support
dialog.template.hma = HMA
dialog.template.hma.tooltip = Report through XMS that HMA exists (not necessarily available)
dialog.template.shellhigh = Kommandoshell i UMB
dialog.template.shellhigh.tooltip = Load the DOSBox-X command shell into the upper memory when the UMB is available.\nIf set to auto (default), it is enabled if the reported DOS version is at least 7.0.
dialog.template.xmshandles = XMS-håndtag
dialog.template.xmshandles.tooltip = Number of XMS handles available for the DOS environment, or 0 to use a reasonable default
dialog.template.minimummcbfree = Mindste ledige segment
dialog.template.minimummcbfree.tooltip = Minimum free segment value to leave free. At startup, the DOS kernel will allocate memory\nup to this point. This can be used to deal with EXEPACK issues or DOS programs that cannot\nbe loaded too low in memory. If you want more free conventional memory to be reported,\nyou can for example set its value to 1.
dialog.template.a20 = A20-port
dialog.template.a20.tooltip = A20 gate emulation mode.\nThe on/off/on_fake/off_fake options are intended for testing and debugging DOS development,\nor to emulate obscure hardware, or to work around potential extended memory problems with DOS programs.\non_fake/off_fake are intended to test whether a program carries out a memory test to ensure the A20\ngate is set as intended (as HIMEM.SYS does). If it goes by the gate bit alone, it WILL crash.\nThis parameter is also changeable from the builtin A20GATE command.\nfast: Emulate A20 gating by remapping the first 64KB @ 1MB boundary (fast, mainline DOSBox behavior)\nmask: Emulate A20 gating by masking memory I/O address (accurate)\noff: Lock A20 gate off (Software/OS cannot enable A20)\non: Lock A20 gate on (Software/OS cannot disable A20)\noff_fake: Lock A20 gate off but allow bit to toggle (hope your DOS game tests the HMA!)\non_fake: Lock A20 gate on but allow bit to toggle
dialog.template.mcbfaults = MCB-fejl
dialog.template.mcbfaults.tooltip = How software-corrupted memory chain blocks should be handled:\nrepair: Repair (and report) faults using adjacent blocks (default).\nreport: Report faults but otherwise proceed as-is.\nallow: Allow faults to go unreported (hardware behavior).\ndeny: Quit (and report) when faults are detected.
dialog.template.pcjrmemorylayout = PCjr-hukommelseslayout
dialog.template.pcjrmemorylayout.tooltip = PCjr memory layout ('expanded' by default).\nexpanded: 640 KB total memory with applications residing above 128 KB. Compatible with most games.\nstandard: 128 KB total memory with applications residing below 96 KB. Required for some older games (e.g., Jumpman, Troll).
dialog.template.memoryfile = Hukommelsesfil
dialog.template.memoryfile.tooltip = If set, guest memory is memory-mapped from a file on disk, rather than allocated from memory
dialog.template.tab.disks = Diske
dialog.template.fdc1enable = Diskettecontroller
dialog.template.fdc1enable.tooltip = Enable floppy controller interface
dialog.template.fdc1pnp = PnP for diskettecontroller
dialog.template.fdc1pnp.tooltip = List floppy controller in ISA PnP BIOS enumeration
dialog.template.floppydatarate = Diskettens datahastighed
dialog.template.floppydatarate.tooltip = Slow down (limit) floppy disk throughput. This setting controls the limit in bytes/second.\nSet to 0 to disable the limit, or -1 (default) to use a reasonable limit.\nThe disk I/O performance as in DOSBox SVN can be achieved by setting this to 0.
dialog.template.fdc1mode = Diskettecontrollerens tilstand
dialog.template.fdc1mode.tooltip = Floppy controller mode. What the controller acts like.\nps2: PS/2 mode (most common)\nps2_model30: PS/2 model 30\nat: AT mode\nxt: PC/XT mode
dialog.template.ide1enable = Primær IDE
dialog.template.ide1enable.tooltip = Enable IDE interface
dialog.template.ide1pnp = PnP for primær IDE
dialog.template.ide1pnp.tooltip = List IDE device in ISA PnP BIOS enumeration
dialog.template.ide2enable = Sekundær IDE
dialog.template.ide2pnp = PnP for sekundær IDE
dialog.template.ide3enable = Tertiær IDE
dialog.template.ide3pnp = PnP for tertiær IDE
dialog.template.ide4enable = Kvaternær IDE
dialog.template.ide4pnp = PnP for kvaternær IDE
dialog.template.ide5enable = Kvinær IDE
dialog.template.ide5pnp = PnP for kvinær IDE
dialog.template.ide6enable = Senær IDE
dialog.template.ide6pnp = PnP for senær IDE
dialog.template.ide7enable = Septenær IDE
dialog.template.ide7pnp = PnP for septenær IDE
dialog.template.ide8enable = Oktonær IDE
dialog.template.ide8pnp = PnP for oktonær IDE
dialog.template.hddatarate = Harddiskens datahastighed
dialog.template.hddatarate.tooltip = Slow down (limit) hard disk throughput. This setting controls the limit in bytes/second.\nSet to 0 to disable the limit, or -1 (default) to use a reasonable limit.\nThe disk I/O performance as in DOSBox SVN can be achieved by setting this to 0.
dialog.template.tab.video = Video
dialog.template.vmemsizemb = Videohukommelse i MB
dialog.template.vmemsizemb.tooltip = Amount of video memory in megabytes. The maximum resolution and color depth the svga_s3 will be able to display is determined by this value.\n-1: auto (vmemsizekb is ignored)\n0: 512k (800x600  at 256 colors) if vmemsizekb=0\n1: 1024x768  at 256 colors or 800x600  at 64k colors\n2: 1600x1200 at 256 colors or 1024x768 at 64k colors or 640x480 at 16M colors\n4: 1600x1200 at 64k colors or 1024x768 at 16M colors\n8: up to 1600x1200 at 16M colors\nFor build engine games, use more memory than in the list above so it can use triple buffering and thus won't flicker.
dialog.template.scanlineondemand = Gengivelse pr. linje
dialog.template.scanlineondemand.tooltip = Render video output at vsync or when something is changed mid frame, instead of stopping to render every scanline.\nMay provide a performance benefit to most DOS games. However this may also break timing-dependent game or Demoscene effects.\nDefault auto, which will turn if off for VGA modes and turn it on for SVGA modes.
dialog.template.vmemsizekb = Videohukommelse i KB
dialog.template.vmemsizekb.tooltip = Amount of video memory in kilobytes, in addition to video memory in MB
dialog.template.vgarenderperscanline = VGA-gengivelse pr. skanlinje
dialog.template.vgarenderperscanline.tooltip = Emulate accurate per-scanline VGA rendering (enabled by default).\nCurrently, you need to disable this for a few games, otherwise they will crash at startup\n(e.g., Deus, Ishar 3, Robinson's Requiem, Time Warriors).
dialog.template.vmemsize = Videohukommelse
dialog.template.vmemsize.tooltip = Video memory in MB (1-8) or KB (256 to 8192). 'auto' uses the default for the selected video adapter ('auto' by default).
dialog.template.ioopt1 = Optimering af hukommelses-I/O 1
dialog.template.ioopt1.tooltip = Enable one class of EGA/VGA memory I/O optimizations. Default ON (true).\nIf graphical artifacts or errors occur, try turning this off first. May provide a performance benefit.
dialog.template.vmemdelay = Forsinkelse ved adgang til videohukommelse
dialog.template.vmemdelay.tooltip = Set video memory access delay emulation ('off' by default).\noff: Disable video memory access delay emulation (default). This is preferable for most games to avoid slowdowns.\non: Enable video memory access delay emulation (3000 ns). This can help reduce or eliminate flicker in Hercules, CGA, EGA, and early VGA games.\n<value>: Set access delay in nanoseconds. Valid range is 0 to 20000 ns; 500 to 5000 ns is the most useful range.\nNote: Only set this on a per-game basis when necessary as it slows down the whole emulator.
dialog.template.dosrate = Billedhastighed
dialog.template.dosrate.tooltip = Customize the emulated video mode's frame rate.\ndefault: The DOS video mode determines the rate (recommended; default).\nhost: Match the DOS rate to the host rate.\n<value>: Sets the rate to an exact value in between 24.000 and 1000.000 (Hz).\nNote: We recommend the 'default' rate, otherwise test and set on a per-game basis.
dialog.template.monochromepalette = Monokrom palet
dialog.template.monochromepalette.tooltip = Set the palette for monochrome display emulation ('amber' by default).\nWorks only with the 'hercules' and 'cga_mono' machine types.\nNote: You can also cycle through the available palettes via hotkeys.
dialog.template.ansi = ANSI
dialog.template.ansi.tooltip = If set (by default), ANSI.SYS emulation is on. If clear, ANSI.SYS is not emulated and will not appear to be installed.\nNOTE: This option has no effect in PC-98 mode where MS-DOS systems integrate ANSI.SYS into the DOS kernel.
dialog.template.cgacolors = CGA-farver
dialog.template.cgacolors.tooltip = Set the interpretation of CGA RGBI colours. Affects all machine types\ncapable of displaying CGA or better graphics.
dialog.template.blinking = Blinkende tekst
dialog.template.blinking.tooltip = Set to false if you want to see high-intensity background colors instead of blinking foreground text.\nThis option has no effect in PC-98 and some other video modes.
dialog.template.vesamodes = VESA
dialog.template.vesamodes.tooltip = Controls which VESA video modes are available:\ncompatible: Only the most compatible VESA modes for the configured video memory size (default).\nRecommended with 4 or 8 MB of video memory ('vmemsize') for the widest compatiblity with games.\n320x200 high colour modes are excluded as they were not properly supported until the late '90s.\nThe 256-colour linear framebuffer 320x240, 400x300, and 512x384 modes are also excluded as they cause timing problems in Build Engine games.\nhalfline: Same as 'compatible', but the 120h VESA mode is replaced with a special halfline mode used by Extreme Assault. Use only if needed.\nall: All modes are available, including extra DOSBox-specific VESA modes.\nUse 8 MB of video memory for the best results. Some games misbehave in the presence of certain VESA modes;\ntry 'compatible' mode if this happens. The 320x200 high colour modes available in this mode are often required by late '90s demoscene productions.
dialog.template.8pxvgafont = VGA-skrifttype på 8 px
dialog.template.8pxvgafont.tooltip = Use 8-pixel-wide fonts on VGA adapters (disabled by default)
dialog.template.reelmagic = ReelMagic MPEG
dialog.template.reelmagic.tooltip = ReelMagic (aka REALmagic) MPEG playback support:\noff: Disable support (default).\ncardonly: Initialize the card without loading the FMPDRV.EXE driver.\non: Initialize the card and load the FMPDRV.EXE on startup.
dialog.template.reelmagicfcode = ReelMagic-billedhastighed
dialog.template.reelmagicfcode.tooltip = Override the frame rate code used during video playback:\n0: No override: attempt automatic rate discovery (default).\n1 to 7: Override the frame rate to one the following (use 1 through 7):\n1=23.976, 2=24, 3=25, 4=29.97, 5=30, 6=50, or 7=59.94 FPS.
dialog.template.reelmagickey = ReelMagic-nøgle
dialog.template.reelmagickey.tooltip = Set the 32-bit magic key used to decode the game's videos:\n auto: Use the built-in routines to determine the key (default).\ncommon: Use the most commonly found key, which is 0x40044041.\nthehorde: Use The Horde's key, which is 0xC39D7088.\n<custom>: Set a custom key in hex format (e.g., 0x12345678).
dialog.template.tab.cgacomposite = CGA composite
dialog.template.composite = Composite-tilstand ved start
dialog.template.composite.tooltip = Enable composite mode on start (only for 'cga', 'pcjr', and 'tandy' machine types; 'auto' by default). 'auto' lets the program decide.
dialog.template.compositeera = Composite-'æra'
dialog.template.compositeera.tooltip = Era of composite technology ('auto' by default). When 'auto', PCjr uses 'new', and CGA/Tandy use 'old'.
dialog.template.compositehue = Hue
dialog.template.compositehue.tooltip = Hue of the RGB palette (0 by default). For example, adjust until the sky is blue.
dialog.template.compositesaturation = Mætning
dialog.template.compositesaturation.tooltip = Intensity of colors, from washed out to vivid (100 by default)
dialog.template.compositecontrast = Kontrast
dialog.template.compositecontrast.tooltip = Ratio between the dark and light area (100 by default)
dialog.template.compositebrightness = Lysstyrke
dialog.template.compositebrightness.tooltip = Luminosity of the image, from dark to light (0 by default)
dialog.template.compositeconvergence = Convergence
dialog.template.compositeconvergence.tooltip = Convergence of subpixel elements, from blurry to sharp (0 by default)
dialog.template.tab.voodoo = Voodoo
dialog.template.voodooemu = Voodoo-emulering
dialog.template.voodooemu.tooltip = Enable support for the 3dfx Voodoo card
dialog.template.voodoo3dfx = Voodoo-emulering
dialog.template.voodoo3dfx.tooltip = Enable 3dfx Voodoo emulation (enabled by default)
dialog.template.voodoomem = Voodoo-RAM
dialog.template.voodoomem.tooltip = Specify VOODOO card memory size.\n'standard' 4MB card (2MB front buffer + 1x2MB texture unit)\n'max' 12MB card (4MB front buffer + 2x4MB texture units)
dialog.template.voodoomemsize.tooltip = Set the amount of video memory for 3dfx Voodoo graphics, either 4 or 12 MB.\nThe memory is used by the Frame Buffer Interface (FBI) and Texture Mapping Unit (TMU) as follows:\n4: 2 MB for the FBI and one TMU with 2 MB (default).\n12: 4 MB for the FBI and two TMUs, each with 4 MB.
dialog.template.voodoomaxmem = Maks. Voodoo-hukommelse
dialog.template.voodoomaxmem.tooltip = Whether to enable maximum memory size for the Voodoo card.\nIf set (on by default), the memory size will be 12MB (4MB front buffer + 2x4MB texture units).\nOtherwise, the memory size will be the standard 4MB (2MB front buffer + 1x2MB texture unit).
dialog.template.glide = Glide
dialog.template.glide.tooltip = Enable glide emulation
dialog.template.lfbglide = LFB-adgang
dialog.template.lfbglide.tooltip = LFB access. OpenGlide does not support locking aux buffer, please use _noaux modes
dialog.template.splash3dfx = 3Dfx-startskærm
dialog.template.splash3dfx.tooltip = Show 3dfx splash screen (requires 3dfxSpl2.dll)
dialog.template.voodoomultithreading = Voodoo-tråde
dialog.template.voodoomultithreading.tooltip = Use threads to improve 3dfx Voodoo performance:\nauto: Use up to 8 threads based on available CPU cores (default).\n<value>: Set a specific number of threads between 1 and 16.\nNote: Tests show that frame rates increase up to 8 threads after which they level off or decrease, in general.
dialog.template.voodoobilinearfiltering = Bilineær filtrering i Voodoo
dialog.template.voodoobilinearfiltering.tooltip = Use bilinear filtering to emulate the 3dfx Voodoo's texture smoothing effect (disabled by default).\nOnly suggested if you have a fast desktop-class CPU, as it can impact frame rates on slower systems.
dialog.template.tab.audio = Lyd
dialog.template.silentmode = Vær tyst
dialog.template.silentmode.tooltip = Enable silent mode.\nSound is still emulated in silent mode, but DOSBox outputs no sound to the host.\nCapturing the emulated audio output to a WAV file works in silent mode.
dialog.template.samplerate = Målefrekvens
dialog.template.samplerate.tooltip = Mixer sample rate, setting any device's rate higher than this will probably lower their sound quality
dialog.template.blocksize = Blok-størrelse
dialog.template.blocksize.tooltip = Block size of the host audio device in sample frames. Larger values might help with sound stuttering but will introduce more latency.
dialog.template.prebuffer = Lydbuffer (ms)
dialog.template.prebuffer.tooltip = How many milliseconds of sound to render in advance on top of 'blocksize'.\nLarger values might help with sound stuttering but will introduce more latency.
dialog.template.mixercommand = Mixer-kommando
dialog.template.mixercommand.tooltip = Set mixer channel volume levels
dialog.template.mutewheninactive = Lydløs ved inaktivitet
dialog.template.mutewheninactive.tooltip = Mute the sound when the window is inactive (disabled by default)
dialog.template.audiocrossfeed = Crossfeed
dialog.template.audiocrossfeed.tooltip = Enable crossfeed globally on all stereo channels for headphone listening
dialog.template.sampleaccurate = Sample-nøjagtig
dialog.template.sampleaccurate.tooltip = Enable sample accurate mixing, at the expense of some emulation performance.\nEnable this option for DOS games and demos that require such accuracy for correct Tandy/OPL output including digitized speech.\nThis option can also help eliminate minor errors in Gravis Ultrasound emulation that result in random echo/attenuation effects.
dialog.template.audioreverb = Rumklang
dialog.template.audioreverb.tooltip = Enable reverb globally to add a sense of space to the sound
dialog.template.audionegotiate = Driverforhandling
dialog.template.audionegotiate.tooltip = Negotiate a possibly better 'blocksize' setting.\nEnable it if you're not getting audio or the sound is stuttering with your 'blocksize' setting.\nDisable it to force the manually set 'blocksize' value.
dialog.template.audiochorus = Chorus
dialog.template.audiochorus.tooltip = Enable chorus globally to add a sense of stereo movement to the sound
dialog.template.swapstereo = Byt venstre/højre kanal
dialog.template.swapstereo.tooltip = Swaps the left and right stereo channels
dialog.template.audioleveling = Automatisk niveauregulering
dialog.template.audioleveling.tooltip = Enable the auto-leveling compressor on the master channel to prevent clipping of the audio output
dialog.template.tab.midi = Midi
dialog.template.mpu401 = MPU-401
dialog.template.mpu401.tooltip = Type of MPU-401 to emulate
dialog.template.mididevice = MIDI-enhed
dialog.template.mididevice.tooltip = Device that will receive the MIDI data from MPU-401
dialog.template.midiconfig = Enheds-ID
dialog.template.midiconfig.tooltip = Special configuration options for the device driver. This is usually the id of the device you want to use. See README for details.
dialog.template.midisamplerate = Synthesizerens samplingfrekvens
dialog.template.midisamplerate.tooltip = Sample rate for MIDI synthesizer, if applicable
dialog.template.mpubase = MPU-401-basisadresse
dialog.template.mpubase.tooltip = The IO address of the MPU-401.\nSet to 0 to use a default I/O address.\n300h to 330h are for use with IBM PC mode.\nC0D0h to F8D0h are for use with NEC PC-98 mode (MPU98).\n80D2h through 80DEh are for use with NEC PC-98 Sound Blaster 16 MPU-401 emulation.\nIf not assigned (0), 330h is the default for IBM PC and E0D0h is the default for PC-98.
dialog.template.mpuirq = MPU-401-IRQ
dialog.template.mpuirq.tooltip = MPU-401 IRQ. -1 to automatically choose.
dialog.template.rawmidioutput = Rå MIDI-output
dialog.template.rawmidioutput.tooltip = Enable raw, unaltered MIDI output (disabled by default)
dialog.template.tab.fluidsynth = FluidSynth
dialog.template.fluidsynth.driver = Driver
dialog.template.fluidsynth.driver.tooltip = Driver to use with FluidSynth, not needed under Windows. Available drivers depend on what FluidSynth was compiled with.
dialog.template.fluidsynth.soundfont = Soundfont
dialog.template.fluidsynth.soundfont.tooltip = Soundfont to use with FluidSynth. One must be specified.
dialog.template.fluidsynth.samplerate = Samplingfrekvens
dialog.template.fluidsynth.samplerate.tooltip = Sample rate to use with FluidSynth
dialog.template.fluidsynth.gain = Forstærkning
dialog.template.fluidsynth.gain.tooltip = FluidSynth gain
dialog.template.fluidsynth.chorus = Chorus
dialog.template.fluidsynth.chorus.tooltip = Chorus effect: 'auto' (default), 'on', 'off', or custom values
dialog.template.fluidsynth.reverb = Rumklang
dialog.template.fluidsynth.reverb.tooltip = Reverb effect: 'auto' (default), 'on', 'off', or custom values
dialog.template.fluidsynth.filter = Filter
dialog.template.fluidsynth.filter.tooltip = Filter for the FluidSynth audio output
dialog.template.tab.mt32 = Roland MT-32
dialog.template.mt32.model = Model
dialog.template.mt32.model.tooltip = The Roland MT-32/CM-32ML model to use. You must have the ROM files for the selected model available (see 'romdir').
dialog.template.mt32.dac = DAC-type
dialog.template.mt32.dac.tooltip = MT-32 DAC input emulation mode\nNice = 0 - default, Produces samples at double the volume, without tricks. Higher quality than the real devices\nPure = 1, Produces samples that exactly match the bits output from the emulated LA32. Nicer overdrive characteristics than the DAC hacks (it simply clips samples within range). Much less likely to overdrive than any other mode. Half the volume of any of the other modes. Perfect for developers while debugging :)\nGENERATION1 = 2, Re-orders the LA32 output bits as in early generation MT-32s (according to Wikipedia).\nGENERATION2 = 3, Re-orders the LA32 output bits as in later generations (personally confirmed on my CM-32L - KG).
dialog.template.mt32.romdir = ROM-mappe
dialog.template.mt32.romdir.tooltip = Name of the directory where MT-32 Control and PCM ROM files can be found. Emulation requires these files to work.
dialog.template.mt32.rate = Samplingfrekvens
dialog.template.mt32.rate.tooltip = Sample rate of MT-32 emulation
dialog.template.mt32.gain = Outputforstærkning
dialog.template.mt32.gain.tooltip = Output gain of MT-32 emulation in percent, 100 is the default value.
dialog.template.mt32.analog = Analog outputtilstand
dialog.template.mt32.analog.tooltip = MT-32 analogue output emulation mode.\nDigital = 0, Only digital path is emulated. The output samples correspond to the digital output signal appeared at the DAC entrance. Fastest mode.\nCoarse = 1, Coarse emulation of LPF circuit. High frequencies are boosted, sample rate remains unchanged. A bit better sounding but also a bit slower.\nAccurate = 2 - default, Finer emulation of LPF circuit. Output signal is upsampled to 48 kHz to allow emulation of audible mirror spectra above 16 kHz, which is passed through the LPF circuit without significant attenuation. Sounding is closer to the analog output from real hardware but also slower than the modes 0 and 1.\nOversampled = 3, Same as the default mode 2 but the output signal is 2x oversampled, i.e. the output sample rate is 96 kHz. Even slower than all the other modes but better retains highest frequencies while further resampled in DOSBox mixer.
dialog.template.mt32.chunk = Blokstørrelse
dialog.template.mt32.chunk.tooltip = Minimum milliseconds of data to render at once. Increasing this value reduces rendering overhead which may improve performance but also increases audio lag. Valid for rendering in separate thread only.
dialog.template.mt32.srcquality = SRC-kvalitet
dialog.template.mt32.srcquality.tooltip = MT-32 sample rate conversion quality. Value '0' is for the fastest conversion, value '3' provides for the best conversion quality. Default is 2.
dialog.template.mt32.prebuffer = Størrelse på forbuffer
dialog.template.mt32.prebuffer.tooltip = How many milliseconds of data to render ahead. Increasing this value may help to avoid underruns but also increases audio lag. Cannot be set less than or equal to mt32.chunk value. Valid for rendering in separate thread only.
dialog.template.mt32.niceampramp = Nice Amp Ramp
dialog.template.mt32.niceampramp.tooltip = Toggles "Nice Amp Ramp" mode that improves amplitude ramp for sustaining instruments. Quick changes of volume or expression on a MIDI channel may result in amp jumps on real hardware. When "Nice Amp Ramp" mode is enabled, amp changes gradually instead. Otherwise, the emulation accuracy is preserved. Default is true.
dialog.template.mt32.partials = Maks. partials
dialog.template.mt32.partials.tooltip = The maximum number of partials playing simultaneously
dialog.template.mt32.reverbmode = Rumklangstilstand
dialog.template.mt32.reverbmode.tooltip = MT-32 reverb mode
dialog.template.mt32.reverboutputgain = Outputforstærkning for rumklang
dialog.template.mt32.reverboutputgain.tooltip = Reverb output gain of MT-32 emulation in percent, 100 is the default value.
dialog.template.mt32.reverbtime = Rumklangens henfaldstid
dialog.template.mt32.reverbtime.tooltip = MT-32 reverb decaying time
dialog.template.mt32.reverblevel = Rumklangsniveau
dialog.template.mt32.reverblevel.tooltip = MT-32 reverb level
dialog.template.mt32.filter = Filter
dialog.template.mt32.filter.tooltip = Filter for the Roland MT-32/CM-32L audio output
dialog.template.mt32.swapstereo.tooltip = Reverse stereo channels for MT-32 output
dialog.template.mt32.multithread = Flertrådning
dialog.template.mt32.multithread.tooltip = MT-32 rendering in separate thread
dialog.template.mt32.verboselogging = Fejlsøgningslog
dialog.template.mt32.verboselogging.tooltip = MT-32 debug logging
