dialog.template.reloadsettings = Recargar Opciones
dialog.template.reloadsettings.tooltip = Asociar con la versión de DOSBox seleccionada, recargando todas las opciones a sus valores por defecto
dialog.template.miscellaneous = Misc
dialog.template.priority = Prioridad
dialog.template.priority.tooltip = Niveles de prioridad para DOSBox. La segunda entrada es para cuando DOSBox se encuentre segundo plano/minimizado
