dialog.template.printdbcs = Double-byte characters
dialog.template.printdbcs.tooltip = Allows DOSBox-X to print Chinese/Japanese/Korean DBCS (double-byte) characters when these code pages are active.\nIf set to auto (default), this is enabled only for the TrueType font (TTF) output with the DBCS support enabled.\nOnly applicable when using a DBCS code page (932: Japanese, 936: Simplified Chinese; 949: Korean; 950: Traditional Chinese).
dialog.template.tab.network = Network
dialog.template.networkredirector = Network redirector
dialog.template.networkredirector.tooltip = Report DOS network redirector as resident. This will allow the host name to be returned unless the secure mode is enabled.\nYou can also directly access UNC network paths in the form \\MACHINE\SHARE even if they are not mounted as drives on Windows systems.\nSet either "ipx=true" in [ipx] section or "ne2000=true" in [ne2000] section for a full network redirector environment.
dialog.template.pcaprealnic = Real NIC
dialog.template.pcaprealnic.tooltip = Specifies which of your host network interfaces is used for pcap.\nWrite 'list' here to see the list of devices from the Help menu ('List network interfaces') or from the Status Window.\nThen make your choice and put either the interface number (e.g. 2) or a part of your adapters name (e.g. VIA here).
dialog.template.pcaptimeout = Read timeout
