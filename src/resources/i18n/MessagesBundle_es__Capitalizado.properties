dialog.template.serial1 = Puerto Serie 1
dialog.template.serial.tooltip = Establece el tipo de dispositivo conectado al puerto COM. Puede ser "disabled, dummy, modem, nullmodem y directserial".\nLos parámetros adicionales deben ir en la misma línea, en formato parámetro\:valor.\nIRQ es un parámetro para todos los dispositivos (opcional).\nPara directserial\: realport (requerido), rxdelay (opcional). (realport\:COM1 realport\:ttyS0).\nPara modem\: listenport (opcional).\nPara nullmodem\: server, rxdelay, txdelay, telnet, usedtr, transparent, port, inhsocket (todos opcionales).\nEjemplo\: modem listenport\:5000
