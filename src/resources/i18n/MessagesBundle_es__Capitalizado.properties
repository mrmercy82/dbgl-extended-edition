dialog.template.dosboxversion = Versión de DOSBox
dialog.template.set = Establecer
dialog.template.set.tooltip = Asociar con la versión de DOSBox seleccionada: solo se conservan tus propios cambios, todos los demás ajustes proceden de la configuración de esta versión de DOSBox (también se hace automáticamente al pulsar Aceptar)
