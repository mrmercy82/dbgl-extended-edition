dialog.template.printeropenerror = Open error
dialog.template.printeropenerror.tooltip = Start the specified program to open the output file if an error had occurred
dialog.template.multipage = Combine pages
dialog.template.multipage.tooltip = Adds all pages to one PostScript file or printer job until CTRL-F2 is pressed
dialog.template.shellhide = Hide shell
dialog.template.shellhide.tooltip = If set, the command window will be hidden for openwith/openerror options on the Windows platform
dialog.template.parallel1 = Parallel 1
dialog.template.parallel1.tooltip = Set type of device connected to the parallel (LPT) port. Can be:\nreallpt (direct parallel port passthrough),\nfile (records data to a file or passes it to a device),\nprinter (virtual dot-matrix printer, see [printer] section)\ndisney (attach Disney Sound Source emulation to this port)\nAdditional parameters must be in the same line in the form of parameter:value.
