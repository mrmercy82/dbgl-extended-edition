dialog.template.mouseemu.tooltip = When is mouse emulated ?\nintegration: when not locked\nlocked: when locked\nalways: every time\nnever: at no time\nIf disabled, the mouse position in DOSBox-X is exactly where the host OS reports it.\nWhen using a high DPI mouse, the emulation of mouse movement can noticeably\nreduce the sensitiveness of your device, i.e. the mouse is slower but more precise.
dialog.template.mousecapture = Mouse capture behaviour
dialog.template.mousecapture.tooltip = Set the mouse capture behaviour:\nonclick: Capture the mouse when clicking any mouse button in the window (default)\nonstart: Capture the mouse immediately on start. Might not work correctly on some host operating systems\nseamless: Let the mouse move seamlessly between the DOSBox window and the rest of the desktop; captures only with middle-click or hotkey.\nSeamless mouse does not work correctly with all the games. Windows 3.1x can be made compatible with a custom mouse driver.\nnomouse: Hide the mouse and don't send mouse input to the game. For touch-screen control, use 'seamless'.
dialog.template.middleunlock = Middle button unlock
dialog.template.middleunlock.tooltip = Whether you can press the middle mouse button to unlock the mouse when the mouse has been locked.\nIf set to "manual", it works only with "autolock=false"; if set to "auto", it works only with "autolock=true".
dialog.template.mousemiddlerelease = Middle-click release
dialog.template.mousemiddlerelease.tooltip = Release the captured mouse by middle-clicking, and also capture it in seamless mode (enabled by default)
dialog.template.autolockfeedback = Autolock feedback
dialog.template.autolockfeedback.tooltip = Autolock status feedback type, i.e. visual, auditive, none
dialog.template.usesystemcursor = Use system cursor
dialog.template.usesystemcursor.tooltip = Use the mouse cursor of the host system instead of drawing a DOS mouse cursor.\nActivated when the mouse is not locked.
dialog.template.int33 = INT33
dialog.template.int33.tooltip = Enable INT 33H for mouse support
dialog.template.aux8042 = 8042 Aux. port
dialog.template.aux8042.tooltip = Enable emulation of the 8042 auxiliary port. PS/2 mouse emulation requires this to be enabled.\nYou should enable this if you will be running Windows ME or any other OS\nthat does not use the BIOS to receive mouse events.
dialog.template.mousevmware = VMware mouse interface
dialog.template.mousevmware.tooltip = VMware mouse interface (enabled by default). Fully compatible only with experimental 3rd party Windows 3.1x driver.\nNote: Requires PS/2 mouse to be enabled.
dialog.template.mousevirtualbox = VirtualBox mouse interface
dialog.template.mousevirtualbox.tooltip = VirtualBox mouse interface (enabled by default). Fully compatible only with 3rd party Windows 3.1x driver.\nNote: Requires PS/2 mouse to be enabled.
dialog.template.mousecommodel = COM mouse model
dialog.template.mousecommodel.tooltip = COM (serial) port default mouse model:\n2button: 2 buttons, Microsoft mouse.\n3button: 3 buttons, Logitech mouse; mostly compatible with Microsoft mouse.\nwheel: 3 buttons + wheel; mostly compatible with Microsoft mouse.\nmsm: 3 buttons, Mouse Systems mouse; NOT compatible with Microsoft mouse.\n2button+msm: Automatic choice between '2button' and 'msm'.\n3button+msm: Automatic choice between '3button' and 'msm'.\nwheel+msm: Automatic choice between 'wheel' and 'msm' (default).\nNote: Enable COM port mice in the [serial] section.
dialog.template.mouseps2model = PS/2 mouse model
dialog.template.mouseps2model.tooltip = PS/2 AUX port mouse model:\nstandard: 3 buttons, standard PS/2 mouse.\nintellimouse: 3 buttons + wheel, Microsoft IntelliMouse.\nexplorer: 5 buttons + wheel, Microsoft IntelliMouse Explorer (default).\nnone: no PS/2 mouse emulated.
dialog.template.mousedosdriver = DOS mouse driver
dialog.template.mousedosdriver.tooltip = Enable built-in DOS mouse driver (enabled by default). Notes:\n- Disable if you intend to use original MOUSE.COM driver in emulated DOS.\n- When guest OS is booted, built-in driver gets disabled automatically.
dialog.template.auxdevice = PS/2 type
dialog.template.auxdevice.tooltip = Type of PS/2 mouse attached to the AUX port
dialog.template.mouserawinput = Raw mouse input
dialog.template.mouserawinput.tooltip = Enable to bypass your operating system's mouse acceleration and sensitivity settings (enabled by default).\nWorks in fullscreen or when the mouse is captured in windowed mode.
dialog.template.mouseimmediate = Mouse immediate
dialog.template.mouseimmediate.tooltip = Update mouse movement counters immediately, without waiting for interrupt (disabled by default). May improve gameplay, might cause compatibility issues.
dialog.template.mousemultidisplayaware = Multi-display mouse behaviour
dialog.template.mousemultidisplayaware.tooltip = Allow seamless mouse behavior and mouse pointer release to work in fullscreen mode on systems with more than one display (enabled by default).\nNote: You should disable this if it incorrectly detects multiple displays when only one should actually be used. This might happen if you are\nusing mirrored display mode or using an AV receiver's HDMI input for audio-only listening.
dialog.template.mousereportrate = Reporting rate
dialog.template.mousereportrate.tooltip = Mouse reporting rate, or 0 for auto. This affects how often mouse events are reported to the guest through the mouse interrupt.\nSome games including CyClone need a lower reporting rate to function correctly. Auto mode allows the guest to change the report rate through the PS/2 mouse emulation.\nThis option does not affect any DOS game that uses polling through INT 33h to detect mouse movement.
dialog.template.mousewheelkey = Wheel to key
dialog.template.mousewheelkey.tooltip = Convert mouse wheel movements into keyboard presses such as arrow keys.\n0: disabled; 1: up/down arrows; 2: left/right arrows; 3: PgUp/PgDn keys.\n4: Ctrl+up/down arrows; 5: Ctrl+left/right arrows; 6: Ctrl+PgUp/PgDn keys.\n7: Ctrl+W/Z, as supported by text editors like WordStar and MS-DOS EDIT.\nPutting a minus sign in front will disable the conversion for guest systems.
dialog.template.tab.joystick = Joystick
dialog.template.joysticktype = Tipo
dialog.template.joysticktype.tooltip = Tipo de joystick que se emulará\:\nauto - selecciona el tipo de emulación dependiendo del joystick real (predeterminado)\nnone - desactiva la emulación del joystick\n2axis - soporta dos joysticks\n4axis - soporta un joystick (se usará el primero)\n4axis_2 - soporta un joystick (se usará el segundo)\nfcs (Thrustmaster)\nch (CH Flightstick)
dialog.template.timedemulation = Emulación Intervalos
dialog.template.timedemulation.tooltip = Habilitar intervalos para los ejes. Prueba con esta configuración, si tu joystick se mueve solo
dialog.template.autofire = Autodisparo
dialog.template.autofire.tooltip = Dispara continuamente mientras el botón esté presionado
dialog.template.swap34 = Intercambiar Ejes 3&&4
dialog.template.swap34.tooltip = Intercambiar los ejes 3 y 4, puede ser útil con ciertos joysticks
dialog.template.buttonwrapping = Activar button wrap
dialog.template.buttonwrapping.tooltip = Activar "button wrapping" con los botones emulados
dialog.template.calibratex = X-axis calibration
dialog.template.calibratex.tooltip = Apply X-axis calibration parameters from the hotkeys
dialog.template.calibratey = Y-axis calibration
dialog.template.calibratey.tooltip = Apply Y-axis calibration parameters from the hotkeys
dialog.template.calibratehotkeys = Realtime calibration
dialog.template.calibratehotkeys.tooltip = Enable hotkeys to allow realtime calibration of the joystick's X and Y axes
dialog.template.deadzone = Deadzone
dialog.template.deadzone.tooltip = The percentage of motion to ignore. 100 turns the stick into a digital one
dialog.template.circularinput = Circular input
dialog.template.circularinput.tooltip = Enable translation of circular input to square output. Try enabling this if your left analog stick can only move in a circle
dialog.template.joydeadzone = Deadzone joystick {0,number,integer} axis {1,number,integer}{2}
