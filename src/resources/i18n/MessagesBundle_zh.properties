database.error.olddatabase = 此数据库来自 DBGL 0.91 或更早版本，其旧格式 DBGL Extended Edition 无法打开。\n\n迁移方法：\n1. 将官方 DBGL 0.92（dbgl.org）解压到此 DBGL 文件夹，启动一次后再关闭。这会转换数据库。\n2. 然后再次将此更新解压到其上。\n\n没有任何更改：配置文件和数据库保持原样，副本位于“backups”文件夹中。
dialog.main.menu.windowtour = 为所有窗口截图（用于错误报告）...
