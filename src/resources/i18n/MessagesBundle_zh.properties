dialog.template.printerdpi = DPI 分辨率
dialog.template.printerdpi.tooltip = Resolution of printer (default 360)
dialog.template.printerheight = 纸张高度
dialog.template.printerheight.tooltip = Height of paper in 1/10 inch (default 110 = 11.0'')
dialog.template.printertimeout = 弹出超时
dialog.template.printertimeout.tooltip = If nonzero: the time in milliseconds the page will be ejected automatically after when no more data arrives at the printer
