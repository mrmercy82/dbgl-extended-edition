dialog.databasecleanup.title = 清理数据库
dialog.databasecleanup.info = 清理会整理配置文件字段所用的列表（开发商、发行商、类型、状态、自定义字段）：\n\n1. 仅空格或大小写不同的条目合并为一个（例如“Accolade, Inc.”出现两次，其中一次带有来自 MobyGames 的不换行空格）。\n2. 删除不再被任何配置文件使用的条目。\n3. 相似条目（“Sierra On-Line”与“Sierra Online”，“Strategy”与“Strategy/Tactics”）随后列出以供手动合并；默认不勾选任何项。\n\n配置文件本身、其设置文件、游戏时间、图片和存档都不会改变；配置文件最多只会改用保留条目的名称。
