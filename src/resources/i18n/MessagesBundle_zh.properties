dialog.template.printerdevice = Device
dialog.template.printerdevice.tooltip = Specify the Windows printer device to use. You can see the list of devices from the Help menu ('List printer devices')\nor the Status Window. Then make your choice and put either the printer device number (e.g. 2) or your printer name (e.g. Microsoft Print to PDF).\nLeaving it empty will show the Windows Print dialog (or '-' for showing once).
