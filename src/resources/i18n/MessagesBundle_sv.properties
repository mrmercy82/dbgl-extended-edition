dialog.template.mouseemu = Musemulering
dialog.template.mouseemu.tooltip = When is mouse emulated ?\nintegration: when not locked\nlocked: when locked\nalways: every time\nnever: at no time\nIf disabled, the mouse position in DOSBox-X is exactly where the host OS reports it.\nWhen using a high DPI mouse, the emulation of mouse movement can noticeably\nreduce the sensitiveness of your device, i.e. the mouse is slower but more precise.
dialog.template.mousecapture = Beteende vid musfångst
dialog.template.mousecapture.tooltip = Set the mouse capture behaviour:\nonclick: Capture the mouse when clicking any mouse button in the window (default)\nonstart: Capture the mouse immediately on start. Might not work correctly on some host operating systems\nseamless: Let the mouse move seamlessly between the DOSBox window and the rest of the desktop; captures only with middle-click or hotkey.\nSeamless mouse does not work correctly with all the games. Windows 3.1x can be made compatible with a custom mouse driver.\nnomouse: Hide the mouse and don't send mouse input to the game. For touch-screen control, use 'seamless'.
dialog.template.middleunlock = Lås upp med mittknapp
dialog.template.middleunlock.tooltip = Whether you can press the middle mouse button to unlock the mouse when the mouse has been locked.\nIf set to "manual", it works only with "autolock=false"; if set to "auto", it works only with "autolock=true".
dialog.template.mousemiddlerelease = Släpp med mittklick
dialog.template.mousemiddlerelease.tooltip = Release the captured mouse by middle-clicking, and also capture it in seamless mode (enabled by default)
dialog.template.autolockfeedback = Återkoppling vid automatisk låsning
dialog.template.autolockfeedback.tooltip = Autolock status feedback type, i.e. visual, auditive, none
dialog.template.usesystemcursor = Använd systemmarkör
