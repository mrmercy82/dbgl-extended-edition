dialog.databasecleanup.title = Pulisci database
dialog.databasecleanup.info = La pulizia riordina gli elenchi da cui scelgono i campi dei profili (sviluppatore, editore, genere, stato, campi personali):\n\n1. Le voci che differiscono solo per spazi o maiuscole diventano una (es. «Accolade, Inc.» due volte, una con uno spazio unificatore da MobyGames).\n2. Le voci che nessun profilo usa più vengono eliminate.\n3. Le voci simili («Sierra On-Line» e «Sierra Online», «Strategy» e «Strategy/Tactics») vengono poi mostrate per unirle a mano; all’inizio non è spuntato nulla.\n\nI profili stessi, i loro file di configurazione, tempi di gioco, immagini e salvataggi non cambiano; i profili ricevono solo il nome della voce che resta.
dialog.databasecleanup.backup = Fare prima un backup (database, profili, modelli, impostazioni) in {0}
