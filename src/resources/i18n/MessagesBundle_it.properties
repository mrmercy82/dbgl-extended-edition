database.error.olddatabase = Questo database proviene da DBGL 0.91 o precedente e ha un vecchio formato che DBGL Extended Edition non può aprire.\n\nEcco come trasferirlo:\n1. Decomprimere il DBGL 0.92 ufficiale (dbgl.org) in questa cartella di DBGL, avviarlo una volta e richiuderlo. Così il database viene convertito.\n2. Poi decomprimere di nuovo questo aggiornamento sopra.\n\nNon è stato modificato nulla: i profili e il database sono come prima, e una copia si trova nella cartella "backups".
dialog.main.menu.windowtour = Fotografa tutte le finestre (per le segnalazioni di errori)...
dialog.windowtour.confirm = DBGL apre le sue finestre una dopo l’altra, ne scatta un’immagine e le richiude ({0} finestre, circa due o tre minuti). Nulla viene salvato o modificato.\n\nNel frattempo non usare mouse e tastiera e non mettere altre finestre davanti.\n\nLe immagini mostrano ciò che c’è nelle finestre, compresi i nomi dei giochi e delle cartelle. Vengono messe in un file ZIP nella cartella "logs" di DBGL e non vengono inviate da nessuna parte.\n\nPer l’altro aspetto (chiaro o scuro): cambiarlo nelle impostazioni, riavviare DBGL e ripetere.\n\nIniziare ora?
