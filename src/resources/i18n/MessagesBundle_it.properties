dialog.welcome.p5.mobyfirst = Una parte è già fatta se nella pagina precedente hai usato «Completa profili...»: titoli e dati dal database MobyGames fornito con DBGL. Qui ne ottieni altri, o per i profili a cui manca ancora qualcosa, da Internet.
dialog.welcome.titles.title = Verifica i titoli
dialog.welcome.titles.text = Dati e copertine vengono cercati in base al titolo del profilo. Verificalo quindi per primo: i giochi importati spesso hanno ancora il nome della loro cartella o del programma («MI2», «WC2»).
dialog.welcome.titles.step1 = «Completa profili...» (in basso a sinistra, anche nel menu Profili e nel menu contestuale sotto Strumenti) mostra ogni profilo con un semaforo: verde trovato, giallo una proposta da verificare, rosso non trovato.
dialog.welcome.titles.step2 = Un doppio clic su un titolo lo cambia; viene subito cercato di nuovo.
dialog.welcome.titles.step3 = «Applica» inserisce per i profili spuntati titolo e dati del gioco; poi si possono cercare le copertine.
dialog.welcome.titles.note = I titoli vengono dal database MobyGames fornito con DBGL e dai file di testo dei giochi (README, FILE_ID.DIZ, etichetta del CD); non viene inviato nulla.
dialog.welcome.titles.button = Completa profili...
dialog.welcome.titles.button.tooltip = Titolo, dati e copertine per tutti i profili, in quest’ordine
dialog.welcome.p2.recommend = Consigliato: scaricare sia DOSBox Staging sia DOSBox-X. Insieme eseguono quasi tutti i giochi DOS; nell'importazione DBGL sceglie DOSBox-X dove un gioco ne ha bisogno, altrimenti DOSBox Staging.
dialog.welcome.p2.staging = DOSBox Staging: un DOSBox moderno e attivamente sviluppato, con buona immagine e buon suono fin dall'inizio. La prima scelta per la maggior parte dei giochi DOS.
dialog.welcome.p2.dosboxx = DOSBox-X: emula più hardware, fino a Windows 3.x e 95 e al PC-98. Aiuta con i giochi che DOSBox Staging non esegue.
dialog.welcome.p2.classic = DOSBox 0.74-3: il DOSBox originale del 2019, incluso in DBGL. Esegue ancora molti giochi, ma non viene più sviluppato.
dialog.welcome.import.known = Giochi noti...
dialog.welcome.import.known.info = riconosciuti dai loro file: titolo, anno e programmi compilati
dialog.welcome.p6.title = Copertine da Internet
dialog.welcome.p6.text = Per le copertine si consiglia TheGamesDB.net: gratuito, senza registrazione, con fronte e retro di molti giochi DOS. Anche altre fonti di immagini si possono scegliere nelle impostazioni di DBGL.
dialog.welcome.p6.single = Un gioco: modificare il profilo, scegliere TheGamesDB.net con la freccia accanto al pulsante del database nella pagina Info, fare clic sul pulsante e scegliere il gioco giusto; le sue immagini si possono riprendere insieme.
dialog.welcome.p6.batch = Più giochi: il pulsante in basso a sinistra (anche nel menu Profili) cerca le copertine di tutti i profili senza immagini; si sceglie quali salvare.
dialog.welcome.p6.note = Anche qui la ricerca avviene per titolo del profilo, quindi un titolo preciso aiuta. Guardare le copertine prima di salvarle.
dialog.welcome.p4.next = Come continuare:
dialog.welcome.p4.next1 = Un gioco si avvia con un doppio clic o Invio; il suo programma di installazione (scheda audio, controlli) si avvia dalla barra degli strumenti.
dialog.welcome.p4.next2 = Modificando un profilo si cambiano le impostazioni DOSBox di un gioco; il controllo dei profili (barra degli strumenti) trova i problemi di tutti i profili e propone soluzioni.
dialog.welcome.p4.next3 = Dati e copertine si ottengono come descritto nelle pagine precedenti.
dialog.welcome.p4.next4 = La modalità TV (F11) mostra i giochi come grandi copertine, da giocare con tastiera o controller.
dialog.welcome.p5.title = Informazioni sui giochi da Internet
dialog.welcome.p5.text = DBGL può riprendere i dati di un gioco (sviluppatore, editore, anno, genere, descrizione) da database. Consigliato: il Metropolis Launcher MobyGames Database. È incluso in DBGL e funziona senza internet, chiave o registrazione (dati di MobyGames del 2021); altri database si possono scegliere nelle impostazioni di DBGL.
dialog.welcome.p5.howto = Come si fa:
dialog.welcome.p5.single = Un gioco: modificare il profilo, fare clic sul pulsante del database nella pagina Info (la freccia accanto sceglie il database) e scegliere il gioco giusto nell'elenco.
dialog.welcome.p5.multi = Più giochi: selezionare i profili, modificarli, attivare il pulsante del database e fare clic su OK. Ogni profilo viene cercato con il proprio titolo; viene ripreso solo un risultato univoco, gli altri sono elencati nel registro.
dialog.welcome.p5.coversonly = Solo copertine: il pulsante in basso a sinistra, anche nel menu Profili. Cerca le copertine dei profili senza immagini; si sceglie quali salvare.
dialog.welcome.p5.note = La ricerca avviene per titolo del profilo: più è vicino al vero titolo del gioco (ad es. "Monkey Island 2: LeChuck's Revenge" invece di "MI2"), migliori sono i risultati. Giochi con lo stesso nome o altre versioni possono comunque dare dati errati; controllare ciò che è stato ripreso.
dialog.welcome.p5.covers = Cerca copertine...
dialog.welcome.p5.covers.tooltip = Cerca le copertine dei profili senza immagini (come nel menu Profili).
dialog.welcome.title = Procedura guidata iniziale
dialog.welcome.p1.title = Benvenuto in DBGL Extended Edition
dialog.welcome.p1.text = Questi passaggi preparano DBGL per iniziare. Tutto può essere modificato in seguito nelle impostazioni.
