dialog.checkprofiles.export = Esporta per lo sviluppatore...
dialog.checkprofiles.export.tooltip = I risultati di questo controllo con i file di configurazione dei profili, da inviare allo sviluppatore di DBGL (es. nel thread di Vogons). Le sue cartelle, il suo nome utente e il nome del computer vengono sostituiti; note, link e campi personali sono omessi. Vede tutto il testo prima di salvarlo
dialog.checkprofiles.export.title = Esportazione per lo sviluppatore (anonima): la controlli prima di inviarla
dialog.checkprofiles.runpcap = Nota: all’ultimo avvio DOSBox-X ha segnalato che manca WinPcap per la scheda di rete (NE2000): senza la rete non funziona. Con [ne2000] backend = slirp non serve WinPcap (basta per internet e la maggior parte dei giochi, non per una LAN con altri computer)
dialog.checkprofiles.runmkdir = Nota: all’ultimo avvio DOSBox non ha potuto creare una cartella (accesso negato): forse non può scrivere nella cartella di DOSBox o del gioco (protezione da scrittura, cartella protetta, accesso controllato alle cartelle di Windows)
dialog.checkprofiles.runbadvalue = Nota: all’ultimo avvio DOSBox non ha accettato il valore «{0}» per {1} (usa il suo predefinito); il valore viene dal profilo o dal file di configurazione di DOSBox
dialog.checkprofiles.runbadvaluedb = Avviso: all’ultimo avvio DOSBox non ha accettato il valore «{0}» per {1} (usa il suo predefinito); il valore è nel file di configurazione della versione di DOSBox, non nel profilo: {2}
dialog.checkprofiles.runmt32 = Nota: all’ultimo avvio DOSBox non ha trovato le ROM del Roland MT-32/CM-32L e ha suonato la musica con il MIDI di Windows (altri suoni, spesso strumenti sbagliati). Le ROM (MT32_CONTROL.ROM e MT32_PCM.ROM, o CM32L_CONTROL.ROM e CM32L_PCM.ROM) vanno in una di queste cartelle: {0}
dialog.checkprofiles.stagingprimaryconf = Nota: DOSBox Staging legge anche la propria configurazione nella sua cartella utente, prima di quella di DBGL ({1}); per la versione di DOSBox intitolata «{0}» vale da lì, dove il profilo non imposta altro: {2}. Per escluderla: Impostazioni, «Avvia DOSBox Staging senza la configurazione della cartella utente»
dialog.settings.noprimaryconf = Avvia DOSBox Staging senza la configurazione della cartella utente
