dialog.template.buttonwrapping = Duplicazione pulsanti
dialog.template.buttonwrapping.tooltip = Permette l'assegnazione multipla di determinati pulsanti se il tuo \njoystick possiede dei pulsanti aggiuntivi non utilizzati
