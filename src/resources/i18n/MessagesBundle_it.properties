dialog.coverbatch.repeat = Con molti profili: i database dei giochi rispondono solo a un numero limitato di richieste alla volta (IGDB il minimo), quindi DBGL prende al massimo {0,number,integer} profili alla volta. Poi ripeti semplicemente: i profili che hanno allora una copertina restano fuori, seguono gli altri.
