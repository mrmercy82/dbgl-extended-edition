dialog.main.svnmac.offer = DBGL per macOS include ora DOSBox SVN r4484, compilato, firmato e notarizzato da Dominus.\n\nPerché passare da DOSBox 0.74-3:\n- funziona in modo nativo sui Mac con Apple Silicon, senza Rosetta (che Apple rimuove in gran parte da macOS 28)\n- nessun arresto a schermo intero (Alt+Invio) sui macOS recenti\n- molte correzioni dell’emulazione dal 2019\n\nDBGL deve aggiungere DOSBox SVN come versione di DOSBox e renderla predefinita? DOSBox 0.74-3 resta registrato. Si può fare anche più tardi con «{0}».
dialog.main.svnmac.switch = {0,number,integer} profili usano {1}. Passarli ora a DOSBox SVN?\n\nCosa cambia:\n- Quasi tutte le impostazioni restano come sono. DBGL le converte e mostra ogni modifica prima di salvare qualcosa.\n- gusrate viene tolto (DOSBox SVN non lo prevede); le nuove impostazioni del joystick deadzone e circularinput ricevono i valori predefiniti.\n- DOSBox SVN legge la mappatura dei tasti da mapper-SVN.map invece che da mapper-0.74-3.map: una mappatura propria di 0.74-3 va copiata o rifatta.\n- I salvataggi e i file dei giochi non vengono toccati.\n- Si può tornare indietro in ogni momento: «{2}» o «{3}».
