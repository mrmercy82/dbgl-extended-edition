dialog.template.serial1 = Seriale 1
dialog.template.serial.tooltip = Assegna il tipo di dispositivo connesso alla porta COM. Può essere\: \n\ndisabled (disattivato), dummy (posticcio), modem, nullmodem, directserial.\n\nParametri addizionali devono trovarsi nella stessa linea nella forma parametro\:valore.\nParametro comune a tutti i tipi è l'IRQ.\nPer directserial\: realport (richiesto), rxdelay (opzionale). (realport\:COM1 realport\:ttyS0).\nPer modem\: listenport (opzionale).\nPer nullmodem\: server, rxdelay, txdelay, telnet, usedtr, transparent, port, inhsocket (tutti opzionali).\nEsempio\: modem listenport\:5000
