dialog.complete.title = Completa profili
dialog.complete.info = In quest’ordine: 1. il titolo: ogni profilo viene cercato nel database MobyGames fornito con DBGL, altrimenti nei file di testo della sua cartella. Verde: trovato o il profilo ha già i dati; giallo: viene proposto un titolo, da verificare; rosso: niente trovato, fai doppio clic sul titolo per scrivere quello giusto. 2. Per i profili spuntati si prendono il titolo proposto e i dati del gioco (sviluppatore, editore, anno, genere, descrizione), solo dove il profilo non li ha. 3. Poi, se desiderato, le copertine, cercate per titolo.
