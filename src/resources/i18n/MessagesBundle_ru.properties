dialog.template.ne2000backend.tooltip = The backend (either pcap or slirp is supported) used for the NE2000 Ethernet emulation.\nIf set to "auto", then "slirp" is selected when available, otherwise "pcap" is selected when available.\nNE2000 Ethernet emulation will be disabled if no backend is available (or the specified backend if unavailable).
