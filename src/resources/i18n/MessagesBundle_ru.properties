dialog.template.serial.tooltip = Установить тип устройства на com-порту. Может быть disabled, dummy, modem, nullmodem, directserial.\nДополнительные параметры должны быть в той же строке в виде параметр\:значение.\nПараметр для всех типов – irq. Также\nдля directserial\: realport (обязательный), rxdelay (опциональный). (realport\:COM1 realport\:ttyS0).\nдля modem\: listenport (опциональный).\nдля nullmodem\: server, rxdelay, txdelay, telnet, usedtr, transparent, port, inhsocket (все опциональные).\nПример\: modem listenport\:5000
