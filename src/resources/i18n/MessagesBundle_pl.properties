dialog.template.set = Ustaw
dialog.template.set.tooltip = Przypisz wybraną wersję DOSBox: zachowane zostaną tylko twoje własne zmiany, wszystkie pozostałe ustawienia pochodzą z konfiguracji tej wersji DOSBox (dzieje się to też automatycznie po kliknięciu OK)
dialog.template.switch = Zachowaj wszystko
dialog.template.switch.tooltip = Przypisz wybraną wersję DOSBox i zachowaj wszystkie bieżące wartości, także te pochodzące z ustawień domyślnych poprzedniej wersji DOSBox
dialog.template.reloadsettings = Odśwież ustawienia
