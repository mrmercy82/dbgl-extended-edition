dialog.template.freesizecap = Freesize cap
dialog.template.freesizecap.tooltip = If set to "cap" (="true"), the value of MOUNT -freesize will apply only if the actual free size is greater than the specified value.\nIf set to "relative", the value of MOUNT -freesize will change relative to the specified value.\nIf set to "fixed" (="false"), the value of MOUNT -freesize will be a fixed one to be reported all the time.
