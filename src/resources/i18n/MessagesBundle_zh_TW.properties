dialog.template.mixer = 混音器
dialog.template.mixer.tooltip = Allow the Sound Blaster mixer to modify volume levels.\nSound Blaster Pro 1 and later cards allow programs to set the volume of the digital audio (DAC), FM synth, and CD Audio output.\nThese correspond to the SB, OPL, and CDAUDIO DOSBox mixer channels, respectively.\non: The final level of the above channels is a combination of the volume set by the program, and the volume set in the DOSBox mixer.\noff: Only the DOSBox mixer determines the volume of these channels.\nNote: Some games change the volume levels dynamically (e.g., lower the FM music volume when speech is playing); it's best to leave 'sbmixer' enabled for such games.
