dialog.template.parallel1 = Paralelo 1
dialog.template.parallel1.tooltip = Seleccionar el tipo de dispositivo conectado al puerto (LPT). Las opciones son:\nreallpt (envía datos directamente al puerto LPT),\nfile (graba los datos en un archivo o los pasa a un dispositivo),\nprinter (impresora matricial emulada, ver sección [printer])\ndisney (emular Disney Sound Sourceen este puerto)\nLos parámetros adicionales tienen que estar en la misma línea en formato parámetro:valor.
