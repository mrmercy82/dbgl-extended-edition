dialog.template.voodoomemsize.tooltip = Especifica la memoria de vídeo para gráficos 3dfx Voodoo, 4 o 12 MB.\nLa memoria es utilizada por el Frame Buffer Interface (FBI) y la Texture Mapping Unit (TMU) de la manera siguiente:\n4: 2 MB para el FBI y una para la TMU con 2 MB (por defecto).\n12: 4 MB para el FBI 1x4 MB para cada TMU.
dialog.template.voodoomaxmem = Memoria máx. Voodoo
