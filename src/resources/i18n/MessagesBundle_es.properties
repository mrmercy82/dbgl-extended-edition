dialog.template.tab.mt32 = Roland MT-32
dialog.template.mt32.model = Modelo
dialog.template.mt32.model.tooltip = El modelo de Roland MT-32/CM-32ML a emular. Es necesario tener los archivos ROM para el modelo seleccionado (ver "romdir").
dialog.template.mt32.dac = Tipo de DAC
dialog.template.mt32.dac.tooltip = Emulación del modo input del DAC de la MT-32\nAgradable = 0 - valor por defecto, produce muestras de sonido al doble de volumen, sin emplear trucos. Ofrece mejor calidad que los dispositivos originales\nPuro = 1, produce muestras exactamente iguales a las del chip LA32. Tiene mejor distorsión que los hacks del DAC y es el modo menos propenso a sobrecargarse. Emplea la mitad de volumen que los demás modos. Perfecto para desarrolladores :)\nGENERATION1 = 2, Reordena los bits de salida del chip LA32 tal como hacían los primeros modelos de la MT-32 (de acuerdo con Wikipedia).\nGENERATION2 = 3, Reordena los bits de salida del chip LA32 tal como hacían los siguientes modelos (confirmado personalmente con mi propia CM-32L - KG).
dialog.template.mt32.romdir = Carpeta de ROMs MT-32
dialog.template.mt32.romdir.tooltip = Nombre de la carpeta donde se encuentran los archivos ROM de Control y PCM de la MT-32. La emulación requiere esos archivos.
dialog.template.mt32.rate = Frecuencia
dialog.template.mt32.rate.tooltip = Frecuencia para la emulación de MT-32
dialog.template.mt32.gain = Ganancia de salida
dialog.template.mt32.gain.tooltip = Ganancia de salida para la emulación de MT-32 en porcentaje, 100 es el valor por defecto.
dialog.template.mt32.analog = Modo de salida analógica
dialog.template.mt32.analog.tooltip = Modo de emulación de la salida analógica de la MT-32.\nDigital = 0, Sólo se emula la parte digital. Las muestras de salida corresponden a la salida digital en la entrada del DAC. Es el modo más rápido.\nCoarse = 1, Emulación cruda del circuito LPF. Las frecuencias altas se enfatizan, la frecuencia no sufre cambios. Suena algo mejor pero también es algo más lenta.\nAccurate = 2 - por defecto, emulación minuciosa del circuito LPF. La señal de salida se resamplea a 48 kHz para emular los sonidos audibles a 16 kHz, que pasan a través del circuito LPF sin apenas atenuarse. La emulación es más fiel a la salida analógica del hardware real pero también más lenta que los modos 0 y 1.\nOversampled = 3, igual al modo 2 por defecto, pero la señal de salida se resamplea al doble de la frecuencia original, p. ej. la frecuencia final es 96 kHz. Es todavía más lento que el resto de modos pero retiene mejor las frecuencias altas antes de pasar a su vez por el mezclador de DOSBox.
dialog.template.mt32.chunk = Tamaño de los fragmentos
dialog.template.mt32.chunk.tooltip = Cantidad de milisegundos de datos a procesar a la vez. Incrementar este valor puede mejorar el rendimiento pero también puede incrementar la latencia. Sólo es válido para procesos en su propio hilo.
dialog.template.mt32.srcquality = Calidad SRC
dialog.template.mt32.srcquality.tooltip = Calidad de conversión de la frecuencia de la MT-32. El valor "0" corresponde a la conversión más rápida y el valor "3" corresponde a la conversión de mejor calidad. El valor por defecto es 2.
dialog.template.mt32.prebuffer = Tamaño del prebúfer
dialog.template.mt32.prebuffer.tooltip = Cantidad de milisegundos de datos a procesar con antelación. Incrementar este valor puede evitar que el búfer se quede vacío, pero puede incrementar la latencia. No puede ser menor que el valor mt32.chunk. Sólo es válido para procesos en su propio hilo.
dialog.template.mt32.niceampramp = Mejora de amplitud
dialog.template.mt32.niceampramp.tooltip = Activa el modo "Nice Amp Ramp" que mejora la amplitud para los instrumentos que suenan en intervalos largos. Los cambios rápidos de volumen en un canal pueden provocar saltos en el hardware original. Con el modo "Nice Amp Ramp" activado, estos cambios se producen de manera gradual. De lo contrario, la emulación es más fiel al original. El valor por defecto es activado.
