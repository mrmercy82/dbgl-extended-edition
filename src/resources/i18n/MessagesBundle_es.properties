dialog.template.sbwarmup = Calentamiento
dialog.template.sbwarmup.tooltip = Silencia el audio inicial por DMA al iniciar la tarjeta, en milisegundos (100 por defecto).\nEsto mitiga los pops escuchados en muchos juegos con sonido SB.\nReducir la cifra si faltan sonidos al principio de la reproducción.
dialog.template.sbenablespeaker = Activar altavoz
dialog.template.sbenablespeaker.tooltip = Inicia la máquina virtual DOS con el altavoz de la Sound Blaster activado.\nLas Sound Blaster Pro y anteriores tienen comando para activar/desactivarlo. Normalmente la tarjeta arranca con el altavoz desactivado.\nSi un juego o una demo DOS intenta emitir sonido sin activar el altavoz poner la opción en "true" para compensarlo.\nEsta opción no tiene efecto en tarjetas Sound Blaster 16.
