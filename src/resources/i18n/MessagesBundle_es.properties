dialog.template.windowresolution = Resolución en ventana
dialog.template.windowresolution.tooltip = Escalar la ventana a esta resolución si el sistema de vídeo lo permite
dialog.template.fullscreenresolution = Resolución en pantalla completa
dialog.template.fullscreenresolution.tooltip = Resolución a usar en el modo de pantalla completa: "original" o cantidad fija (p. ej. 1024x768)
dialog.template.scaler = Escalado
dialog.template.scaler.tooltip = Filtro de escalado usado con los modos de baja resolución. "Forzado" implica que se usará siempre, sin importar el resultado.
dialog.template.scalerforced = Forzado
dialog.template.scalerforced.tooltip = Si se marca, el escalado se aplicará incluso si el resultado no es el deseado.
dialog.template.doublebuffering = Doble búfer
