dialog.template.tab.network = Red
dialog.template.networkredirector = Redirección de redes
dialog.template.networkredirector.tooltip = Reporta como residente el redirector de redes de DOS. esto permitirá que el nombre del huésped sea devuelto excepto si el modo seguro está activado.\nTambién se puede acceder directamente a rutas de red UNC de la forma \\MACHINE\SHARE incluso si no están montados como unidades en sistemas Windows.\nPara un entorno redirector de redes completo hay que activar las opciones "ipx=true" en la sección [ipx] o bien "ne2000=true" en la sección [ne2000].
dialog.template.pcaprealnic = NIC real
dialog.template.pcaprealnic.tooltip = Especifica cuál de la interfaces de red del SO original se usará para pcap.\nEl comando "list" muestra una lista de dispositivos desde el menú Ayuda ("Listar interfaces de red") o desde la ventana de estatus.\nTras escoger una introducir su número (p. ej. 2) o una parte del nombre del adaptador (ej. VIA aquí).
dialog.template.pcaptimeout = Pausa de lectura
