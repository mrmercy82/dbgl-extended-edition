dialog.template.mpubase = Dirección base MPU-401
dialog.template.mpubase.tooltip = La dirección I/O de la unidad MPU-401.\nCon la opción 0 usa la dirección I/O por defecto.\nLos valores de 300h a 330h son para usarse en modo IBM PC.\nLos valores C0D0h a F8D0h son para usarse bajo modo PC-98 (MPU98).\nLos valores de 80D2h a 80DEh son para la emulación de Sound Blaster 16 MPU-401 en modo NEC PC-98.\nSi no hay ningún valor asignado (0), 330h es el valor por defecto para IBM PC y E0D0h el valor por defecto para PC-98.
