dialog.template.gusglobalregisterreadalias = Alias de registro GUS
dialog.template.gusglobalregisterreadalias.tooltip = Activado, todos los registros globales de la GUS tendrán un alias de lectura en N y N+0x80.\nDesactivado, sólo los registros de voz 0x0-0xF tendrán un alias de lectura 0x80-0x8F, tal y como consta en la documentación oficial.\nEn modo "auto", se decidirá automáticamente basándose en otros parámetros como el modelo de GUS.\nEsta opción puede ser necesaria para algunas demos para DOS de la demoscene que asumen un comportamiento de alias, como Out of Control de Contract.
