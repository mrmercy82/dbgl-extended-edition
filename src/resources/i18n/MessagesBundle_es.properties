dialog.template.aspectcorrection = Corregir relación de aspecto
dialog.template.aspectcorrection.tooltip = Aplicar corrección de aspecto. Si el sistema de vídeo elegido no soporta esta resolución pueden producirse ralentizaciones
dialog.template.frameskip = Frameskip
dialog.template.frameskip.tooltip = Número de fotogramas que omitirá DOSBox por cada uno mostrado
dialog.template.glshader = Sombreador GLSL
dialog.template.glshader.tooltip = Especifica un sombreador con emulación de monitor CRT o un sombreador GLSL corriente en los modos OpenGL.
dialog.template.pixelshader = Sombreador de píxel
dialog.template.pixelshader.tooltip = Especifica un sombreador de pixel Direct3D (que debe colocarse en la carpeta Shaders).\nSi se añade el comando "forced", el sombreador de pixel se utilizará aunque el efecto no sea el deseado.
dialog.template.texturerenderer = Render de texturas
dialog.template.texturerenderer.tooltip = Driver de render utilizado en el modo de salida "texture" ("auto" por defecto).
dialog.template.maximize = Maximizar ventana
dialog.template.maximize.tooltip = Si se activa la ventana de DOSBox-X se maximizará al iniciar (solamente en las builds SDL2 y SDL1 para Windows; emplear pantalla completa para la salida TTF)
dialog.template.videodriver = Driver de vídeo
dialog.template.videodriver.tooltip = Fuerza un driver de vídeo (p. ej. windib/windows, directx, x11, fbcon, dummy, etc.) para su uso con la librería SDL
dialog.template.dpiaware = Alerta DPI
dialog.template.dpiaware.tooltip = Esta opción ("auto" por defecto) indica al SO principal que DOSBox-X tendrá en cuenta la opción DPI.\nSi no está activada, Windows Vista/7/8/10 pueden reescalar la ventana de DOSBox-X\nen monitores con resoluciones altas, lo que probablemente no es un comportamiento deseado.
dialog.template.windowposition = Posición de la ventana
dialog.template.windowposition.tooltip = Especifica la posición inicial de DOSBox-X en modo ventana:\n auto: Que el gestor de ventanas escoja la posición (por defecto).\nX,Y: fija la posición en formato X,Y (p. ej., 250,100). 0,0 es el borde superior izquierdo de la pantalla.
dialog.template.windowpositionx = Posición de la ventana
dialog.template.windowpositionx.tooltip = Especifica la posición de la ventana al arrancar en el formato X,Y (p. ej.: 1300,200).\nLa ventana estará centrada con el valor "," (o  ninguno), y quedará en su posición original con "-".
dialog.template.aspectratio = Relación de aspecto
dialog.template.aspectratio.tooltip = Especifica la relación de aspecto (p. ej. 16:9) si la corrección de relación está activada.\n0:0 significa una relación de aspecto de 4:3, y -1:-1 especifica la relación original.
dialog.template.overscan = Overscan
dialog.template.overscan.tooltip = Anchura del borde del overscan para la salida "surface"
dialog.template.integerscaling = Escalado integral
dialog.template.integerscaling.tooltip = Limita el factor de escalado horizontal o vertical al mayor valor integral para que la imagen quepa en el monitor.\nSe mantiene siempre la relación de aspecto de acuerdo a las opciones "aspecto" y "monitor",\nlo que puede resultar en un valor no integral en la otra dimensión. Si la imagen es más grande que el monitor,\nla limitación queda desactivada (lo mismo que con "off").
dialog.template.autofit = Ajustar a la pantalla
dialog.template.autofit.tooltip = Mejor ajuste de imagen a la ventana. Para usar con las opciones salida=direct3d, fullresolution=original, aspecto=true
dialog.template.viewport = Monitor
dialog.template.viewport.tooltip = Especifica la resolución del monitor (la máxima zona disponible). La salida de vídeo siempre se limita al área del monitor\naún teniendo en cuanta la relación de aspecto.
dialog.template.windowdecorations = Ventanas con decoración
dialog.template.windowdecorations.tooltip = Activa la decoración en las ventanas (activado por defecto)
dialog.template.vsyncmode = Modo de V-Sync
dialog.template.vsyncmode.tooltip = Especifica la sincronización vertical del driver de vídeo (V-Sync) modo:\nauto: Limita el V-Sync a los casos beneficiosos, como al usar interpolarización VRR en pantalla completa (por defecto).\non: Activa V-Sync. Esto evitará errores gráficos en algunos juegos pero afecta al rendimiento o provoca caídas de FPS si la tasa de refresco del DOS excede a la del SO principal (p. ej. 70 Hz en DOS y 60 Hz en el OS principal).\nadaptive: Activa V-Sync cuando la tasa de refresco es más alta que la del SO principal, pero lo desactiva si la cifra de FPS baja a cifras inferiores a las del SO principal.\nEs una alternativa razonable bajo macOS en lugar de "on". Nota: sólo es válido con los modos de salida de vídeo OpenGL; de lo contrario actúa como en "on".\noff: Intenta desactivar V-Sync para aumentar la tasa de FPS aunque puede provocar errores gráficos en algunos juegos.\nyield: Ceder el control de la sincronización vertical al driver de vídeo del sistema.
dialog.template.vsyncrate = Frecuencia de V-Sync
dialog.template.vsyncrate.tooltip = Tasa de V-Sync cuando está activado. Valor ignorado si la opción es ceder el control al SO principal (win32).
dialog.template.vsyncskip = Salto de V-Sync
dialog.template.vsyncskip.tooltip = Número de microsegundos con la imagen bloqueada antes de omitir el siguiente fotograma.\nPor ejemplo, un valor de 7000 casi la mitad de un fotograma a 70 Hz.\n0 desactiva la opción y siempre muestra el fotograma (por defecto).
dialog.template.hostrefreshrate = Tasa de refresco
dialog.template.hostrefreshrate.tooltip = Especifica la tasa de refresco del SO principal:\n auto: Usar valores SDI, o valores VRR en modo de pantalla completa con una frecuencia de refresco alta (por defecto).\nsdi: Usar valores Serial Device Interface (SDI), sin más ajustes.\nvrr: Restar 3 Hz de la cifra reportada (la mejor opción para pantallas VRR).\nN: Especificar un valor en Hz (se admiten decimales; 23.000 es el valor mínimo).
dialog.template.framepresentationmode = Modo de presentación de fotograma
dialog.template.framepresentationmode.tooltip = Especifica el modo de presentación de cada fotograma:\nauto: Evita los cuellos de botella, basándose en las tasas de refresco del OS principal y del DOS (por defecto).\ncfr: Visualiza siempre los fotogramas bajo DOS a una velocidad constante.\nvfr: Visualiza siempre los fotogramas bajo DOS a una velocidad variable.
dialog.template.transparency = Transparencia
dialog.template.transparency.tooltip = Valor de la transparencia de la ventana de DOSBox Staging (0 por defecto).\nAdmite valores desde 0 (ninguna transparencia) a 90 (alta transparencia).
dialog.template.displayno = Número de monitor
dialog.template.displayno.tooltip = Número de monitor, para equipos con más de una pantalla (0 = por defecto)
dialog.template.doublescan = Doublescan
dialog.template.doublescan.tooltip = Si se activa este modo de salida se emitirán dos scanlines por cada línea original, imitando a una salida VGA original (320x200 se visualiza como 640x400, por ejemplo).\nSi la salida con doublescan se visualiza a la resolución nativa (320x200 como 320x200).\nEsto afecta al ráster ANTES que los filtros de escalado por software o hardware. Activar esta opción puede afectar al funcionamiento de estos filtros.\nEn esos casos hay que desactivar esta opción. Para un escalado pixel-perfect (output=openglpp) es recomendable desactivar esta opción.
dialog.template.screensaver = Salvapantallas
dialog.template.screensaver.tooltip = Usar "permitir" o "bloquear" para ignorar la variable SDL_VIDEO_ALLOW_SCREENSAVER\nque normalmente bloquea el salvapantallas del SO principal mientras se ejecuta el emulador ("auto" por defecto).
dialog.template.euro = Símbolo del euro
dialog.template.euro.tooltip = Mostrar el símbolo del euro en lugar de su carácter ASCII (33-255).\nPor ejemplo, un valor de 128 hace que se muestre el símbolo del euro en lugar de C-cedilla.
dialog.template.char9 = Fuentes de 9 píxeles
dialog.template.char9.tooltip = Permite usar fuentes de 9 píxeles de ancho en lugar de fuentes de 8 píxeles
dialog.template.tab.ttf = Fuente TrueType (TTF)
dialog.template.ttf.bold = Negrita
dialog.template.ttf.bold.tooltip = Si se activa DOSBox-X mostrará texto en negrita (requiere especificar un procesador de texto) en su salida TTF.\nSe puede especificar una fuente en negrita con la opción fontbold o bien convertir la fuente en negrita automáticamente.
dialog.template.ttf.font = Fuente
dialog.template.ttf.font.tooltip = Especifica una fuente TrueType en su salida TTF. Si no especifica otra, se empleará la fuente TrueType por defecto.\nSe puede especificar un nombre de fuente o su ruta completa. Si el archivo tiene extensión .TTF esta se puede omitir.\nCon un nombre de fuente o una ruta relativa, se buscará el archivo en la carpeta de trabajo y en la carpeta de fuentes del sistema.\nPor ejemplo, especificando "consola" o "consola.ttf" se usará la fuente Consola (incluida en Windows); Lo mismo ocurrirá con otras fuentes TTF.\nAdemás, las fuentes OTF (p. ej. OratorStd.otf), las fuentes .FON (p. ej. vgasys.fon), y fuentes .TTC (p. ej. msgothic.ttc) también están soportadas.\nPara mostrar texto chino/japonés/coreano con estas condiciones es necesaria una fuente con caracteres CJK (p. ej. GNU Unifont o Sarasa Gothic).
dialog.template.ttf.italic = Cursiva
dialog.template.ttf.italic.tooltip = Si se activa DOSBox-X mostrará texto en negrita (requiere especificar un procesador de texto) en su salida TTF.\nSe puede especificar una fuente en cursiva con la opción fontital o bien inclinar la fuente automáticamente.
dialog.template.ttf.fontbold = Fuente en negrita
dialog.template.ttf.fontbold.tooltip = Opcionalmente se puede seleccionar una fuente TrueType para usar con la salida TTF que mostrará el texto en negrita.\nRequiere especificar un procesador de texto con la opción wp, y esta fuente en negrita se empleará para este estilo.\nPor ejemplo, especificar "consolab" o "consolab.ttf" usará la fuente Consolab; y lo mismo para otras fuentes TTF.
dialog.template.ttf.underline = Subrayado
dialog.template.ttf.underline.tooltip = Si se activa DOSBox-X mostrará texto subrayado (requiere especificar un procesador de texto) en su salida TTF.
dialog.template.ttf.fontital = Fuente en cursiva
dialog.template.ttf.fontital.tooltip = Opcionalmente se puede seleccionar una fuente TrueType para usar con la salida TTF que mostrará el texto en cursiva.\nRequiere especificar un procesador de texto con la opción wp, y esta fuente en cursiva se empleará para este estilo.\nPor ejemplo, especificar "consolai" o "consolai.ttf" usará la fuente Consolai y lo mismo para otras fuentes TTF.
dialog.template.ttf.strikeout = Tachado
dialog.template.ttf.strikeout.tooltip = Si se activa DOSBox-X mostrará texto tachado (requiere especificar un procesador de texto) en su salida TTF.
dialog.template.ttf.fontboit = Fuente en negrita y cursiva
dialog.template.ttf.fontboit.tooltip = Opcionalmente se puede seleccionar una fuente TrueType para usar con la salida TTF que mostrará el texto en negrita y cursiva.\nRequiere especificar un procesador de texto con la opción wp, y esta fuente en negrita y cursiva se empleará para estos estilos.\nPor ejemplo, especificar "consolaz" o "consolaz.ttf" usará la fuente Consolaz; y lo mismo para otras fuentes TTF.
dialog.template.ttf.righttoleft = De derecha a izquierda
dialog.template.ttf.righttoleft.tooltip = Si se activa DOSBox-X mostrará texto de nada derecha a izquierda en lugar de izquierda a derecha en su salida TTF.\nEsto resulta especialmente útil para lenguas que se escriben en este formato (como el árabe o el hebreo).
dialog.template.ttf.blinkc = Cursor parpadeante
dialog.template.ttf.blinkc.tooltip = Si se activa el cursor parpadeará en su salida TTF; desactivado dejará de parpadear.\nTambién se puede cambiar la velocidad de parpadeo con una cifra de entre 1 (más rápido) y 7 (más lento), o 0 para no ver el cursor.
dialog.template.ttf.printfont = Usar fuente para imprimir
dialog.template.ttf.printfont.tooltip = Si se activa DOSBox-X usará la actual fuente TrueType (escogida a través de la opción Fuente) para imprimir además de para mostrar en pantalla
dialog.template.ttf.colors = Esquema de colores
dialog.template.ttf.colors.tooltip = Especifica un esquema de colores para la salida TTF proporcionando los 16 valores de color en formato RGB: (r,g,b) o hexadecimal como en HTML: #RRGGBB\nLos colores originales del DOS son (0-15): #000000 #0000aa #00aa00 #00aaaa #aa0000 #aa00aa #aa5500 #aaaaaa #555555 #5555ff #55ff55 #55ffff #ff5555 #ff55ff #ffff55 #ffffff\n y en escala de grises: (0,0,0)  #0e0e0e  (75,75,75) (89,89,89) (38,38,38) (52,52,52) #717171 #c0c0c0 #808080 (28,28,28) (150,150,150) (178,178,178) (76,76,76) (104,104,104) (226,226,226) (255,255,255)\nEl símbolo opcional "+" sirve para que el esquema predeterminado se mantenga al cambiar de salida.
dialog.template.ttf.autodbcs = DBCS Auto
dialog.template.ttf.autodbcs.tooltip = Si está activado DOSBox-X permite usar caracteres chinos/japoneses/coreanos de doble bit cuando sus respectivas páginas de códigos están activadas por defecto.\nSólo es aplicable con las páginas DBCS (932: japonés, 936: chino simplificado; 949: coreano; 950: chino tradicional)\nEsto afecta a los caracteres mostrados en pantalla y para imprimir (véase la sección [Imprimir] para más detalles).
dialog.template.ttf.winperc = Porcentaje de ventana
dialog.template.ttf.winperc.tooltip = Especifica el procentaje de ventana para la salida TTF output (100 = pantalla completa). Ignorado si se ha especificado el valor ptsize.
dialog.template.ttf.gbk = Extensión GBK
dialog.template.ttf.gbk.tooltip = Activa la extensión GBK (además del juego de caracteres estándar GB2312) para la salida TTF en chino simplificado o la emulación de DOS/V
dialog.template.ttf.ptsize = Tamaño de la fuente en puntos
dialog.template.ttf.ptsize.tooltip = Especifica el tamaño de la fuente en puntos para la salida TTF. De especificarse (el mínimo es 9), se ignorará la opción winperc.
dialog.template.ttf.chinasea = Extensiones ChinaSea y Big5-2003
dialog.template.ttf.chinasea.tooltip = Activa las extensiones ChinaSea y Big5-2003 (además del juego de caracteres estándar Big5-1984) para la salida TTF en chino tradicional.\nNecesita una fuente TTF/OTF con esos caracteres (como la incluida SarasaGothicFixed) para mostrar correctamente los caracteres ChinaSea.
dialog.template.ttf.lins = Filas
dialog.template.ttf.lins.tooltip = Especifica el número de filas en la pantalla para la salida TTF (0 = por defecto)
dialog.template.ttf.dosvfunc = Control FEP
dialog.template.ttf.dosvfunc.tooltip = Si está activado activa el control FEP para las aplicaciones japonesas bajo DOS/V, y cambia los atributos del carácter a brillo alto.
dialog.template.ttf.cols = Columnas
dialog.template.ttf.cols.tooltip = Especifica el número de columnas en la pantalla para la salida TTF (0 = por defecto)
dialog.template.ttf.wp = Procesador de texto
dialog.template.ttf.wp.tooltip = Permite especificar un procesador de texto para la salida TTF y, opcionalmente, su número de versión.\nWP=WordPerfect, WS=WordStar, XY=XyWrite, FE=FastEdit están soportados, junto a su número de versión opcional.\nPor ejemplo, WP6 escoge como procesador a WordPerfect 6, y XY4 a XyWrite 4.\nBasándose en esto habrá nuevos estilos de texto y fuentes disponibles.
dialog.template.ttf.outputswitch = Cambiar salida
dialog.template.ttf.outputswitch.tooltip = Especifica la salida a la que cambiará DOSBox-X al pasar a modo gráfico, o "auto" para selección automática.
dialog.template.dos.version = Versión de DOS
dialog.template.dos.version.tooltip = Especifica la versión del DOS versión reportada (5.0 por defecto)
dialog.template.dosclipboardapi = Bloc de notas DOS
dialog.template.dosclipboardapi.tooltip = Si se activa, se pondrán en marcha las APIs de DOS para comunicar con el Bloc de notas de  Windows.\nCuidado: Activar estas APIs puede hacer que algunos programas crean estar funcionando bajo Windows.
dialog.template.dos.setverfile = Archivo de versiones
dialog.template.dos.setverfile.tooltip = Archivo con una lista de aplicaciones y versiones de DOS, separados con el tabulador, usado por SETVER.EXE como almacén
dialog.template.dosclipboarddevice = Bloc de notas
dialog.template.dosclipboarddevice.tooltip = Si se activa, se añadirá una instrucción DOS para permitir comunicación bidireccional con el bloc de notas compartido.\nLa opción "read" sólo permitirá acceso de lectura, y la opción "write" sólo permitirá acceso de escritura.\nLas opciones "full" o "true" permitirá ambos; la opción "false" o "disabled" impide el acceso completamente.\nEl nombre por defecto del bloc es CLIP$, pero puede cambiarse más abajo.
dialog.template.fat32setversion = Reportar siempre DOS como v7.0/7.10
dialog.template.fat32setversion.tooltip = Preguntar si DOSBox-X debe reportar automáticamente la versión del DOS como 7.0/7.10 cuando sea inferior a 7.0/7.10 al montar unidades LBA/FAT32.\nCon la opción "ask", una ventana emergente aparecerá para preguntar.
dialog.template.dosclipboarddevicename = Nombre del bloc de notas
dialog.template.dosclipboarddevicename.tooltip = Escoger un nombre DOS (de hasta 8 caracteres) para la comunicación bidireccional con el bloc de notas compartido.\nPor defecto se usará el nombre CLIP$ (p. ej. "TYPE CLIP$" muestra su contenido).\nLa opción no tiene ningún efecto si este bloc de notas está desactivado, y está desactivado en el modo seguro.
dialog.template.dos.localeperiod = Época informática
dialog.template.dos.localeperiod.tooltip = Especifica la época informática ("modern" por defecto). La opción intenta imitar el viejo comportamiento de DOS en algunos países al mostrar información como fechas, horas y números. La opción "modern" sigue las convenciones actuales para una experiencia más coherente con los SO actuales.
dialog.template.dos.country = Código de país DOS
dialog.template.dos.country.tooltip = Especifica el código de país ("auto" por defecto). Esto afecta a la información típica de cada país como la fecha, la hora y el uso de decimales. Con la opción "auto", se usará el código correspondiente al mapa de teclado.
dialog.template.dos.expandshellvar = Expandir variables de entorno
dialog.template.dos.expandshellvar.tooltip = Permite expandir variables de entorno como %PATH% en la línea de comandos del DOS (auto por defecto, activado si la versión de DOS  >= 7.0). FreeDOS y MS-DOS 7/8 soportan esta opción.
dialog.template.dos.shellhistoryfile = Historial de la línea de comandos
dialog.template.dos.shellhistoryfile.tooltip = Archivo que contiene el historial de la línea de comandos ("shell_history.txt" por defecto). Dejarlo en blanco desactiva esta opción.
dialog.template.longfilenames = Soporte para nombres de archivo largos
dialog.template.longfilenames.tooltip = Activa el soporte para nombres de archivo largos. Si se escoge "auto" (por defecto), el soporte estará activo si la versión reportada de DOS es 7.0 o superior.\nCon la opción "autostart", el comando VER no activará/desactivará este soporte según la versión reportada de DOS.
dialog.template.fileaccesstries = Intentos de acceso a archivos
dialog.template.fileaccesstries.tooltip = Si se introduce un número entero, DOSBox-X intentará leer/escribir/abrir archivos en unidades locales montadas\nese número de veces sin usar la caché antes de recurrir al sistema de Windows.\nPara programas de base de datos en red (p. ej. dBase, FoxPro, etc.), se recomienda introducir por ejemplo 3 para operaciones correctas.
dialog.template.quickreboot = Reinicio rápido
dialog.template.quickreboot.tooltip = Si se activa el DOS emulado se reiniciará sin necesidad de reiniciar la máquina virtual.
dialog.template.share = Share.exe
dialog.template.share.tooltip = Reporta SHARE.EXE como residente en memoria y provee funciones como cerrar archivos y registros,\naunque no todas las funciones de SHARE están emuladas.
dialog.template.doslogconsole = Registro de salida CON
dialog.template.doslogconsole.tooltip = Si se activa se guarda un registro de la actividad CON de DOS en un archivo de registro.\nLa opción "quiet" registra la salida CON DOS solamente (sin mensajes de debug).
dialog.template.autofixwarning = Aviso de archivo comprimido corrupto
dialog.template.autofixwarning.tooltip = Si se escoge "true" o "both", DOSBox-X mostrará mensajes mientras intenta solucionar el error "Archivo comprimido corrupto" error.\nCon las opciones "false" o "none", DOSBox-X no mostrará mensajes al detectar el error.\nCon las opciones "a20fix" o "loadfix", DOSBox-X solamente mostrará los mensajes relativos a a20fix o loadfix.
dialog.template.tab.configsys = Config.sys
dialog.template.configsys.shell = Shell
dialog.template.configsys.shell.tooltip = Especifica el intérprete de comandos (COMMAND.COM o 4DOS.COM)
dialog.template.configsys.dos = DOS
dialog.template.configsys.dos.tooltip = Informa si DOS ocupa la memoria HMA y gestiona la memoria UMB (de estar disponible)
dialog.template.configsys.fcbs = FCBS
dialog.template.configsys.fcbs.tooltip = Número de handles FCB disponibles para programas DOS (1-255). Utilizar 0 para una cifra razonable automática.
dialog.template.configsys.files = Archivos
dialog.template.configsys.files.tooltip = Número de handles de archivo FCB disponibles para programas DOS (8-255). Utilizar 0 para una cifra razonable automática.
dialog.template.configsys.country = País
dialog.template.configsys.country.tooltip = Código de país para formatos fecha/hora/decimales y opcionalmente páginas de código para salida TTF y archivos de lenguaje
dialog.template.configsys.lastdrive = Letra de unidad
dialog.template.configsys.lastdrive.tooltip = Letra de unidad más alta accesible
dialog.template.configsys.numlock = Bloq. Núm.
dialog.template.configsys.numlock.tooltip = Estado inicial de la tecla Bloq. Núm.
dialog.template.configsys.break = Break
dialog.template.configsys.break.tooltip = Activa o desactiva la comprobación de CTRL+C
dialog.template.configsys.setpath = Variable SET PATH
dialog.template.configsys.setprompt = Variable SET PROMPT
dialog.template.configsys.settemp = Variable SET TEMP
dialog.template.configsys.install = Install
dialog.template.configsys.installhigh = Installhigh
dialog.template.configsys.device = Device
dialog.template.configsys.devicehigh = Devicehigh
dialog.template.tab.dosv = DOS/V
dialog.template.dosvemu = Emulación de DOS/V
dialog.template.dosvemu.tooltip = Activa la emulación de DOS/V y especifica qué versión emular. Esta opción está ideada para juegos y programas\n asiáticos (China, Japón, Corea) que usan un juego de caracteres de dos bytes (DBCS) y la extensión de DOS/V para mostrar texto en japonés (jp), chino (chs/cht/cn/tw), o coreano (ko). Al activar DOS/V se reemplaza el modo texto de 80x25 caracteres con\n un modo gráfico EGA/VGA que emula el modo texto para mostrar estos caracteres y que puede ser incompatible con software occidental que\nasume acceso directo al modo texto a través del segmento 0xB800. Para un entorno DOS general con soporte para estos idiomas es mejor desactivar la emulación de DOS/V\ny usar la salida de fuentes TrueType (TTF) con una página de códigos china/japonesa/coreana (932, 936, 949, 950) y una fuente TTF con esos caracteres.
dialog.template.dosdbcs = Tabla DBCS
dialog.template.dosdbcs.tooltip = Activa la tabla DBCS y el soporte chino, japonés y coreano para la salida de fuentes TrueType font (TTF).\nCUIDADO: Algunos programas pueden fallar sin la tabla DBCS, incluyendo el instalador de Open Watcom.
dialog.template.dosvgetsysfont = Usar fuentes del sistema
dialog.template.dosvgetsysfont.tooltip = Si se activa DOSBox-X intentará usar las fuentes del sistema bajo Windows y Linux para la emulación de DOS/V.\nSi no puede hacerlo, DOSBox-X intentará usar una fuente interna japonesa para DOS/V, o se puede especificar una fuente distinta.
dialog.template.showdbcsnodosv = Caracteres DBCS con o sin DOS/V
dialog.template.showdbcsnodosv.tooltip = Permite mostrar caracteres japoneses, chinos o coreanos de páginas de código DBCS en máquinas VGA y EGA estándar sin emular DOS/V y en modo no-TTF.\nEn estos casos se usarán las fuentes de DOS/V, que pueden ajustarse en las opciones de más arriba (como fontxdbcs, fontxdbcs14, y fontxdbcs24).\nLa opción "auto" permite caracteres chinos/japoneses/coreanos cargando un archivo de lenguaje (o con la opción "autodbcs").
dialog.template.dosvyen = Símbolo del yen
dialog.template.dosvyen.tooltip = Permite usar el símbolo del yen si aparece en séptimo lugar en una tabla SBCS para la emulación del DOS/V japonés o JEGA
dialog.template.fepcontrol = FEP
dialog.template.fepcontrol.tooltip = Control de la API FEP para la emulación de DOS/V
dialog.template.vtext1 = Modo de pantalla V-text 1
dialog.template.vtext1.tooltip = Modo de pantalla V-text 1 para la emulación de DOS/V. Entrar el comando "VTEXT 1" para este modo.\nEl modo XGA/SXGA sólo está soportado en las máquinas svga_s3trio t svga_et4000.
dialog.template.vtext2 = Modo de pantalla V-text 2
dialog.template.vtext2.tooltip = V-text screen mode 2 para la emulación de DOS/V. Entrar el comando "VTEXT 2" para este modo.\nEl modo XGA/SXGA sólo está soportado en las máquinas svga_s3trio t svga_et4000.
dialog.template.dosvuse20pixelfont = Usa fuente de 20 píxeles
dialog.template.dosvuse20pixelfont.tooltip = Usa una fuente de 20 píxeles (en lugar de la original de 24) para la emulación del DOS/V japonés(con V-text activado)
dialog.template.j3100 = J-3100
dialog.template.j3100.tooltip = Junto a la opción dosv=jp y cualquier valor salvo "off" en esta opción, la máquina Toshiba J-3100 se emulará con soporte DCGA.\nLa opción "on" o "auto" inicia la máquina J-3100 automáticamente, y con la opción "manual" se puede acceder al modo J-3100 con el comando DCGA.
dialog.template.j3100type = Máquina J-3100 machine
dialog.template.j3100type.tooltip = Especifica el tipo de máquina J-3100 si el modo J-3100 está activado. La paleta de colores cambia según el tipo de máquina.
dialog.template.dosvj3100colorscroll = Scroll J-3100
dialog.template.dosvj3100colorscroll.tooltip = Especifica que la salida de color puede usarse para generar scroll, lo que es incompatible por ejemplo con la versión J-3100 de SimCity.\nLa versión VGA del Windows 3.1 de Toshiba funciona bien con el valor "false" de esta opción, mientras que la versión CGA/EGA requiere el valor "true".
dialog.template.dosvfontxsbcs = Fuente SBCS 8x19
dialog.template.dosvfontxsbcs.tooltip = Archivo de la fuente FONTX2 para generar los caracteres SBCS (8x19) en DOS/V o modo JEGA. Si no se especifica, se usará el archivo por defecto.\nCargar los archivos de fuente ASC16 y ASCFONT.15 (de los sistemas DOS UCDOS y ETen chinos) también sirven para el modo DOS/V.
dialog.template.dosvfontxsbcs16 = Fuente SBCS 8x16
dialog.template.dosvfontxsbcs16.tooltip = Archivo de la fuente FONTX2 para generar los caracteres SBCS (8x16) en DOS/V o modo JEGA. Si no se especifica, se usará el archivo por defecto.\nCargar los archivos de fuente ASC16 y ASCFONT.15 (de los sistemas DOS UCDOS y ETen chinos) también sirven para el modo DOS/V.
dialog.template.dosvfontxsbcs24 = Fuente SBCS 12x24
dialog.template.dosvfontxsbcs24.tooltip = Archivo de la fuente FONTX2 para generar los caracteres SBCS (12x24) en modo DOS/V (con V-text). Si no se especifica, se usará el archivo por defecto.\nCargar los archivos de fuente ASC24 y ASCFONT.24 (el último del sistema DOS ETen chino) también sirve para el modo DOS/V.
dialog.template.dosvfontxdbcs = Fuente DBCS 16x16
dialog.template.dosvfontxdbcs.tooltip = Archivo de la fuente FONTX2 para generar los caracteres DBCS (16x16) en DOS/V o modo VGA/JEGA. Si no se especifica, se usará el archivo por defecto.\nTambién se puede utilizar un archivo de fuente BDF o PCF (16x16 o 15x15), como las fuentes bitmap gratuitas de WenQuanYi (https://wenq.org/).\nPara DOS/V en chino simplificado, cargar el archivo de fuente HZK16 (https://github.com/aguegu/BitmapFont/tree/master/font) también sirve.\nPara DOS/V en chino tradicional, cargar el archivo de fuente STDFONT.15 del sistema DOS ETen Chino también sirve.
dialog.template.dosvfontxdbcs14 = Fuente DBCS 14x14
dialog.template.dosvfontxdbcs14.tooltip = Archivo de la fuente ONTX2 para generar los caracteres DBCS (14x14) para la Herramienta de Configuración o modo EGA. Si no se especifica, se usará el archivo por defecto.\nTambién se puede utilizar un archivo de fuente BDF o PCF (14x14 o 15x15), como las fuentes bitmap gratuitas de WenQuanYi (https://wenq.org/).\nPara DOS/V en chino simplificado, cargar el archivo de fuente HZK14 (https://github.com/aguegu/BitmapFont/tree/master/font) también sirve.\nPara DOS/V en chino tradicional, cargar el archivo de fuente STDFONT.15 del sistema DOS ETen Chino también sirve.
dialog.template.dosvfontxdbcs24 = Fuente DBCS 24x24
dialog.template.dosvfontxdbcs24.tooltip = Archivo de la fuente FONTX2 para generar los caracteres DBCS (24x24) en modo DOS/V (con V-text y fuentes de 24 píxeles activados).\nPara DOS/V en chino simplificado, cargar el archivo de fuente HZK24? (https://github.com/aguegu/BitmapFont/tree/master/font) también sirve.\npara DOS/V en chino tradicional, cargar el archivo de fuente STDFONT.24 del sistema DOS ETen Chino también sirve.
dialog.template.tab.system = Sistema
dialog.template.machine = Máquina
dialog.template.machine.tooltip = El tipo de máquina que DOSBox intenta emular
dialog.template.integrationdevice = Dispositivo de integración de DOSBox-X
dialog.template.integrationdevice.tooltip = Activa el dispositivo I/O de integración de DOSBox-X, una manera para que otros programas se comuniquen con DOSBox-X. Actualmente es una opción experimental.\nSe puede usar por ejemplo para reportar el estatus actual de DOSBox-X y para que el SO original ajuste la posición del puntero del ratón.
dialog.template.vmware = Integración con VMware
dialog.template.vmware.tooltip = Activa la interfaz de integración con VMware, incluyendo la integración del ratón\n(cuando se usa junto p. ej. el driver de ratón de VMware para Windows 3.x).
dialog.template.pc98256color = PC-98 con 256 colores
dialog.template.pc98256color.tooltip = En modo PC-98, permite seleccionar el modo de gráficos de 256 colores, y lo desactiva si no está seleccionado.
dialog.template.pc98anex86font = PC-98 con fuente Anex86
dialog.template.pc98anex86font.tooltip = En modo PC-98, especifica una fuente compatible con el emulador Anex86.\nPor defecto DOSBox-X intentará cargar los archivos FONT.ROM seguido de ANEX86.BMP y FREECG98.BMP.\nSi se especifica una fuente aquí se cargará primero, tal vez incluso antes que FONT.ROM.
dialog.template.pc9816color = PC-98 con 16 colores
dialog.template.pc9816color.tooltip = En modo PC-98, permite seleccionar el modo de gráficos de 16 colores, y lo desactiva si no está seleccionado.
dialog.template.pc98fmboard = PC-98 FM
dialog.template.pc98fmboard.tooltip = En modo PC-98, selecciona la tarjeta de música FM a emular
dialog.template.pc98grcg = PC-98 con aceleración de gráficos GRCG
dialog.template.pc98grcg.tooltip = En modo PC-98, permite gráficos acelerados GRCG, y los desactiva si no está seleccionado.
dialog.template.pc98busmouse = PC-98 bus de ratón
dialog.template.pc98busmouse.tooltip = Activa la emulación del bus de ratón en modo PC-98. Desactivar esta opción no desactiva la emulación de la INT 33h.
dialog.template.pc98egc = PC-98 con gráficos EGC
dialog.template.pc98egc.tooltip = Permite mostrar gráficos EGC (en modelos a partir de 1986), y los desactiva si no está seleccionado.
dialog.template.pc98forceibmkeyboard = PC-98 con teclado IBM
dialog.template.pc98forceibmkeyboard.tooltip = En modo PC-98, emplea un mapa de teclado parecido al IBM inglés americano.\nSólo funcionará con juegos y aplicaciones que accedan al teclado mediante la BIOS.
dialog.template.pc98fontrom = PC-98 ROM de fuente
dialog.template.pc98fontrom.tooltip = Si se activa DOSBox-X intentará cargar un archivo FONT.ROM como el generado por las T98Tools para la emulación de PC-98
dialog.template.pc98forcejiskeyboard = PC-98 con teclado JIS
dialog.template.pc98forcejiskeyboard.tooltip = En modo PC-98, emplea un mapa de teclado parecido al estándar japonés.\nSólo funcionará con juegos y aplicaciones que accedan al teclado mediante la BIOS.
dialog.template.pc98biosstring = PC-98 BIOS con copyright
dialog.template.pc98biosstring.tooltip = Si se activa la referencia al copyright de la BIOS aparecerá en E800:0000.\nEs necesario activar esta opción para los programas que diferencien entre máquinas PC-98 de NEC y Epson.
dialog.template.tab.cpu = CPU
dialog.template.core = Núcleo
dialog.template.core.tooltip = Núcleo de CPU emulado. "auto" usará "dynamic" si es posible.
dialog.template.cputype = CPU
dialog.template.cputype.tooltip = Tipo de CPU emulada. "auto" es la opción más rápida.
dialog.template.cycles = Ciclos
dialog.template.cycles.tooltip = Cantidad de instrucciones que DOSBox intenta emular cada milisegundo. Un valor demasiado alto provocará ralentizaciones. Los ciclos pueden configurarse de tres formas\:\n"auto" intenta adivinar el valor correcto. Suele funcionar bien pero no es infalible.\n"fixed + cifra concreta" fijará un número concreto de ciclos. Es la mejor opción cuando "auto" no funciona bien (Ejemplo\: fixed 4000)\n"max" ejecutará tantos ciclos como permita nuestra CPU.
dialog.template.up = Aumentar
dialog.template.up.tooltip = Cantidad de ciclos a aumentar con CTRL+F12. Con cifra inferior 100 se considera un porcentaje.
dialog.template.down = Disminuir
dialog.template.down.tooltip = Cantidad de ciclos a disminuir con CTRL+F11. Con cifra inferior 100 se considera un porcentaje.
dialog.template.cpucycles = Ciclos
dialog.template.cpucycles.tooltip = Velocidad de la CPU emulada ("3000" por defecto). Si "cpu_cycles_protected" emplea la opción "auto", esto fija los ciclos para los programas en modo real y modo protegido.\n<number>: Emula un número fijo por cada milisegundo (más o menos equivalente a MIPS). Los valores aceptados son desde 50 a 2000000.\nmax: Emular tantos ciclos como la CPU del sistema pueda calcular con un solo núcleo. El número de ciclos por milisegundo puede variar; esto puede causar problemas en algunos programas para DOS.\nNotas:\n- Seleccionar "max" o valores fijos demasiado altos para la CPU puede provocar ralentizaciones y caídas de sonido.\n- Para obtener los mejores resultados, es mejor seleccionar la cifra mínima de ciclos para que el programa funcione satisfactoriamente.
dialog.template.cpucyclesprotected = Modo protegido
dialog.template.cpucyclesprotected.tooltip = Velocidad para la CPU emulada, solamente para programas en modo protegido ("60000" por defecto).\nauto: Usar la opción "cpu_cycles". \n<number>: Emular un número fijo de ciclos por milisegundo (más o menos equivalente a MIPS). Los valores aceptados son desde 50 a 2000000.\nmax: Emular tantos ciclos como la CPU del sistema pueda calcular con un solo núcleo. El número de ciclos por milisegundo puede variar; esto puede causar problemas en algunos programas para DOS.
dialog.template.cputhrottle = Límite dinámico
dialog.template.cputhrottle.tooltip = Limita los ciclos de la CPU emulada si la CPU del sistema se queda atrás. Sólo afecta a la opción ciclos cuando se usa con un número fijo.\nSi está activado El número de ciclos por milisegundo puede variar; esto puede causar problemas en algunos programas para DOS.
dialog.template.fpuemulation = FPU
dialog.template.fpuemulation.tooltip = Activa la emulación de FPU
dialog.template.rdtscrate = Tasa de RDTSC
dialog.template.rdtscrate.tooltip = Si está a cero, el contador RDTSC de los Pentium usará esa cifra por milisegundo en lugar de una cifra de ciclos
dialog.template.dosidleapi = DOS sin foco
dialog.template.dosidleapi.tooltip = Si se activa DOSBox-X puede reducir la carga de la CPU cuando un programa pierda el foco
dialog.template.segmentlimits = Aplicar límites de segmento
dialog.template.segmentlimits.tooltip = Comprueba los límites de segmento en CPUs 80286 y superiores
dialog.template.speedmods = Mods de velocidad
dialog.template.speedmods.tooltip = Permite cambios conocidos que mejoran el rendimiento (activado por defecto)
dialog.template.turbo = Turbo
dialog.template.turbo.tooltip = Activa el modo Turbo (FFWD) para acelerar operaciones
dialog.template.outputportreset = Permitir reset del puerto de salida
dialog.template.outputportreset.tooltip = Activado (por defecto), permite a la aplicación resetear la CPU usando el controlador de teclado.\nEsta opción es necesaria para que Windows ME pueda reiniciarse correctamente, mientras que Windows 9x y anteriores\nemplean la INT 19h.
dialog.template.apmbios = APM BIOS
dialog.template.apmbios.tooltip = Emula las llamadas a la BIOS de Advanced Power Management (APM)
dialog.template.isapnpbios = BIOS ISA PnP
dialog.template.isapnpbios.tooltip = Emula la BIOS ISA Plug & Play. Activada permite a DOSBox-X ejecutar programas DOS que comprueben el PnP o arrancar Windows 9x.\nEs mejor no desactivar la opción si Windows 9x está usando dispositivos PnP, o causará problemas.
dialog.template.tab.memory = Memoria
dialog.template.memorysize = Tamaño (MB)
dialog.template.memorysize.tooltip = Cantidad de memoria emulada por DOSBox en megabytes. Es mejor usar la cantidad por defecto,\naunque algunos juegos pueden necesitar más. Aumentar su valor no implica mejor rendimiento.
dialog.template.xms = XMS
dialog.template.xms.tooltip = Activar soporte para memoria XMS
dialog.template.ems = EMS
dialog.template.ems.tooltip = Activar soporte para memoria EMS
dialog.template.umb = UMB
dialog.template.umb.tooltip = Activar soporte para memoria UMB
dialog.template.hma = HMA
dialog.template.hma.tooltip = Informa a través de la memoria XMS de que hay disponible HMA (aunque no esté disponible)
dialog.template.shellhigh = Intérprete de comandos en memoria UMB
dialog.template.shellhigh.tooltip = Carga en memoria alta el intérprete de comandos de DOSBox-X si la memoria UMB está disponible.\nEn modo auto (por defecto), se activa en versiones del DOS 7.0 o superiores.
dialog.template.xmshandles = Handles XMS
dialog.template.xmshandles.tooltip = Número de handles XMS disponibles para el entorno DOS, o 0 para usar una cifra por defecto razonable.
dialog.template.minimummcbfree = Segmento libre mínimo
dialog.template.minimummcbfree.tooltip = Segmento libre mínimo sin utilizar. Al arrancar, el kernel de DOS distribuirá la memoria\nhasta este punto. Esta opción puede usarse para solucionar problemas con EXEPACK o programas DOS que no funcionan bien cuando se cargan\nen la zona baja de la memoria. Para reportar más memoria convencional libre,\nse puede usar el valor 1.
dialog.template.a20 = Línea A20
dialog.template.a20.tooltip = Emulación de línea A20.\nLas opciones on/off/on_fake/off_fake están pensadas para el desarrollo de programas DOS,\no para emular hardware antiguo, o para solucionar potenciales problemas con la memoria extendida con programas DOS.\nLas opciones on_fake/off_fake sirven para testear si un programa comprueba si la línea\nA20 está configurada debidamente (como hace HIMEM.SYS). Puede provocar cuelgues si se cuela algún bit.\nEste parámetro también se puede cambiar desde el comando interno A20GATE.\nfast: Emula la línea A20 remapeando los primeros 64KB en el límite de 1MB (comportamiento rápido, habitual en DOSBox)\nmask: Emular la línea A20 escondiendo la dirección I/O de la memoria (preciso)\noff: Impedir el acceso a la línea A20 (los programas o el SO no podrán activarla)\non: Mantener la línea A20 abierta (los programas o el SO no podrán desactivarla)\noff_fake: Mantener la línea cerrada pero permitiendo el paso a algún bit (¡más vale que el juego de turno compruebe el HMA!)\non_fake: Mantener la línea abierta y permitir el paso a algún bit
dialog.template.mcbfaults = MCB defectuosos
dialog.template.mcbfaults.tooltip = Cómo actuar ante cadenas de bloques corrompidos por los programas:\nrepair: Reparar (y reportar) usando los bloques adyacentes (por defecto).\nreport: Reportar fallos pero continuar.\nallow: Permitir que los fallos queden sin reportar (como haría el hardware original).\ndeny: Salir (y reportar) cuando se detecten fallos.
dialog.template.pcjrmemorylayout = Disposición de memoria PCjr
dialog.template.pcjrmemorylayout.tooltip = Disposición de memoria del IBM PCjr ("expanded" por defecto).\nexpanded: 640 KB de memoria total, con programas residiendo por encima de los 128 KB. Compatible con la mayoría de los juegos.\nstandard: 128 KB de memoria total con programas residiendo por debajo de los 96 KB. Requerido por algunos juegos antiguos (p. ej., Jumpman, Troll).
dialog.template.memoryfile = Memory file
dialog.template.memoryfile.tooltip = If set, guest memory is memory-mapped from a file on disk, rather than allocated from memory
dialog.template.tab.disks = Disquetes
dialog.template.fdc1enable = Controladora de disquete
dialog.template.fdc1enable.tooltip = Activar la interfaz de controladora de disquete
dialog.template.fdc1pnp = FDC PnP
dialog.template.fdc1pnp.tooltip = La controladora de disquete aparecerá en la lista de dispositivos ISA PnP de la BIOS
dialog.template.floppydatarate = Tasa de lectura
dialog.template.floppydatarate.tooltip = Reducir (limitar) el rendimiento del disquete. Esta opción controla el límite en bits/segundo.\nLa opción 0 desactiva el límite, o -1 (por defecto) emplea un límite razonable.\nEl rendimiento del I/O del disquete en DOSBox SVN se obtiene con la opción 0.
dialog.template.fdc1mode = Modo FDC
dialog.template.fdc1mode.tooltip = Modo de la controladora de disquete. Cómo se comporta.\nps2: modo PS/2 (el más común)\nps2_model30: modelo PS/2 30\nat: modo PC/AT\nxt: modo PC/XT
dialog.template.ide1enable = IDE primario
dialog.template.ide1enable.tooltip = Activar interfaz IDE
dialog.template.ide1pnp = IDE primario PnP
dialog.template.ide1pnp.tooltip = El dispositivo IDE aparecerá en la lista de dispositivos ISA PnP de la BIOS
dialog.template.ide2enable = IDE secundario
dialog.template.ide2pnp = IDE secundario PnP
dialog.template.ide3enable = IDE terciario
dialog.template.ide3pnp = IDE terciario PnP
dialog.template.ide4enable = IDE cuaternario
dialog.template.ide4pnp = IDE cuaternario IDE PnP
dialog.template.ide5enable = IDE quinario
dialog.template.ide5pnp = IDE quinario PnP
dialog.template.ide6enable = IDE sextenario
dialog.template.ide6pnp = IDE sextenario PnP
dialog.template.ide7enable = IDE septenario
dialog.template.ide7pnp = IDE septenario PnP
dialog.template.ide8enable = IDE octonario
dialog.template.ide8pnp = IDE octonario PnP
dialog.template.hddatarate = Tasa de lectura HDD
dialog.template.hddatarate.tooltip = Reducir (limitar) el rendimiento del disco duro. Esta opción controla el límite en bits/segundo.\nLa opción 0 desactiva el límite, o -1 (por defecto) emplea un límite razonable.\nEl rendimiento del I/O del disquete en DOSBox SVN se obtiene con la opción 0.
dialog.template.tab.video = Vídeo
dialog.template.vmemsizemb = Memoria de vídeo en MB
dialog.template.vmemsizemb.tooltip = Cantidad de memoria de vídeo en megabytes. Esto determinará la resolución y profundidad de color máximos que la svga_s3 podrá mostrar.\n-1: auto (vmemsizekb es ignorado)\n0: 512k (800x600  con 256 colores) con la opción vmemsizekb=0\n1: 1024x768 y 256 colores o 800x600 con color 64k\n2: 1600x1200 y 256 colores o 1024x768 con color 64k o 640x480 con 16M de colores\n4: 1600x1200 con color 64k o 1024x768 y 16M de colores\n8: hasta 1600x1200 y 16M de colores\nPara juegos con el motor build, configurar todavía más memoria y activar el triple búfer para evitar parpadeos.
dialog.template.scanlineondemand = Generación de scanlines
dialog.template.scanlineondemand.tooltip = Esperar a V-Sync o cuando haya cambios a mitad de fotograma para dibujar gráficos, en lugar de parar para generar cada scanline.\nPuede mejorar el rendimiento de muchos juegos DOS. Pero también puede provocar errores en demos o juegos que presten especial atención a los tiempos.\nLa opción por defecto es "auto", que lo desactiva en los modos VGA y lo activa en los modos SVGA.
dialog.template.vmemsizekb = Memoria de vídeo en KB
dialog.template.vmemsizekb.tooltip = Cantidad de memoria de vídeo en KB, además de la memoria de vídeo en MB
dialog.template.vgarenderperscanline = Dibujado VGA por scanline
dialog.template.vgarenderperscanline.tooltip = Emular con precisión el dibujado por scanline VGA (activado por defecto).\nActualmente hay que desactivarlo para algunos juegos, o se cerrarán inmediatamente\n(p. ej., Deus, Ishar 3, Robinson's Requiem, Time Warriors).
dialog.template.vmemsize = Memoria de vídeo
dialog.template.vmemsize.tooltip = Memoria de vídeo en MB (1-8) o KB (de 256 a 8192). "auto" la cifra por defecto para cada adaptador de vídeo ("auto" por defecto).
dialog.template.ioopt1 = Optimización de memoria I/O 1
dialog.template.ioopt1.tooltip = Activa un tipo de optimización de memoria EGA/VGA I/O. Activado por defecto (true).\nSi se producen errores gráficos, desactivar primero. Puede beneficiar al rendimiento.
dialog.template.vmemdelay = Retraso en el acceso a memoria de vídeo
dialog.template.vmemdelay.tooltip = Retraso en el acceso a memoria de vídeo ("off" por defecto).\noff: Desactivar retraso en el acceso a memoria de vídeo (por defecto). Esta es la opción preferible para la mayoría de juegos para evitar bajones de velocidad.\non: Activar retraso en el acceso a memoria de vídeo (3000 ns). Esto puede ayudar a reducir o eliminar los parpadeos en juegos Hercules, CGA, EGA, y juegos VGA tempranos.\n<value>: El retraso se configura en nanosegundos. El rango válido es de 0 a 20000 ns; 500 a 5000 ns es el rango más útil.\nNota: Usar esta opción en juegos concretos porque afecta al rendimiento de todo el emulador.
dialog.template.dosrate = Tasa de fotogramas
dialog.template.dosrate.tooltip = Personalizar la tasa de fotogramas del modo de vídeo emulado.\ndefault: El modo de vídeo DOS determina la tasa (recomendado; por defecto).\nhost: La tasa la determina el modo de vídeo del SO original.\n<value>: Fija la tasa en un valor exacto de entre 24.000 y 1000.000 (Hz).\nNota: Recomendamos la opción "default", o de lo contrario usar una tasa diferente para cada juego.
dialog.template.monochromepalette = Paleta monocromo
dialog.template.monochromepalette.tooltip = Ajusta la paleta para emular monitores monocromo ("amber" por defecto).\nFunciona solamente con los tipos de máquina "hercules" y "cga_mono".\nNota: También se pueden intercambiar las paletas disponibles a través de atajos de teclado.
dialog.template.ansi = ANSI
dialog.template.ansi.tooltip = Si se activa (por defecto), se emula ANSI.SYS. De lo contrario, ANSI.SYS no está emulado ni figurará como instalado.\nNOTA: Esta opción no tiene efecto en máquinas PC-98 donde los sistemas MS-DOS integran ANSI.SYS en el kernel de DOS.
dialog.template.cgacolors = Colores CGA
dialog.template.cgacolors.tooltip = Interpreta los colores CGA RGBI. Afecta a todos los tipos de máquina\n capaces de mostrar gráficos CGA o superiores.
dialog.template.blinking = Texto parpadeante
dialog.template.blinking.tooltip = Desactivar para ver colores de fondo intensos en lugar de texto parpadeante en primer plano.\nEsta opción no tiene efecto en máquinas PC-98 ni otros modos de vídeo.
dialog.template.vesamodes = VESA
dialog.template.vesamodes.tooltip = Controla la selección de modos VESA 1.2 y 2.0 disponibles:\ncompatible: Una selección que ofrece mejor compatibilidad con juegos. Es la opción recomendada junto a 4 o 8 MB de memoria de vídeo (por defecto).\nhalfline: Soporta el modo VESA de baja resolución usado por Extreme Assault. Usar solamente si es necesario, porque no es compatible con la tarjeta S3.\nall: Todos los modos disponibles para esta cantidad de memoria de vídeo, aunque algunos juegos no las usen correctamente (parpadeos) o requieran más memoria RAM.
dialog.template.8pxvgafont = Fuente VGA 8 de 8 píxeles
dialog.template.8pxvgafont.tooltip = Emplear fuentes de 8 píxeles de ancho en adaptadores VGA (desactivado por defecto)
dialog.template.reelmagic = ReelMagic MPEG
dialog.template.reelmagic.tooltip = Soporte para reproducir ReelMagic (alias REALmagic) MPEG:\noff: Desactivar soporte (por defecto).\ncardonly: Inicializa la tarjeta sin cargar el driver FMPDRV.EXE.\non: Inicializa la tarjeta y carga FMPDRV.EXE al arrancar.
dialog.template.reelmagicfcode = Tasa ReelMagic
dialog.template.reelmagicfcode.tooltip = Ignora el código de FPS durante la reproducción de vídeo:\n0: No lo ignora: intentar descubrir la tasa durante la reproducción (por defecto).\nde 1 a 7: Ajustar los FPS a uno de los valores siguientes (usar de 1 a 7):\n1=23.976, 2=24, 3=25, 4=29.97, 5=30, 6=50, o 7=59.94 FPS.
dialog.template.reelmagickey = Clave ReelMagic
dialog.template.reelmagickey.tooltip = Ajustar la clave de 32 bits empleada para decodificar los vídeos del juego:\n auto: Usar las rutinas internas para determinar la clave (por defecto).\ncommon: Usar la clave más habitual, o sea 0x40044041.\nthehorde: Emplear la clave de The Horde, o sea 0xC39D7088.\n<custom>: Escoger una clave personalizada en formato hexadecimal (p. ej., 0x12345678).
dialog.template.tab.cgacomposite = CGA composite
dialog.template.composite = Modo Composite al arrancar
dialog.template.composite.tooltip = Activar el modo CGA Composite (solamente en máquinas "cga", "pcjr", y "tandy"; "auto" por defecto). "auto" deja que el programa decida.
dialog.template.compositeera = "Era" Composite
