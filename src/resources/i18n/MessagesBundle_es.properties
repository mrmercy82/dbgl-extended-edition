dialog.template.customcodepage = Página de códigos customizada
dialog.template.customcodepage.tooltip = Selecciona una página de códigos customizada para comandos CHCP y especifica una página de código SBCS, siguiendo el formato estándar SBCS.\nSe pueden conseguir ejemplos de páginas de códigos SBCS en la web del Unicode Consortium: https://www.unicode.org/Public/MAPPINGS/VENDORS/MICSFT/PC/
dialog.template.ime = IME
dialog.template.ime.tooltip = Activa el soporte para Editores de métodos de entrada (IME) para entrar caracteres en versiones de Windows y Linux builds.\nSi está en "auto", está función sólo estará activada si DOSBox-X arranca con una página de códigos china/japonesa/coreana.
dialog.template.tab.mouse = Ratón
dialog.template.autolock = Capturar automáticamente
dialog.template.autolock.tooltip = Se capturará el ratón automáticamente al hacer clic sobre la pantalla
dialog.template.sensitivity = Sensibilidad
dialog.template.sensitivity.tooltip = Sensibilidad del ratón
dialog.template.mouseemu = Emulación de ratón
dialog.template.mouseemu.tooltip = ¿Cuándo se está emulando el ratón?\nintegration: cuando no está capturado\nlocked: cuando está capturado\nalways: siempre\nnever: nunca\nCon la opción desactivada, la posición del ratón en DOSBox-X estará exactamente donde lo diga el SO original.\nCon un ratón muy sensible, la emulación del movimiento del ratón\npuede reducir esta sensibilidad, p. ej. el ratón será más lento pero más preciso.
dialog.template.mousecapture = Captura del ratón
dialog.template.mousecapture.tooltip = Cuándo se capturará el ratón:\nonclick: Capturar el ratón al hacer clic con cualquier botón sobre la ventana (por defecto)\nonstart: Capturar el ratón inmediatamente al arrancar. Puede no funcionar correctamente en algunos SO\nseamless: Dejar que el ratón se pueda mover entre la ventana de DOSBox y el resto del escritorio; lo capturará solamente pulsando el botón central o la tecla asignada.\nEste modo no funciona correctamente con todos los juegos. Windows 3.1x puede usarlo con un driver personalizado.\nnomouse: Esconde el ratón y no envía sus movimientos al juego. Para control mediante una pantalla táctil, emplear "seamless".
dialog.template.middleunlock = Permitir liberar ratón con botón central
dialog.template.middleunlock.tooltip = Si se permite liberar el ratón (cuando ha sido capturado) pulsando el botón central.\nEn "manual", sólo funciona junto a la opción "autolock=false"; en "auto", funciona solamente con "autolock=true".
dialog.template.mousemiddlerelease = Liberar ratón con botón central
dialog.template.mousemiddlerelease.tooltip = Liberar el ratón con el botón central, y también capturarlo en modo constante (activado por defecto)
dialog.template.autolockfeedback = Aviso de bloqueo automático
dialog.template.autolockfeedback.tooltip = Tipo de aviso, p. ej. visual, auditiva, ninguna
dialog.template.usesystemcursor = Usar puntero del sistema
dialog.template.usesystemcursor.tooltip = Usar el puntero del ratón del SO original en lugar de dibujar un puntero DOS.\nActivado cuando el ratón no está capturado.
dialog.template.int33 = INT33
dialog.template.int33.tooltip = Activar INT 33H para soporte de ratón
dialog.template.aux8042 = Puerto auxiliar 8042
dialog.template.aux8042.tooltip = Activa la emulación del puerto auxiliar 8042. La emulación de ratón PS/2 requiere que está activada.\nDebería activarse para ejecutar Windows ME o cualquier otro SO\nque no use la BIOS para registrar el movimiento del ratón.
dialog.template.mousevmware = Interfaz de ratón VMware
dialog.template.mousevmware.tooltip = Interfaz de ratón VMware (activada por defecto). Sólo es completamente compatible un driver experimental para Windows 3.1x.\nNota: Requiere activar un ratón PS/2.
dialog.template.mousevirtualbox = Interfaz de ratón VirtualBox
dialog.template.mousevirtualbox.tooltip = Interfaz de ratón VirtualBox (activada por defecto). Sólo es completamente compatible un driver experimental para Windows 3.1x.\nNota: Requiere activar un ratón PS/2.
dialog.template.mousecommodel = Ratón tipo COM
dialog.template.mousecommodel.tooltip = Ratón del tipo COM a emular por defecto (serial) modelo por defecto:\n2button: ratón Microsoft de dos botones.\n3button: ratón Logitech de 3 botones; mayormente compatible con el ratón Microsoft.\nwheel: ratón de 3 botones + rueda; mayormente compatible con el ratón Microsoft.\nmsm: ratón de 3 botones Mouse Systems; NO compatible con el ratón Microsoft.\n2button+msm: elección automática entre los modelos "2button" y "msm".\n3button+msm: elección automática entre los modelos "3button" y "msm".\nwheel+msm: elección automática entre los modelos "wheel" y "msm" (por defecto).\nNota: Es necesario activar la opción Ratón tipo COM en la sección [serial].
dialog.template.mouseps2model = Ratón tipo PS/2
dialog.template.mouseps2model.tooltip = Ratón del tipo PS/2 a emular por defecto:\nstandard: ratón estándar PS/2 de 3 botones.\nintellimouse: Microsoft IntelliMouse de 3 botones + rueda.\nexplorer: Microsoft IntelliMouse Explorer de 5 botones + rueda, (por defecto).\nnone: no se emula ningún ratón tipo PS/2.
dialog.template.mousedosdriver = Driver ratón DOS
dialog.template.mousedosdriver.tooltip = Activar el driver DOS del ratón incluido (activado por defecto). Notas:\n- Desactivar si se pretende usar el MOUSE.COM original bajo DOS emulado.\n- Cuando el SO de la máquina virtual se inicie, este driver incluido se desactiva automáticamente.
dialog.template.auxdevice = Ratón tipo PS/2 en puerto AUX
dialog.template.auxdevice.tooltip = Tipo de ratón PS/2 conectado al puerto AUX
dialog.template.mouserawinput = Entrada de ratón directa
dialog.template.mouserawinput.tooltip = Ignora las opciones de aceleración y sensibilidad del SO original (activado por defecto).\nFunciona en modo de pantalla completa o con el ratón capturado en modo ventana.
dialog.template.mouseimmediate = Actualización inmediata
dialog.template.mouseimmediate.tooltip = Actualiza el movimiento del ratón inmediatamente, sin esperar a las interrupciones (desactivado por defecto). Puede mejorar la jugabilidad, o puede provocar problemas de compatibilidad.
dialog.template.mousemultidisplayaware = Ratón en pantallas múltiples
dialog.template.mousemultidisplayaware.tooltip = Hace que el ratón pueda usarse y liberarse en modo de pantalla completa en sistemas con más de un monitor (activado por defecto).\nNota: La opción debería desactivarse si detecta pantallas múltiples por error. Esto puede ocurrir\nal usar una imagen invertida al emplear el receptor AV de la entrada HDMI para escuchar audio.
dialog.template.mousereportrate = Frecuencia de actualización
dialog.template.mousereportrate.tooltip = Frecuencia de actualización del ratón, o 0 para opción automática. Esto afecta a la frecuencia con que los eventos del ratón se comunican al SO original a través de la IRQ del ratón.\nAlgunos juegos como CyClone necesitan una frecuencia menor para funcionar correctamente. El modo Auto permite al usuario cambiar esta frecuencia a través de la emulación de ratón PS/2.\nEsta opción no afecta a los juegos DOS que detectan el movimiento del ratón a través de la INT 33h.
dialog.template.mousewheelkey = Rueda a tecla
dialog.template.mousewheelkey.tooltip = Convierte los movimientos de la rueda del ratón en pulsaciones de teclado como los cursores.\n0: desactivado; 1: cursores arriba/abajo; 2: cursores izquierda/derecha; 3: teclas Re.Pg/Av.Pag.\n4: Ctrl+cursores arriba/abajo; 5: Ctrl+cursores izquierda/derecha; 6: Ctrl+Re.Pg/Av.Pag.\n7: Ctrl+W/Z, para emplear con procesadores de texto como WordStar y el Editor de MS-DOS.\nCon el signo negativo la conversión para el SO emulado queda anulada.
dialog.template.tab.joystick = Joystick
dialog.template.joysticktype = Tipo
dialog.template.joysticktype.tooltip = Tipo de joystick que a emular\: auto (por defecto), ninguno, 2 ejes (soporta dos joysticks),\n4axis (soporta un joystick, se usará el primero), 4axis_2 (soporta un joystick, se usará el segundo),\nfcs (Thrustmaster), ch (CH Flightstick).\nnone desactiva la emulación de joystick.\nauto escoge automáticamente.
