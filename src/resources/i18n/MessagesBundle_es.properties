dialog.template.printoutput.tooltip = Modo de salida para las páginas completadas:\npng: Crea imágenes PNG (por defecto)\nps: Crea PostScript\nbmp: Crea imágenes BMP (archivos muy grandes, no se recomienda)\nprinter: Enviar a una impresora real bajo Windows (hay que especificar una, o aparecerá un menú de impresión)
dialog.template.printerdevice = Dispositivo de la impresora
dialog.template.printerdevice.tooltip = Especifica el dispositivo de la impresora bajo Windows a emplear. Se puede ver una lista de dispositivos desde la Ayuda ("Listar dispositivos de la impresora")\no la ventana de estatus. Tras elegir uno hay que entrar su número (p. ej. 2) o el nombre de la impresora (p. ej. Microsoft Print to PDF).\nDejarlo en blanco hará aparecer un menú de impresión (o entrar "-" para que se muestre una sola vez).
