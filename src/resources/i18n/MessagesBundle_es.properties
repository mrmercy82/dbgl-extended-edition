dialog.template.startbanner.tooltip = Si se activa (por defecto), DOSBox-X mostrará su pantalla de bienvenida al arrancar
dialog.template.bannercolortheme = Colores de la pantalla de bienvenida
dialog.template.bannercolortheme.tooltip = Se puede especificar un color de fondo para la pantalla de bienvenida
dialog.template.showbasic = Mostrar información básica
dialog.template.showbasic.tooltip = Si se activa DOSBox-X mostrará información básica incluyendo su número de versión y la velocidad de la CPU en la barra del título.
dialog.template.startupverbosity = Mensajes al arrancar
dialog.template.startupverbosity.tooltip = Controla los mensajes antes de iniciar el programa ("auto" por defecto)
dialog.template.showdetails = Mostrar información detallada
dialog.template.showdetails.tooltip = Si se activa DOSBox-X mostrará la velocidad en FPS y la velocidad de la CPU relativa en la barra del título.
dialog.template.titlebar = Barra del título
dialog.template.titlebar.tooltip = Texto mostrado en la barra del título de DOSBox-X
dialog.template.fastbioslogo = Logo BIOS rápido
dialog.template.fastbioslogo.tooltip = Si se activa DOSBox-X se saltará la pantalla de la BIOS y arrancará sin la pausa de 1 segundo
dialog.template.addtitlebar = Texto adicional para la barra del título
dialog.template.addtitlebar.tooltip = Texto adicional para mostrar en la barra del título
dialog.template.logotext = Logo text
dialog.template.logotext.tooltip = Text to place at the bottom of the screen during the startup logo. Text will line wrap automatically.\nTo explicitly break to the next line, put \\n in the string.
dialog.template.logo = Logo image dir
dialog.template.logo.tooltip = Location of PNG images to use in place of the DOSBox-X logo at startup.\nThis is the path of the base file name. For example logo=subdir\\sets\\007\\logo\nwith machine=vgaonly will use subdir\\sets\\007\\logo224x224.png as the logo.
dialog.template.showmenu = Mostrar barra del menú
dialog.template.showmenu.tooltip = Mostrar o no la barra del menú (si está soportado). Activada por defecto.
dialog.template.quitwarning = Aviso al salir
dialog.template.quitwarning.tooltip = Mostrar o no mensaje de confirmación al salir de DOSBox-X si el usuario intenta cerrar su ventana.\nSi está en "auto" (por defecto), DOSBox-X avisará si hay algún programa en ejecución.\nSi está en "autofile", DOSBox-X avisará si hay archivos abiertos o un SO ejecutándose.
dialog.template.configurationtooltheme = Tema de la herramienta de configuración
dialog.template.configurationtooltheme.tooltip = Tema para la herramienta de configuración. Si no se especifica otro, se usará el modo oscuro del sistema anfitrión.
dialog.template.showadvancedoptions = Opciones avanzadas
dialog.template.showadvancedoptions.tooltip = Si se activa, la herramienta de configuración mostrará todas sus opciones (incluso las avanzadas) por defecto
dialog.template.resolveconfigpath = Resolver opciones en rutas
dialog.template.resolveconfigpath.tooltip = Si se activa, DOSBox-X resolverá opciones que contengan rutas en su archivo de configuración (excepto en la sección [autoexec]).\nEsto incluye variables de entorno (%VAR% [DOS/Windows] o ${VAR} [Linux/macOS] y las que contengan (~) en Linux/macOS.\nCon la opción "dosvar", DOSBox-X solamente resolverá las variables de entorno del tipo DOS (%VAR%) en todas las plataformas (más las que contengan (~)).\nCon la opción (~), DOSBox-X sólo resolverá las que contengan el signo (~) en Linux/macOS pero no las variables de entorno.
dialog.template.configshortcuts = Configurar atajos
dialog.template.configshortcuts.tooltip = Permite emplear atajos para simplificar el proceso de configuración (activados por defecto).\nP .ej., en lugar de "config -set sbtype sb16", bastará con ejecutar "sbtype sb16",\ny en lugar de "config -get sbtype", se podrá ejecutar el comando "sbtype".
dialog.template.hostkey = Host key
dialog.template.hostkey.tooltip = Por defecto DOSBox-X emplea la tecla host del mapa de teclado, que por defecto es F11 bajo Windows y F12 en otras plataformas.\nCon esta opción se puede especificar otra tecla key que sustituirá a la del mapa de teclado.\nEsto también puede hacerse desde el menú ("Main" => "Select host key").
dialog.template.startcmd = Comando Start
dialog.template.startcmd.tooltip = Permite emplear el comando START para arrancar programas en el SO principal.\nEn Windows estos programas o comandos se pueden arrancar directamente.
dialog.template.workingdiroption = Carpeta de trabajo
dialog.template.workingdiroption.tooltip = Selecciona una carpeta de trabajo para DOSBox-X.\nautoprompt: DOSBox-X preguntará al usuario qué carpeta emplear.\nconfig: DOSBox-X usará la carpeta especificada en su archivo de configuración.\ncustom: Especificar una carpeta con la opción "carpeta de trabajo por defecto".\ndefault: Similar a "autoprompt", pero DOSBox-X ofrecerá salvar la carpeta escogida.\nforce: Similar a "custom", pero ignorando la opción -defaultdir si se está usando.\nnoprompt: DOSBox-X usa la carpeta actual y nunca ofrece cambiarla.\nprogram: DOSBox-X usará la carpeta de DOSBox-X como carpeta de trabajo.\nprompt: DOSBox-X siempre preguntará al usuario qué carpeta emplear como carpeta de trabajo.\nuserconfig: DOSBox-X usará como carpeta de trabajo la carpeta de su archivo de configuración.
dialog.template.startquiet = Arrancar en silencio
dialog.template.startquiet.tooltip = Si se activa, DOSBox-X no mostrará mensajes antes de lanzar aplicaciones del SO principal\nDOSBox-X no mostrará mensajes del tipo "Ahora ejecútalo como una aplicación de Windows".
dialog.template.workingdirdefault = Carpeta de trabajo por defecto
dialog.template.workingdirdefault.tooltip = La carpeta que DOSBox-X usará como carpeta de trabajo. Ver también la opción "Carpeta de trabajo".\nCon la opción=prompt, la carpeta seleccionada se convierte en la primera opción.
dialog.template.startwait = Esperar tras arrancar
dialog.template.startwait.tooltip = Especifica si DOSBox-X esperar a que terminen de ejecutarse las aplicaciones del SO principal
dialog.template.startnopause = No pause after completion
dialog.template.startnopause.tooltip = If set, DOSBox-X will not pause after host command execution is completed.
dialog.template.autoexecsections = Secciones Autoexec
dialog.template.autoexecsections.tooltip = Especifica cómo se manejarán las secciones autoexec desde múltiples archivos de configuración:\njoin: Combinarlas en una sola sección (comportamiento antiguo; por defecto).\noverwrite: Usar la última encontrada, como con las demás opciones de configuración.
dialog.template.starttranspath = Traducir rutas
dialog.template.starttranspath.tooltip = Especifica si DOSBox-X debería traducir automáticamente todas las rutas en la línea de comandos\na rutas del SO principal al arrancar aplicaciones en el SO principal.
dialog.template.imgcaptureformat = Formato de las capturas
dialog.template.imgcaptureformat.tooltip = Especifica el formato de las capturas en las capturas de pantalla ("upscaled" por defecto)
dialog.template.writeprotect = Proteger archivos contra escritura
dialog.template.writeprotect.tooltip = Muchos juegos abren todos sus archivos con permiso de escritura; incluso archivos que no modifican nunca.\nEsta opción protege contra escritura esos archivos pero sigue permitiendo que el juego pueda leerlos (activado por defecto).\nUna segunda utilidad: si se está usando un sistema de archivos de sólo lectura o basado en red,\nesta opción impide operaciones de escritura en esos archivos.
dialog.template.logfile = Archivo de registro
dialog.template.logfile.tooltip = Archivo donde se guardarán los registros
dialog.template.pausewheninactive = Pausa cuando inactivo
dialog.template.pausewheninactive.tooltip = Pausa la emulación cuando la ventana está inactiva (desactivado por defecto)
dialog.template.debuggerrun = Modo debug
dialog.template.debuggerrun.tooltip = Modo de ejecución cuando arranca el dejugar de DOSBox-X
dialog.template.saveslot = Espacio de partida salvada
dialog.template.saveslot.tooltip = Escoge el espacio para partida salvada (1-100) para salvar/recuperar partidas
dialog.template.savefile = Archivo de partida salvada
dialog.template.savefile.tooltip = Escoge el archivo donde salvar/recuperar partidas. Si se especifica uno se usará automáticamente.
dialog.template.saveremark = Comentarios en partidas salvadas
dialog.template.saveremark.tooltip = Si se activa se podrán introducir comentarios al salvar una partida
dialog.template.autosave = Salvado automático
dialog.template.autosave.tooltip = Activa la opción de salvado automático. Se puede especificar un intervalo de tiempo en segundos, y opcionalmente un espacio de partida salvada o un rango.\nPor ejemplo, "autosave=10 11-20" determina un intervalo de 10 segundos para salvar automáticamente, y se usarán los espacios entre 11 and 20.\nAdicionalmente, se pueden especificar hasta 9 programas para esta función, p. ej. "autosave=10 11-20 EDIT:21-30 EDITOR:35" para "EDIT" y "EDITOR".\nUn signo menos (-) antes del intervalo de tiempo provoca que la función no se active al arrancar.
dialog.template.forceloadstate = Forzar cargar partida salvada
dialog.template.forceloadstate.tooltip = Si se activa DOSBox-X cargará una partida salvada sin importar las discrepancias\nen la versión de DOSBox-X, tipo de máquina, nombre del programa o tamaño de memoria.
dialog.template.synctime = Sincronizar hora
dialog.template.synctime.tooltip = Si se activa DOSBox-X intentará sincronizar automáticamente la hora con el SO principal, a no ser que se especifique manualmente
dialog.template.clipboardspeed = Velocidad de pegado del Bloc de notas
dialog.template.clipboardspeed.tooltip = Especifica la velocidad del teclado para pegar texto desde el Bloc de notas.\nSi la opción por defecto de 30 provoca el nombre habrá que incrementar el número.\nO se puede experimentar con disminuir el número para aplicaciones que reaccionan rápido al teclado.
dialog.template.clipboardbutton = Copiar y pegar desde el Bloc de notas
dialog.template.clipboardbutton.tooltip = Selecciona el botón del ratón o los cursores para la función de copiar y pegar.\nSi el botón del ratón por defecto es el "derecho", significa que podemos utilizar el botón derecho del ratón para seleccionar texto, copiar y pegar desde el Bloc de notas.\nSi la opción es "central" usaremos el botón central del ratón, "cursores" para emplear los cursores en lugar del ratón, y "ninguno" para desactivar esta función.\nPara "cursores", apretamos la tecla Inicio (o Fn+Mayúsculas+Izquierda en portátiles Mac) para seleccionar, y la tecla Fin(o Fn+Mayúsculas+Derecha en portátiles Mac) para terminar.
dialog.template.clipboardmod = Modificador del Bloc de notas
dialog.template.clipboardmod.tooltip = Cambia el modificador del teclado para la función de copiar y pegar desde el Bloc de notas usando un botón del ratón o los cursores.\nEl modificador por defecto es "Mayúsculas" (ambas teclas). Escoger "ninguno" si no se desea emplear ninguno.
dialog.template.clipboardbios = BIOS del Bloc de notas
dialog.template.clipboardbios.tooltip = Especifica si usar o no las funciones de teclado de la  BIOS para el pegado desde  el Bloc de notas en lugar de utilizar el teclado.\nPara pegar texto a aplicaciones de Windows 3.x/9x (p. ej. el Bloc de notas) es necesario utilizar el teclado.
