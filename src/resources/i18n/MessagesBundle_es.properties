dialog.template.freesizecap = Límite de espacio libre
dialog.template.freesizecap.tooltip = Con la opción "cap" (="true"), el valor del parámetro -freesize sólo se aplicará si el tamaño libre actual es mayor del especificado.\nCon la opción "relative", el valor de -freesize cambiará en relación al valor especificado.\nCon la opción "fixed" (="false"), el valor de -freesize será un valor fijo constante.
