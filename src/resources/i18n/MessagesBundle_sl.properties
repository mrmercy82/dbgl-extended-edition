dialog.template.doublebuffering = Dvojno predpomnjenje
dialog.template.doublebuffering.tooltip = Uporabi dvojno predpomnjenje v celozaslonskem načinu. Utripanje slike se lahko zmanjša, vendar pa lahko upočasni DOSBox.
dialog.template.aspectcorrection = Popravek razmerja
dialog.template.aspectcorrection.tooltip = Uporabi popravek razmerja. Če način izhoda ne podpira umerjanja, lahko to upočasni DOSBox!
dialog.template.frameskip = Preskok sličic
dialog.template.frameskip.tooltip = Koliko sličic bo DOSBox preskočil, preden bo eno izrisal
