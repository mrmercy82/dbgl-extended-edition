dialog.template.mouserawinput.tooltip = Enable to bypass your operating system's mouse acceleration and sensitivity settings (enabled by default).\nWorks in fullscreen or when the mouse is captured in windowed mode.
dialog.template.mouseimmediate = Takojšnja miška
dialog.template.mouseimmediate.tooltip = Update mouse movement counters immediately, without waiting for interrupt (disabled by default). May improve gameplay, might cause compatibility issues.
dialog.template.mousemultidisplayaware = Multi-display mouse behaviour
dialog.template.mousemultidisplayaware.tooltip = Allow seamless mouse behavior and mouse pointer release to work in fullscreen mode on systems with more than one display (enabled by default).\nNote: You should disable this if it incorrectly detects multiple displays when only one should actually be used. This might happen if you are\nusing mirrored display mode or using an AV receiver's HDMI input for audio-only listening.
dialog.template.mousereportrate = Frekvenca poročanja
dialog.template.mousereportrate.tooltip = Mouse reporting rate, or 0 for auto. This affects how often mouse events are reported to the guest through the mouse interrupt.\nSome games including CyClone need a lower reporting rate to function correctly. Auto mode allows the guest to change the report rate through the PS/2 mouse emulation.\nThis option does not affect any DOS game that uses polling through INT 33h to detect mouse movement.
dialog.template.mousewheelkey = Kolešček v tipke
dialog.template.mousewheelkey.tooltip = Convert mouse wheel movements into keyboard presses such as arrow keys.\n0: disabled; 1: up/down arrows; 2: left/right arrows; 3: PgUp/PgDn keys.\n4: Ctrl+up/down arrows; 5: Ctrl+left/right arrows; 6: Ctrl+PgUp/PgDn keys.\n7: Ctrl+W/Z, as supported by text editors like WordStar and MS-DOS EDIT.\nPutting a minus sign in front will disable the conversion for guest systems.
