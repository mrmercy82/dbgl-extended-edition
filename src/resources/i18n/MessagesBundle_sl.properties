dialog.template.fullscreen = Celozaslonsko
dialog.template.fullscreen.tooltip = Zaženi DOSBox neposredno v celozaslonskem načinu. (pritisnite ALT-Enter za preklop na okenski način)
dialog.template.windowresolution = Ločljivost okna
dialog.template.windowresolution.tooltip = Umeri okno na to velikost, če način izhoda podpira strojno umerjanje. (output=surface tega ne podpira!)
dialog.template.fullscreenresolution = Celozaslonska ločljivost
dialog.template.fullscreenresolution.tooltip = Kakšna ločljivost bo uporabljena v celozaslonskem načinu\: original ali fixed velikost (npr. 1024x768).\nNajboljše rezultate boste najbrž dosegli, če boste uporabili največjo ločljivost vašega zaslona in možnost aspect\=true.\nČe bo prikazano majhno okno na velikem prikazu, spremenite output iz surface v nekaj drugega.
dialog.template.scaler = Umerilnik
dialog.template.scaler.tooltip = Umerilnik uporabljen za povečanje nizkih ločljivosti. Če pripnete 'forced', bo umerilnik uporabljen tudi, če rezultat ne bo zaželen.
