# DOSBox Staging 0.82.2 settings and defaults, derived from the 0.82.2 sources (test fixture)

[capture]
capture_dir = capture
default_image_capture_formats = upscaled

[composite]
composite = auto
era = auto

[cpu]
core = auto
cputype = auto
cycles =  
parameters = 
type = auto

[dos]
country = auto
ems = true
expand_shell_variable = auto
file_locking = true
keyboardlayout = auto
locale_period = modern
pcjr_memory_config = expanded
setver_table_file = 
shell_history_file = shell_history.txt
umb = true
ver = 5.0
xms = true

[dosbox]
allow_write_protected_files = true
autoexec_section = join
automount = true
dos_rate = default
language = 
machine = svga_s3
mcb_fault_strategy = repair
memsize = 16
shell_config_shortcuts = true
speed_mods = true
startup_verbosity = auto
vesa_modes = compatible
vga_8dot_font = false
vga_render_per_scanline = true
vmem_delay = off
vmemsize = auto

[drive]
label = 
override_drive = 
path = 
readonly = false
type = 
verbose = true

[ethernet]
macaddr = AC:DE:48:88:99:AA
ne2000 = true
nicbase = 300
nicirq = 3
tcp_port_forwards = 
udp_port_forwards = 

[fluidsynth]
fsynth_chorus = auto
fsynth_filter = off
fsynth_reverb = auto
soundfont = default.sf2

[gus]
gus = false
gus_filter = on
gusbase = 240
gusdma = 3
gusirq = 5
ultradir = C:\ULTRASND

[imfc]
imfc = false
imfc_base = 2a20
imfc_filter = on
imfc_irq = 3

[innovation]
6581filter = 50
8580filter = 50
innovation_filter = off
sidclock = default
sidmodel = none
sidport = 280

[ipx]
ipx = false

[joystick]
autofire = false
buttonwrap = false
circularinput = false
deadzone = 10
joy_x_calibration = auto
joy_y_calibration = auto
joysticktype = auto
swap34 = false
timed = true
use_joy_calibration_hotkeys = false

[log]
buf = true
logfile = 

[midi]
midiconfig = 
mididevice = auto
mpu401 = intelligent
raw_midi_output = false

[mixer]
chorus = off
crossfeed = off
nosound = false
reverb = off

[mouse]
dos_mouse_driver = true
dos_mouse_immediate = false
mouse_middle_release = true
mouse_multi_display_aware = true
mouse_raw_input = true
mouse_sensitivity = 100
virtualbox_mouse = true
vmware_mouse = true

[mt32]
model = auto
mt32_filter = off
romdir = 

[reelmagic]
reelmagic = off
reelmagic_fcode = 0
reelmagic_key = auto

[render]
aspect = auto
cga_colors = default
glshader = crt-auto
integer_scaling = auto
viewport = fit

[sblaster]
cms = auto
cms_filter = on
dma = 1
hdma = 5
irq = 7
opl_fadeout = off
opl_filter = auto
opl_remove_dc_bias = false
oplmode = auto
sb_filter = modern
sb_filter_always_on = false
sbbase = 220
sbmixer = true
sbtype = sb16
sbwarmup = 100

[sdl]
active = auto
display = 0
fullresolution = desktop
fullscreen = false
host_rate = auto
inactive = auto
mute_when_inactive = false
pause_when_inactive = false
presentation_mode = auto
priority =  
screensaver = auto
texture_renderer = auto
transparency = 0
vsync = auto
vsync_skip = 0
waitonerror = true
window_decorations = true
window_position = auto
windowresolution = default

[serial]
parameters = 
phonebookfile = phonebook.txt
serial1 = dummy
serial2 = dummy
serial3 = disabled
serial4 = disabled
type = disabled

[speaker]
lpt_dac = none
lpt_dac_filter = on
pcspeaker = impulse
pcspeaker_filter = on
ps1audio = false
ps1audio_dac_filter = on
ps1audio_filter = on
tandy = auto
tandy_dac_filter = on
tandy_fadeout = off
tandy_filter = on

[voodoo]
voodoo = true
voodoo_bilinear_filtering = true
voodoo_memsize = 4
voodoo_threads = auto

[autoexec]
