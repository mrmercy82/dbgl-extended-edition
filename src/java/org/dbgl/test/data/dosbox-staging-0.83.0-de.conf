# Dies ist die Konfigurationsdatei für dosbox-staging (0.83.0).
# Zeilen, die mit einem '#' Zeichen beginnen, sind Kommentare.

[sdl]

# Zu verwendendes Rendering-Backend für die Grafikausgabe (standardmäßig
# 'opengl'). Nur das 'opengl'-Backend unterstützt Shader und ist daher die
# bevorzugte Option. Das 'texture'-Backend dient lediglich als Ausweichlösung
# für den Fall, dass OpenGL nicht verfügbar ist oder der OpenGL-Treiber nicht
# mit Core Profile 3.3 kompatibel ist. Mögliche Werte:
#
#   opengl:     OpenGL-Backend mit Shader-Unterstützung (Standard).
#   Textur:    Das SDL Textur-Backend mit bilinearer Interpolation.
#   texturenb: SDLs Textur-Backend mit Nearest-Neighbor-Interpolation
#               (keine bilineare Interpolation).
#
output = opengl

# Zu verwendender Renderer-Treiber, wenn du einen Textur-Ausgabemodus
# verwendest (Standardmäßig 'auto').
# Verwende 'texture_renderer = auto' für eine automatische Auswahl.
#
texture_renderer = auto

# Nummer der zu verwendenden Anzeige; die Werte hängen vom Betriebssystem und den
# Benutzereinstellungen ab (Standardwert '0').
#
display = 0

# Im Vollbildmodus starten (standardmäßig deaktiviert).
#
fullscreen = true

# Vollbildmodus aktivieren (Standardwert: 'standard'). Mögliche Werte:
#
#   standard:           Verwendet den Standard-Vollbildmodus deines Betriebssystems
#                       (Standard).
#
#   forced-borderless: Erzwingt den randlosen Vollbildmodus, falls der Treiber
#                       deiner Grafikkarte unter Windows die Vollbildoptimierung
#                       deaktiviert, was zu einem exklusiven Vollbildmodus führt.
#                       Das Erzwingen des randlosen Modus kann zu einer 
#                       verminderten Leistung und einem leicht schlechteren
#                       Frame-Pacing führen (z. B. erscheint das Scrollen in
#                       2D-Spielen nicht vollkommen flüssig).
#
fullscreen_mode = forced-borderless

# Legt die anfängliche Fenstergröße für den Fenstermodus fest
# (standardmäßig 'default'). Du kannst
# die Fenstergröße nach dem Start weiterhin anpassen. Mögliche Werte:
#
#   default:   Wählt die beste Option basierend auf deiner Umgebung und anderen
#              Faktoren (z. B. ob die Seitenverhältniskorrektur aktiviert ist).
#
#   small, medium, large (s, m, l):
#              Passt die Fenstergröße relativ zum Desktop an.
#
#   BxH:       Gib die Fenstergröße im Format BxH in logischen Einheiten an
#              (z. B. 1024x768). Die Werte werden mit der DPI-Skalierung auf
#              Betriebssystemebene multipliziert, um die Fenstergröße in Pixeln
#              zu erhalten.
#
# Hinweis: Wenn du stattdessen Pixelkoordinaten verwenden und die DPI-Skalierung
#              ignorieren möchtest, setze die Umgebungsvariable
#              SDL_WINDOWS_DPI_SCALING auf 0.
#
window_size = default

# Legt die anfängliche Fensterposition für den Fenstermodus fest
# (Standardwert: 'auto').
# Mögliche Werte:
#
#   auto:      Der Fenstermanager bestimmt die Position (Standard).
#
#   X,Y:       Legt die Fensterposition im X,Y-Format in logischen Einheiten
#              fest (z. B. 250,100). 0,0 ist die obere linke Ecke des Bild-
#              schirms. Die Werte werden mit der DPI-Skalierung auf Betriebs-
#              systemebene multipliziert, um die Fensterposition in Pixeln
#              zu erhalten.
#
window_position = auto

# Legt fest, ob der Rahmen im Fenster-Modus angezeigt werden soll (standardmäßig
# aktiviert).
#
window_decorations = on

# Durch Leerzeichen getrennte Liste von Informationen, die in der Titelleiste des
# Fensters angezeigt werden sollen ('program=name dosbox=auto cycles=on
# mouse=full' als Standard).
# Wenn ein Parameter nicht angegeben ist, wird sein Standardwert verwendet.
# Mögliche Informationen, die angezeigt werden können, sind:
#
#   animation=<value>:  Wenn diese Option auf 'on' gesetzt ist (Standard), wird
#                       die Audio-/Video Aufnahmemarkierung animiert. Auf 'off'
#                       gesetzt, wird die Animation deaktiviert; dies ist
#                       nützlich, wenn Ihre Schriftart Probleme macht.
#
#   program=<value>:    Zeigt den Namen des laufenden Programms an.
#                       <Wert> kann einer der folgenden Werte sein:
#                           none/off:  Den Programmnamen nicht anzeigen.
#                           name:      Programmname, Erweiterung (Standard).
#                           path:      Name, Erweiterung und vollständiger Pfad.
#                           segment:   Programmspeichersegment anzeigen.
#                           'Titel':   Benutzerdefinierter Name. Alternativ
#                                      kannst du folgende Formate verwenden:
#                                      'Titel', (Titel), <Title> oder [Titel].
#
#                       Hinweis: Bei manchen Programmen (wie Windows 3.1x im
#                       erweiterten Modus) ist es unmöglich, den vollständigen
#                       Programmnamen oder Pfad zu erkennen; in solchen Fällen
#                       wird stattdessen 'segment' verwendet.
#
#   dosbox=<value>:     Anzeige von 'DOSBox Staging' in der Titelleiste.
#                       <Wert> kann einer der folgenden Werte sein:
#                         always:   Zeigt immer 'DOSBox Staging' an.
#                         auto:     Wird nur angezeigt, wenn kein Spiel läuft
#                                   oder 'program=none' gesetzt ist
#                                   (Voreinstellung).
#
#   version=<value>:    Anzeige der DOSBox-Versionsinformationen.
#                       <Wert> kann einer der folgenden Werte sein:
#                          none/off:  DOSBox-Version nicht anzeigen (Standard).
#                          simple:    Einfache Versionsinformationen.
#                          detailed:  Git-Hash einbeziehen, falls verfügbar.
#
#   cycles=<value>:     Bei der Einstellung 'on' (Standard) wird die emulierte
#                       CPU Geschwindigkeit angezeigt. Setze die Einstellung auf
#                       'off', um die Anzeige zu deaktivieren.
#
#   mouse=<value>:      Stufe der Mausumschaltungs-Hinweise:
#                         none/off:  Keine Maus-Hinweise anzeigen.
#                         short:     Nur anzeigen, wenn die Maus umgeschaltet
#                                    wird.
#                         full:      Zeigt ausführliche Informationen zum
#                                    Umschalten der Maus an (Standard).
#
window_titlebar = dosbox=always version=simple program=name cycles=on mouse=full

# Stelle die Transparenz des DOSBox-Staging-Fensters ein
# (Standardwert: 0). Der gültige Bereich reicht von 0 (keine
# Transparenz) bis 90 (hohe Transparenz).
#
window_transparency = 0

# Legt den Modus für die vertikale Synchronisation (Vsync) des Host-
# Grafiktreibers fest. Mögliche Werte:
#
#   off:              Deaktiviert Vsync sowohl im Fenstermodus als auch im
#                     Vollbildmodus (Standard). Dies ist die beste Option für
#                     Monitore mit variabler Bildwiederholfrequenz (VRR),
#                     die im VRR-Modus betrieben werden, um eine perfekte Bildab-
#                     folge, kein Tearing und eine geringe Eingabeverzögerung
#                     zu erzielen. Bei Monitoren mit fester Bildwiederholfrequenz
#                     (oder VRR-Monitoren im Modus mit fester Bildwiederholfrequenz)
#                     kann das Deaktivieren von Vsync in rasanten Spielen zu
#                     sichtbaren Bildfehlern führen.
#
#   on:               Aktiviert Vsync sowohl im Fenstermodus als auch im Vollbild-
#                     modus. Dies kann Bildfehler in rasanten Spielen verhindern,
#                     erhöht jedoch die Eingabeverzögerung. Vsync ist nur bei der
#                     Darstellung im 'Host-Rate'-Modus verfügbar (siehe
#                     'presentation_mode').
#
#   fullscreen-only:  Aktiviert Vsync nur im Vollbildmodus. Dies kann nützlich
#                     sein, wenn Ihr Betriebssystem Vsync im Fenstermodus erzwingt
#                     und die Einstellung 'on' nur im Fenstermodus zu Tonstörungen
#                     oder anderen Problemen führt. Vsync ist nur bei der Dar-
#                     stellung im 'Host-Rate'-Modus verfügbar (siehe 
#                     'presentation_mode').
#
# Hinweise:
#   - Für absolut flüssiges Scrollen in 2D-Spielen (z. B. in 'Pinball Dreams'
#     und 'Epic Pinball') benötigst du einen VRR-Monitor, der im VRR-Modus läuft
#     und bei dem 'Vsync' deaktiviert ist. Das Scrollen in 70-Hz-VGA-Spielen
#     wirkt auf Monitoren mit fester Bildwiederholfrequenz von 60 Hz immer
#     ruckelig, selbst wenn Vsync aktiviert ist.
#
#   - In der Regel erhältst du ein vollkommen flüssiges 2D-Scrolling nur im
#     Vollbildmodus, selbst auf einem VRR-Monitor.
#
#   - Um optimale Ergebnisse zu erzielen, deaktiviere alle Frame-Capping-
#     Funktionen und globalen VSync-Übersteuerungen in den Einstellungen deines
#     Grafiktreibers.
#
vsync = off

# Legt den Bildwiedergabemodus fest (Standardwert: 'auto').
# Mögliche Werte:
#
#   auto:       Verwendet 'host-rate', wenn 'vsync' aktiviert ist, andernfalls
#               'dos-rate' (Standard). Weitere Informationen findest du unter
#               'vsync'.
#
#   dos-rate:   Frames werden mit der Bildwiederholfrequenz des emulierten DOS-
#               Videomodus dargestellt. Dies ist die beste Option für Monitore
#               mit variabler Bildwiederholfrequenz (VRR). 'vsync' ist bei der
#               Darstellung mit 'dos-rate' nicht verfügbar.
#
#   host-rate:  Zeigt Bilder mit der Bildwiederholfrequenz des Host-Bildschirms
#               an. Verwende dies bei Monitoren mit fester Bildwiederhol-
#               frequenz und aktiviertem 'vsync' für rasante Spiele, bei denen
#               Bildreißen ein Problem darstellt. 'host-rate' in Kombination mit
#               deaktiviertem 'vsync' kann eine gute Abhilfe auf Systemen sein,
#               die stets blockierendes vsync auf Betriebssystemebene erzwingen
#               (z. B. könnte erzwungenes 60-Hz-vsync bei VGA-Spielen, die
#               Frames mit 70 Hz ausgeben, Probleme verursachen).
#
presentation_mode = auto

# Den Ton stummschalten, wenn das Fenster inaktiv ist
# (standardmäßig deaktiviert).
#
mute_when_inactive = off

# Emulation anhalten, wenn das Fenster inaktiv ist (Standardmäßig deaktiviert).
#
pause_when_inactive = off

# System-Tastenkombinationen erfassen (standardmäßig deaktiviert).
# Wenn diese Option aktiviert ist, werden die meisten System-Tastenkombinationen
# wie Alt+Tab erfasst und an DOSBox Staging weitergeleitet. Dies ist nützlich für
# Windows 3.1 und einige DOS-Programme mit festgelegten Tastenkombinationen,
# die mit den System-Tastenkombinationen in Konflikt stehen.
#
keyboard_capture = off

# Pfad zur Mapper-Datei (standardmäßig 'mapper-sdl2-XYZ.map', wobei XYZ für die
# aktuelle Version steht). Vorkonfigurierte Maps sind im Verzeichnis
# 'resources/mapperfiles' enthalten. Diese können namentlich geladen werden,
# z. B. mit 'mapperfile = xbox/xenon2.map'.
#
# Hinweis: Die Befehlszeilenoption '--erasemapper' löscht nur die Standard-
#          Mapper-Datei.
#
mapperfile = mapper-sdl2-0.83.0.map

# Verwende 'allow' oder 'block' um die SDL_VIDEO_ALLOW_SCREENSAVER
# Umgebungsvariable zu überschreiben die normalerweise den Betriebssystem-
# Bildschirmschoner blockiert während DOSBox läuft (Standardmäßig 'auto').
#
screensaver = auto


[dosbox]

# Wählt die Sprache für die DOS-Meldungen aus (Standard: 'auto').
# Mögliche Werte:
#
#   auto:     Erkennt die Sprache anhand des Host-Betriebssystems (Standard).
#   <Wert>:   Lädt eine Übersetzung aus der angegebenen Datei.
#
# Hinweise:
#   - Folgende Sprachdateien sind verfügbar:
#     'de', 'en', 'es', 'fr', 'it', 'nl', 'pl', 'pt_BR' und 'ru'.
#
#   - Englisch ist bereits integriert, die übrigen Sprachen sind im mit-
#     gelieferten Verzeichnis 'resources/translations' gespeichert.
#
language = auto

# Stellt den zu emulierenden Videoadapter oder Rechner ein.
# Mögliche Werte:
#
#   hercules:       Hercules-Grafikkarte (HGC) (siehe 'monochrome_palette').
#
#   cga_mono:       CGA-Adapter, angeschlossen an einen monochromen Monitor
#                   (siehe 'monochrome_palette').
#
#   cga:            IBM Color Graphics Adapter (CGA). Ermöglicht auch Composite
#                   Videoemulation (siehe Abschnitt [composite]).
#
#   pcjr:           Ein IBM PCjr-Rechner. Ermöglicht auch PCjr-Sound- und 
#                   Composite-Video-Emulation (siehe Abschnitt [composite]).
#
#   Tandy:          Ein Tandy 1000 Rechner mit TGA-Grafik. Ermöglicht auch Tandy
#                   Sound- und Composite-Video-Emulation (siehe [Composite]
#                   Abschnitt).
#
#   ega:            IBM Enhanced Graphics Adapter (EGA).
#
#   svga_paradise:  Paradise PVGA1A SVGA-Karte (kein VESA VBE; 512K vmem als 
#                   Standard, kann mit 'vmemsize' auf 256K oder 1MB gesetzt 
#                   werden). Sie kommt dem originalen VGA-Adapter von IBM am 
#                   nächsten.
#
#   svga_et3000:    Tseng Labs ET3000 SVGA-Karte (kein VESA VBE;
#                   festes 512K Vmem).
#
#   svga_et4000:    Tseng Labs ET4000 SVGA-Karte (kein VESA VBE; 1MB vmem als
#                   Standard, kann mit 'vmemsize' auf 256K oder 512K eingestellt 
#                   werden).
#
#   svga_s3:        S3 Trio64 (VESA VBE 2.0; 4MB vmem standardmäßig, kann auf
#                   512K, 1MB, 2MB oder 8MB mit 'vmemsize' geändert werden)
#                   (Standardeinstellung)
#
#   vesa_oldvbe:    Dasselbe wie 'svga_s3', aber beschränkt auf VESA VBE 1.2.
#
#   vesa_nolfb:     Gleich wie 'svga_s3' (VESA VBE 2.0), inkl. 'no linear
#                   Framebuffer'-Hack (wird von einigen Spielen benötigt).
#
machine = svga_s3

# Die Menge an Speicher, die DOSBox emuliert, in MB (Standardwert '16').
# Dieser Wert wird am besten auf dem Standardwert belassen, um Probleme mit
# einigen Spielen zu vermeiden, obwohl einige wenige Spiele einen höheren
# Wert benötigen könnten. Es gibt generell keinen Geschwindigkeitsvorteil,
# wenn du diesen Wert erhöhst.
#
memsize = 16

# Wie durch Software beschädigte Speicherkettenblöcke behandelt werden sollten.
# Mögliche Werte:
#
#   repair:  Repariere (und melde) Fehler mit Hilfe benachbarter Blöcke
#            (Standard).
#   report:  Melde Fehler, aber fahre ansonsten so fort, als ob nichts gewesen
#            wäre.
#   allow:   Erlaube Fehler und gib keine Meldung aus (Hardwareverhalten).
#   deny:    Beenden (und melden), wenn Fehler entdeckt werden.
#
mcb_fault_strategy = repair

# Videospeicher in MB (1-8) oder KB (256 bis 8192). 'auto' verwendet den
# Standardwert für den verwendeten Videoadapter (Standardwert 'auto'). Siehe den 
# Parameter 'machine' für die Liste der gültigen Optionen je Adapter.
#
vmemsize = auto

# Emulation des Zugriffszeit auf den Videospeicher (standardmäßig 'off').
# Mögliche Werte:
#
#   off:    Deaktiviert Emulation der Videospeicherzugriffszeit (Voreinstellung).
#           Dies ist für die meisten Spiele zu bevorzugen, um Verlangsamungen zu
#           vermeiden.
#
#   on:     Aktiviert Emulation der Zugriffszeit des Videospeichers (3000 ns).
#           Dies kann helfen, Flimmern in Hercules-, CGA-, EGA- und frühen VGA-
#           Spielen zu reduzieren oder zu eliminieren.
#
#   <Wert>: Legt die Zugriffszeit in Nanosekunden fest. Der gültige Bereich ist
#           0 bis 20000 ns; 500 bis 5000 ns ist der nützlichste Bereich.
#
# Hinweis:  Stelle diesen Wert nur bei Bedarf pro Spiel ein, da er den gesamten
#           Emulator verlangsamt.
#
vmem_delay = off

# Die Bildwiederholfrequenz des emulierten DOS-Videomodus durch eine benutzer-
# definierte Frequenz überschreiben (Standardwert: 'default'). Mögliche Werte:
#
#   default:   Nicht überschreiben; die Bildwiederholfrequenz des emulierten 
#              DOS-Videomodus verwenden (Standard).
#
#   host:      Überschreibt die Bildwiederholfrequenz aller DOS-Videomodi durch
#              die Bildwiederholfrequenz Ihres Monitors. Dies ermöglicht es
#              Ihnen möglicherweise, einige 70-Hz-VGA-Spiele mit perfekter Vsync
#              auf einem Monitor mit fester Bildwiederholfrequenz von 60 Hz zu
#              spielen (siehe 'vsync' für weitere Details).
#
#   <Zahl>:    Überschreibt die Bildwiederholfrequenz aller DOS-Videomodi durch
#              einen festen Wert in Hz (gültiger Bereich: 24,000 bis 1000,000).
#              Dies ist eine Nischenoption für einige wenige rasante 3D-Spiele
#              aus der Mitte bis zum Ende der 1990er Jahre, die für das Spielen
#              mit hoher Bildwiederholfrequenz ausgelegt sind.
#
# Hinweis: Viele Spiele verhalten sich fehlerhaft, wenn die Bildwiederholfrequenz
#          des DOS-Grafikmodus durch nicht standardmäßige Werte überschrieben wird.
#          Dies kann sich in Bildstörungen, beschleunigtem oder verlangsamtem Ton,
#          ruckelnden Mausbewegungen, nicht registrierten Mausklicks und sogar
#          Spielfehlern äußern. Das Überschreiben der DOS-Bildwiederholrate ist
#          ein Hack, der nur bei einer kleinen Untergruppe aller DOS-Spiele
#          (typischerweise Spiele aus der Mitte bis Ende der 1990er Jahre)
#          akzeptabel funktioniert.
#
dos_rate = default

# Legt fest, welche VESA-Bildschirmauflösungen verfügbar sind (standardmäßig
# 'kompatibel'). Mögliche Werte:
#
#   kompatibel:  Nur die am besten kompatiblen VESA-Modi für die konfigurierte
#                Grafikspeichergröße (Standard). Empfohlen bei 4 oder 8 MB
#                Grafikspeicher ('vmemsize') für größtmögliche Kompatibilität
#                mit Spielen. 320x200-High-Color-Modi sind ausgeschlossen, da
#                sie erst Ende der 90er Jahre ordnungsgemäß unterstützt wurden.
#                Die linearen 256-Farben-Framebuffer-Modi 320x240, 400x300 und
#                512x384 sind ebenfalls ausgeschlossen, da sie in Spielen der
#                Build Engine zu Timing-Problemen führen.
#
#   halfline:    Wie 'compatible', jedoch wird der 120h-VESA-Modus durch einen
#                speziellen Halfline-Modus ersetzt, der von Extreme Assault
#                verwendet wird. Nur bei Bedarf verwenden.
#
#   All:         Alle Modi sind verfügbar, einschließlich zusätzlicher DOSBox-
#                spezifischer VESA-Modi. Verwendet 8 MB Grafikspeicher, um
#                optimale Ergebnisse zu erzielen. Einige Spiele verhalten sich
#                in bestimmten VESA-Modi fehlerhaft; versuche es in diesem
#                Fall mit dem 'kompatiblen' Modus. Die in diesem Modus verfüg-
#                baren 320x200-High-Color-Modi werden häufig von Demoszene-
#                Produktionen aus den späten 90er Jahren benötigt.
#
vesa_modes = compatible

# Verwende 8 Pixel breite Schriftarten auf VGA-Adaptern
# (standardmäßig deaktiviert).
#
vga_8dot_font = off

# Wie Autoexec-Abschnitte aus mehreren Konfigurationsdateien behandelt werden
# (standardmäßig 'join'). Mögliche Werte:
#
#   join:       Fasst sie in einem großen Abschnitt zusammen (Standard).
#
#   overwrite:  Verwende die zuletzt gefundene, wie bei anderen Konfig-
#               Einstellungen.
#
autoexec_section = join

# Bindet Verzeichnisse 'drives/[c]' beim Start als Laufwerke ein, wobei [c]
# ein klein geschriebener Laufwerksbuchstabe von a bis y ist (Standardmäßig 'on').
# Der Ordner 'drives' kann relativ zum aktuellen Verzeichnis oder über die inte-
# grierten Ressourcen angegeben werden. Die Mount-Einstellungen können optional
# in einer [c].conf-Datei in dem Verzeichnis des Laufwerks mit folgendem Inhalt
# angegeben werden:
#
#   [laufwerk]
#   type    = dir, overlay, floppy, cdrom oder iso (wie cdrom)
#   label   = Laufwerksbezeichnung
#   path    = Pfadangabe (z.B.: path = %path%;c:\tools)
#   override_drive = das Verzeichnis stattdessen auf dieses Laufwerk mounten
#                    (standardmäßig leer)
#   verbose = true oder false
#
automount = on

# Bestimmt die Ausführlichkeit der Anzeigen, bevor das Programm angezeigt
# wird. (Standardmäßig 'auto'):
#
# Verbosität  |Willkommen| Frühe Ausgabe
# high        |   ja     |    ja
# low         |  nein    |    ja
# quiet       |  nein    |   nein
# auto        | 'low' wenn Dateiname oder Verzeichnis übergeben werden,
#                     ansonsten 'high'
#
startup_verbosity = auto

# Viele Spiele öffnen alle ihre Dateien mit Schreibberechtigung, auch solche, die
# sie nie ändern. Mit dieser Einstellung kann man diese Dateien mit einem
# Schreibschutz versehen und trotzdem ermöglichen, dass das Spiel sie lesen kann
# (standardmäßig aktiviert). Ein zweiter Anwendungsfall: Wenn man ein Copy-On-
# Write oder ein netzwerkbasiertes Dateisystem verwendet, vermeidet diese
# Einstellung die Verwendung von Schreiboperationen für diese schreibgeschützten
# Dateien.
#
allow_write_protected_files = on

# Abkürzungen für die einfachere Konfigurationsverwaltung zulassen (standardmäßig
# aktiviert). D.h. anstelle von 'config -set sbtype sb16' genügt die Ausführung
# von 'sbtype sb16', und anstelle von 'config -get sbtype' kannst du einfach
# 'sbtype' eingeben.
#
shell_config_shortcuts = on

# Legt die Geschwindigkeit der emulierten Festplatte fest
# (Standardwert: 'maximal'). Mögliche Werte:
#
#   maximum:  So schnell wie möglich, keine Verlangsamung (Standard)
#   fast:     Festplattengeschwindigkeit Mitte der 1990er Jahre (~15 MB/s)
#   medium:   Festplattengeschwindigkeit Anfang der 1990er Jahre (~2,5 MB/s)
#   slow:     Festplattengeschwindigkeit der 1980er Jahre (~600 kB/s)
#
hard_disk_speed = maximum

# Legt die Geschwindigkeit der emulierten Diskette fest
# (Standardwert: 'maximal'). Mögliche Werte:
#
#   maximum:  So schnell wie möglich, keine Verlangsamung (Standard)
#   fast:     Geschwindigkeit für ED-Disketten (~120 kB/s)
#   medium:   Geschwindigkeit für HD-Disketten (~60 kB/s)
#   slow:     Geschwindigkeit für DD-Disketten (~30 kB/s)
#
floppy_disk_speed = maximum


[render]

# Legt einen adaptiven CRT-Monitor-Emulations-Shader oder einen regulären
# Shader fest (Standardwert: 'crt-auto'). Shader werden nur im OpenGL-
# Ausgabemodus unterstützt (siehe 'output'). Optionen für den adaptiven
# CRT-Shader:
#
#   crt-auto:               Adaptiver CRT-Shader, der die Absicht der Entwickler
#                           sowie die Spielerfahrung der Nutzer zum Zeitpunkt der
#                           Veröffentlichung in den Vordergrund stellt (Standard).
#                           Eine geeignete Shader-Variante wird automatisch
#                           ausgewählt, basierend auf dem Grafikstandard des
#                           aktuellen Videomodus und der Größe des Bildausschnitts,
#                           unabhängig von der Einstellung 'machine'. Das bedeutet,
#                           dass du den authentischen Look eines single-scan
#                           CGA- und EGA-Monitors mit sichtbaren Scanlinien in CGA-
#                           und EGA-Spielen erhalten, selbst auf einem emulierten
#                           VGA-Adapter. Der 'Sharp'-Shader wird bei einer
#                           vertikalen Skalierung unter 3,0x verwendet.
#
#   crt-auto-machine:       Eine Variante von 'crt-auto'; diese emuliert einen
#                           fixen CRT-Monitor für den über die Einstellung 'machine'
#                           konfigurierten Grafikadapter. Beispielsweise werden CGA-
#                           und EGA-Spiele auf einem emulierten VGA-Adapter mit
#                           double-scanning angezeigt.
#
#   crt-auto-arcade:        Emulation eines Arcade- oder Heimcomputermonitors mit
#                           einer geringeren Bildschärfe und dicken Scanlinien in
#                           Videomodi mit niedriger Auflösung. Dies ist eine fiktive
#                           Option, die in der Realität nie existiert hat, aber viel
#                           Spaß machen kann, insbesondere bei DOS-Portierungen
#                           von Amiga-Spielen.
#
#   crt-auto-arcade-sharp: Eine Variante des Arcade-Shaders mit höherer Schärfe für
#                          alle, die dicke Scanlinien mögen, aber die Schärfe eines
#                          typischen PC-Monitors beibehalten möchten.
#
# Weitere Shader-Optionen sind unter anderem (nicht erschöpfende Liste):
#
#   sharp:     Skaliert das Bild hoch, wobei die Pixel als kleine Rechtecke
#              behandelt werden, was zu einem scharfen Bild mit minimaler
#              Unschärfe führt, während das korrekte Pixelseitenverhältnis
#              beibehalten wird. Dies ist die empfohlene Option für diejenigen,
#              die die adaptiven CRT-Shader nicht verwenden möchten.
#
#   bilinear:  Das Bild wird mittels bilinearer Interpolation hochskaliert
#              (führt zu einem unscharfen Bild).
#
#   nearest:   Skaliert das Bild mit der Nearest-Neighbor-Interpolation
#              (auch bekannt als 'no bilinear'). Dies führt zu einem möglichst
#              scharfen Bild auf Kosten ungleichmäßiger Pixel, insbesondere
#              bei nicht quadratischen Pixel-Seitenverhältnissen (auf
#              hochauflösenden Monitoren ist dies weniger ein Problem).
#
# Starte DOSBox Staging mit der Befehlszeilenoption '--list-shaders',
# um die vollständige Liste der verfügbaren Shader anzuzeigen. Du kannst auch
# einen absoluten oder relativen Pfad zu einer Datei angeben. In allen Fällen
# kannst du die Dateiendung '.glsl' des Shaders weglassen.
#
shader = crt-auto

# Modus für die Korrektur des Seitenverhältnisses (standardmäßig 'auto').
# Mögliche Werte:
#
#   auto, on:            Umrechnung des Seitenverhältnisses für moderne
#                        Flachbildschirme mit quadratischen Pixeln, damit DOS-
#                        Auflösungen mit nicht-quadratischen Pixeln wie auf einem
#                        4:3 CRT-Monitor, für den die meisten DOS-Spiele
#                        entwickelt wurden, dargestellt werden (standardmäßig
#                        aktiviert). Diese Einstellung betrifft nur Videomodi,
#                        die nicht-quadratische Pixel verwenden, wie 320x200 oder
#                        640x400; während Modi mit quadratischen Pixeln, wie
#                        640x480 und 800x600, unverändert angezeigt werden.
#
#   square pixels, off:  Wendet keine Seitenverhältniskorrektur an; alle DOS-
#                        Videomodi werden mit quadratischen Pixeln angezeigt. Die
#                        meisten 320x200 Spiele werden gequetscht dargestellt,
#                        aber eine Minderheit von Titeln (z.B. DOS-Portierungen
#                        von PAL-Amiga-Spielen) brauchen quadratische Pixel, um
#                        um so zu erscheinen, wie es die Künstler beabsichtigt
#                        haben.
#
#   stretch:             Berechnet das Seitenverhältnis aus den Abmessungen des
#                        Bildausschnitts.
#                        Kombiniert mit 'viewport', ist dieser Modus
#                        nützlich, um beliebige Seitenverhältnisse zu erzwingen
#                        (z.B. um DOS-Spiele auf 16:9-Displays auf Vollbild zu
#                        strecken) und um die horizontalen und vertikalen
#                        Größeneinstellungsmöglichkeiten von CRT-Monitoren zu
#                        emulieren.
#
aspect = stretch

# Constrain the horizontal or vertical scaling factor to the largest integer
# value so the image still fits into the viewport ('auto' by default). The
# configured aspect ratio is always maintained according to the 'aspect' and
# 'viewport' settings, which may result in a non-integer scaling factor in the
# other dimension. If the image is larger than the viewport, the integer scaling
# constraint is auto-disabled (same as 'off'). Possible values:
#
#   auto:        A special vertical mode auto-enabled only for the CRT shaders
#                (see `shader`). This mode has refinements over standard vertical
#                integer scaling: 3.5x and 4.5x scaling factors are also allowed,
#                and integer scaling is disabled above 5.0x scaling.
#
#   vertical:    Constrain the vertical scaling factor to integer values. This is
#                the recommended setting for 3rd party CRT shaders with scanline
#                simulation to avoid uneven scanlines and interference artifacts.
#                For the built-in CRT shaders, use 'auto'.
#
#   horizontal:  Constrain the horizontal scaling factor to integer values. Might
#                be useful on low-resolution displays to optimise for horizontal
#                text sharpness.
#
#   off:         Apply no integer scaling constraint; the image fills the viewport
#                while maintaining the configured aspect ratio.
#
integer_scaling = off

# Legt die Größe des Bildausschnitts fest (Standardwert: 'fit'). Dies ist
# der maximale Zeichenbereich; die Videoausgabe wird stets innerhalb des Bildaus-
# schnitts dargestellt, wobei das konfigurierte Seitenverhältnis berücksichtigt
# wird (siehe 'aspect'). Mögliche Werte:
#
#   fit:             Passt das Ansichtsfenster in das verfügbare Fenster bzw.
#                    die verfügbare Bildschirmgröße ein (Standard).
#                    Bei aktivierter 'integer_scaling'-Funktion können um das
#                    Bild herum schwarze Bereiche (Balken) dargestellt werden.
#
#   WxH:             Legt eine feste Größe des Ansichtsfensters im Format WxH in
#                    logischen Einheiten fest (z.B. 960x720). Die angegebene
#                    Größe darf nicht größer sein als der Desktop. Wenn sie
#                    größer als die Fenstergröße ist, wird sie skaliert, um in
#                    das Fenster zu passen.
#
#   N%:              Ähnlich wie 'WxH', aber die Größe wird als Prozentsatz
#                    der Desktopgröße angegeben.
#
#   relative H% V%:  Das Ansichtsfenster wird auf ein Rechteck im Seiten-
#                    verhältnis 4:3 eingestellt, das in das verfügbare Fenster/
#                    Bildschirm passt, dann wird es mit den horizontalen und
#                    vertikalen Skalierungsfaktoren (gültiger Bereich von
#                    20% bis 300%) skaliert. Das resultierende Ansichtsfenster
#                    darf sich über das Fenster/den Bildschirm hinaus erstrecken.
#                    Nützlich, um beliebige Seitenverhältnisse mit
#                    'aspect = stretch'zu erzwingen und in das Bild zu zoomen.
#                    Dies emuliert effektiv die horizontalen und vertikalen
#                    Größeneinstellungsmöglichkeiten von CRT-Monitoren.
#
# Anmerkungen:
#  - Die Verwendung von 'relative' mit aktiviertem 'integer_scaling'
#    könnte zu überraschenden (aber korrekten) Ergebnissen führen.
#
#  - Du kannst die Hotkey-Aktionen 'Stretch Axis', 'Inc Stretch' und
#    'Dec Stretch' verwenden, um die Streckung im 'relativen' Modus in Echtzeit
#    einzustellen.
#
viewport = 99%

# Legt die Palette für die Emulation einer monochromen Anzeige fest
# (Standardwert: 'amber'). Funktioniert nur mit den Maschinentypen 'hercules'
# und 'cga_mono'. Mögliche Werte:
#
#   amber:       Amber-Palette (Standard).
#   green:       Grüne Palette.
#   white:       Weiße Palette.
#   paperwhite:  Paperwhite-Palette.
#
# Hinweis: Du kannst auch über Tastenkombinationen zwischen den verfügbaren
# Paletten wechseln.
#
monochrome_palette = amber

# Legt die Interpretation von CGA-RGBI-Farben fest (standardmäßig 'default').
# Betrifft alle Gerätetypen, die CGA- oder höhere Grafikauflösungen darstellen
# können, einschließlich des PCjr, des Tandy sowie der CGA-/EGA-Modi auf VGA-
# Adaptern. Beachte, dass diese Farben zusätzlich durch die Einstellungen
# für die Videoausgabe angepasst werden (siehe 'crt_color_profile', 'brightness',
# 'saturation' usw.). Integrierte Voreinstellungen:
#
#   default:       Klassische CGA-Palette, wie sie von VGA-Adaptern emuliert
#                  wird (Standard).
#
#   tandy <bl>:    Emulation eines idealisierten Tandy-Monitors mit einstell-
#                  barem Braunton. Der Braunton kann als optionaler zweiter
#                  Parameter angegeben werden (0 – rot, 50 – braun, 100 – 
#                  dunkelgelb; Standardwert ist 50). Z. B.: tandy 100
#
#   tandy-warm:    Emulation der tatsächlichen Farbwiedergabe eines unbekannten
#                  Tandy-Monitors. Zur Verwendung mit 'crt_color_profile = none'
#                  und 'color_temperature = 6500'.
#
#
#   ibm5153 <c>:   Emulation der tatsächlichen Farbdarstellung eines IBM 5153-
#                  Monitors mit einer speziellen Kontraststeuerung, die aus-
#                  schließlich nicht-helle Farben abdunkelt. Der Kontrast kann
#                  optional als zweiter Parameter angegeben werden (0 bis 100;
#                  Standardwert ist 100), z. B. ibm5153 60. Zur Verwendung mit
#                  'crt_color_profile = none' und 'color_temperature = 6500'.
#
#   agi-amiga-v1, agi-amiga-v2, agi-amiga-v3:
#                  Paletten, die von den Amiga-Portierungen der Sierra AGI
#                  Spiele verwendet werden.
#
#   agi-amigaish:  Eine Mischung aus EGA- und Amiga-Farben, die der Sarien
#                  AGI-Interpreter verwendet.
#
#   scumm-amiga:   Palette, die von den Amiga-Portierungen der EGA-Spiele von
#                  LucasArts verwendet wird.
#
#   colodore:      Vom Commodore 64 inspirierte Farben, die auf der Colodore-
#                  Palette basieren.
#
#   colodore-sat:  Colodore-Palette mit 20% mehr Sättigung.
#
#   dga16:         Eine moderne Interpretation der klassischen CGA-Palette mit
#                  reduziertem Kontrast.
#
# Du kannst auch benutzerdefinierte Farben einstellen, indem du 16 durch
# Leerzeichen oder Kommata getrennte Farbwerte angibst, entweder als 3- oder
# 6-stellige Hex-Codes (z. B. #f00 oder #ff0000 für Rot) oder als dezimale
# RGB-Tripletts (z. B. (255, 0, 255) für Magenta). Die 16 Farben
# haben folgende Reihenfolge:
#
#   Schwarz, Blau, Grün, Cyan, Rot, Magenta, Braun, Hellgrau, Dunkelgrau,
#   Hellblau, Hellgrün, Hellcyan, Hellrot, Hellmagenta, Gelb, Weiß.
#
# Ihre Standardwerte, die hier im 6-stelligen Hex-Code-Format dargestellt sind,
# sind:
#   #000000 #0000aa #00aa00 #00aaaa #aa0000 #aa00aa #aa5500 #aaaaaa
#   #555555 #5555ff #55ff55 #55ffff #ff5555 #ff55ff #ffff55 #ffffff
#
cga_colors = default

# Set the colour space of the video output ('srgb' by default). This setting
# allows to take advantage of wide color gamut monitors and to more accurately
# emulate CRT colors. Possible values:
#
#   srgb:        Der sRGB-Farbraum als kleinster gemeinsamer Nenner ohne
#                erweiterten Farbraum mit einem Weißpunkt von 6500 K und
#                sRGB-Gamma (Standard).
#
#   display-p3:  Display P3 – Farbraum mit großem Farbumfang, 6500 K Weißpunkt
#                und sRGB-Gamma.
#
#   dci-p3:      Standard-Farbraum DCI-P3 mit großem Farbumfang, DCI-Weißpunkt
#                (~6300 K) und einem Gammawert von 2,6. Verwende stattdessen
#                'dci-p3-d65', wenn die Weiß-und Grautöne auf deinem Monitor im
#                DCI-P3-Modus einen grünlichen Stich aufweisen.
#
#   dci-p3-d65:  DCI-P3-Variante mit modifiziertem D65-Weißpunkt (6500 K) und
#                einem Gammawert von 2,6. Verwende  stattdessen 'dci-p3',
#                wenn die Weiß- und Grautöne auf deinem Monitor im DCI-P3-Modus
#                einen gelblichen Stich aufweisen.
#
#   modern-p3:   Einstellung für handelsübliche Verbraucher- und Gaming-Monitore,
#                die nur eine Farbraumabdeckung von etwa 90% des DCI-P3-Farbraums
#                erreichen (Weißpunkt 6500K, sRGB-Gamma). Verwende die
#                anderen DCI-P3-Farbräume, wenn die DCI-P3-Abdeckung deines
#                Monitors bei nahezu 100% liegt.
#
#   adobe-rgb:   AdobeRGB 2020-Farbraum mit großem Farbumfang, 6500K-Weißpunkt
#                und Gamma 2,2.
#
#   rec-2020:    Rec.2020-Farbraum mit großem Farbumfang, einem Weißpunkt
#                von 6500 K und einem Gammawert von 2,2
#               .
#
# Hinweise:
#   - Farbraumtransformationen werden auf gerenderte Screenshots angewendet,
#     nicht jedoch auf unbearbeitete und hochskalierte Screenshots sowie
#     Videoaufnahmen (diese liegen immer im sRGB-Farbraum vor).
#
#   - Diese Funktion ist nur im OpenGL-Ausgabemodus verfügbar.
#
#   - Die Einstellung muss mit dem auf deinem Monitor eingestellten Farbraum
#     übereinstimmen.
#
#   - Du musst jegliches Farbmanagement auf Betriebssystem- und
#     Grafiktreiberebene deaktivieren und darfst keine Farbmanagementprogramme
#     von Drittanbietern für DOSBox Staging verwenden, da es sonst zu
#     Farbfehlern kommt.
#
color_space = srgb

# Bildanpassungen aktivieren (standardmäßig 'ein'). Bei deaktivierter Option haben
# die Einstellungen für die Bildanpassung im Render-Bereich (z. B.
# 'crt_color_profile', 'brightness', 'contrast' usw.) keine Wirkung, und für die
# Videoausgabe werden die rohen RGB-Werte verwendet. Die Farbraumkonvertierung
# ist immer aktiv und kann nicht deaktiviert werden (siehe 'color_space').
#
# Hinweise:
#   - Bildanpassungen funktionieren nur im OpenGL-Ausgabemodus.
#
#   - Die Anpassungen werden auf gerenderte Screenshots angewendet, nicht jedoch
#     auf unbearbeitete und hochskalierte Screenshots und Videoaufnahmen.
#
#   - Verwende die Hotkeys 'PrevImageAdj' und 'NextImageAdj', um eine
#     Bildanpassungseinstellung auszuwählen, und die Hotkeys 'DecImageAdj' und
#     'IncImageAdj', um die Einstellungen in Echtzeit anzupassen. Kopiere
#     die neuen Einstellungen aus den Protokollen in Ihre Konfiguration oder
#     erstelle mit dem Befehl 'CONFIG -wc' eine neue Konfiguration.
#
image_adjustments = on

# Legt ein CRT-Farbprofil fest, um eine authentischere Emulation der
# Videoausgabe zu erzielen (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:       Wählt ein authentisches Farbprofil aus, das für den aktuell
#               aktiven adaptiven CRT-Shader geeignet ist (z. B. 'crt-auto'),
#               oder für den aktuellen Maschinentyp bei regulären Shadern
#               (z. B. 'sharp').
#
#   none:       Zeigt Rohfarben ohne jegliche Farbprofil-Transformationen an.
#
#   ebu:        EBU-Standard-Leuchtstoffemulation, die in professionellen
#               High-End-CRT-Monitoren wie der Sony BVM/PVM-Serie verwendet
#               wird.
#
#   p22:        P22-Leuchtstoffemulation, die am häufigsten in CRT-Monitoren
#               der unteren Preisklasse verwendet wird.
#
#   smpte-c:    SMPT 'C'-Leuchtstoffemulation, der Standard für amerikanische
#               Fernsehmonitore.
#
#   philips:    Die Farben des Philips-CRT-Monitors entsprechen denen typischer
#               15-kHz-Heimcomputer-Monitore (z. B. des Commodore 1084S).
#               Dieses Profil ist für die Verwendung mit einer auf 6500K einge-
#               stellten 'color_temperature' vorgesehen. Die Ausgabe wirkt dann
#               aufgrund der für Philips-CRTs typischen Farbtemperatur von ~6100K,
#               die in diesem Profil 'fest eingebaut' ist, gelblich. Du kannst
#               weiterhin 'color_temperature' anpassen, um den Weißabgleich
#               einzustellen. Für möglichst genaue Ergebnisse ist ein DCI-P3-
#               Display mit großem Farbraum erforderlich.
#
#   trinitron:  Typische Farben von Sony Trinitron-Röhrenfernsehern und
#               -Monitoren. Dieses Profil ist für die Verwendung mit einer auf
#               6500 eingestellten 'color_temperature' vorgesehen. Die Ausgabe
#               wirkt dann bläulich, da die für Trinitron-Röhren typische Farb-
#               temperatur von ca. 9300K in diesem Profil 'fest eingebaut' ist.
#               Du kannst 'color_temperature' dennoch anpassen, um den relativen
#               Weißabgleich einzustellen. Für die genauesten Ergebnisse ist ein
#               DCI-P3-Display mit großem Farbraum erforderlich.
#
crt_color_profile = auto

# Stellt die Helligkeit des Videoausgangs ein (Standardwert: 45). Der
# zulässige Bereich liegt zwischen 0 und 100. Dies emuliert die Helligkeits-
# regelung von CRT-Monitoren, mit der der Schwarzpunkt eingestellt wird;
# höhere Werte führen zu aufgehellten Schwarztönen.
#
brightness = 45

# Stellt den Kontrast der Videoausgabe ein (Standardwert: 65). Der zulässige
# Bereich liegt zwischen 0 und 100. Dies emuliert die Kontrastregelung von CRT-
# Monitoren, mit der der Weißpunkt eingestellt wird; höhere Werte führen zu
# aufgehellten Schwarzwerten (verringere dazu den Wert 'brightness',
# um dies auszugleichen).
#
contrast = 65

# Stellt den Gammawert der Videoausgabe ein (Standardwert: 0). Der zulässige
# Bereich liegt zwischen -50 und 50. Dies ist eine zusätzliche Gammaanpassung
# relativ zum Gammawert des emulierten virtuellen Monitors.
#
gamma = 0

# Stellt den digitalen Kontrast des Videoausgangs ein (Standardwert: 0). Der
# zulässige Bereich liegt zwischen -50 und 50. Dies funktioniert ganz anders als
# die Einstellung 'contrast' des virtuellen Monitors; der digitale Kontrast wird
# auf die rohen RGB-Werte des Framebuffer-Bildes angewendet.
#
digital_contrast = 0

# Erhöht den Schwarzwert der Videoausgabe (Standardwert: 'auto'). Diese Ein-
# stellung wird vor den Einstellungen für 'brightness' und 'contrast' angewendet,
# die ebenfalls den Schwarzwert erhöhen können, sodass sie effektiv als
# Schwarzwertverstärkung wirkt. Mögliche Werte:
#
#   auto:      Erhöht den Schwarzwert nur für die Videomodi PCjr, Tandy, CGA und
#              EGA bei adaptiven CRT-Shadern; für alle anderen Shader verwende
#              0 (Standard).
#
#   <Zahl>:    Legt den Wert für die Anhebung des Schwarzwertes fest. Der gültige
#              Bereich liegt zwischen 0 und 100. Bei 0 wird der Schwarzwert nicht
#              angehoben.
#
# Hinweis: Die Anhebung des Schwarzwertes ist nützlich für die Emulation von
#          'schwarzen Scanlines'; dies verleiht PCjr-, Tandy-, CGA- und EGA-
#          Spielen mit einfacher Grafik mehr visuelle Attraktivität.
#
black_level = auto

# Stellt die Sättigung der Videoausgabe ein (Standardwert: 0). Der zulässige
# Bereich liegt zwischen -50 und 50. Hierbei handelt es sich um eine digitale
# Sättigung, die auf die rohen RGB-Werte des Framebuffer-Bildes angewendet wird,
# ähnlich wie bei 'digital_contrast'.
#
saturation = 0

# Stellt die Farbtemperatur (Weißpunkt) des Videoausgangs ein
# (standardmäßig 'auto'). Mögliche Werte:
#
#   auto:      Wählt eine authentische Farbtemperatur aus, die für den
#              aktuell aktiven adaptiven CRT-Shader (z. B. 'crt-auto')
#              oder den aktuellen Gerätetyp bei regulären Shadern (z. B.
#              'sharp') geeignet ist.
#   <Zahl>:  Gib die Farbtemperatur in Kelvin (K) an. Der gültige
#              Bereich liegt zwischen 3000 und 10000. 6500 K ist der
#              Neutralpunkt für die meisten modernen Bildschirme. Werte
#              unter 6500 führen zu wärmeren Farben, Werte über 6500 zu
#              kühleren Farben.
#
color_temperature = auto

# Beibehaltung der Helligkeit des Videoausgangs vor der Anpassung der Farb-
# temperatur (Standardwert: 0). Der gültige Bereich liegt zwischen 0 und 100.
# Bei 0 erfolgt keine Helligkeitserhaltung, bei 100 wird die Helligkeit voll-
# ständig beibehalten. Werte über 0 führen zu ungenauen Farbtemperaturen in
# den helleren Farbtönen; daher empfiehlt es sich, diesen Wert auf 0 oder
# nahe 0 einzustellen, wenn Ihr Monitor hell genug ist.
#
color_temperature_luma_preserve = 0

# Stellt den Verstärkungsfaktor des roten Kanals des Videoausgangs ein
# (Standardwert: 100). Der gültige Bereich liegt zwischen 0 und 200.
# Bei einem Wert von 100 erfolgt keine Änderung.
#
red_gain = 100

# Legt den Verstärkungsfaktor des Grünkanals des Videoausgangs fest
# (Standardwert: 100). Der gültige Bereich liegt zwischen 0 und 200. Bei
# einem Wert von 100 erfolgt keine Änderung.
#
green_gain = 100

# Stellt den Verstärkungsfaktor des Blaukanals des Videoausgangs ein
# (Standardwert: 100). Der zulässige Bereich liegt zwischen 0 und 200.
# Bei einem Wert von 100 erfolgt keine Änderung.
#
blue_gain = 100

# Entfernt schwarze Zeilen aus Interlaced-Videos (standardmäßig auf 'off'
# gesetzt). Zu verwenden bei Spielen, die Videoinhalte mit abwechselnden schwarzen
# Zeilen anzeigen. Dieser Trick funktionierte gut auf CRT-Monitoren, um die wahr-
# genommene Auflösung zu erhöhen und gleichzeitig Speicherplatz zu sparen, führte
# jedoch zu Helligkeitsverlusten. Mögliche Werte:
#
#   off:     Deinterlacing deaktivieren (Standard).
#
#   on:      Deinterlacing mit mittlerer Stärke aktivieren.
#
#   light:   Leichtes Deinterlacing. Schwarze Scanlinien werden weicher dar-
# gestellt, um den CRT-Look nachzuahmen.
#
#   medium:  Mittleres Deinterlacing. Optimales Gleichgewicht zwischen der
#            Beseitigung schwarzer Streifen, der Erhöhung der Helligkeit und
#            der Beibehaltung des hochauflösenden Bildes.
#
#   strong:  Starkes Deinterlacing. Die Bildhelligkeit wird fast vollständig
#            wiederhergestellt, allerdings auf Kosten des hochauflösenden
#            Bildes.
#
#   full:    Vollständiges Deinterlacing. Beseitigt schwarze Streifen voll-
#            ständig und maximiert die Helligkeit, das Bild wirkt jedoch
#            blockiger.
#
# Hinweis: Bei Bildschirmen mit niedrigerer Auflösung wird empfohlen, die
#          vertikale 'integer_scaling'-Funktion zu aktivieren, um Inter-
#          ferenzartefakte bei Verwendung niedrigerer Deinterlacing-Stärken
#          zu vermeiden. Alternativ kannst du die Stärke 'full' verwenden,
#          um alle möglichen Interferenzmuster vollständig zu beseitigen.
#
deinterlacing = off

# Entfernt Schachbrett-Dither-Muster aus der Videoausgabe (standardmäßig auf
# 'off' gesetzt). Nützlich bei CGA- und EGA-Spielen, die Dither-Muster ver-
# wenden, um die Illusion einer größeren Farbpalette bei den begrenzten CGA-/
# EGA-Farbtabellen zu erzeugen. Mögliche Werte:
#
#   off:       Dedithering deaktivieren (Standard).
#   on:        Dedithering aktivieren (mit voller Stärke).
#
#   <Zahl>:  Stellt die Stärke des Dithering-Entfernungsvorgangs von 0 (aus)
#            bis 100 (volle Stärke) ein. Niedrigere Werte führen zu einer
#            subtilen Weichzeichnung der Dithering-Muster; höhere Werte sorgen
#            für einen Übergang zwischen dem Originalbild und dem Bild ohne
#            Dithering.
#
# Hinweise:
#    - Dedithering funktioniert nur im OpenGL-Ausgabemodus.
#
#    - Dedithering wird auf gerenderte Screenshots angewendet, nicht jedoch
#      auf unbearbeitete und hochskalierte Screenshots und Videoaufnahmen.
#
dedithering = off


[composite]

# Enable CGA composite monitor emulation ('auto' by default). Only available for
# 'cga', 'pcjr', and 'tandy' machine types. This allows the emulation of NTSC
# artifact colours from the raw CGA RBGI image data, just like on a real NTSC CGA
# composite monitor. Possible values:
#
#   off:   Disable composite emulation.
#
#   on:    Enable composite emulation in all video modes.
#
#   auto:  Automatically enable composite emulation for the 640x400 composite
#          mode if the game uses it (default). You need to enable composite mode
#          manually for the 320x200 mode.
#
# Note: Fine-tune the composite emulation settings (e.g., 'hue') using the
#       composite hotkeys, then copy the new settings from the logs into your
#       config.
#
composite = auto

# Zu emulierende Ära des CGA-Composite-Monitors (Standardwert: 'auto').
# Mögliche Werte:
#
#   auto:  PCjr verwendet 'new', CGA/Tandy verwenden 'old' (Standard)
#   old:   Emuliert ein frühes NTSC-IBM-CGA-Composite-Monitor-Modell.
#   new:   Emuliert ein spätes NTSC-IBM-CGA-Composite-Monitor-Modell.
#
era = auto

# Stelle den Farbton der CGA-Composite-Farben ein (Standardwert: 0).
# Der gültige Bereich liegt zwischen -360 und 360. Passe den Wert beispielsweise
# so an, dass der Himmel im Spiel blau und das Gras grün erscheint. Dies emuliert
# den Farbtonregler von CGA-Composite-Monitoren, der oft für jedes Spiel neu
# eingestellt werden musste.
#
hue = 0

# Legt die Schärfe des CGA-Zusammengesetzten Bildes fest (Standardwert: 0).
# Der zulässige Bereich liegt zwischen -50 und 50.
#
convergence = 0


[cpu]

# Zu verwendender Typ des CPU-Emulators (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:     'normaler' Kern für Real-Mode-Programme, 'dynamischer' Kern für
#             Protected-Mode-Programme (Standard). Die meisten Programme laufen
#             mit dieser Einstellung einwandfrei.
#
#   normal:   Das DOS-Spiel wird Befehl für Befehl interpretiert. Dies
#             liefert die genauesten Zeitangaben, belastet jedoch die
#             Host-CPU im Vergleich zum 'dynamischen' Kern um das 3- bis 5-fache.
#             Daher wird er im Allgemeinen nur für Real-Mode-Programme empfohlen,
#             die keine schnelle emulierte CPU benötigen oder zeitkritisch sind.
#             Der 'normale' Kern ist außerdem für Programme erforderlich, die
#             ihren Code selbst modifizieren.
#
#   simple:   Der 'normale' Kern, der für alte Real-Mode-Programme optimiert ist;
#             er bietet möglicherweise eine etwas bessere Kompatibilität mit
#             älteren Spielen.
#             Wechselt im geschützten Modus automatisch zum 'normalen' Kern.
#
#   dynamic:  Die Befehle des DOS-Programms werden blockweise in Befehle der
#             Host-CPU übersetzt und dann direkt ausgeführt. Dadurch wird die
#             Host-CPU im Vergleich zum 'normalen' Kern 3- bis 5-mal weniger
#             belastet, allerdings sind die Timings möglicherweise weniger genau.
#             Der 'dynamic'-Kern ist für anspruchsvolle DOS-Programme
#             (z. B. 3D-SVGA-Spiele) unverzichtbar. Programme, die ihren Code
#             selbst ändern, können auf dem 'dynamischen' Kern fehlerhaft laufen
#             oder abstürzen; verwende für solche Programme den 'normalen'
#             Kern.
#
core = auto

# Zu emulierender CPU-Typ (Standardwert: 'auto'). Du solltest diese Einstellung
# nur ändern, wenn das Spiel unter 'auto' nicht korrekt läuft. Mögliche Werte:
#
#   auto:          Die schnellste und kompatibelste Einstellung (Standard).
#                  Technisch gesehen handelt es sich hierbei um '386_fast' mit
#                  486-CPUID, 486-CR-Registerverhalten und zusätzlichen 486-
#                  Befehlen.
#
#   386:           386 CPUID und Berechnung der seitenbezogenen Zugriffsebene
#                  für 386.
#
#   386_fast:      Wie '386', jedoch mit weniger strengen Privilegienprüfungen
#                  für Seiten, was deutlich schneller ist.
#
#   386_prefetch:  Entspricht '386_fast' und bietet zusätzlich eine präzise
#                  Emulation der CPU-Prefetch-Warteschlange. Erfordert 
#                  'core = normal'. Diese Einstellung ist erforderlich für
#                  Programme, die ihren Code selbst modifizieren oder Anti-
#                  Debugging-Tricks einsetzen. Zu den Spielen, die '386_prefetch'
#                  erfordern, gehören Contra, FIFA International Soccer (1994),
#                  Terminator 1 und X-Men: Madness in The Murderworld.
#
#   486:           486-CPUID, 486+-spezifische Berechnung der Seitenzugriffsebene,
#                  486-CR-Register-Verhalten sowie zusätzliche 486-Befehle.
#
#   pentium:       Wie '486', jedoch mit Pentium-CPUID, Pentium-CR-Register-
#                  Verhalten und Unterstützung für den RDTSC-Befehl. Empfohlen
#                  für Windows 3.1-Spiele (z. B. 'Betrayal in Antara').
#
#   pentium_mmx:   Entspricht 'pentium' und bietet zusätzlich Unterstützung für
#                  den MMX-Befehlssatz. Nur sehr wenige Spiele nutzen MMX-Befehle;
#                  dieser ist hauptsächlich nur für Demoszene-Produktionen von
#                  Nutzen.
#
cputype = auto

# Geschwindigkeit der emulierten CPU (Standardwert: '3000'). Wenn
# 'cpu_cycles_protected' auf 'auto' gesetzt ist, legt dieser Wert die Taktzyklen
# sowohl für Programme im Real- als auch im Protected-Modus fest.
# Mögliche Werte:
#
#   <Zahl>:  Emuliert eine feste Anzahl von Zyklen pro Millisekunde (entspricht
#            in etwa MIPS). Der gültige Bereich liegt zwischen 50 und 2000000.
#
#   max:       Emuliert so viele Takte, wie die Host-CPU auf einem einzelnen
#              Kern bewältigen kann. Die Anzahl der Takte pro Millisekunde
#              kann variieren; dies kann bei einigen DOS-Programmen zu
#              Problemen führen.
# Hinweise:
#   - Die Einstellung der CPU-Geschwindigkeit auf 'max' oder auf hohe feste
#     Werte kann zu Tonausfällen und allgemeiner Trägheit führen.
#
#   - Stelle den niedrigsten festen Wert ein, bei dem das Spiel mit
#     einer akzeptablen Geschwindigkeit läuft, um die besten Ergebnisse zu
#     erzielen.
#
#   - Ungefähre Taktwerte für gängige CPUs. DOSBox führt keine taktgenaue
#     CPU-Emulation durch, daher sollten diese Werte als Ausgangspunkt dienen
#     und je nach Spiel angepasst werden.
#
#       8088 (4,77 MHz)     300
#       286-8               700
#       286-12             1500
#       386SX-20           3000
#       386DX-33           6000
#       386DX-40           8000
#       486DX-33          12000
#       486DX/2-66        25000
#       Pentium 90        50000
#       Pentium MMX-166  100000
#       Pentium II 300   200000
#
cpu_cycles = 3000

# Taktfrequenz der emulierten CPU, nur für Programme im geschützten Modus
# (Standardwert: '60000'). Mögliche Werte:
#
#   auto:      Verwendet die Einstellung 'cpu_cycles'.
#
#   <Zahl>:  Emuliert eine feste Anzahl von Takten pro Millisekunde
#            (entspricht in etwa MIPS). Der gültige Bereich liegt
#            zwischen 50 und 2000000.
#
#   max:       Emuliere so viele Zyklen, wie die Host-CPU auf einem
#              einzelnen Kern verarbeiten kann. Die Anzahl der Zyklen
#              pro Millisekunde kann variieren; dies kann bei einigen
#              DOS-Programmen zu Problemen führen.
#
# Hinweis: Weitere Informationen findest du unter der Einstellung 'cpu_cycles'.
#
cpu_cycles_protected = 25000

# Reduziere die Anzahl der emulierten CPU-Zyklen dynamisch, wenn Ihre Host-
# CPU nicht mithalten kann (standardmäßig deaktiviert). Dies wirkt sich nur auf
# feste Zyklus-Einstellungen aus. Wenn diese Option aktiviert ist, kann die Anzahl
# der Zyklen pro Millisekunde variieren; dies kann bei einigen DOS-Programmen zu
# Problemen führen.
#
cpu_throttle = off

# Anzahl der Zyklen, die mit dem Tastenkürzel 'Inc Cycles' hinzugefügt
# werden sollen (Standardwert: 10). Werte unter 100 werden als prozentuale
# Erhöhung interpretiert.
#
cycleup = 10

# Anzahl der Zyklen, die mit dem Tastenkürzel 'Dec Cycles' abgezogen werden
# sollen (Standardwert: 20). Werte unter 100 werden als prozentuale
# Verringerung interpretiert.
#
cycledown = 20

# Reduziert die CPU-Auslastung in der DOS-Shell und in einigen Anwendungen, wenn
# DOSBox im Leerlauf ist (standardmäßig aktiviert). Dies geschieht durch die Emu-
# lation des HLT-CPU-Befehls, sodass es bei Aktivierung zu Konflikten mit anderen
# Energieverwaltungstools wie DOSidle und FDAPM kommen kann.
#
cpu_idle = on


[voodoo]

# Aktiviert die 3dfx-Voodoo-Emulation (standardmäßig auf 'Ein' gesetzt).
# Hierbei handelt es sich um eine authentische Low-Level-Emulation der Voodoo-
# Karte ohne OpenGL-Passthrough, weshalb eine leistungsstarke CPU erforderlich
# ist. Bei den meisten Spielen muss der DOS-Glide-Treiber 'GLIDE2X.OVL'im Pfad
# vorhanden sein, damit der 3dfx-Modus funktioniert. Viele Spiele enthalten
# eigene Glide-Treibervarianten, bei einigen musst du jedoch eine geeignete
# Version von 'GLIDE2X.OVL' bereitstellen. Eine kleine Anzahl von Spielen
# integriert den Glide-Treiber in ihren Code, sodass sie 'GLIDE2X.OVL' nicht
# benötigen.
#
voodoo = on

# Legt die Größe des Videospeichers für 3dfx-Voodoo-Grafikkarten fest
# (Standardwert: 4). Der Speicher wird von der Frame-Buffer-Schnittstelle
# (FBI) und der Textur-Mapping-Einheit (TMU) genutzt. Mögliche Werte:
#
#    4: 2 MB für die FBI und eine TMU mit 2 MB (Standard).
#   12: 4 MB für die FBI und zwei TMUs mit jeweils 4 MB.
#
voodoo_memsize = 4

# Verwendet Threads, um die Leistung von 3dfx Voodoo zu verbessern
# (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:    Verwendet bis zu 16 Threads, abhängig von den verfügbaren
#            CPU-Kernen (Standard).
#   <Zahl>:  Legt eine bestimmte Anzahl von Threads zwischen 1 und 128
#            fest.
#
# Hinweis: Wenn du hier einen Wert einstellst, der höher ist als die
#          Anzahl der logischen CPUs, die deine Hardware unterstützt, wird
#          die Leistung höchstwahrscheinlich beeinträchtigt. Messungen
#          haben ergeben, dass dies bis zu 8–16 Threads gut skaliert, es
#          wurde jedoch noch nicht auf einer Multicore-CPU getestet. Wenn
#          du einen Threadripper oder eine ähnliche CPU besitzt, teile
#          uns bitte mit, wie es läuft.
#
voodoo_threads = auto

# Verwendet bilineare Filterung, um den Texturglättungseffekt der 3dfx Voodoo
# nachzuahmen (standardmäßig aktiviert). Bilineare Filterung kann auf langsameren
# Systemen die Bildrate beeinträchtigen; deaktiviere sie, falls die Leistung
# nicht ausreichend ist.
#
voodoo_bilinear_filtering = on


[capture]

# Verzeichnis, in dem die verschiedenen Aufnahmen gespeichert werden, z.B. Audio,
# Video, MIDI und Screenshots. ('capture' ist standardmäßig auf das aktuelle
# Arbeitsverzeichnis eingestellt).
#
capture_dir = capture

# Festlegen des Aufnahmeformats der Standard-Screenshot-Aktion
# (Standardmäßig 'upscaled'). Mögliche Werte:
#
#   upscaled:  Das Bild wird bilinear-scharf hochskaliert und das richtige
#              Bildseitenverhältnis wird beibehalten, abhängig von der
#              Einstellung 'aspect'. Der vertikale Skalierungsfaktor ist immer
#              eine ganze Zahl. Z.B. 320x200 Inhalte werden auf 1600x1200 hoch-
#              skaliert (ganzzahlige Skalierung 5:6), 640x480 auf 1920x1440 (3:3
#              ganzzahlige Skalierung) und 640x350 auf 1400x1050 (2,1875:3
#              Skalierung; horizontal als Bruchzahl und vertikal ganzzahlig).
#              Die Dateinamen von hochskalierten Bildschirmfotos haben kein
#              Postfix (z. B. 'image0001.png').
#
#   rendered:  Das auf dem Bildschirm dargestellte Bild wird 1:1 gespeichert.
#              Die Dateinamen von gerenderten Bildschirmfotos enden mit
#              '-rendered' (z.B. 'image0001-rendered.png').
#
#   raw:       Der Inhalt des unbearbeiteten Framebuffers wird aufgezeichnet
#              (dies führt immer zu quadratischen Pixeln). Die Dateinamen von
#              Rohdaten-Screenshots enden mit '-raw' (z. B. 'image0001-raw.png').
#
# Wenn mehrere Formate durch Leerzeichen getrennt angegeben werden, speichert die
# Standard-Screenshot-Aktion jeweils ein Bild in den angegebenen Formaten.
# Tastenkombinationen für die Aufnahme einzelner Screenshots in bestimmten
# Formaten sind ebenfalls verfügbar.
#
default_image_capture_formats = upscaled


[mouse]

# Wählt eine Methode zum Umschalten der Maus (Standardmäßig 'onclick').
# Mögliche Werte:
#
#   onclick:   Schalte die Maus beim Klick auf eine beliebige Stelle im Fenster
#              um (Standard).
#
#   onstart:   Schalte die Maus sofort beim Start um. Funktioniert auf manchen
#              Betriebssystemen evtl. nicht richtig.
#
#   seamless:  Maus übergangslos bewegen; umschalten nur mit Mittelklick
#              oder Hotkey. 'seamless' funktioniert nicht mit allen Spielen
#              korrekt. Windows 3.1x kann mit einem eigenen Maustreiber
#              kompatibel gemacht werden.
#
#   nomouse:   Verstecke die Maus und sende keine Eingaben an Spiele.
#
# Hinweis: Für die Steuerung über einen Touchscreen wähle 'seamless'.
#
mouse_capture = onclick

# Die Maus durch einen Mittelklick freigeben oder umschalten, wenn sie
# übergangslos ist (standardmäßig 'on').
#
mouse_middle_release = on

# Ermöglicht das übergangslose Verhalten der Maus und die Freigabe des Maus-
# zeigers im Vollbildmodus für Systeme mit mehr als einem Bildschirm
# (standardmäßig 'on').
#
# Hinweis: Du solltest diese Funktion deaktivieren, wenn sie fälschlicherweise
#          mehrere Bildschirme erkennt. Dies kann passieren, wenn spiegelnden
#          Anzeigemodi verwendet werden oder du den HDMI-Eingang eines AV-
#          Receivers zur ausschließlichen Tonausgabe verwendest.
#
mouse_multi_display_aware = on

# Globale Mausempfindlichkeit festlegen (Standardwert: 100). Mögliche Werte:
#
#   <Wert>:  Legt die Empfindlichkeit für beide Achsen als Prozentsatz fest (z. B. 150).
#
#   X,Y:     Legt die Empfindlichkeit der X- und Y-Achse separat als Prozentsätze fest
#            (z. B. 100,150). Die beiden Werte können durch ein Leerzeichen oder ein
#            Semikolon getrennt werden.
#
# Hinweise:
#   - Negative Werte kehren eine Achse um, der Wert Null deaktiviert sie.
#
#   - Die Empfindlichkeit lässt sich je nach Maus-Schnittstelle mit dem internen
#     Befehl 'MOUSECTL.COM' weiter feinabstimmen.
#
mouse_sensitivity = 55 98

# Aktiviere diese Option, um die Mausbeschleunigung und -empfindlichkeit deines
# Betriebssystems zu umgehen (Standardmäßig 'on'). Funktioniert im
# Vollbildmodus oder wenn die Maus im Fenstermodus umgeschaltet ist.
#
mouse_raw_input = on

# Integrierter DOS-Maus-Treiber-Modus (standardmäßig auf 'on' gesetzt). Er umgeht
# die PS/2- und seriellen (COM-)Anschlüsse und kommuniziert direkt mit der Maus.
# Dies führt zu geringerer Eingabeverzögerung, flüssigeren Bewegungen und einer
# höheren Reaktionsgeschwindigkeit der Maus. Deaktiviere ihn daher nur und
# lade einen echten DOS-Maus-Treiber, wenn es wirklich notwendig ist (z. B.
# wenn ein Spiel nicht mit dem integrierten Treiber kompatibel ist).
# Mögliche Werte:
#
#   on:      Simuliert ein aus AUTOEXEC.BAT geladenes TSR-Programm für den Maus-
#            treiber (Standard). Dies ist die kompatibelste Methode zur Emulation
#            des DOS-Maustreibers, sollte es jedoch mit deinem Spiel nicht
#            funktionieren, versuche es mit der Einstellung 'no-tsr'.
#
#   no-tsr:  Aktiviert den Maustreiber, ohne das TSR-Programm zu simulieren. Teile
#            uns bitte mit, ob dadurch Probleme behoben werden, die bei der
#            Einstellung 'on' auftraten.
#
#   aus:     Deaktiviert den integrierten Maustreiber. Du kannst ihn dennoch zur
#            Laufzeit starten, indem du die mitgelieferte Datei MOUSE.COM vom
#            Laufwerk Z ausführst.
#
# Hinweise:
#   - Die Einstellungen `ps2_mouse_model` und `com_mouse_model` haben keine Aus-
#     wirkung auf den integrierten Treiber.
#
#   - Der Treiber wird automatisch deaktiviert, wenn du unter DOSBox in echtes
#     MS-DOS oder Windows 9x booten. Unter Windows 3.1 wird der Treiber nicht de-
#     aktiviert, aber der Windows 3.1-Maus-Treiber übernimmt die Steuerung.
#
#   - Um einen echten DOS-Maus-Treiber (z. B. MOUSE.COM oder CTMOUSE.EXE) zu ver-
#     wenden, konfiguriere den Maus-Typ mit `ps2_mouse_model` oder
#     `com_mouse_model` und lade anschließend den Treiber.
#
#
#
builtin_dos_mouse_driver = on

# Legt das Mausmodell fest, das vom integrierten DOS-Maus-Treiber simuliert
# werden soll (standardmäßig '2button'). Mögliche Werte:
#
#   2button:  2 Tasten, die sicherste Option für die meisten Spiele. Die meisten
#             DOS-Spiele unterstützen nur 2 Tasten; einige verhalten sich
#             möglicherweise fehlerhaft, wenn die mittlere Taste gedrückt wird.
#
#   3button:  3 Tasten, wird nur von sehr wenigen DOS-Spielen unterstützt.
#             Verwende diese Option nur, wenn bekannt ist, dass das Spiel
#             eine 3-Tasten-Maus unterstützt.
#
#   wheel:    3 Tasten + Scrollrad, unterstützt die CuteMouse WheelAPI Version 1.0.
#             Kein DOS-Spiel nutzt das Mausrad, nur eine Handvoll DOS-Anwendungen
#             und Windows 3.1 mit speziellen Treibern von Drittanbietern.
#
builtin_dos_mouse_driver_model = 2button

# Der kleinste Wert für die Mausbewegung, der an den Gast gemeldet wird
# (Standardwert: 1). Einige DOS-Spiele können auf kleine Bewegungen nicht
# richtig reagieren, da diese mit den ungenauen Kugelmäusen jener Zeit nur
# schwer zu erzielen waren; in solchen Fällen ändere den Wert auf den
# kleinsten Wert, der zu einer korrekten Cursorbewegung führt.
# Mögliche Werte:
#
#   1–9:  Die kleinste zu meldende Bewegungsmenge, sowohl für die horizon-
#         tale als auch für die vertikale Achse. 1 meldet alle Bewegungen
#         (Standard).
#
#   x,y:  Separate Werte für die horizontale und vertikale Achse, die durch
#         Leerzeichen, Kommas oder Semikolons getrennt werden können.
#
# Liste bekannter Spiele, bei denen der Schwellenwert auf 2 gesetzt werden
# muss:
#   - Ultima Underworld: The Stygian Abyss
#   - Ultima Underworld II: Labyrinth of Worlds
#
builtin_dos_mouse_driver_move_threshold = 1

# Zusätzliche integrierte Einstellungen für den DOS-Maus-Treiber als Liste von
# durch Leerzeichen oder Kommas getrennten Optionen (standardmäßig deaktiviert).
# Mögliche Werte:
#
#   immediate:       Aktualisiert die Mausbewegungszähler sofort, ohne auf
#                    einen Interrupt zu warten. Kann die Mauslatenz in rasanten
#                    Spielen (Arcade, FPS usw.) verbessern, kann jedoch bei
#                    einigen Titeln zu Problemen führen.
#                    Liste bekannter inkompatibler Spiele:
#                      - Ultima Underworld: The Stygian Abyss
#                      - Ultima Underworld II: Labyrinth of Worlds
#                    Bitte melde weitere inkompatible Spiele, damit wir diese
#                    Liste aktualisieren können.
#
#   modern:          Sofern vorhanden, wird das Verhalten des Microsoft-Maus-
#                    Treibers ab Version 7.0 emuliert, andernfalls das Ver-
#                    halten von Version 6.0 und früher (die beiden sind leicht
#                    inkompatibel). Bislang wurde nur bei 'Descent II' mit dem
#                    offiziellen Voodoo-Patch festgestellt, dass das Verhalten
#                    ab Version 7.0 erforderlich ist.
#
#   no-granularity:  Deaktiviert die Mauspositionsauflösung. Nur aktivieren, wenn
#                    das Spiel dies erfordert. Bislang wurde nur bei 'Joan of Arc:
#                    Siege & the Sword' im Hercules-Modus festgestellt, dass die
#                    Mauspositionsauflösung deaktiviert werden muss.
#
builtin_dos_mouse_driver_options = 

# Legt das Mausmodell für den PS/2-AUX-Anschluss fest, d. h. den Typ der
# virtuellen Maus, die an den emulierten PS/2-Mausanschluss angeschlossen ist
# (standardmäßig 'explorer'). Die Einstellung hat keine Auswirkungen auf den
# integrierten Maustreiber (siehe 'dos_mouse_driver').
# Mögliche Werte:
#
#   standard:      3 Tasten, Standard-PS/2-Maus.
#   intellimouse:  3 Tasten + Scrollrad, Microsoft IntelliMouse.
#   explorer:      5 Tasten + Scrollrad, Microsoft IntelliMouse Explorer (Standard).
#   none:          keine PS/2-Maus.
#
ps2_mouse_model = explorer

# Legt das Standard-COM-Mausmodell fest, d. h. den Typ der
# virtuellen Maus, die an die emulierten COM-Ports angeschlossen ist
# (standardmäßig 'wheel+msm'). Die Einstellung hat keine Auswirkungen
# auf den integrierten Maustreiber (siehe 'dos_mouse_driver').
# Mögliche Werte:
#
#    2button:        2 Tasten, Microsoft-Maus.
#
#    3button:        3 Tasten, Logitech Maus,
#                    weitgehend kompatibel mit Microsoft Maus.
#
#    wheel:          3 Tasten + Rad,
#                    weitgehend kompatibel mit Microsoft Maus.
#
#    msm:            3 Tasten, Mouse Systems Maus,
#                    NICHT KOMPATIBEL mit Microsoft Maus.
#
#    2button+msm:    Automatische Wahl zwischen '2button' und 'msm'.
#    3button+msm:    Automatische Wahl zwischen '3button' und 'msm'.
#    wheel+msm:      Automatische Wahl zwischen 'Rad' und 'msm' (Standard).
#
# Hinweis: Im Abschnitt [serial], werden die Mäuse am COM-Port
#          aktiviert.
#
com_mouse_model = wheel+msm

# VMware-Mausschnittstelle (standardmäßig aktiviert).
# Vollständig kompatibel nur mit experimentellen Windows 3.1x-Treibern von
# Drittanbietern.
#
# Hinweis: Erfordert die Aktivierung der PS/2-Maus.
#
vmware_mouse = on

# VirtualBox-Mausschnittstelle (standardmäßig 'on').
# Vollständig kompatibel nur mit Windows 3.1x-Treibern von Drittanbietern.
#
# Hinweis: Erfordert die Aktivierung der PS/2-Maus.
#
virtualbox_mouse = on


[mixer]

# Stummschaltungsmodus aktivieren (standardmäßig deaktiviert). Im Stumm-
# schaltungsmodus wird der Ton weiterhin emuliert, aber DOSBox gibt keinen
# Ton an den Host aus. Die Aufzeichnung der emulierten Audioausgabe in
# eine WAV-Datei funktioniert im Stummschaltungsmodus.
#
nosound = off

# Abtastrate des internen Audiomixers von DOSBox in Hz (standardmäßig 48000).
# Der gültige Bereich liegt zwischen 8000 und 96000 Hz. Die überwiegende
# Mehrheit der handelsüblichen Audiohardware verwendet eine native Abtastrate
# von 48000 Hz. Es wird empfohlen, diese Einstellung unverändert zu lassen, es
# sei denn, du hast einen triftigen Grund, sie zu ändern. Das Betriebssystem
# wird nicht standardmäßige Abtastraten höchstwahrscheinlich ohnehin auf 48000Hz
# umrechnen.
#
rate = 48000

# Blockgröße des Host-Audiogeräts in Sample-Frames (standardmäßig 1024). Der gültige
# Bereich liegt zwischen 64 und 8192. Sollte auf Werte eingestellt werden, die eine
# Zweierpotenz sind (z. B. 256, 512, 1024, usw.). Größere Werte können bei Tonaus-
# setzern helfen, führen jedoch zu einer höheren Latenz. Siehe auch 'negotiate'.
#
blocksize = 1024

# Wie viele Millisekunden Daten zusätzlich zur Blockgröße vorgehalten werden
# sollen (standardmäßig 25). Größere Werte können stotternde Audioausgabe
# verhindern, aber der Ton wird auch mehr verzögert.
#
prebuffer = 25

# Verhandelt eine möglicherweise bessere Einstellung für die 'Blocksize'
# (Standardwert: off). Aktiviere diese Option, wenn du keinen Ton hörst
# oder der Ton bei deiner aktuellen 'Blocksize'-Einstellung stottert. Deaktiviere
# diese Option, um den manuell festgelegten Wert für die 'Blocksize' zu erzwingen.
#
negotiate = off

# Aktiviere den Auto-Leveling Kompressor auf dem Masterkanal,
# um Clipping der Audioausgabe zu verhindern (standardmäßig 'on').
# Mögliche Werte:
#
#   off:  Deaktiviere den Kompressor.
#   on:   Aktiviere den Kompressor (Standard).
#
compressor = on

# Aktiviert Crossfeed auf den OPL- und CMS-Mixerkanälen (standardmäßig
# deaktiviert). Viele Spiele panen die Instrumente auf diesen Audiogeräten zu
# 100% nach links und 100% nach rechts im Stereofeld, was beim Hören über
# Kopfhörer unangenehm ist. Bei aktiviertem Crossfeed wird ein Teil des
# Signals des linken Kanals in den rechten Kanal gemischt und umgekehrt,
# wodurch ein natürlicheres Hörerlebnis entsteht. Mögliche Werte:
#
#   off:     Kein Crossfeed (Standard).
#   on:      Aktiviere das Crossfeed (Preset 'normal').
#   light:   Leichtes Crossfeed (Stärke 15).
#   normal:  Normales Crossfeed (Stärke 40).
#   strong:  Starkes Crossfeed (Stärke 65).
#
# Hinweis:
#   - Verwende den Befehl 'MIXER', um den Crossfeed auch auf andere Audio-
#     kanäle anzuwenden und die Crossfeed-Stärke für jeden Kanal individuell
#     anzupassen.
#
crossfeed = off

# Ein Hall-Effekt, der dem Klang standardmäßig mehr Räumlichkeit verleiht
# (standardmäßig 'off'). Mögliche Werte:
#
#   off:     Kein Reverb (Standard).
#
#   on:      Aktiviert Reverb (mittlere Voreinstellung).
#
#   tiny:    Simuliert den Klang eines kleinen integrierten Lautsprechers;
#            speziell für Audiosysteme mit kleinen Lautsprechern entwickelt
#            (PC Speaker, Tandy, PS/1 Audio, und LPT Digital-Analog-Wandler).
#
#   small:   Verleiht ein subtiles Gefühl von Raum; gut für Spiele, die einen
#            einzigen Synth-Kanal (normalerweise OPL) für Musik und Soundeffekte
#            verwenden.
#
#   medium:  Mittlere Raumvoreinstellung, die gut mit einer Vielzahl von Spielen
#            funktioniert.
#
#   large:   Die Voreinstellung 'Großer Saal' wird für Spiele empfohlen, die
#            getrennte Kanäle für Musik und digitales Audio verwenden.
#
#   huge:    Eine stärkere Variante der Voreinstellung 'Große Saal'; funktioniert
#            sehr gut in einigen Spielen mit stimmungsvollen Soundtracks.
#
# Hinweise:
#   - Die Voreinstellungen fügen den Synth-Mixer-Kanälen einen deutlich
#     wahrnehmbaren Hall hinzu (mit Ausnahme von Synthesizern mit inte-
#     griertem Hall, z. B. dem Roland MT-32) und einen dezenten Hall den
#     digitalen Audiokanälen.
#
#   - Verwende den Befehl MIXER, um die Hallpegel für jeden Kanal fein abzustimmen.
#
reverb = medium

# Chorus-Effekt, der dem Klang eine Stereobewegung verleiht (standardmäßig
# 'off'). Mögliche Werte:
#
#   off:     Kein Chorus (Standard).
#
#   on:      Chorus aktivieren (Voreinstellung 'normal').
#
#   light:   Ein leichter Chorus-Effekt (besonders geeignet für
#            Synthesizer-Musik, die viel weißes Rauschen enthält).
#
#   normal:  Normaler Chorus, der mit einer Vielzahl von Programmen gut
#            funktioniert.
#
#   strong:  Ein offensichtlicher und vordergründiger Chorus-Effekt.
#
# Hinweise:
#   - Die Voreinstellungen wenden den Chorus-Effekt nur auf die Synth-Kanäle
#     an (mit Ausnahme von Synths mit integriertem Chorus, z. B. dem
#     Roland MT-32).
#
#   - Verwende den Befehl MIXER, um die Chorus-Pegel pro Kanal fein
#     abzustimmen.
#
chorus = normal

# Entfernt leise Restrauschen aus dem Ausgangssignal des OPL-Synthesizers und des
# Roland Sound Canvas (standardmäßig aktiviert). Die Emulation dieser Geräte ent-
# spricht genau den Originalgeräten, was auch die Emulation eines sehr leisen,
# halbzufälligen Rauschens beinhaltet. Obwohl dies authentisch ist, empfinden es
# die meisten Nutzer als etwas störend. Mögliche Werte:
#
#   off:  Den Rauschunterdrücker deaktivieren.
#
#   on:   Aktiviert den Rauschunterdrücker für die Kanäle OPL und SOUNDCANVAS
#         (Standard). Der Rauschunterdrücker führt zu keiner Verschlechterung der
#         Klangqualität; er entfernt lediglich das kaum hörbare Restrauschen in
#         leisen Passagen.
#
denoiser = on


[mt32]

# Zu verwendendes Roland-Modell MT-32/CM-32L (Standardwert: 'auto').
# Die ROM-Dateien für das ausgewählte Modell müssen verfügbar sein
# (siehe 'romdir'). Die Suche nach den besten Modellen erfolgt in der
# angegebenen Reihenfolge. Mögliche Werte:
#
#   auto:       Wählt das erste verfügbare Modell aus (Standard).
#   cm32l:      Wählt das erste verfügbare CM-32L Modell.
#   mt32_old:   Wählt das erste verfügbare MT-32 'old' Modell (v1.0x).
#   mt32_new:   Wählt das erste verfügbare MT-32 'new' Modell (v2.0x).
#   mt32:       Wählt das erste verfügbare MT-32 Modell.
#   <version>:  Verwendet exakt das angegebene Modell (z.B. 'mt32_204').
#
# Hinweise:
#   - Führe `MIXER /LISTMIDI` aus, um die Liste der verfügbaren Modelle
#     anzuzeigen.
#
#   - Dies ist *KEIN* General-MIDI-kompatibles MIDI-Gerät; verwende es
#     nur, wenn das Spiel bekanntermaßen Roland MT-32 MIDI unterstützt
#     (Spiel ist älter ist als der General MIDI Standard).
#
#
model = auto

# Das Verzeichnis mit den Roland MT-32/CM-32L ROMs (standardmäßig nicht gesetzt).
# Das Verzeichnis kann absolut oder relativ sein, oder du lässt es ungesetzt, um
# das Verzeichnis 'mt32-roms' in deinem DOSBox-Konfigurations-
# verzeichnis zu verwenden. Andere gängige Systemverzeichnisse werden ebenfalls
# überprüft.
#
# Hinweise:
#   - Die Dateinamen der ROM-Dateien spielen keine Rolle; die ROMS werden durch
#     ihre Prüfsummen erkannt.
#
#   - Es werden interleaved als auch non-interleaved ROM-Dateien unterstützt.
#
romdir = 

# Filter für den Roland MT-32/CM-32L Audioausgang (standardmäßig 'off').
# Mögliche Werte:
#
#   off:       Die Ausgabe nicht filtern (Standard).
#   <custom>:  Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
mt32_filter = off


[fluidsynth]

# Name oder Pfad der zu verwendenden SoundFont-Datei (standardmäßig 'default.sf2').
# Die SoundFont-Datei wird nacheinander an den folgenden Speicherorten gesucht:
#
#   - Das benutzerdefinierte SoundFont-Verzeichnis (siehe 'soundfont_dir').
#   - Das Verzeichnis 'soundfonts' in deinem DOSBox-Konfigurationsverzeichnis.
#   - Andere gängige Systemverzeichnisse.
#
# Die Erweiterung '.sf2' kann weggelassen werden. Du kannst sowohl relative
# Pfade zu den oben genannten Speicherorten als auch absolute Pfade verwenden.
#
# Hinweis: Führe `MIXER /LISTMIDI` aus, um die Liste der verfügbaren SoundFonts
#          anzuzeigen.
#
soundfont = default.sf2

# Zusätzliches benutzerdefiniertes SoundFont-Verzeichnis (standardmäßig nicht
# gesetzt). Wenn diese Option gesetzt ist, werden SoundFonts zuerst in diesem
# Verzeichnis gesucht, dann an den üblichen Systemspeicherorten.
#
soundfont_dir = 

# Stellt die Lautstärke des SoundFonts als Prozentsatz ein (Standardwert: 100).
# Dies ist nützlich, um die Lautstärke verschiedener SoundFonts anzugleichen. Der
# Prozentsatz kann zwischen 1 und 800 liegen.
#
soundfont_volume = 100

# Konfiguriert den FluidSynth-Chorus (Standardwert: 'auto').
# Mögliche Werte:
#
#   auto:      Wendet automatisch optimierte Einstellungen für gängige SoundFonts
#              an oder aktiviert den Chorus mit den Standardeinstellungen für
#              alle anderen SoundFonts (Standard).
#
#   on:        Chorus immer aktivieren.
#   off:       Chorus deaktivieren.
#
#   <custom>:  Benutzerdefinierte Einstellung über fünf durch Leerzeichen
#              getrennte Werte:
#                - voice-count:      Ganzzahl von 0 bis 99
#                - level:            Dezimalzahl von 0,0 bis 10,0
#                - speed:            Dezimalzahl von 0,1 bis 5,0 (in Hz)
#                - depth:            Dezimalzahl von 0,0 bis 21,0
#                - modulation-wave:  'sine' oder 'triangle'
#              Beispiel: 'fsynth_chorus = 3 1.2 0.3 8.0 sine'
#
# Hinweis: Du kannst den FluidSynth-Chorus deaktivieren und stattdessen
#          den Chorus auf Mixer-Ebene im FluidSynth-Kanal aktivieren oder
#          beide Chorus-Effekte gleichzeitig aktivieren. Ob dies gut klingt,
#          hängt vom verwendeten SoundFont und den eingestellten Chorus-
#          Parametern ab.
#
fsynth_chorus = auto

# Konfiguriert den FluidSynth-Hall (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:      Wendet automatisch optimierte Einstellungen für gängige Sound-
#              Fonts an oder aktiviert den Hall mit den Standardeinstellungen
#              für alle anderen SoundFonts (Standard).
#
#   on:        Hall aktivieren.
#   off:       Hall deaktivieren.
#
#   <Wert>:    Benutzerdefinierte Einstellung über vier durch Leerzeichen
#              getrennte Werte:
#                - room-size:  Dezimalwert zwischen 0,0 und 1,0
#                - damping:    Dezimalwert zwischen 0,0 und 1,0
#                - width:      Dezimalwert zwischen 0,0 und 100,0
#                - level:      Dezimalwert von 0,0 bis 1,0
#              Beispiel: 'fsynth_reverb = 0,61 0,23 0,76 0,56'
#
# Hinweis: Du kannst den FluidSynth-Reverb deaktivieren und stattdessen den
#          Mixer-Reverb auf dem FluidSynth-Kanal aktivieren, oder
#          beide Reverb-Effekte gleichzeitig aktivieren. Ob dies
#          gut klingt hängt vom SoundFont und den verwendeten Reverb-
#          Einstellungen, die verwendet werden, ab.
#
fsynth_reverb = auto

# Filter für das FluidSynth-Ausgangssignal (standardmäßig 'off').
# Mögliche Werte:
#
#   off:       Die Ausgabe nicht filtern (Standard).
#   <custom>:  Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
fsynth_filter = off


[soundcanvas]

# Zu verwendendes Roland-Sound-Canvas-Modell (Standardwert: 'auto'). Ein oder
# mehrere CLAP-Audio-Plugins, die die unterstützten Sound-Canvas-Modelle
# implementieren, müssen im Verzeichnis 'plugins' Ihrer DOSBox-Installation
# oder in deinem Konfigurationsverzeichnis vorhanden sein. DOSBox sucht nach dem
# gewünschten Modell, indem es die Plugin-Beschreibungen überprüft. Die Suche
# nach dem besten Modell erfolgt in der angegebenen Reihenfolge.
# Mögliche Werte:
#
#   auto:       Das beste verfügbare Modell auswählen (Standard).
#   sc55:       Das beste verfügbare Originalmodell des SC-55 auswählen.
#   sc55mk2:    Das beste verfügbare Modell des SC-55mk2 auswählen.
#   <version>:  Die genau angegebene Modellversion verwenden (z. B. 'sc55_121').
#
soundcanvas_model = auto

# Das Verzeichnis, das die Roland Sound Canvas-ROMs enthält (standardmäßig
# nicht festgelegt). Das Verzeichnis kann absolut oder relativ angegeben werden;
# lasse es unbestimmt, um das Verzeichnis 'soundcanvas-roms' in deinem
# DOSBox-Konfigurationsverzeichnis zu verwenden. Andere gängige Speicherorte
# im System werden ebenfalls überprüft.
#
soundcanvas_rom_dir = 

# Filter für die Audioausgabe von Roland Sound Canvas (standardmäßig auf
# 'on' gesetzt). Mögliche Werte:
#
#   on:        Ausgabe filtern (Standard).
#   off:       Ausgabe nicht filtern.
#   <custom>:  Benutzerdefinierte Filterdefinition; weitere Informationen findest
#              du unter 'sb_filter'.
#
soundcanvas_filter = on


[midi]

# Legt fest, wohin die MIDI-Daten von der emulierten MPU-401 MIDI-Schnittstelle
# gesendet werden (standardmäßig 'auto').
#
#   Port:         Ein MIDI-Port der MIDI-Schnittstelle des Host-Betriebssystems
#                 (Standard). Du kannst den zu verwendenden Port über die
#                 Einstellung 'midiconfig' konfigurieren.
#
#   mt32:         Der interne Roland MT-32-Synthesizer (siehe Abschnitt [mt32]).
#
#   soundcanvas:  Der interne Roland SC-55-Synthesizer (erfordert ein CLAP-
#                 Audio-Plugin, das Sound Canvas implementiert;
#                 siehe Abschnitt [soundcanvas]).
#
#   fluidsynth:   Der interne FluidSynth-MIDI-Synthesizer (SoundFont-Player)
#                 (erfordert die Verfügbarkeit der FluidSynth-DLL;
#                 siehe Abschnitt [fluidsynth]).
#
#   none:        Deaktiviert die MIDI-Ausgabe.
#
mididevice = port

# Konfigurationsoptionen für das ausgewählte MIDI-Gerät (standardmäßig
# deaktiviert).
# Hinweise:
#
#   - Wenn du 'mididevice = port' verwendest, ermittele die ID oder den Namen
#     des MIDI-Ports, den du verwenden möchtest, mit dem DOS-Befehl 'MIXER
#     /LISTMIDI' und gib dann entweder die ID oder einen Teil des Namens
#     ein (um beispielsweise den Port 'loopMIDI Port A' mit der ID 2 zu verwenden,
#     setze 'midiconfig = 2' oder 'midiconfig = port a').
#
#   - Die Einstellung hat keine Auswirkung, wenn die internen Synthesizer
#     verwendet werden ('mididevice = fluidsynth', 'mt32' oder 'soundcanvas').
#
#   - Wenn du einen physischen Roland MT-32 der Revision 0 verwenden, benötigt die
#     Hardware möglicherweise eine Verzögerung, um Pufferüberläufe zu verhindern.
#     Du kannst dies mit 'delaysysex' hinter der Port-ID oder dem Portnamen
#     aktivieren (z. B. 'midiconfig = 2 delaysysex').
#
midiconfig = 

# MPU-401-Modus, der emuliert werden soll (standardmäßig 'intelligent').
#
mpu401 = intelligent

# Aktiviert die direkte, unveränderte MIDI-Ausgabe (standardmäßig 'off').
# Die MIDI-Treiber vieler Spiele sind nicht vollständig konform mit dem MIDI-
# Standard. Dies macht die Bearbeitung der MIDI-Aufnahmen dieser Spiele sehr
# fehleranfällig und die Bearbeitung in MIDI-Sequenzern umständlich, was oft zu
# hängenden oder fehlenden Noten führt. DOSBox korrigiert die MIDI-Ausgabe von
# solchen Spielen standardmäßig. Dies führt zu keinem hörbaren Unterschied; es
# wirkt sich nur auf die Darstellung der MIDI-Daten aus.
#
# Man sollte 'raw_midi_output' nur aktivieren, wenn man wirklich die unve-
# ränderte MIDI-Ausgabe eines Programms aufzeichnen möchte, z.B. bei der Arbeit
# mit Musik-Anwendungen oder beim Debuggen von MIDI-Problemen.
#
raw_midi_output = off


[sblaster]

# Zu emulierendes Sound Blaster-Modell (standardmäßig 'sb16'). Die Modelle,
# die automatisch ausgewählt werden, wenn 'oplmode' und 'cms' auf 'auto' gesetzt
# sind, werden ebenfalls aufgeführt. Mögliche Werte:
#
#   gb:        Game Blaster          - CMS
#   sb1:       Sound Blaster 1.0     - OPL2, CMS
#   sb2:       Sound Blaster 2.0     - OPL2
#   sbpro1:    Sound Blaster Pro     - Dual OPL2
#   sbpro2:    Sound Blaster Pro 2   - OPL3
#   sb16:      Sound Blaster 16      - OPL3 (Standard)
#   ess:       ESS ES1688 AudioDrive - ESFM
#   none/off:  Sound Blaster-Emulation deaktivieren.
#
# Anmerkungen:
#   - Creative Music System wurde später in Game Blaster umbenannt; es handelt
#     sich um dieselbe Karte.
#
#   - Die Option 'ess' dient dazu, ESS Enhanced FM-Musik über den ESFM-
#     Synthesizer der Karte in Spielen wiederzugeben, die dies unterstützen.
#     Der ESS-DAC wird nicht emuliert, aber die Karte ist Sound Blaster Pro-
#     kompatibel; konfiguriere das Spiel einfach für Sound Blaster
#     Digital Sound.
#
sbtype = sb16

# Die E/A-Adresse der Sound Blaster-Karte (standardmäßig 220).
# Mögliche Werte: 220, 240, 260, 280, 2a0, 2c0, 2e0, 300
#
sbbase = 220

# Die IRQ-Nummer der Sound Blaster-Karte (standardmäßig 7).
# Mögliche Werte: 3, 5, 7, 9, 10, 11, 12
#
irq = 7

# Der DMA-Kanal der Sound Blaster-Karte (standardmäßig 1).
# Mögliche Werte: 0, 1, 3, 5, 6, 7
#
dma = 1

# Der High-DMA-Kanal der Sound Blaster 16 (standardmäßig 5).
# Mögliche Werte: 0, 1, 3, 5, 6, 7
#
hdma = 5

# Erlaube dem Sound Blaster-Mixer, die Lautstärke anzupassen (standardmäßig
# aktiviert). Bei Sound Blaster Pro 1 und neueren Karten können Programme die
# Lautstärke des digitalen Audioausgangs (DAC), des FM-Synthesizers und des
# CD-Audioausgangs einstellen. Diese entsprechen jeweils den SB-, OPL- und
# CDAUDIO-Kanälen des DOSBox-Mixers. Mögliche Werte:
#
#   on:   Der endgültige Pegel der oben genannten Kanäle ergibt sich aus der
#         Kombination der vom Spiel eingestellten Lautstärke und der im
#         DOSBox-Mixer eingestellten Lautstärke.
#
#   off:  Nur der DOSBox-Mixer bestimmt die Lautstärke dieser Kanäle.
#
# Hinweis: Einige Spiele ändern die Lautstärke dynamisch (z. B. wird die
#          Lautstärke der FM-Musik verringert, wenn Sprache wiedergegeben
#          wird); für solche Spiele ist es am besten, 'sbmixer' aktiviert
#          zu lassen.
#
sbmixer = on

# Stummschalten des DMA-Audio nach dem Einschalten der Karte in Millisekunden
# (Standard '100'). Dadurch werden die Knackgeräusche beim Starten vieler SB-
# basierter Spiele reduziert. Reduziere diesen Wert, wenn du feststellst, dass
# beim Beginn der Wiedergabe Audio fehlt.
#
sbwarmup = 100

# Art des zu emulierenden Filters für den digitalen Sound Blaster-Ausgang
# (Standardmäßig 'modern'). Mögliche Werte:
#
#   auto:      Verwende den passenden Filter, der durch 'sbtype' bestimmt wird.
#
#   sb1, sb2, sbpro1, sbpro2, sb16:
#              Verwende den Filter dieses Sound Blaster-Modells.
#
#   modern:    Verwende lineares Interpolations-Upsampling, das wie ein Tiefpass-
#              filter wirkt; Dies ist das alte DOSBox-Verhalten (Standard).
#
#   off:       Die Ausgabe nicht filtern.
#
#   <custom>:  Ein oder zwei benutzerdefinierte Filter im folgenden Format:
#                 TYP ORDNUNG FREQUENZ
#              TYP kann 'hpf' (Hochpass) oder 'lpf' (Tiefpass) sein,
#              ORDER ist die Ordnung des Filters von 1 bis 16
#              (1. Ordnung = 6dB/Okt. Steigung, 2. Ordnung = 12dB/Okt. usw.),
#              und FREQ ist die Cutoff-Frequenz in Hz. Beispiele:
#                 lpf 2 12000
#                 hpf 3 120 lfp 1 6500
#
sb_filter = modern

# Stellt den Sound Blaster Pro 2-Filter so ein, dass er immer aktiviert
# ist (standardmäßig ist er deaktiviert). Bei anderen Sound Blaster-Modellen
# lässt sich der Filter nicht per Software umschalten.
#
sb_filter_always_on = off

# Zu emulierendes OPL-Modell (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:      Verwende das durch 'sbtype' bestimmte Modell.
#   opl2:      Yamaha OPL2 (YM3812, Mono).
#   dualopl2:  Dual OPL2 (zwei OPL2-Chips in Stereokonfiguration).
#   opl3:      Yamaha OPL3 (YMF262, Stereo).
#
#   opl3gold:  OPL3 und das optionale AdLib Gold Surround-Modul.
#              Verwende 'sbtype = sb16', um den AdLib Gold 1000 zu emulieren.
#
#   esfm:      ESS ESFM (erweiterter, mit Yamaha OPL3 kompatibler FM-Synthesizer).
#   none/off:  OPL-Emulation deaktivieren.
#
# Hinweise:
#   - 'sbtype = none' und 'oplmode = opl2' emulieren die ursprüngliche
#     AdLib-Karte.
#   - 'oplmode = esfm' allein reicht nicht aus, um ESS Enhanced FM-Musik in
#     Spielen wiederzugeben; du musst zusätzlich 'sbtype = ess' einstellen.
#     'oplmode = esfm' ist nützlich, um OPL im ESFM-Stil mit den ursprünglichen
#     Sound Blaster-Modellen wiederzugeben.
#
oplmode = auto

# Ausklingen von nachklingenden Noten auf dem OPL-Synthesizer (standardmäßig 'off').
# Mögliche Werte:
#
#   off:       Nachklingende Noten nicht ausklingen lassen (Standard).
#
#   fade:      Nachklingende Noten ausklingen lassen. Diese Option sollte nur in
#              Spielen aktiviert werden, in denen gelegentlich nachklingende Noten
#              gespielt werden, die nie ganz verstummen (z. B. 'Bard's Tale').
#
#   <wert>:    Eine benutzerdefinierte Ausblenddefinition im folgenden Format:
#                WAIT FADE
#              Dabei gibt 'WAIT' an, wie lange nach dem letzten Schreibvorgang am
#              E/A-Port die Ausblendung beginnt (zwischen 100 und 5000 Milli-
#              sekunden); und 'FADE' ist die Ausblenddauer (zwischen 10 und
#              3000 Millisekunden).
#              Beispiele:
#                300 200   (300 ms warten, bevor das Ausblenden über einen Zeit-
#                          raum von 200 ms erfolgt)
#                1000 3000 (1 Sekunde warten, bevor das Ausblenden über 3
#                          Sekunden erfolgt)
#
opl_fadeout = off

# Entfernt die Gleichspannungsanteil vom OPL-Ausgang (standardmäßig auf 'off'
# gesetzt). Diese Option sollte nur als letztes Mittel verwendet werden, um
# Knackgeräusche in Spielen zu beheben, die PCM-Audio über den OPL-Synthesizer
# einer Sound Blaster- oder AdLib-Karte wiedergeben, wie beispielsweise in:
# Golden Eagle (1991), Wizardry 6 (1990) und Wizardry 7 (1992). Bitte eröffne
# ein Ticket, falls du weitere betroffene Spiele findest.
#
opl_remove_dc_bias = off

# Filtertyp für den Sound Blaster OPL-Ausgang (Standardwert: 'auto').
# Mögliche Werte:
#
#   auto:      Verwende den durch 'sbtype' bestimmten Filter (Standard).
#
#   sb1, sb2, sbpro1, sbpro2, sb16:
#              Verwende den Filter dieses Sound Blaster-Modells.
#
#   off:       Die Ausgabe nicht filtern.
#
#   <wert>:    Benutzerdefinierte Filterdefinition; weitere Informationen
#              findest du unter 'sb_filter'.
#
opl_filter = auto

# CMS-Emulation aktivieren (Standardwert: 'auto'). Mögliche Werte:
#
#   off:   CMS-Emulation deaktivieren (außer wenn 'Game Blaster' ausgewählt ist).
#   on:    CMS-Emulation für Sound Blaster 1 / 2 aktivieren.
#   auto:  CMS-Emulation für Sound Blaster 1 / Game Blaster automatisch aktivieren.
#
cms = auto

# Filter für den Sound Blaster CMS-Ausgang (standardmäßig auf 'on' gesetzt).
# Mögliche Werte:
#
#   on:        Ausgang filtern (Standard).
#   off:       Ausgang nicht filtern.
#   <wert>:    Benutzerdefinierte Filterdefinition; siehe 'sb_filter' für weitere Informationen.
#
cms_filter = on


[gus]

# Aktiviert die Gravis-UltraSound-Emulation (standardmäßig deaktiviert).
# Viele Spiele und alle Demos laden ihre eigenen Sounds hoch, doch einige sind
# für die MIDI-Wiedergabe auf die Instrumenten-Patch-Dateien angewiesen, die im
# Lieferumfang des GUS enthalten sind (Einzelheiten findest du unter 'ultradir').
# Bei einigen Spielen muss zudem die Datei ULTRAMID.EXE vor dem Start des Spiels
# geladen werden.
#
# Hinweis: Die Standardeinstellungen Basisadresse 240, IRQ 5 und DMA 3 wurden
#          gewählt, damit der GUS mit einer Sound Blaster-Karte koexistieren
#          kann. Dies funktioniert bei den meisten Programmen einwandfrei, doch
#          einige Spiele und Demos erwarten die Werkseinstellungen des GUS mit
#          Basisadresse 220, IRQ 11 und DMA 1. Der Standard-IRQ 11 ist zudem
#          problematisch bei bestimmten Versionen des DOS4GW-Extenders, die keine
#          IRQs über 7 verarbeiten können.
#
gus = off

# Die IO-Basisadresse des Gravis UltraSound (standardmäßig 240).
# Mögliche Werte: 210, 220, 230, 240, 250, 260
#
gusbase = 240

# Die IRQ-Nummer des Gravis UltraSound (standardmäßig 5).
# Mögliche Werte: 2, 3, 5, 7, 11, 12, 15
#
gusirq = 5

# Der DMA-Kanal des Gravis UltraSound (standardmäßig 3).
# Mögliche Werte: 1, 3, 5, 6, 7
#
gusdma = 3

# Filter für den Gravis UltraSound-Audioausgang (standardmäßig 'on').
# Mögliche Werte:
#
#   on:        Ausgabe filtern (Standard).
#   off:       Ausgabe nicht filtern.
#   <wert>:    Benutzerdefinierte Filterdefinition; weitere Informationen
#              findest du unter 'sb_filter'.
#
gus_filter = on

# Pfad zum Verzeichnis 'UltraSound' (standardmäßig 'C:\ULTRASND'). Dieses sollte
# ein Unterverzeichnis 'MIDI' enthalten, in dem sich die Patches (Instrumenten-
# dateien) befinden, die von einigen Spielen für die Wiedergabe von MIDI-Musik
# benötigt werden. Nicht alle Spiele benötigen diese Patches; viele GUS-native
# Spiele und alle Demos laden stattdessen ihre eigenen benutzerdefinierten Sounds
# hoch.
#
ultradir = C:\ULTRASND


[imfc]

# Aktiviert die IBM Music Feature Card (standardmäßig 'off').
#
imfc = off

# Die IO-Basisadresse der IBM Music Feature Card (standardmäßig '2A20').
# Mögliche Werte: 2A20, 2A30
#
imfc_base = 2a20

# Die IRQ-Nummer der IBM Music Feature Card (standardmäßig 3).
# Mögliche Werte: 2, 3, 4, 5, 6, 7
#
imfc_irq = 3

# Filter für die Ausgabe der IBM Music Feature Card (standardmäßig 'on').
# Mögliche Werte:
#
#   on:        Ausgabe filtern (Standard).
#   off:       Ausgabe nicht filtern.
#   <custom>:  Benutzerdefinierte Filterdefinition; weitere Informationen
#              findest du unter 'sb_filter'.
#
imfc_filter = on


[innovation]

# Aktiviert die Emulation der Soundkarten Innovation SSI-2001 und Microprose
# 'The Entertainer' am Basisport 280. Diese verwenden den legendären MOS 6581
# SID-Chip des Commodore 64-Personalcomputers aus den 1980er Jahren. Es sind nur
# 15 Spiele bekannt, die diese Karten unterstützen.
#
innovation = off

# Stellt die Filterstärke des 6581 als Prozentsatz von 0 bis 100 ein
# (Standardwert: 50). Aufgrund der analogen Filterung des SID war jeder Chip
# physisch einzigartig.
#
innovation_sid_filter = 50

# Filter für den Innovation-Audioausgang (standardmäßig 'off'). Mögliche Werte:
#
#
#   off:       Die Ausgabe wird nicht gefiltert (Standard).
#   <Wert>:    Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
innovation_filter = off


[speaker]

# Typ des an den Parallelanschluss angeschlossenen DAC (standardmäßig 'none').
# Mögliche Werte:
#
#   disney:    Disney Sound Source.
#   covox:     Covox Speech Thing.
#   ston1:     Stereo-on-1 DAC, in stereo bis zu 30 kHz.
#   none/off:  Keinen Parallelport-DAC verwenden (Standard).
#
lpt_dac = none

# Filter für das/die LPT-DAC-Audiogerät(e) (standardmäßig auf 'Ein' gesetzt).
# Mögliche Werte:
#
#   on:        Filtere die Ausgabe (Standard).
#   off:       Filtere die Ausgabe nicht.
#   <Wert>:    Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
lpt_dac_filter = on

# PC-Lautsprecher-Emulationsmodell (standardmäßig 'impulse'). Mögliche Werte:
#
#   impulse:    Eine sehr originalgetreue Nachbildung des PC-Lautsprecher-Ausgangs
#               (Standard). Funktioniert mit den meisten Spielen, kann jedoch bei
#               einigen wenigen Programmen zu verzerrtem Ton oder Stille führen.
#
#   discrete:  Vereinfachte PC-Lautsprecher-Emulation älterer Generation;
#              verwende diese Option nur bei bestimmten Titeln, bei denen
#              beim 'Impulse'-Modell Probleme auftreten.
#
#
#   none, off: Benutzt den PC-Lautsprecher nicht.
#
pcspeaker = impulse

# Filter für den PC-Lautsprecherausgang (standardmäßig 'on'). Mögliche Werte:
#
#   on:        Filtert die Ausgabe (Standard).
#   off:       Die Ausgabe nicht filtern.
#   <Wert>:    Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
pcspeaker_filter = on

# Aktiviert IBM PS/1 Audio Emulation (standardmäßig 'off').
#
ps1audio = off

# Filter für den Audio-Synth-Ausgang des PS/1 (standardmäßig aktiviert).
# Mögliche Werte:
#
#   on:        Filtere die Ausgabe (Standard).
#   off:       Filtere die Ausgabe nicht.
#   <Wert>:    Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
ps1audio_filter = on

# Filter für den PS/1-Audio-DAC-Ausgang (standardmäßig 'on'). Mögliche Werte:
#
#   on:        Filtere die Ausgabe (Standard).
#   off:       Filtere die Ausgabe nicht.
#   <custom>:  Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
ps1audio_dac_filter = on

# Die Tandy/PCjr-3-Voice-Soundemulation ist standardmäßig auf 'auto' eingestellt.
# Mögliche Werte:
#
#   auto:  Aktiviert automatisch den Tandy/PCjr-Ton für die Gerätetypen 'tandy'
#          und 'pcjr' (Standard).
#
#   on:    Aktiviert Tandy/PCjr-Sound mit DAC-Unterstützung, wenn möglich.
#          Für die meisten Spiele muss der Rechner auf 'tandy' oder 'pcjr'
#          eingestellt sein, damit sie funktionieren.
#
#   psg:   Aktiviere nur den dreistimmigen programmierbaren Soundgenerator der
#          Karte ohne DAC, um Konflikte mit anderen Karten zu vermeiden, die
#          DMA 1 verwenden.
#
#   off:   Tandy/PCjr-Sound deaktivieren.
#
tandy = auto

# Den Ausgang des Tandy-Synthesizers nach dem letzten Schreibvorgang am E/A-Port ausblenden
# (standardmäßig 'off'). Mögliche Werte:
#
#   off:       Keine Ausblendung; die verbleibende Ausgabe wird für immer
#              abgespielt (Standard).
#   on:        0,5s warten, bevor die Ausgabe über einen Zeitraum von 0,5s
#              ausgeblendet wird.
#   <Wert>:    Benutzerdefinierte Ausblendungsdefinition;
#              siehe 'opl_fadeout' für Details.
#
tandy_fadeout = off

# Filter für den Ausgang des Tandy-Synthesizers (standardmäßig aktiviert).
# Mögliche Werte:
#
#   on:        Filtert die Ausgabe (Standard).
#   off:       Die Ausgabe nicht filtern.
#   <Wert>:    Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
tandy_filter = on

# Filter für den Tandy-DAC-Ausgang (standardmäßig 'on'). Mögliche Werte:
#
#   on:        Filtert die Ausgabe (Standard).
#   off:       Die Ausgabe nicht filtern.
#   <custom>:  Benutzerdefinierter Filter; siehe 'sb_filter' für Details.
#
tandy_dac_filter = on


[disknoise]

# Emulierte Festplattengeräusche aktivieren (standardmäßig auf 'off' gesetzt).
# Aktiviert Geräusche von sich drehenden Platten und Suchvorgängen.
# Für ein authentisches Erlebnis wird empfohlen, 'hard_disk_speed' auf einen Wert
# unterhalb von 'maximum' einzustellen. Mögliche Werte:
#
#   off:           Keine Festplattengeräusche (Standard).
#   seek-only:     Nur Suchgeräusche der Festplatte wiedergeben, keine Drehgeräusche.
#   on:            Sowohl Such- als auch Drehgeräusche der Festplatte wiedergeben.
#
# Hinweis: Du kannst die Lautstärke des Festplattengeräuschs anpassen, indem du
#          die Lautstärke des `DISKNOISE`-Mixerkanals änderst.
#
hard_disk_noise = on

# Emulierte Diskettengeräusche aktivieren (standardmäßig auf 'off' gesetzt). Spielt
# bei Aktivierung Geräusche der sich drehenden Plattenscheibe und des Suchvorgangs
# ab. Es wird empfohlen, 'floppy_disk_speed' auf einen Wert unterhalb von 'maximum'
# zu setzen, um ein authentisches Erlebnis zu erzielen. Mögliche Werte:
#
#   off:           Keine Diskettengeräusche (Standard).
#   seek-only:     Nur Suchgeräusche der Diskette wiedergeben, keine Drehgeräusche.
#   on:            Sowohl Such- als auch Drehgeräusche der Diskette wiedergeben.
#
# Hinweis: Du kannst die Lautstärke des Festplattengeräuschs anpassen, indem du
#          die Lautstärke des `DISKNOISE`-Mixerkanals änderst.
#
floppy_disk_noise = on


[reelmagic]

# ReelMagic (REALmagic) Unterstützung für MPEG-Wiedergabe (standardmäßig 'off').
# Mögliche Werte:
#
#   off:      Unterstützung deaktivieren (Standard).
#   cardonly: Initialisiere die Karte, ohne den Treiber FMPDRV.EXE zu laden.
#   on:       Initialisiere die Karte und lade die FMPDRV.EXE beim Start.
#
reelmagic = off

# Lege den 32-Bit-Schlüssel fest, der zum Dekodieren der Videos verwendet wird
# (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:      Verwende integrierte Routinen zur Schlüsselbestimmung (Standard).
#   common:    Verwende den am häufigsten vorkommenden Schlüssel, nämlich 0x40044041.
#   thehorde:  Verwende den Schlüssel von The Horde, der 0xC39D7088 lautet.
#   <Wert>:  Lege einen benutzerdefinierten Schlüssel im Hex-Format fest
#              (z. B. 0x12345678).
#
reelmagic_key = auto

# Den bei der Videowiedergabe verwendeten Code für die Bildrate überschreiben
# (Standardwert: 0). Mögliche Werte:
#
#   0:       Kein Überschreiben: Automatische Ratenerkennung (Standard).
#
#   1 to 7:  Setze die Bildrate auf eine der folgenden Werte (verwende 1 bis 7):
#            1=23.976, 2=24, 3=25, 4=29.97, 5=30, 6=50, or 7=59.94 FPS.
#
reelmagic_fcode = 0


[joystick]

# Zu emulierender Joystick-Typ (Standardwert: 'auto'). Mögliche Werte:
#
#   auto:      Joysticks erkennen und verwenden, sofern möglich (Standard).
#              Joystick-Emulation deaktiviert, wenn kein Joystick gefunden.
#
#   2axis:     Unterstützt bis zu zwei Joysticks, mit jeweils 2 Achsen.
#
#   4axis:     Unterstützt nur den ersten Joystick, aber mit 4 Achsen.
#
#   4axis_2:   Unterstützt nur den zweiten Joystick, aber mit 4 Achsen.
#
#   fcs:       Unterstützt einen Joystick vom Typ Thrustmaster FCS.
#
#   ch:        Unterstützt einen Joystick vom Typ CH-Flightstick.
#
#   hidden:    Verhindert, dass DOS den/die Joystick(s) sieht, aktiviert sie aber
#              für das Mapping.
#
#   disabled:  Vollständige Deaktivierung der Joysticks: Sie werden nicht
#              abgefragt, gemappt und sind im DOS nicht sichtbar.
#
# Hinweis: Vergiss nicht, die Mapperdatei von DOSBox zurückzusetzen,
# wenn du sie vorher gespeichert hattest.
#
joysticktype = auto

# Aktiviere zeitgesteuerte Intervalle für die Achsen (standardmäßig 'on').
# Experimentiere mit dieser Option, wenn dein Joystick weg 'driftet'.
#
timed = on

# Feuert kontinuierlich, solange die Taste gedrückt wird (standardmäßig 'off').
#
autofire = off

# Vertauscht die 3. und 4. Achse (standardmäßig 'off').
# Kann für bestimmte Joysticks nützlich sein.
#
swap34 = off

# Aktiviere Button Wrapping bei der Anzahl der emulierten Buttons
# (standardmäßig 'off').
#
buttonwrap = off

# Aktiviert die Übersetzung der kreisförmigen Eingabe in eine quadratische
# Ausgabe (standardmäßig 'off'). Versuche diese Option zu aktivieren, wenn
# dein linker Analogstick sich nur innerhalb eines Kreises bewegen lässt.
#
circularinput = off

# Prozentualer Anteil der zu ignorierenden Bewegung (Standardwert: 10).
# Der gültige Bereich liegt zwischen 0 und 100. Bei einem Wert von 100 wird
# der Stick zu einem digitalen Stick.
#
deadzone = 10

# Aktiviert die Hotkeys, um eine Echtzeitkalibrierung der X- und Y-Achsen
# des Joysticks zu ermöglichen (standardmäßig deaktiviert). Ziehe dies nur
# als letzten Ausweg in Betracht, wenn die Kalibrierung im Spiel nicht ordnungs-
# gemäß funktioniert. Anleitung:
#
#   - Mit Strg/CMD+Pfeiltasten stellst du den Skalarwert der Achse ein:
#       - links und rechts verkleinert bzw. vergrößert den Skalar der x-Achse.
#       - runter und hoch verkleinern bzw. vergrößern den Skalar der y-Achse.
#   - Alt+Pfeiltasten passt die Offset-Position der Achse an:
#       - links und rechts verschiebt die x-Achse in die angegebene Richtung.
#       - runter und hoch verschiebt den Y-Achsen-Versatz in diese Richtung.
#   - Setze die X- und Y-Kalibrierung mit Strg+Entf bzw. Strg+Home zurück.
#
# Jeder Tastendruck meldet X- oder Y-Kalibrierungswerte, die du dann unten
# einstellen kannst. Wenn du Parameter gefunden hast, die funktionieren, beende
# das Spiel, setze diese Einstellung zurück auf 'false' und gib die gemeldeten
# Kalibrierungsparameter unten ein.
#
use_joy_calibration_hotkeys = off

# Wende die Parameter für die Kalibrierung der x-Achse über die Hotkeys an
# (standardmäßig 'auto').
#
joy_x_calibration = auto

# Wende die Parameter für die Kalibrierung der y-Achse über die Hotkeys an
# (Standardmäßig 'auto').
#
joy_y_calibration = auto


[serial]

# Legt den Typ des an den COM1-Anschluss angeschlossenen Geräts fest
# (standardmäßig 'dummy'). Mögliche Werte:
#
#   disabled:  Deaktiviert den Port.
#   dummy:     Emuliert den Port, ohne dass ein Gerät angeschlossen ist.
#   mouse:     Emuliert eine an den Port angeschlossene serielle Maus.
#   modem:     Emuliert ein an den Port angeschlossenes Modem.
#   nullmodem: Emuliert ein an den Port angeschlossenes Nullmodem.
#   direct:    Emuliert eine direkte serielle Verbindung.
#
# Zusätzliche Parameter stehen in derselben Zeile in der Form PARAMETER:WERT.
# Der optionale Parameter 'irq' ist für alle Typen gleich. Verfügbare Parameter:
#
#
#   - für 'mouse':      Modell (optional; überschreibt die Einstellung
#                       'com_mouse_model').
#
#   - für 'direct':     realport (benötigt), rxdelay (optional).
#                       (z.B. realport:COM1 realport:ttyS0).
#
#   - für 'modem':      listenport, sock, bps (alle optional).
#
#   - für 'nullmodem':  server, rxdelay, txdelay, telnet, usedtr,
#                       transparent, port, inhsocket, sock (alle optional).
#
# Der SOCK-Parameter legt das Protokoll fest, das von beiden Seiten
# der Verbindung verwendet wird. Gültige Werte sind0 für TCP und 1 für ENet
# reliable UDP.
# Beispiel: serial1=modem listenport:5000 sock:1
#
serial1 = dummy

# Siehe 'serial1' (Standard 'dummy').
#
serial2 = dummy

# Siehe 'serial1' (Standard 'disabled').
#
serial3 = disabled

# Siehe 'serial1' (Standard 'disabled').
#
serial4 = disabled

# Datei, die benutzt wird, um Fake-Telefonnummern auf Adressen zu mappen
# (standardmäßig 'phonebook.txt').
#
phonebookfile = phonebook.txt


[dos]

# Aktiviert die XMS-Unterstützung (standardmäßig 'on').
#
xms = on

# Aktiviert die EMS-Unterstützung (standardmäßig 'on').
# Aktiviert bietet die beste Kompatibilität, aber bestimmte Anwendungen laufen
# besser mit anderen Einstellungen oder erfordern die Deaktivierung der EMS-
# Unterstützung um überhaupt zu funktionieren.
#
ems = on

# Aktiviert die UMB-Unterstützung (standardmäßig 'on').
#
umb = on

# PCjr-Speicherlayout festlegen (standardmäßig 'expanded'). Mögliche Werte:
#
# expanded:  640 KB Gesamtspeicher mit Anwendungen, die über 128 KB liegen.
#            Kompatibel mit den meisten Spielen.
#
# standard:  128 KB Gesamtspeicher mit Anwendungen, die unter 96 KB liegen.
#            Erforderlich für einige ältere Spiele (z. B. Jumpman, Troll).
#
pcjr_memory_config = expanded

# Legt die DOS-Version im Format MAJOR.MINOR fest (Standardwert: 5.0).
# Eine einzelne Zahl wird als Hauptversion interpretiert.
# Gängige Einstellungen sind 3.3, 5.0, 6.22 und 7.1.
#
ver = 6.22

# Lokale Zeitepoche festlegen (Standardwert: 'native'). Mögliche Werte:
#
#   historic:  Wenn für das angegebene Land Daten verfügbar sind, wird das alte
#              DOS-Verhalten bei der Anzeige von Uhrzeit, Datum usw. nachgeahmt.
#
#   modern:    Es werden aktuelle Standards befolgt, um eine Benutzererfahrung
#              zu gewährleisten, die mit typischen Hostsystemen übereinstimmt.
#
#   native:    Aktuelle Einstellungen des Host-Betriebssystems werden unabhängig
#              von eingestellten Ländereinstellungen übernommen;
#              'moderne' Daten werden verwendet, um Lücken zu füllen, wenn das
#              DOS-Lokalisierungssystem zu eingeschränkt ist, um die Desktop-
#              Einstellungen zu übernehmen.
#
locale_period = native

# Lege den DOS-Ländercode fest (Standard 'auto').
# Dies beeinflusst länderspezifische Informationen wie Datum, Uhrzeit und
# Dezimalformate. Die Liste der unterstützten Ländercodes kann mit dem
# Befehlszeilenargument '--list-countries' angezeigt werden. Wenn er auf 'auto'
# gesetzt ist, wird der Ländercode der dem ausgewählten Tastaturlayout
# entspricht, verwendet.
#
country = auto

# Code für die Tastaturbelegung (standardmäßig 'auto'). Die Liste der unter-
# stützten Tastaturbelegungscodes kann mit dem Befehlszeilenargument
# '--list-layouts' angezeigt werden, z. B. 'uk' für die britisch-englische
# Belegung. Dem Belegungscode kann die Codepagennummer folgen, z. B. wählt
# 'uk 850' eine westeuropäische Bildschirmschriftart aus.
#
# Setze den Wert auf 'auto', um die Werte aus den Einstellungen des Host-
# Betriebssystems zu ermitteln. Verwende nach dem Start den Befehl 'KEYB',
# um Tastaturlayouts und Codeseiten zu verwalten (führe 'HELP KEYB' aus,
# um weitere Informationen zu erhalten).
#
keyboard_layout = auto

# Aktiviert die Erweiterung von Umgebungsvariablen wie %PATH% in der DOS-
# Befehlszeile (Standardwert: 'auto'). FreeDOS und MS-DOS 7.0+ COMMAND.COM unter-
# stützen dieses Verhalten. Mögliche Werte:
#
#   auto:  Aktiviert, wenn die DOS-Version 7.0 oder höher ist (Standard).
#   on:    Aktiviert die Erweiterung von Umgebungsvariablen.
#   off:   Deaktiviert die Erweiterung von Umgebungsvariablen.
#
expand_shell_variable = auto

# Datei mit dem persistenten Befehlszeilenverlauf (standardmäßig
# 'shell_history.txt'). Wenn kein Dateiname angegeben wird, wird der persistente
# Shellverlauf deaktiviert.
#
shell_history_file = shell_history.txt

# Datei, die die Liste der Anwendungen und der zugewiesenen DOS-Versionen
# enthält, in einem tabulatorgetrenntem Format, die von SETVER.EXE als
# dauerhafter Speicher verwendet wird (standardmäßig leer).
#
setver_table_file = 

# Aktiviert die Dateisperre durch Emulation von SHARE.EXE (Standardwert:
# 'auto'). Dies ist erforderlich, damit einige Windows 3.1-Anwendungen ordnungs-
# gemäß funktionieren. In der Regel verursacht dies keine Probleme bei DOS-
# Spielen, außer in seltenen Fällen (z. B. bei der Astral Blur-Demo). Wenn es
# zu Abstürzen im Zusammenhang mit Dateiberechtigungen kommt, kannst du ver-
# suchen, diese Option zu deaktivieren. Mögliche Werte:
#
#   auto:  Dateisperren nur aktivieren, wenn Windows 3.1 läuft.
#   on:    Dateisperren immer aktivieren.
#   off:   Dateisperren immer deaktivieren.
#
file_locking = auto


[ipx]

# Aktiviert IPX über UDP/IP Emulation (standardmäßig 'off').
#
ipx = off


[ethernet]

# Aktiviere die Emulation einer Novell NE2000-Netzwerkkarte in einem software-
# basierten Netzwerk mit den folgenden Eigenschaften
# (standardmäßig 'off'):
#
#   - 255.255.255.0:  Subnetzmaske des virtuellen LAN 10.0.2.0.
#   - 10.0.2.2:       IP des Gateways und des DHCP-Dienstes.
#   - 10.0.2.3:       IP des virtuellen DNS-Servers.
#   - 10.0.2.15:      Die erste von DHCP bereitgestellte IP, deine IP!
#
# Hinweis: Unter DOS wird für die Einrichtung ein NE2000-Paket-Treiber,
#          DHCP-Client und ein TCP/IP-Stack benötigt. Möglicherweise
#          benötigst du eine Port-Weiterleitung vom Host zum DOS-Gast
#          und von deinem Router zu deinem Host, wenn du als Server
#          für Multiplayer-Spiele fungierst.
#
ne2000 = off

# Die Basisadresse der NE2000-Karte (Standard '300').
# Hinweis: Die Adressen 220 und 240 sind möglicherweise nicht verfügbar, da sie
#          Sound Blaster und Gravis UltraSound standardmäßig zugewiesen sind.
#
nicbase = 300

# Der Interrupt, der von der NE2000-Karte verwendet wird (Standard '3').
# Hinweis: Die IRQs 3 und 5 sind möglicherweise nicht verfügbar, da sie
#          'serial2' und dem Gravis UltraSound standardmäßig zugewiesen sind.
#
nicirq = 3

# Die MAC-Adresse der NE2000-Karte (Standard 'AC:DE:48:88:99:AA').
#
macaddr = AC:DE:48:88:99:AA

# Leitet einen oder mehrere TCP-Ports vom Host an den DOS-Gast weiter
# (standardmäßig nicht gesetzt). Das Format ist:
#
#   port1  port2  port3 ... (z.B., 21 80 443)
#   Dadurch werden FTP, HTTP und HTTPS an den DOS-Gast weitergeleitet.
#
# Wenn die Ports auf dem Host privilegiert sind, kann Mapping verwendet werden
#
#   Host:Gast  ..., (z.B., 8021:21 8080:80)
#   Dadurch werden die Ports 8021 und 8080 an FTP und HTTP im Gast weitergeleitet
#
# Ein Bereich von benachbarten Ports kann mit einem Bindestrich abgekürzt werden:
#
#   Start-Ende ... (z.B., 27910-27960)
#   Dadurch werden die Ports 27910 bis 27960 an den DOS-Gast weitergeleitet.
#
# Zuordnungen und Bereiche können auch kombiniert werden:
#
#   HStart-HEnde:GStart-GEnde ..., (z.B, 8040-8080:20-60)
#   Dies leitet die Ports 8040 bis 8080 an die Ports 20 bis 60 des Gastes weiter.
#
# Anmerkungen:
#   - Wenn die zugewiesenen Bereiche unterschiedlich sind, wird der kürzere
#     Bereich erweitert, damit er passt.
#   - Wenn widersprüchliche Host-Ports angegeben werden, wird nur der erste
#     eingerichtet.
#   - Bei widersprüchlichen Gast-Ports hat die letztere Regel Vorrang.
#
tcp_port_forwards = 

# Leitet einen oder mehrere UDP-Ports vom Host an den DOS-Gast weiter
# (standardmäßig nicht gesetzt). Das Format ist dasselbe wie bei der
# Weiterleitung von TCP-Ports.
#
udp_port_forwards = 


[webserver]

# Enable the HTTP REST API that exposes internal state and memory (disabled by
# default). Open http://localhost:8086 in a browser (or use the configured port)
# to view the API documentation.
#
webserver_enabled = off

# Verbinde dich mit der angegebenen IP-Adresse. Diese API gewährt vollständige
# Kontrolle über DOSBox; gib sie niemals an nicht vertrauenswürdige Hosts weiter.
#
# Standardmäßig sind nur lokale Verbindungen zulässig.
#
webserver_bind_address = 127.0.0.1

# TCP-Port, auf den eine Verbindung hergestellt werden soll.
#
webserver_port = 8086


[autoexec]

# Jede Zeile in diesem Abschnitt wird beim Systemstart als DOS-Befehl
# ausgeführt.
# Wichtig: Der Abschnitt [autoexec] muss der letzte Abschnitt in der
#          Konfigurationsdatei sein!

