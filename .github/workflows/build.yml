# Builds dbgl.jar with the build.xml of this repository on every push and pull request, and runs the tests that need no
# internet (org.dbgl.test.OfflineTests) on Linux and on Windows.
# The jar of the Linux run is attached to the run as an artifact ("dbgl-jar").
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant (and on Linux a virtual screen for SWT) if missing
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            command -v ant || choco install ant -y --no-progress
          else
            (command -v ant && command -v xvfb-run) || (sudo apt-get update && sudo apt-get install -y ant xvfb)
          fi
      - name: Build dbgl.jar
        run: ant jar
      - name: Run the tests (without internet)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; LIBS="src/dist/shared/lib/* src/dist/winshared/lib/*"; RUN=""; else SEP=":"; LIBS="src/dist/shared/lib/* src/dist/linuxshared/lib/*"; RUN="xvfb-run -a"; fi
          W="$GITHUB_WORKSPACE"
          CP="$W/build_ant"
          for j in $LIBS libtest/*; do CP="$CP$SEP$W/$j"; done
          mkdir -p testrun
          cd testrun
          $RUN java -Ddbgl.testdata="$W/src/java/org/dbgl/test/data" -Ddbgl.officialconf="$W/src/dist/winshared/DOSBox-0.74-3/dosbox.conf" -cp "$CP" org.junit.runner.JUnitCore org.dbgl.test.OfflineTests
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dbgl-jar
          path: dist/dbgl.jar
