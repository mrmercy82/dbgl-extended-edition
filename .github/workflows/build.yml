# Builds dbgl.jar with the build.xml of this repository on every push and pull request.
# The jar is attached to the run as an artifact ("dbgl-jar").
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant if missing
        run: command -v ant || (sudo apt-get update && sudo apt-get install -y ant)
      - name: Build dbgl.jar
        run: ant jar
      - uses: actions/upload-artifact@v4
        with:
          name: dbgl-jar
          path: dist/dbgl.jar
